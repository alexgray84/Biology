ource current ___ A divides into ___ A + ___ A…",answer:"Branch currents add to battery current. Equal branches divide current approximately equally; unequal resistances do not. Parallel branches span nearly the same voltage. Opening one branch leaves another conducting; opening the common supply stops all branches."},{title:"Find the pattern",tag:"Fair test · 20 min",question:"How does voltage affect current?",intro:"Act as a test engineer. Gather evidence to predict current before connecting a new power supply.",preset:"resistance",steps:["Use the 20 Ω resistor example. Keep resistance unchanged. Write a prediction in your notebook.","Set the battery to 1.5, 3, 4.5, 6 and 9 V. Record a reading after each change.","Open the notebook graph. Choose battery voltage for the horizontal axis and current for the vertical axis. Describe the pattern and predict a reading at 7.5 V."],change:"Battery voltage (1.5 to 9 V)",measure:"Resistor current (A)",keep:"Resistor at 20 Ω and the same wires",success:"Five readings, a graph and a prediction supported by the relationship V = I × R.",hint:"Select the battery to change its voltage. Record reading captures every component, so select the resistor in the graph controls.",answer:"At constant resistance, current is proportional to the applied voltage. A straight line through the origin is expected. At 7.5 V the current is about 0.373 A with this model’s 0.1 Ω battery and small lead resistances. An ideal 20 Ω circuit would give 0.375 A."},{title:"The shelter challenge",tag:"STEM design · 25 min",question:"Can you build two independently controlled lights?",intro:"Your shelter has a reading area and an entrance. Build one battery circuit where either light can be switched off without switching off the other.",preset:"blank",steps:["Sketch or describe your plan in the prediction field. Use one 6 V battery, two lamps and two switches.","Build and test all four switch combinations. Record the current and lamp power for each.","Use your ect the same lamp and Trial number on the horizontal axis. Compare watts rather than judging brightness by eye.",answer:"One battery gives about 0.594 A and 3.53 W. Two aiding batteries give about 1.176 A and 13.83 W in this fixed-resistance model: nearly twice the current and four times the power. Opposing equal batteries cancel, giving no current. Equal batteries in parallel share the load at nearly the same voltage, so lamp power changes only slightly because internal resistance is reduced. The AI claim ignores connections and confuses power with perceived brightness. In the optional demonstration, excess power builds heat until the filament breaks and its branch becomes an open circuit. Extra lamps in series reduce current; adding parallel branches increases battery current. Real filament resistance rises with temperature, so exact current and brightness changes differ. The heat timing is illustrative."}],Kr={series:{kind:"series",kit:"One 6 V battery, three 10 Ω lamps, one switch, one adjustable resistor, wires, an ammeter and a voltmeter.",outcomes:["Draw and build one complete series path using circuit symbols.","Compare current at different positions and explain how resistance changes it.","Use voltage and power readings to explain observations and faults."],stages:[{title:"A · One, two, then three lamps",minutes:"15–20 min",steps:["Predict how adding lamps in one loop changes current and brightness. Write your reason before testing.","Build one lamp and a closed switch with a 6 V battery. Add a second lamp in series, then a third. Keep each lamp at 10 Ω.","For each build, select the battery and lamps to read measurements. Record a trial labelled S-A1, S-A2 or S-A3 in Notebook, then copy the values into the table. Use magnitudes; record a dash for a lamp that is not present.","Insert an ammeter before and after Lamp 1 in the three-lamp circuit, one position at a time. Remove a wire to insert it. Compare the two readings in your book. Connect a voltmeter across Lamp 1 and check its voltage."],columns:["Trial / lamps","Battery I (A)","Lamp 1 I (A)","Lamp 2 I (A)","Lamp 3 I (A)","Lamp 1 V (V)","Lamp 1 P (W)"],rows:[["S-A1 · 1 lamp"],["S-A2 · 2 lamps"],["S-A3 · 3 lamps"]],drawings:["S-A1: one lamp","S-A2: two lamps","S-A3: three lamps; add A and V in their correct positions"],questions:["What happens to battery current and Lamp 1 power as you add lamps? Quote two readings.","Does current get used up by a lamp? Use your before-and-after ammeter readings."],support:"I changed only the number of lamps. The current changed from ___ A to ___ A. The two ammeter readings were ___ and ___. This suggests…",answer:"Adding series lamps increases total resistance, so current falls. Expected battery currents are about 0.594, 0.298 and 0.199 A; Lamp 1 power is about 3.53, 0.891 and 0.397 W. Small wire/meter losses affect the last digits. Before and after Lamp 1, steady current magnitudes match: charge is conserved and current is not used up. The lamp transfers energy. A belongs in the path; V belongs across the lamp."},{title:"B · Add a resistor to the same loop",minutes:"10–15 min",graph:"Plot only S-B10, S-B20 and S-B40: resistor resistance (Ω) on the horizontal axis and battery current (A) on the vertical axis. Label both axes, choose even scales and describe the trend. Do not include the later open-switch result.",steps:["Keep two 10 Ω lamps. Replace the third lamp with one resistor in series. Keep the source at 6 V and the switch closed.","Set the resistor to 10 Ω, then 20 Ω, then 40 Ω. Predict before each change. Keep both lamps and all wires the same.","Record S-B10, S-B20 and S-B40 in Notebook and complete the table. Use a voltmeter across the battery terminals for source-terminal voltage, rather than copying the 6 V setting.","Draw the 20 Ω resistor circuit. Label both lamp voltages and the resistor voltage. Check whether these drops approximately add to the measured source-terminal voltage."],columns:["Trial / R","Battery I (A)","Lamp 1 V (V)","Lamp 2 V (V)","Resistor V (V)","Source terminal V (V)","Lamp 1 P (W)"],rows:[["S-B10 · 10 Ω"],["S-B20 · 20 Ω"],["S-B40 · 40 Ω"]],drawings:["S-B20: two lamps and a resistor in one loop; annotate measured voltage drops"],questions:["Why does changing this resistor affect both lamps? Support your answer with measured current and power.","Where is the source-terminal voltage accounted for around the loop?"],support:"At ___ Ω, current was ___ A. At ___ Ω, it was ___ A. Both lamps are in the same ___, so… The voltage drops add to approximately…",answer:"All three components share the same series current. Increasing resistance decreases that current and reduces the power of both unchanged lamps. Expected current is about 0.199, 0.150 and 0.100 A for total load resistances 30, 40 and 60 Ω. Each drop is I × its resistance; the larger resistor takes a larger share of the voltage. The component drops plus small wire/switch/meter drops add to measured source-terminal voltage. Use terminal voltage, which is slightly below the source setting. The graph decreases but is not a straight-line proportional relationship: current depends on the reciprocal of total loop resistance, including both lamps."},{title:"C · Find the fault and infer a rule",minutes:"5–10 min",steps:["Keep the final Part B circuit. Record its closed-switch state using S-B40, then open the common switch.","Record S-C-open. Compare lamp current and power. Measure across the open switch with a voltmeter.","Draw the fault using an open-switch symbol. Mark the broken path. Write your conclusions in your book or Notebook, quoting trial labels."],columns:["State","Battery I (A)","Lamp 1 P (W)","Lamp 2 P (W)","Open switch V (V)"],rows:[["Open · S-C-open"]],drawings:["S-C-open: show the open switch and mark where the path is broken"],questions:["Why do both lamps go out when one part of a series path is opened?","How can the open switch have voltage across it while current is zero?"],support:"The path is broken at ___. Current is ___ A, so lamp power is ___ W. Voltage describes…",answer:"Opening the common switch breaks the only conducting path. Both lamp currents and powers become zero. Nearly the full 6 V is across the open switch: a potential difference can exist without a current. Voltage is energy per charge, whereas current is charge flowing per second. A voltmeter connected across the gap reads the voltage; it does not restore a conducting path in this ideal-meter model."}],challenge:"A claim says, “Three lamps must always be dimmer than two.” Evaluate it. State what must be kept constant, then suggest a changed circuit that makes the claim unreliable.",challengeAnswer:"The claim is supported for identical lamps added in series with an unchanged source. It is not a universal rule: three lamps could be in parallel, the source voltage could change, or lamp resistances could differ. Name the connection and controlled variables before predicting brightness; compare measured lamp power rather than appearance alone."},parallel:{kind:"parallel",kit:"One 6 V battery, three 10 Ω lamps, one common switch, one adjustable resistor, wires, an ammeter and a voltmeter.",outcomes:["Draw and build separate parallel paths with clear junctions.","Use measurements to show how branch currents combine at the source.","Explain unequal branch currents and why one branch can keep working after a fault."],stages:[{title:"A · One, two, then three branches",minutes:"15–20 min",steps:["Predict the effect of adding identical lamp branches on battery current and each lamp’s power. Write a reason.","Build one 10 Ω lamp with a common switch and a 6 V battery. Add a second lamp on its own parallel branch, then a third. Each branch must connect to the same two supply junctions.","Record P-A1, P-A2 and P-A3 in Notebook. Copy current magnitudes into the table and add the branch currents. Use a dash for an absent branch.","Insert an ammeter in the common supply path, then in one branch. Measure voltage across the battery terminals and across each lamp. Compare the voltage readings in your book."],columns:["Trial / branches","Battery I (A)","Branch 1 I (A)","Branch 2 I (A)","Branch 3 I (A)","Sum of branch I (A)","Lamp 1 P (W)"],rows:[["P-A1 · 1 branch"],["P-A2 · 2 branches"],["P-A3 · 3 branches"]],drawings:["P-A1: one lamp path","P-A2: two separate paths","P-A3: three branches; label junctions and add A and V"],questions:["How does the sum of the branch currents compare with battery current? Quote a complete set of readings.","Why does each lamp stay at nearly the same power when another parallel branch is added?"],support:"At the junction, ___ A splits into ___ A + ___ A + ___ A. Each lamp is connected across the same two ___.",answer:"Battery current equals the sum of the branch currents, within rounding. Adding branches reduces equivalent resistance and increases battery current: about 0.594 A for one branch, 1.175 A for two and roughly 1.74 A for three, depending on shared leads. Equal branches have approximately equal currents. Each lamp spans nearly the same voltage as the source terminals, so its power is nearly unchanged. More source current causes slightly greater internal voltage loss; the model therefore shows a small reduction in lamp voltage/power."},{title:"B · Do unequal branches share equally?",minutes:"10–15 min",graph:"Plot only P-B10, P-B20 and P-B40: resistor resistance (Ω) on the horizontal axis and resistor-branch current (A) on the vertical axis. Label both axes, choose even scales and describe the trend. Do not include the later fault results.",steps:["Keep exactly two branches. Keep a 10 Ω lamp in branch 1. Replace the lamp in branch 2 with a resistor. Keep the 6 V source and common switch unchanged.","Set branch 2 resistance to 10 Ω, then 20 Ω, then 40 Ω. Predict which branch carries more current before each test.","Record P-B10, P-B20 and P-B40. Measure each branch’s voltage and current, then complete the table.","Draw the 20 Ω version. Label the branch currents and voltages. Use arrows to show current splitting and recombining."],columns:["Trial / R2","Battery I (A)","Lamp branch I (A)","Resistor branch I (A)","Lamp V (V)","Resistor V (V)","Sum of branch I (A)"],rows:[["P-B10 · 10 Ω"],["P-B20 · 20 Ω"],["P-B40 · 40 Ω"]],drawings:["P-B20: a lamp branch and a resistor branch; annotate junction currents and voltages"],questions:["Does current always split equally at a junction? Use your unequal-branch results to justify your answer.","Why are the branch voltages nearly equal while the currents can differ?"],support:"Both branches have approximately ___ V. The ___ Ω branch carries ___ A, compared with ___ A in the ___ Ω branch. I infer…",answer:"Current only divides equally for equal branch resistances at the same voltage. With a 10 Ω lamp and 20 Ω resistor, the lamp current is approximately twice the resistor current; at 40 Ω it is approximately four times. Both branches connect across the same two junctions, so their voltages are nearly equal. I = V/R explains the different currents. Their currents still sum to battery current. Small lead/internal losses mean the lamp current can change slightly when the other branch changes. The resistor-branch graph decreases approximately as 1/R; the three points do not imply a straight-line proportional relationship."},{title:"C · Disconnect a branch, then the supply",minutes:"5–10 min",steps:["Keep the final Part B circuit. Record its connected state as P-B40. Remove one wire only from the resistor branch.","Record P-C-branch. Check whether the lamp still has a complete path and measure its power. Do not record a floating-probe dash as zero volts.","Restore the branch wire, then open the common switch. Record P-C-common. Compare the two faults.","Draw both faulty circuits. Mark the missing branch connection on one and the open common switch on the other. Write an evidence-based recommendation for shelter lights."],columns:["Fault","Battery I (A)","Lamp branch I (A)","Resistor branch I (A)","Lamp P (W)"],rows:[["Branch open · P-C-branch"],["Common switch open · P-C-common"]],drawings:["P-C-branch: resistor branch disconnected; trace the remaining lamp path","P-C-common: open common switch; trace why no branch has a complete path"],questions:["Why can the lamp stay on after the other branch is disconnected, but not when the common switch is opened?","What evidence supports using parallel branches for independently controlled shelter lights?"],support:"In trial ___, Lamp 1 still transferred ___ W because… In trial ___, its power was ___ W because… My recommendation is…",answer:"Disconnecting the resistor branch stops its current but leaves the lamp’s complete supply path intact. Battery current decreases; lamp power can rise slightly as source losses fall. Opening the common switch interrupts the supply path shared by both branches, stopping both currents. For independent control, each lamp needs its own switch in its own parallel branch. Tests with one on and the other off demonstrate independence; a common switch cannot do this."}],challenge:"Draw two parallel lamp branches with one switch in each. Predict all four switch combinations, then use The shelter challenge to test them. Which two tests are essential evidence of independent control?",challengeAnswer:"A separate series switch in each parallel lamp branch gives on/on, on/off, off/on and off/off. The mixed states—on/off and off/on—are the essential evidence that each light can be controlled independently. Both-on and both-off alone could be produced by a common switch."}},cl={series:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Two lamps connected in one series loop"><title>Two lamps connected in one series loop</title><rect width="900" height="560" fill="#fffdf8"/><path d="M100 100L375 100" fill="none" stroke="#14263d" stroke-width="4"/><g transform="translate(440 100)"><path d="M-65 0L-25 0" fill="none" stroke="#14263d
