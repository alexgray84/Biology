<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 427" width="760" height="427" role="img" aria-label="A lever balanced on a pivot with a downward force, and a stretched spring holding a mass.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1e3"/>
      <stop offset="1" stop-color="#efe7d3"/>
    </linearGradient>
  </defs>
  <rect width="760" height="427" fill="url(#bg)"/>
  <rect width="760" height="427" fill="none" stroke="#d9cfb6" stroke-width="2"/>
  <!-- left: lever and moment -->
  <g>
    <rect x="70" y="196" width="290" height="18" rx="8" fill="#26507a"/>
    <polygon points="150,214 122,270 178,270" fill="#17324d"/>
    <line x1="330" y1="96" x2="330" y2="188" stroke="#b8860b" stroke-width="13" stroke-linecap="round"/>
    <polygon points="330,200 310,164 350,164" fill="#b8860b"/>
    <text x="150" y="298" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">pivot</text>
    <text x="330" y="80" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="700" fill="#8a6608">force</text>
    <text x="215" y="352" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#17324d">M = F &#215; d</text>
  </g>
  <!-- divider -->
  <line x1="430" y1="70" x2="430" y2="360" stroke="#d3c8ad" stroke-width="2" stroke-dasharray="6 8"/>
  <!-- right: spring and extension -->
  <g>
    <rect x="480" y="86" width="210" height="12" rx="4" fill="#26507a"/>
    <path d="M585 98 L585 116 L556 128 L614 146 L556 164 L614 182 L556 200 L614 218 L585 232 L585 248" fill="none" stroke="#17324d" stroke-width="5"/>
    <rect x="565" y="248" width="40" height="28" rx="4" fill="#b8860b"/>
    <line x1="585" y1="276" x2="585" y2="318" stroke="#8a6608" stroke-width="10" stroke-linecap="round"/>
    <polygon points="585,330 567,296 603,296" fill="#8a6608"/>
    <text x="585" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#17324d">F = k &#215; e</text>
  </g>
</svg>
