<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 427" width="760" height="427" role="img" aria-label="A chain of glucose rings forming starch, four food-test tubes showing blue-black, brick-red, purple and cloudy white positive results, and an enzyme with a substrate fitting its active site.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1e3"/>
      <stop offset="1" stop-color="#efe7d3"/>
    </linearGradient>
    <g id="ring"><polygon points="0,-17 15,-8.5 15,8.5 0,17 -15,8.5 -15,-8.5" fill="#e6b95e" stroke="#8a6608" stroke-width="3"/></g>
  </defs>
  <rect width="760" height="427" fill="url(#bg)"/>
  <rect width="760" height="427" fill="none" stroke="#d9cfb6" stroke-width="2"/>
  <!-- left: glucose units joined into starch -->
  <g>
    <path d="M52 250 C 90 214, 130 214, 170 236 S 240 262, 262 222" fill="none" stroke="#8a6608" stroke-width="4"/>
    <path d="M170 236 L 196 176" fill="none" stroke="#8a6608" stroke-width="4"/>
    <use href="#ring" x="52" y="250"/><use href="#ring" x="92" y="222"/><use href="#ring" x="132" y="222"/>
    <use href="#ring" x="170" y="236"/><use href="#ring" x="212" y="252"/><use href="#ring" x="248" y="240"/>
    <use href="#ring" x="262" y="204"/><use href="#ring" x="186" y="198"/><use href="#ring" x="200" y="164"/>
    <text x="158" y="316" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">glucose → starch</text>
  </g>
  <line x1="304" y1="70" x2="304" y2="360" stroke="#d3c8ad" stroke-width="2" stroke-dasharray="6 8"/>
  <!-- middle: four positive food tests -->
  <g font-family="Montserrat,Arial,sans-serif" font-size="17" font-weight="700" fill="#17324d" text-anchor="middle">
    <g transform="translate(338 110)"><rect x="0" y="0" width="34" height="160" rx="17" fill="#ffffff" fill-opacity=".55" stroke="#17324d" stroke-width="3"/><rect x="4" y="70" width="26" height="86" rx="13" fill="#1d2140"/></g>
    <g transform="translate(390 110)"><rect x="0" y="0" width="34" height="160" rx="17" fill="#ffffff" fill-opacity=".55" stroke="#17324d" stroke-width="3"/><rect x="4" y="70" width="26" height="86" rx="13" fill="#a33d1c"/></g>
    <g transform="translate(442 110)"><rect x="0" y="0" width="34" height="160" rx="17" fill="#ffffff" fill-opacity=".55" stroke="#17324d" stroke-width="3"/><rect x="4" y="70" width="26" height="86" rx="13" fill="#7a3f98"/></g>
    <g transform="translate(494 110)"><rect x="0" y="0" width="34" height="160" rx="17" fill="#ffffff" fill-opacity=".55" stroke="#17324d" stroke-width="3"/><rect x="4" y="70" width="26" height="86" rx="13" fill="#f2f0ea" stroke="#c9c2b0" stroke-width="1.5"/></g>
    <text x="433" y="316">food tests</text>
  </g>
  <line x1="562" y1="70" x2="562" y2="360" stroke="#d3c8ad" stroke-width="2" stroke-dasharray="6 8"/>
  <!-- right: enzyme and substrate -->
  <g>
    <path d="M592 150 C 592 100, 700 92, 720 150 L 720 250 C 720 292, 600 300, 592 250 L 592 222 L 644 200 L 592 178 Z" fill="#24748d" stroke="#17324d" stroke-width="3"/>
    <path d="M592 178 L 644 200 L 592 222" fill="none" stroke="#b8860b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M560 178 L 612 200 L 560 222 Z" fill="#e6b95e" stroke="#8a6608" stroke-width="3" transform="translate(-14 0)"/>
    <text x="656" y="316" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">active site</text>
  </g>
</svg>
