<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc">
  <title id="title">Reflection and refraction ray model</title>
  <desc id="desc">A gold ray reflects from a mirror and a second ray bends through a blue transparent block.</desc>
  <rect width="1000" height="750" fill="#14263d"/>
  <circle cx="145" cy="115" r="210" fill="#203853"/>
  <circle cx="880" cy="680" r="260" fill="#0d1d31"/>
  <g opacity=".95">
    <rect x="584" y="185" width="236" height="375" rx="18" fill="#dbeaf0" stroke="#faf7f0" stroke-width="8"/>
    <path d="M85 520 340 330 535 475" fill="none" stroke="#f2c96d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M535 475 675 375 885 290" fill="none" stroke="#f2c96d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M340 135V600" fill="none" stroke="#fffdf8" stroke-width="8" stroke-dasharray="20 18"/>
    <path d="M120 612H555" fill="none" stroke="#fffdf8" stroke-width="20" stroke-linecap="round"/>
    <path d="M584 375H820" fill="none" stroke="#7195a4" stroke-width="5" stroke-dasharray="16 14"/>
  </g>
  <g fill="#fffdf8" font-family="Arial, sans-serif" font-size="34" font-weight="700">
    <text x="110" y="675">REFLECT</text>
    <text x="680" y="630">REFRACT</text>
  </g>
</svg>
