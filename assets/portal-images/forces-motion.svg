<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 427" role="img" aria-label="A car with a forward driving-force arrow and a backward drag arrow, and a lever balanced on a pivot">
  <rect width="760" height="427" fill="#21345B"/>
  <rect width="760" height="427" fill="url(#g)"/>
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26406e"/><stop offset="1" stop-color="#1b2c4d"/></linearGradient></defs>
  <line x1="60" y1="250" x2="700" y2="250" stroke="#3c5686" stroke-width="3"/>
  <!-- car -->
  <rect x="300" y="196" width="150" height="42" rx="12" fill="#F7F1E3" stroke="#0f1c34" stroke-width="3"/>
  <path d="M320 196 q18 -30 55 -30 q40 0 55 30 Z" fill="#e9dcbf" stroke="#0f1c34" stroke-width="3"/>
  <circle cx="330" cy="240" r="17" fill="#0f1c34" stroke="#F7F1E3" stroke-width="3"/>
  <circle cx="420" cy="240" r="17" fill="#0f1c34" stroke="#F7F1E3" stroke-width="3"/>
  <!-- driving force arrow (gold, forward) -->
  <line x1="450" y1="217" x2="600" y2="217" stroke="#B8860B" stroke-width="12"/>
  <polygon points="600,199 636,217 600,235" fill="#B8860B"/>
  <text x="500" y="192" font-family="Georgia, serif" font-size="20" fill="#f1dc9d">driving force</text>
  <!-- drag arrow (light, backward) -->
  <line x1="300" y1="217" x2="200" y2="217" stroke="#c9d4e6" stroke-width="9"/>
  <polygon points="200,201 170,217 200,233" fill="#c9d4e6"/>
  <text x="150" y="192" font-family="Georgia, serif" font-size="20" fill="#c9d4e6">drag</text>
  <!-- lever on a pivot -->
  <line x1="150" y1="330" x2="610" y2="300" stroke="#F7F1E3" stroke-width="8"/>
  <polygon points="360,318 392,318 376,360" fill="#B8860B" stroke="#0f1c34" stroke-width="2"/>
  <rect x="150" y="312" width="34" height="30" rx="4" fill="#c9d4e6" stroke="#0f1c34" stroke-width="2"/>
  <line x1="600" y1="270" x2="600" y2="300" stroke="#B8860B" stroke-width="8"/>
  <polygon points="588,272 612,272 600,254" fill="#B8860B"/>
  <text x="60" y="60" font-family="Georgia, serif" font-size="34" fill="#ffffff" font-weight="700">Forces and motion</text>
  <text x="60" y="94" font-family="Montserrat, Arial, sans-serif" font-size="17" fill="#b9c6df" letter-spacing="0.08em">TOPICS 41 &amp; 42</text>
</svg>
