<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 427" width="760" height="427" role="img" aria-label="A leaf in sunlight taking in carbon dioxide and water and giving out oxygen, beside a tube of pondweed releasing bubbles of gas into a gas syringe.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f1e3"/><stop offset="1" stop-color="#efe7d3"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="760" height="427" fill="url(#bg)"/>
  <rect width="760" height="427" fill="none" stroke="#d9cfb6" stroke-width="2"/>
  <!-- sun and light -->
  <circle cx="92" cy="80" r="38" fill="#d8b23a"/>
  <g stroke="#d8b23a" stroke-width="5" stroke-linecap="round">
    <line x1="140" y1="104" x2="206" y2="140" marker-end="url(#ar)"/><line x1="128" y1="128" x2="186" y2="176" marker-end="url(#ar)"/>
  </g>
  <!-- leaf -->
  <path d="M190 300 C 200 170, 330 120, 430 150 C 410 260, 300 320, 190 300 Z" fill="#7aa463" stroke="#3f6b35" stroke-width="4"/>
  <path d="M190 300 C 260 250, 340 200, 430 150" fill="none" stroke="#3f6b35" stroke-width="4"/>
  <path d="M190 300 L 160 340" stroke="#3f6b35" stroke-width="6" stroke-linecap="round"/>
  <!-- gases -->
  <line x1="120" y1="230" x2="196" y2="246" stroke="#6b7280" stroke-width="5" marker-end="url(#ar)"/>
  <text x="44" y="232" font-family="Montserrat,Arial,sans-serif" font-size="24" font-weight="700" fill="#4b5563">CO₂</text>
  <line x1="150" y1="385" x2="166" y2="344" stroke="#3d7cc9" stroke-width="5" marker-end="url(#ar)"/>
  <text x="84" y="404" font-family="Montserrat,Arial,sans-serif" font-size="24" font-weight="700" fill="#2f63a5">water</text>
  <line x1="410" y1="226" x2="470" y2="256" stroke="#24748d" stroke-width="5" marker-end="url(#ar)"/>
  <text x="474" y="270" font-family="Montserrat,Arial,sans-serif" font-size="24" font-weight="700" fill="#1d5f74">O₂</text>
  <text x="300" y="380" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">light energy → glucose</text>
  <!-- pondweed tube and syringe -->
  <rect x="600" y="170" width="62" height="200" rx="28" fill="#dfeef3" stroke="#17324d" stroke-width="4"/>
  <path d="M631 360 C 618 320, 645 300, 628 260 C 616 236, 640 220, 632 200" fill="none" stroke="#3f6b35" stroke-width="6"/>
  <g fill="#3f6b35"><ellipse cx="618" cy="320" rx="14" ry="5"/><ellipse cx="645" cy="290" rx="14" ry="5"/><ellipse cx="620" cy="250" rx="14" ry="5"/></g>
  <g fill="none" stroke="#24748d" stroke-width="3"><circle cx="634" cy="186" r="5"/><circle cx="640" cy="160" r="4"/><circle cx="633" cy="136" r="4"/></g>
  <rect x="590" y="62" width="82" height="34" rx="6" fill="#ffffff" stroke="#17324d" stroke-width="4"/>
  <line x1="631" y1="96" x2="631" y2="170" stroke="#17324d" stroke-width="4"/>
  <text x="631" y="50" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324d">gas syringe</text>
</svg>
