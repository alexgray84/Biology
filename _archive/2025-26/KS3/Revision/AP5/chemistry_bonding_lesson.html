<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemical Bonding – Lesson Activities</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f5f0ff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ──────────────────────────────────────────── */
.header {
  background: #2d1b69;
  color: white;
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.header-left h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.01em; }
.header-left .sub { font-size: 0.78rem; opacity: 0.68; margin-top: 2px; }
.progress-pill {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 600;
  white-space: nowrap;
}
.progress-track { height: 4px; background: #ddd6fe; }
.progress-fill { height: 100%; background: #7c3aed; transition: width 0.5s ease; }

/* ── Main ────────────────────────────────────────────── */
.main {
  flex: 1;
  padding: 20px 16px 4px;
  max-width: 880px;
  margin: 0 auto;
  width: 100%;
}

/* ── Card ─────────────────────────────────────────────── */
.card {
  background: white;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  overflow: hidden;
  margin-bottom: 12px;
}
.card-header {
  background: #f3f0ff;
  border-bottom: 1px solid #ddd6fe;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.card-title {
  font-size: 1rem;
  font-weight: 700;
  color: #2d1b69;
  flex: 1;
  min-width: 160px;
}
.badge {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  white-space: nowrap;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.badge-activity { background: #fef3c7; color: #92400e; }
.badge-exam     { background: #dbeafe; color: #1e3a8a; }
.badge-spec     { background: #ede9fe; color: #4c1d95; text-transform: none; font-size: 0.75rem; }
.badge-time     { background: #f3f4f6; color: #374151; text-transform: none; font-size: 0.75rem; }
.badge-marks    { background: #2d1b69; color: white; margin-left: auto; }

.card-body { padding: 18px 20px; }

/* ── Instructions ─────────────────────────────────────── */
.instructions {
  background: #f3f0ff;
  border-left: 3px solid #7c3aed;
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  font-size: 0.88rem;
  color: #2d1b69;
  margin-bottom: 16px;
  line-height: 1.55;
}

/* ── Ion sprint table ─────────────────────────────────── */
.table-wrap { overflow-x: auto; margin-bottom: 14px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.data-table th {
  background: #2d1b69; color: white;
  padding: 8px 12px; text-align: left; font-weight: 600;
}
.data-table td {
  padding: 7px 12px; border-bottom: 1px solid #e5e7eb; color: #374151;
}
.data-table tr:nth-child(even) td { background: #faf8ff; }
.data-table td.blank-cell { color: #d1d5db; font-style: italic; }
.data-table td.answer-cell { color: #4c1d95; font-weight: 600; }
.data-table td.work-cell { font-family: 'Courier New', monospace; font-size: 0.82rem; color: #2d1b69; }

/* ── Task steps ───────────────────────────────────────── */
.task-steps {
  list-style: none; counter-reset: step;
  display: flex; flex-direction: column; gap: 8px;
  margin-bottom: 4px;
}
.task-steps li {
  counter-increment: step;
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 0.88rem; color: #374151; line-height: 1.55;
}
.task-steps li::before {
  content: counter(step);
  background: #7c3aed; color: white;
  font-size: 0.74rem; font-weight: 700;
  min-width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
}

/* ── Dot-and-cross grid ───────────────────────────────── */
.dc-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 4px;
}
.dc-group-hdr {
  font-size: 0.8rem; font-weight: 700; color: white;
  padding: 5px 12px; border-radius: 6px 6px 0 0;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.dc-group-hdr.ionic   { background: #2d1b69; }
.dc-group-hdr.covalent { background: #7c3aed; }
.dc-item {
  border: 1.5px solid #ddd6fe;
  border-radius: 8px;
  overflow: hidden;
}
.dc-item-hdr {
  padding: 6px 12px;
  font-size: 0.85rem;
  font-weight: 700;
  color: #2d1b69;
  background: #ede9fe;
  border-bottom: 1px solid #ddd6fe;
}
.dc-draw-box {
  height: 70px;
  background: #fdfcff;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c4b5fd;
  font-size: 0.78rem;
  font-style: italic;
}
.dc-answer-box {
  padding: 8px 12px;
  font-size: 0.83rem;
  line-height: 1.5;
  color: #374151;
  background: #faf8ff;
}

/* ── Properties grid ──────────────────────────────────── */
.prop-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
.prop-table th {
  background: #2d1b69; color: white;
  padding: 8px 10px; text-align: left; font-weight: 600; font-size: 0.8rem;
}
.prop-table td {
  padding: 8px 10px; border: 1px solid #e5e7eb; vertical-align: top; line-height: 1.45;
}
.prop-table tr:nth-child(even) td { background: #faf8ff; }
.prop-table td.n { text-align: center; font-weight: 700; color: #9ca3af; width: 28px; }
.prop-table td.subst { min-width: 90px; font-weight: 600; color: #2d1b69; font-size: 0.83rem; }
.prop-table td.blank { color: #d1d5db; font-style: italic; font-size: 0.8rem; min-width: 100px; }
.prop-table td.answer { color: #4c1d95; font-size: 0.82rem; min-width: 100px; }

/* ── Answer blocks ────────────────────────────────────── */
.answer-section { display: flex; flex-direction: column; gap: 12px; }
.answer-block { border: 1px solid #ddd6fe; border-radius: 8px; overflow: hidden; }
.answer-block-hdr {
  background: #ede9fe; border-bottom: 1px solid #ddd6fe;
  padding: 7px 14px; font-size: 0.82rem; font-weight: 700; color: #4c1d95;
}
.answer-block-body {
  padding: 10px 14px; font-size: 0.87rem; color: #374151; line-height: 1.6;
}

/* ── Exam questions ───────────────────────────────────── */
.exam-qs { display: flex; flex-direction: column; gap: 18px; }
.exam-q { }
.exam-q-num {
  font-size: 0.95rem; font-weight: 700; color: #2d1b69;
  border-bottom: 1px solid #ddd6fe; padding-bottom: 5px; margin-bottom: 10px;
}
.exam-context {
  font-size: 0.87rem; color: #374151; line-height: 1.55;
  padding: 8px 12px; background: #faf8ff;
  border-left: 3px solid #ddd6fe; border-radius: 0 6px 6px 0;
  margin-bottom: 10px;
}
.exam-parts { display: flex; flex-direction: column; gap: 10px; }
.exam-part { display: flex; gap: 10px; align-items: flex-start; }
.exam-part-ref { font-weight: 700; color: #374151; min-width: 28px; font-size: 0.9rem; padding-top: 2px; }
.exam-part-body { flex: 1; }
.exam-stem { font-size: 0.9rem; color: #1a1a2e; line-height: 1.55; }
.exam-marks { font-size: 0.8rem; color: #6b7280; font-weight: 600; margin-left: 4px; }
.write-line { border-bottom: 1px solid #e5e7eb; height: 22px; margin-top: 5px; }

/* ── Mark scheme ──────────────────────────────────────── */
.ms-section { display: flex; flex-direction: column; gap: 14px; }
.ms-q { }
.ms-q-hdr {
  background: #ede9fe; border-radius: 6px;
  padding: 6px 12px; font-size: 0.85rem; font-weight: 700; color: #4c1d95;
  margin-bottom: 8px;
}
.ms-part { display: flex; gap: 10px; margin-bottom: 8px; padding-left: 8px; }
.ms-ref { font-weight: 700; color: #374151; min-width: 28px; font-size: 0.85rem; padding-top: 1px; }
.ms-body { flex: 1; }
.ms-pt {
  display: flex; gap: 7px; align-items: flex-start;
  font-size: 0.86rem; color: #1a1a2e; line-height: 1.5; margin-bottom: 3px;
}
.ms-pt-tick { color: #7c3aed; font-weight: 700; flex-shrink: 0; }
.ms-note { font-size: 0.8rem; color: #6b7280; font-style: italic; margin-top: 3px; line-height: 1.4; }

/* ── Hint & Nav ───────────────────────────────────────── */
.hint-wrap { padding: 4px 16px 0; max-width: 880px; margin: 0 auto; width: 100%; }
.hint-text {
  text-align: center; font-size: 0.82rem; color: #6b7280;
  font-style: italic; padding: 6px 0;
}
.nav-bar {
  background: white; border-top: 1px solid #e5e7eb;
  padding: 11px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.nav-dots { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.nav-dot {
  width: 11px; height: 11px; border-radius: 50%;
  background: #ddd6fe; border: none; cursor: pointer;
  transition: background 0.2s; padding: 0;
}
.nav-dot.active { background: #2d1b69; }
.nav-dot.done   { background: #7c3aed; }
.btn {
  padding: 9px 18px; border-radius: 8px;
  font-size: 0.88rem; font-weight: 600; border: none; cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}
.btn-prev   { background: #f3f4f6; color: #374151; }
.btn-prev:hover:not(:disabled)   { background: #e5e7eb; }
.btn-reveal { background: #7c3aed; color: white; }
.btn-reveal:hover { background: #5b21b6; }
.btn-next   { background: #2d1b69; color: white; }
.btn-next:hover:not(:disabled)   { background: #3730a3; }
.btn:disabled { opacity: 0.35; cursor: default; }

/* ── Complete banner ──────────────────────────────────── */
.complete-banner {
  background: #2d1b69; color: white;
  text-align: center; padding: 24px 20px;
  border-radius: 12px; margin: 0 16px 20px;
  max-width: 848px; margin-left: auto; margin-right: auto;
}
.complete-banner h2 { font-size: 1.25rem; margin-bottom: 8px; }
.complete-banner p  { opacity: 0.8; font-size: 0.9rem; }

/* ── Mobile ───────────────────────────────────────────── */
@media (max-width: 640px) {
  .header { padding: 10px 14px; }
  .main { padding: 12px 10px 4px; }
  .card-body { padding: 14px; }
  .card-header { padding: 10px 14px; }
  .nav-bar { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
  .btn { padding: 8px 13px; font-size: 0.83rem; }
  .data-table th, .data-table td { padding: 6px 8px; font-size: 0.8rem; }
  .prop-table th, .prop-table td { padding: 6px 8px; font-size: 0.78rem; }
  .dc-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<div class="nav-bar">

  <button class="btn btn-reveal"  id="btnReveal" onclick="toggleReveal()">Reveal Answers ✓</button>
  <button class="btn btn-next"    id="btnNext"   onclick="navigate(1)"  disabled>Next &#8594;</button>
</div>

  <h2>🎉 Lesson complete!</h2>
  <p>3 activities + 25 marks of exam practice. Use the dots above to revisit any section.</p>
</div>

// ─────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────
let current  = 0;
let revealed = false;
const done   = new Set();

// ─────────────────────────────────────────────────────────────
// Build: activity question face
// ─────────────────────────────────────────────────────────────
function buildActivityFace(card) {
  let html = `<div class="instructions">${card.instructions}</div>`;

  // Ion sprint table
  if (card.ionRows) {
    html += `<div class="table-wrap"><table class="data-table">
      <thead><tr>
        <th>#</th><th>Ion 1</th><th>Ion 2</th>
        <th>Formula (write here)</th><th>Working (write here)</th>
      </tr></thead>
      <tbody>`;
    for (const r of card.ionRows) {
      html += `<tr>
        <td style="text-align:center;font-weight:700;color:#9ca3af">${r.n}</td>
        <td style="font-weight:600;color:#2d1b69">${r.ion1}</td>
        <td style="font-weight:600;color:#2d1b69">${r.ion2}</td>
        <td class="blank-cell">…</td>
        <td class="blank-cell">…</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
  }

  // Dot-and-cross grid
  if (card.dotCrossItems) {
    const ionic    = card.dotCrossItems.filter(d => d.type === 'ionic');
    const covalent = card.dotCrossItems.filter(d => d.type === 'covalent');
    html += '<div class="dc-grid">';
    html += '<div>';
    html += '<div class="dc-group-hdr ionic">Ionic compounds</div>';
    for (const d of ionic) {
      html += `<div class="dc-item" style="margin-top:8px">
        <div class="dc-item-hdr">${d.name}</div>
        <div class="dc-draw-box">draw dot-and-cross diagram here</div>
      </div>`;
    }
    html += '</div>';
    html += '<div>';
    html += '<div class="dc-group-hdr covalent">Covalent molecules</div>';
    for (const d of covalent) {
      html += `<div class="dc-item" style="margin-top:8px">
        <div class="dc-item-hdr">${d.name}</div>
        <div class="dc-draw-box">draw dot-and-cross diagram here</div>
      </div>`;
    }
    html += '</div>';
    html += '</div>';
  }

  // Properties sorting grid
  if (card.propRows) {
    html += `<div class="table-wrap"><table class="prop-table">
      <thead><tr>
        <th>#</th><th>Substance</th>
        <th>Structure type</th><th>MP/BP — high or low? Why?</th>
        <th>Conducts electricity?</th>
      </tr></thead>
      <tbody>`;
    for (const r of card.propRows) {
      html += `<tr>
        <td class="n">${r.n}</td>
        <td class="subst">${r.substance}</td>
        <td class="blank">write here…</td>
        <td class="blank">write here…</td>
        <td class="blank">write here…</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
  }

  return html;
}

// ─────────────────────────────────────────────────────────────
// Build: activity answer face
// ─────────────────────────────────────────────────────────────
function buildActivityAnswers(card) {
  let html = '<div class="answer-section">';

  // Ion sprint answers
  if (card.ionRows) {
    html += `<div class="answer-block">
      <div class="answer-block-hdr">Model Answers</div>
      <div class="answer-block-body" style="padding:0">
        <div class="table-wrap" style="margin:0"><table class="data-table">
          <thead><tr>
            <th>#</th><th>Ion 1</th><th>Ion 2</th>
            <th>Formula</th><th>Cross-multiplication working</th>
          </tr></thead>
          <tbody>`;
    for (const r of card.ionRows) {
      html += `<tr>
        <td style="text-align:center;font-weight:700;color:#9ca3af">${r.n}</td>
        <td style="font-weight:600;color:#2d1b69">${r.ion1}</td>
        <td style="font-weight:600;color:#2d1b69">${r.ion2}</td>
        <td class="answer-cell">${r.formula}</td>
        <td class="work-cell">${r.working}</td>
      </tr>`;
    }
    html += '</tbody></table></div></div></div>';
  }

  // Dot-and-cross answers
  if (card.dotCrossItems) {
    const ionic    = card.dotCrossItems.filter(d => d.type === 'ionic');
    const covalent = card.dotCrossItems.filter(d => d.type === 'covalent');
    html += '<div class="answer-block"><div class="answer-block-hdr">Ionic compounds — key features</div><div class="answer-block-body"><div class="dc-grid">';
    for (const d of ionic) {
      html += `<div class="dc-item">
        <div class="dc-item-hdr">${d.name}</div>
        <div class="dc-answer-box">${d.answer}</div>
      </div>`;
    }
    html += '</div></div></div>';
    html += '<div class="answer-block"><div class="answer-block-hdr">Covalent molecules — key features</div><div class="answer-block-body"><div class="dc-grid">';
    for (const d of covalent) {
      html += `<div class="dc-item">
        <div class="dc-item-hdr">${d.name}</div>
        <div class="dc-answer-box">${d.answer}</div>
      </div>`;
    }
    html += '</div></div></div>';
  }

  // Properties grid answers
  if (card.propRows) {
    html += `<div class="answer-block">
      <div class="answer-block-hdr">Model Answers</div>
      <div class="answer-block-body" style="padding:0">
        <div class="table-wrap" style="margin:0"><table class="prop-table">
          <thead><tr>
            <th>#</th><th>Substance</th>
            <th>Structure type</th><th>MP/BP</th>
            <th>Conducts electricity?</th>
          </tr></thead>
          <tbody>`;
    for (const r of card.propRows) {
      html += `<tr>
        <td class="n">${r.n}</td>
        <td class="subst">${r.substance}</td>
        <td class="answer">${r.structure}</td>
        <td class="answer">${r.mpbp}</td>
        <td class="answer">${r.conduct}</td>
      </tr>`;
    }
    html += '</tbody></table></div></div></div>';
  }

  html += '</div>';
  return html;
}

// ─────────────────────────────────────────────────────────────
// Build: exam question face
// ─────────────────────────────────────────────────────────────
function buildExamFace(card) {
  let html = '<div class="exam-qs">';
  for (const q of card.questions) {
    html += `<div class="exam-q">
      <div class="exam-q-num">${q.num} <span style="font-size:0.8rem;font-weight:400;color:#6b7280">[${q.marks} marks]</span></div>`;
    if (q.context) {
      html += `<div class="exam-context">${q.context}</div>`;
    }
    html += '<div class="exam-parts">';
    for (const p of q.parts) {
      const lines = Array(p.lines).fill('<div class="write-line"></div>').join('');
      html += `<div class="exam-part">
        <div class="exam-part-ref">${p.ref}</div>
        <div class="exam-part-body">
          <div class="exam-stem">${p.stem} <span class="exam-marks">[${p.marks}]</span></div>
          ${lines}
        </div>
      </div>`;
    }
    html += '</div></div>';
  }
  html += '</div>';
  return html;
}

// ─────────────────────────────────────────────────────────────
// Build: mark scheme face
// ─────────────────────────────────────────────────────────────
function buildMarkScheme(card) {
  let html = '<div class="ms-section">';
  for (const q of card.markScheme) {
    html += `<div class="ms-q"><div class="ms-q-hdr">${q.num}</div>`;
    for (const part of q.parts) {
      html += `<div class="ms-part">
        <div class="ms-ref">${part.ref}</div>
        <div class="ms-body">`;
      for (const pt of part.points) {
        html += `<div class="ms-pt"><span class="ms-pt-tick">›</span><span>${pt}</span></div>`;
      }
      for (const note of part.notes) {
        html += `<div class="ms-note">${note}</div>`;
      }
      html += `</div></div>`;
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// ─────────────────────────────────────────────────────────────
// Render current card
// ─────────────────────────────────────────────────────────────
function render() {
  const card = cards[current];
  revealed = false;

  // Progress bar
  document.getElementById('progFill').style.width = `${((current + 1) / cards.length) * 100}%`;

  // Pill
  if (card.type === 'activity') {
    document.getElementById('progressPill').textContent = `Activity ${current + 1} of 3`;
  } else {
    document.getElementById('progressPill').textContent = 'Exam Questions';
  }

  // Nav buttons
  document.getElementById('btnPrev').disabled   = (current === 0);
  document.getElementById('btnNext').disabled   = !done.has(current) || (current === cards.length - 1);
  document.getElementById('btnReveal').textContent = 'Reveal Answers ✓';

  // Hint
  document.getElementById('hintText').textContent = card.type === 'exam'
    ? 'Complete the exam questions on paper, then reveal the mark scheme.'
    : 'Work through the activity on paper, then reveal the model answers.';

  // Nav dots
  renderDots();

  // Card HTML
  const isAct = card.type === 'activity';
  const badgeHTML = isAct
    ? `<span class="badge badge-activity">Activity</span>`
    : `<span class="badge badge-exam">Exam Practice</span>`;
  const marksHTML = isAct ? '' : `<span class="badge badge-marks">${card.totalMarks} marks</span>`;

  const bodyHTML = isAct ? buildActivityFace(card) : buildExamFace(card);

  document.getElementById('mainArea').innerHTML = `
    <div class="card">
      <div class="card-header">
        ${badgeHTML}
        <span class="badge badge-spec">${card.spec}</span>
        <span class="badge badge-time">⏱ ${card.duration} min</span>
        <span class="card-title">${card.title}</span>
        ${marksHTML}
      </div>
      <div class="card-body">
        <div id="cardContent">${bodyHTML}</div>
      </div>
    </div>`;

  // Complete banner
  document.getElementById('completeBanner').style.display =
    (done.size === cards.length && current === cards.length - 1) ? 'block' : 'none';
}

// ─────────────────────────────────────────────────────────────
// Toggle reveal / hide
// ─────────────────────────────────────────────────────────────
function toggleReveal() {
  const card = cards[current];
  const btn  = document.getElementById('btnReveal');
  const contentEl = document.getElementById('cardContent');

  if (revealed) {
    revealed = false;
    btn.textContent = 'Reveal Answers ✓';
    document.getElementById('hintText').textContent = card.type === 'exam'
      ? 'Complete the exam questions on paper, then reveal the mark scheme.'
      : 'Work through the activity on paper, then reveal the model answers.';
    contentEl.innerHTML = card.type === 'activity' ? buildActivityFace(card) : buildExamFace(card);
  } else {
    revealed = true;
    done.add(current);
    btn.textContent = 'Hide Answers ↩';
    document.getElementById('hintText').textContent = card.type === 'exam'
      ? 'Check your answers carefully against the mark scheme.'
      : 'Check your answers against the model answers below.';
    contentEl.innerHTML = card.type === 'activity' ? buildActivityAnswers(card) : buildMarkScheme(card);
    document.getElementById('btnNext').disabled = (current === cards.length - 1);
    renderDots();
    if (done.size === cards.length && current === cards.length - 1) {
      document.getElementById('completeBanner').style.display = 'block';
    }
  }
}

// ─────────────────────────────────────────────────────────────
// Navigate
// ─────────────────────────────────────────────────────────────
function navigate(dir) {
  current += dir;
  render();
  window.scrollTo(0, 0);
}

// ─────────────────────────────────────────────────────────────
// Render nav dots
// ─────────────────────────────────────────────────────────────
function renderDots() {
  const dotsEl = document.getElementById('navDots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < cards.length; i++) {
    const dot = document.createElement('button');
    dot.className = 'nav-dot' + (i === current ? ' active' : (done.has(i) ? ' done' : ''));
    dot.setAttribute('aria-label', `Card ${i + 1}`);
    dot.onclick = () => { current = i; render(); };
    dotsEl.appendChild(dot);
  }
}

// ─────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
