    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .progress-track { height: 4px; background: #d4c4b4; }

    color: #5c3a1e;
    font-weight: 700;
    font-size: 0.7rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .spec-dot:hover { background: #f0e4d0; }
  .spec-dot.active { background: #2a1a10; color: white; border-color: #2a1a10; }
  .spec-dot.done   { background: #c44b2b; color: white; border-color: #c44b2b; }

  .card-scene {
    width: 100%;
    max-width: 920px;
    display: grid;
  }
  .card-face {
    grid-area: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 22px rgba(60,30,10,0.14);
    transition: opacity 0.35s ease, transform 0.35s ease;
    background: #fffdf8;

  .card-scene.revealed .card-face.back  { opacity: 1; transform: scale(1); pointer-events: all; }

    color: white;
    padding: 13px 20px;
    display: flex;
    align-items: center;
    gap: 11px;

    align-items: center;

    font-weight: 700;

    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: 0.04em;

    background: #c44b2b;

    border-radius: 7px;
    white-space: nowrap;
    flex-shrink: 0;

  .marks-badge {
    margin-left: auto;
    background: #e8c46a;
    color: #2a1a00;
    font-weight: 700;
    font-size: 0.78rem;
    padding: 4px 11px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;

  .q-content { flex: 1; min-width: 0; }
  .q-stem { font-size: 0.91rem; color: #2a1a10; line-height: 1.55; }
  .q-meta { margin-top: 7px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .marks-pill { background: #2a1a10; color: white; font-size: 0.71rem; font-weight: 700; padding: 2px 9px; border-radius: 10px; }
  .ao-pill { background: #f0e8dc; color: #5c3a1e; font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; border: 1px solid #c4a882; }

  .ms-body.cols-1 { grid-template-columns: 1fr; }
  .ms-item { background: #fffdf8; border-radius: 8px; overflow: hidden; border: 1px solid #d4bfa0; box-shadow: 0 1px 4px rgba(60,30,10,0.06); }
  .ms-item-hdr { background: #f0e4d0; padding: 6px 13px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #d4bfa0; }
  .ms-ref { font-weight: 700; color: #2a1a10; font-size: 0.92rem; }
  .ms-total { font-size: 0.74rem; color: #7a5a3a; }
  .ms-points { padding: 9px 13px; display: flex; flex-direction: column; gap: 6px; }
  .ms-point { display: flex; gap: 8px; align-items: flex-start; font-size: 0.86rem; color: #2a1a10; line-height: 1.45; }
  .ms-tick { color: #1a7a4a; font-weight: 800; font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
  .ms-note { font-size: 0.74rem; color: #7a5a3a; font-style: italic; line-height: 1.4; border-top: 1px solid #ede4d8; margin-top: 4px; padding-top: 5px; }
  /* ── Controls ───────────────────────────────────── */
  .hint-text { font-size: 0.8rem; color: #8a7060; text-align: center; min-height: 18px; font-style: italic; }
  .controls { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; width: 100%; max-width: 920px; }
  .btn { padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.87rem; font-weight: 600; font-family: inherit; transition: all 0.15s; white-space: nowrap; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(60,30,10,0.18); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-outline { background: #fffdf8; color: #2a1a10; border: 2px solid #2a1a10; }
  .btn-reveal  { background: #c44b2b; color: white; padding: 11px 30px; font-size: 0.92rem; }
  .btn-next    { background: #2a1a10; color: white; padding: 11px 30px; font-size: 0.92rem; }
  /* ── Completion banner ──────────────────────────── */
  .complete-banner { background: #2a1a10; color: white; text-align: center; padding: 20px; border-radius: 12px; width: 100%; max-width: 920px; display: none; }
  .complete-banner h2 { font-size: 1.3rem; margin-bottom: 6px; }
  .complete-banner p { opacity: 0.8; font-size: 0.9rem; }
  .complete-banner.show { display: block; }
  @media (max-width: 640px) {
    .header { padding: 10px 14px; }
    .header-left h1 { font-size: 0.9rem; }
    .main { padding: 10px 10px 24px; gap: 9px; }

    .ms-body { grid-template-columns: 1fr !important; padding: 12px 14px; }
    .controls { gap: 8px; }
    .btn { padding: 9px 14px; font-size: 0.81rem; }
    .btn-reveal, .btn-next { padding: 9px 18px; font-size: 0.84rem; }
  }
</style>

          notes: "Must follow a logical sequence: isolation → no gene flow → different mutations/selection → genetic divergence → reproductive incompatibility."
        }
      ]
    }
  },

  // ── 4.21 ───────────────────────────────────────────────────────────────────
  {
    id: "4.21", label: "4.21",
    topic: "Topic 4: Biodiversity and Natural Resources",
    statement: "Be able to evaluate the methods used by zoos and seed banks in the conservation of endangered species and their genetic diversity, including scientific research, captive breeding programmes, reintroduction programmes and education.",
    totalMarks: 9,
    questionSlide: {
      title: "Conservation: Zoos and Seed Banks",
      questions: [
        { ref: "(a)", ao: "AO2", marks: 4, stem: "Evaluate the use of zoos in the conservation of endangered species. In your answer, include <strong>two</strong> advantages and <strong>two</strong> disadvantages." },
        { ref: "(b)", ao: "AO2", marks: 3, stem: "Describe how seed banks contribute to conservation of genetic diversity, and evaluate <strong>two</strong> limitations of this approach." },
        { ref: "(c)", ao: "AO3", marks: 2, stem: "Suggest why maintaining genetic diversity is important when planning a captive breeding programme for reintroduction." }
      ]
    },
    markSchemeSlide: {
      markScheme: [
        {
          ref: "(a)", total: "4 marks",
          points: [
            "Advantage 1: Captive breeding programmes increase population numbers / prevent extinction of critically endangered species [1]",
            "Advantage 2: Zoos conduct scientific research into animal biology / diseases / breeding; provide public education to raise awareness and funding [1]",
            "Disadvantage 1: Animals in captivity may lose natural behaviours (hunting, foraging) → reintroduction into wild may fail [1]",
            "Disadvantage 2: Limited space in zoos → small captive populations → risk of inbreeding → reduced genetic diversity → lower fitness [1]"
          ],
          notes: "Must be an evaluation (advantages AND disadvantages). Award 1 mark per valid point."
        },
        {
          ref: "(b)", total: "3 marks",
          points: [
            "Seeds are collected from wild plant populations and stored at low temperature (−20°C) and low humidity to remain viable for many years [1]",
            "Seeds represent the genetic diversity of the species; can be germinated and grown if wild populations become extinct [1]",
            "Limitation 1: Only works for seed-producing plants; cannot conserve ferns, mosses, or many species lacking viable seeds [1]",
            "Limitation 2: Seeds have a finite lifespan; must be periodically grown out and new seeds re-collected; some seeds do not survive storage well [1]",
            "Limitation 3: Does not preserve the species in its ecosystem / ecological interactions are lost [1]"
          ],
          notes: "1 mark for description of seed bank method, 1 mark for genetic diversity point, 1 mark for any valid limitation."
        },
        {

          points: [

      ]

];

// ── State ───────────────────────────────────────────────────────────────────
let current = 0;
const visited = new Set();
const revealed = new Set();

// ── Build question face ─────────────────────────────────────────────────────
function buildQuestion(sp) {
  const qs = sp.questionSlide;
  const questionsHTML = qs.questions.map(q => `
    <div class="q-item">
      <div class="q-ref">${q.ref}</div>
      <div class="q-content">
        <div class="q-stem">${q.stem}</div>
        <div class="q-meta">
          <span class="marks-pill">${q.marks} mark${q.marks !== 1 ? 's' : ''}</span>
          <span class="ao-pill">${q.ao}</span>
        </div>
      </div>
    </div>`).join('');

  return `
    <div class="q-header">
      <span class="unit-badge">WBI12 · Unit 2</span>
      <span class="spec-badge-hdr">${sp.id}</span>
      <span class="q-header-title">${qs.title}</span>
      <span class="marks-badge">${sp.totalMarks} marks</span>
    </div>
    <div class="spec-stmt"><strong>Spec:</strong> ${sp.statement}</div>
    <div class="q-body">${questionsHTML}</div>`;
}

// ── Build mark scheme face ──────────────────────────────────────────────────
function buildMarkScheme(sp) {
  const ms = sp.markSchemeSlide;
  const useSingleCol = ms.markScheme.length <= 2;
  const itemsHTML = ms.markScheme.map(item => {
    const pointsHTML = item.points.map(p =>
      `<div class="ms-point"><span class="ms-tick">✓</span><span>${p}</span></div>`
    ).join('');
    const noteHTML = item.notes
      ? `<div class="ms-note">📝 ${item.notes}</div>`
      : '';
    return `
      <div class="ms-item">
        <div class="ms-item-hdr">
          <span class="ms-ref">${item.ref}</span>
          <span class="ms-total">${item.total}</span>
        </div>
        <div class="ms-points">${pointsHTML}${noteHTML}</div>
      </div>`;
  }).join('');

  return `
    <div class="ms-header">
      <span class="ms-badge">Mark Scheme</span>
      <span class="ms-header-title">${sp.questionSlide.title}</span>
    </div>
    <div class="ms-body ${useSingleCol ? 'cols-1' : ''}">${itemsHTML}</div>`;
}

// ── Render nav dots ─────────────────────────────────────────────────────────
function renderNav() {
  document.getElementById('specNav').innerHTML = specPoints.map((sp, i) => {
    let cls = '';
    if (i === current) cls = 'active';
    else if (revealed.has(i)) cls = 'done';
    return `<div class="spec-dot ${cls}" onclick="goTo(${i})" title="${sp.questionSlide.title}">${sp.label}</div>`;
  }).join('');
}

// ── Render current card ─────────────────────────────────────────────────────
function render() {
  const sp = specPoints[current];
  visited.add(current);

  document.getElementById('qFace').innerHTML  = buildQuestion(sp);
  document.getElementById('msFace').innerHTML = buildMarkScheme(sp);

  const scene = document.getElementById('cardScene');
  if (revealed.has(current)) {
    scene.classList.add('revealed');
    document.getElementById('hintText').textContent = '';
    document.getElementById('btnReveal').disabled = true;
    document.getElementById('btnNext').disabled = false;
  } else {
    scene.classList.remove('revealed');
    document.getElementById('hintText').innerHTML = 'Answer the questions, then tap <em>Reveal Answers</em>';
    document.getElementById('btnReveal').disabled = false;
    document.getElementById('btnNext').disabled = true;
  }

  document.getElementById('btnPrev').disabled = (current === 0);

  const total = specPoints.length;
  document.getElementById('progressPill').textContent = `Card ${current + 1} of ${total}`;
  document.getElementById('progressFill').style.width = `${((current + 1) / total) * 100}%`;

  renderNav();

  if (revealed.size === total) {
    document.getElementById('completeBanner').classList.add('show');
  }
}

// ── Reveal answers ──────────────────────────────────────────────────────────
function revealAnswers() {
  revealed.add(current);
  document.getElementById('cardScene').classList.add('revealed');
  document.getElementById('hintText').textContent = '';
  document.getElementById('btnReveal').disabled = true;
  document.getElementById('btnNext').disabled = false;
  renderNav();
}

// ── Navigation ──────────────────────────────────────────────────────────────
function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < specPoints.length) {
    current = next;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function goTo(idx) {
  current = idx;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Init ────────────────────────────────────────────────────────────────────
render();
</script>
