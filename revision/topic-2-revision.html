  .spec-dot.active { background: #2a1a10; color: white; border-color: #2a1a10; }
  .spec-dot.done   { background: #c44b2b; color: white; border-color: #c44b2b; }

    border-radius: 12px;

  .btn { padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.87rem; font-weight: 600; font-family: inherit; transition: all 0.15s; white-space: nowrap; }

  .btn-outline { background: #fffdf8; color: #2a1a10; border: 2px solid #2a1a10; }
  .btn-reveal  { background: #c44b2b; color: white; padding: 11px 30px; font-size: 0.92rem; }
  .btn-next    { background: #2a1a10; color: white; padding: 11px 30px; font-size: 0.92rem; }

    .btn { padding: 9px 14px; font-size: 0.81rem; }
    .btn-reveal, .btn-next { padding: 9px 18px; font-size: 0.84rem; }
  }
</style>

// ── Helpers ───────────────────────────────────────────────────────────────
function cleanPoint(pt) {
  return pt.replace(/\s*✓\s*\(\d+\)/g, '').replace(/\s*✓/g, '').trim();
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Render question face ──────────────────────────────────────────────────
function buildQuestion(sp) {
  const qs = sp.questionSlide;
  let qsHTML = '';
  for (const q of qs.questions) {
    qsHTML += `
      <div class="q-item">
        <div class="q-ref">${esc(q.ref)}</div>
        <div class="q-content">
          <div class="q-stem">${esc(q.stem)}</div>
          <div class="q-meta">
            <span class="marks-pill">[${q.marks}]</span>
            <span class="ao-pill">${esc(q.ao)}</span>
          </div>
        </div>
      </div>`;
  }
  return `
    <div class="q-header">
      <span class="unit-badge">WBI11 · Unit 1</span>
      <span class="spec-badge-hdr">${esc(sp.label)}</span>
      <span class="q-header-title">${esc(qs.title)}</span>
      <span class="marks-badge">${sp.totalMarks} marks</span>
    </div>
    <div class="spec-stmt"><strong>Spec ${esc(sp.id)}:</strong> ${esc(sp.statement)}</div>
    <div class="q-body">${qsHTML}</div>`;
}

  let itemsHTML = '';
  for (const item of ms.markScheme) {
    const pureAnswers = item.points.filter(p => !/^(NOTE|Do not|Accept|Allow|Award|Must|Any |Both|Either|E\.g\.|Number alone|approx|ecf)/i.test(p.trim()));
    const allNotes = [...item.points.filter(p => /^(NOTE|Do not|Accept|Allow|Award|Must|Any |Both|Either|E\.g\.|Number alone|approx|ecf)/i.test(p.trim())), ...(item.notes || [])];
    const pointsHTML = pureAnswers.map(pt => {
      const hasCheck = pt.includes('✓');
      const cleaned = cleanPoint(pt);
      return `<div class="ms-point">${hasCheck ? '<span class="ms-tick">✓</span>' : '<span class="ms-tick" style="opacity:0">·</span>'}<span>${esc(cleaned)}</span></div>`;
    }).join('');
    const notesHTML = allNotes.map(n => `<div class="ms-note">${esc(n)}</div>`).join('');
    itemsHTML += `
      <div class="ms-item">
        <div class="ms-item-hdr">
          <span class="ms-ref">${esc(item.ref)}</span>
          <span class="ms-total">[${item.total} mark${item.total > 1 ? 's' : ''}]</span>
        </div>
        <div class="ms-points">${pointsHTML}${notesHTML}</div>
      </div>`;
  }
  return `
    <div class="ms-header">
      <span class="unit-badge">WBI11 · Unit 1</span>
      <span class="ms-badge">✓ Mark Scheme</span>
      <span class="ms-header-title">${esc(sp.label)} — ${esc(sp.questionSlide.title)}</span>
    </div>
    <div class="spec-stmt"><strong>Spec ${esc(sp.id)}:</strong> ${esc(sp.statement)}</div>
    <div class="ms-body ${singleCol ? 'cols-1' : ''}">
      ${itemsHTML}
    </div>`;
}

// ── Nav dots ─────────────────────────────────────────────────────────────
function renderNav() {
  document.getElementById('specNav').innerHTML = specPoints.map((sp, i) => {
    const cls = i === current ? 'active' : done.has(i) ? 'done' : '';
    return `<div class="spec-dot ${cls}" onclick="goTo(${i})" title="${sp.questionSlide.title}">${sp.label}</div>`;
  }).join('');
}

// ── Main render ───────────────────────────────────────────────────────────
function render() {
  const sp = specPoints[current];
  document.getElementById('cardScene').classList.remove('revealed');
  document.getElementById('progressPill').textContent = `Card ${current + 1} of ${specPoints.length}`;
  document.getElementById('progressFill').style.width = `${(current + 1) / specPoints.length * 100}%`;
  document.getElementById('hintText').textContent = 'Answer the questions, then tap "Reveal Answers"';
  document.getElementById('btnReveal').disabled = false;
  document.getElementById('btnReveal').textContent = 'Reveal Answers ✓';
  document.getElementById('btnNext').disabled = true;
  document.getElementById('btnPrev').disabled = current === 0;
  document.getElementById('completeBanner').classList.remove('show');
  document.getElementById('qFace').innerHTML  = buildQuestion(sp);
  document.getElementById('msFace').innerHTML = buildMarkScheme(sp);
  renderNav();
}

// ── Actions ───────────────────────────────────────────────────────────────
function revealAnswers() {
  const scene = document.getElementById('cardScene');
  const btn = document.getElementById('btnReveal');
  if (scene.classList.contains('revealed')) {
    scene.classList.remove('revealed');
    btn.textContent = 'Reveal Answers ✓';
    document.getElementById('hintText').textContent = 'Answer the questions, then tap "Reveal Answers"';
  } else {
    scene.classList.add('revealed');
    btn.textContent = 'Hide Answers ↩';
    document.getElementById('btnNext').disabled = (current === specPoints.length - 1);
    document.getElementById('hintText').textContent = 'Check your answers carefully, then move on';
    done.add(current);
    renderNav();
  }
}
function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < specPoints.length) {
    current = next;
    render();
  } else if (dir === 1 && current === specPoints.length - 1) {
    document.getElementById('completeBanner').classList.add('show');
    document.getElementById('hintText').textContent = '';
  }
}
function goTo(idx) { current = idx; render(); }

// ── Init ──────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
