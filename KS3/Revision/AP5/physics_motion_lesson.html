<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion &amp; Forces – Lesson Activities</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f0f4ff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ──────────────────────────────────────────── */
.header {
  background: #0c2340;
  color: white;
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.header-left h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.01em; }
.header-left .sub { font-size: 0.78rem; opacity: 0.68; margin-top: 2px; }
.progress-pill {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 600;
  white-space: nowrap;
}
.progress-track { height: 4px; background: #bfdbfe; }
.progress-fill { height: 100%; background: #3b82f6; transition: width 0.5s ease; }

/* ── Main ────────────────────────────────────────────── */
.main {
  flex: 1;
  padding: 20px 16px 4px;
  max-width: 880px;
  margin: 0 auto;
  width: 100%;
}

/* ── Card ─────────────────────────────────────────────── */
.card {
  background: white;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  overflow: hidden;
  margin-bottom: 12px;
}
.card-header {
  background: #eff6ff;
  border-bottom: 1px solid #bfdbfe;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.card-title {
  font-size: 1rem;
  font-weight: 700;
  color: #0c2340;
  flex: 1;
  min-width: 160px;
}
.badge {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  white-space: nowrap;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.badge-activity { background: #fef3c7; color: #92400e; }
.badge-exam     { background: #dbeafe; color: #1e3a8a; }
.badge-spec     { background: #dbeafe; color: #1e3a5f; text-transform: none; font-size: 0.75rem; }
.badge-time     { background: #f3f4f6; color: #374151; text-transform: none; font-size: 0.75rem; }
.badge-marks    { background: #0c2340; color: white; margin-left: auto; }

.card-body { padding: 18px 20px; }

/* ── Instructions ─────────────────────────────────────── */
.instructions {
  background: #eff6ff;
  border-left: 3px solid #3b82f6;
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  font-size: 0.88rem;
  color: #1e3a5f;
  margin-bottom: 16px;
  line-height: 1.55;
}

/* ── Calculation sprint table ─────────────────────────── */
.table-wrap { overflow-x: auto; margin-bottom: 14px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.data-table th {
  background: #0c2340; color: white;
  padding: 8px 12px; text-align: left; font-weight: 600;
}
.data-table td {
  padding: 7px 12px; border-bottom: 1px solid #e5e7eb; color: #374151;
}
.data-table tr:nth-child(even) td { background: #f8faff; }
.data-table td.blank-cell { color: #d1d5db; font-style: italic; }
.data-table td.answer-cell { color: #1e3a5f; font-weight: 600; }
.data-table td.eq-cell { font-family: 'Courier New', monospace; font-size: 0.82rem; color: #0c2340; }

/* ── Graph grid ───────────────────────────────────────── */
.graph-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 14px;
}
.graph-panel {
  border: 2px dashed #93c5fd;
  border-radius: 10px;
  background: #f8faff;
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.graph-panel svg { width: 100%; height: auto; }
.graph-label {
  font-size: 0.78rem;
  font-weight: 700;
  color: #0c2340;
  text-align: center;
  margin-bottom: 4px;
}

/* ── Graph questions ──────────────────────────────────── */
.graph-qs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.graph-q {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 0.88rem; color: #374151; line-height: 1.55;
}
.graph-q-ref { font-weight: 700; color: #0c2340; min-width: 28px; flex-shrink: 0; padding-top: 1px; }
.graph-q-marks { font-size: 0.78rem; color: #6b7280; font-weight: 600; margin-left: 4px; }

/* ── Forces table ─────────────────────────────────────── */
.forces-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; margin-bottom: 14px; }
.forces-table th {
  background: #0c2340; color: white;
  padding: 8px 12px; text-align: center; font-weight: 600;
}
.forces-table td {
  padding: 7px 12px; border: 1px solid #e5e7eb; text-align: center; color: #374151;
}
.forces-table tr:nth-child(even) td { background: #f8faff; }
.forces-table td.blank-cell { color: #d1d5db; font-style: italic; }
.forces-table td.answer-cell { color: #1e3a5f; font-weight: 600; }
.forces-table td.find-cell { background: #dbeafe; color: #1e3a8a; font-weight: 700; font-style: italic; font-size: 0.8rem; }

/* ── Answer blocks ────────────────────────────────────── */
.answer-section { display: flex; flex-direction: column; gap: 12px; }
.answer-block { border: 1px solid #bfdbfe; border-radius: 8px; overflow: hidden; }
.answer-block-hdr {
  background: #dbeafe; border-bottom: 1px solid #bfdbfe;
  padding: 7px 14px; font-size: 0.82rem; font-weight: 700; color: #1e3a5f;
}
.answer-block-body {
  padding: 10px 14px; font-size: 0.87rem; color: #374151; line-height: 1.6;
}

/* ── Answer rows ──────────────────────────────────────── */
.ans-row {
  display: flex; gap: 8px; align-items: flex-start;
  font-size: 0.86rem; color: #1a2e4f; line-height: 1.5;
  padding: 5px 0; border-bottom: 1px solid #eff6ff;
}
.ans-row:last-child { border-bottom: none; }
.ans-ref { font-weight: 700; color: #0c2340; min-width: 28px; flex-shrink: 0; }
.ans-tick { color: #2563eb; font-weight: 800; flex-shrink: 0; }

/* ── Exam questions ───────────────────────────────────── */
.exam-qs { display: flex; flex-direction: column; gap: 18px; }
.exam-q { }
.exam-q-num {
  font-size: 0.95rem; font-weight: 700; color: #0c2340;
  border-bottom: 1px solid #bfdbfe; padding-bottom: 5px; margin-bottom: 10px;
}
.exam-context {
  font-size: 0.87rem; color: #374151; line-height: 1.55;
  padding: 8px 12px; background: #f8faff;
  border-left: 3px solid #93c5fd; border-radius: 0 6px 6px 0;
  margin-bottom: 10px;
}
.exam-parts { display: flex; flex-direction: column; gap: 10px; }
.exam-part { display: flex; gap: 10px; align-items: flex-start; }
.exam-part-ref { font-weight: 700; color: #374151; min-width: 28px; font-size: 0.9rem; padding-top: 2px; }
.exam-part-body { flex: 1; }
.exam-stem { font-size: 0.9rem; color: #1a2e4f; line-height: 1.55; }
.exam-marks { font-size: 0.8rem; color: #6b7280; font-weight: 600; margin-left: 4px; }
.write-line { border-bottom: 1px solid #e5e7eb; height: 22px; margin-top: 5px; }

/* ── Mark scheme ──────────────────────────────────────── */
.ms-section { display: flex; flex-direction: column; gap: 14px; }
.ms-q { }
.ms-q-hdr {
  background: #dbeafe; border-radius: 6px;
  padding: 6px 12px; font-size: 0.85rem; font-weight: 700; color: #1e3a5f;
  margin-bottom: 8px;
}
.ms-part { display: flex; gap: 10px; margin-bottom: 8px; padding-left: 8px; }
.ms-ref { font-weight: 700; color: #374151; min-width: 28px; font-size: 0.85rem; padding-top: 1px; }
.ms-body { flex: 1; }
.ms-pt {
  display: flex; gap: 7px; align-items: flex-start;
  font-size: 0.86rem; color: #1a2e4f; line-height: 1.5; margin-bottom: 3px;
}
.ms-pt-tick { color: #2563eb; font-weight: 700; flex-shrink: 0; }
.ms-note { font-size: 0.8rem; color: #6b7280; font-style: italic; margin-top: 3px; line-height: 1.4; }

/* ── Hint & Nav ───────────────────────────────────────── */
.hint-wrap { padding: 4px 16px 0; max-width: 880px; margin: 0 auto; width: 100%; }
.hint-text {
  text-align: center; font-size: 0.82rem; color: #6b7280;
  font-style: italic; padding: 6px 0;
}
.nav-bar {
  background: white; border-top: 1px solid #e5e7eb;
  padding: 11px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.nav-dots { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.nav-dot {
  width: 11px; height: 11px; border-radius: 50%;
  background: #bfdbfe; border: none; cursor: pointer;
  transition: background 0.2s; padding: 0;
}
.nav-dot.active { background: #0c2340; }
.nav-dot.done   { background: #3b82f6; }
.btn {
  padding: 9px 18px; border-radius: 8px;
  font-size: 0.88rem; font-weight: 600; border: none; cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}
.btn-prev   { background: #f3f4f6; color: #374151; }
.btn-prev:hover:not(:disabled)   { background: #e5e7eb; }
.btn-reveal { background: #3b82f6; color: white; }
.btn-reveal:hover { background: #2563eb; }
.btn-next   { background: #0c2340; color: white; }
.btn-next:hover:not(:disabled)   { background: #1e3a5f; }
.btn:disabled { opacity: 0.35; cursor: default; }

/* ── Complete banner ──────────────────────────────────── */
.complete-banner {
  background: #0c2340; color: white;
  text-align: center; padding: 24px 20px;
  border-radius: 12px; margin: 0 16px 20px;
  max-width: 848px; margin-left: auto; margin-right: auto;
}
.complete-banner h2 { font-size: 1.25rem; margin-bottom: 8px; }
.complete-banner p  { opacity: 0.8; font-size: 0.9rem; }

/* ── Mobile ───────────────────────────────────────────── */
@media (max-width: 640px) {
  .header { padding: 10px 14px; }
  .main { padding: 12px 10px 4px; }
  .card-body { padding: 14px; }
  .card-header { padding: 10px 14px; }
  .nav-bar { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
  .btn { padding: 8px 13px; font-size: 0.83rem; }
  .data-table th, .data-table td { padding: 6px 8px; font-size: 0.8rem; }
  .graph-grid { grid-template-columns: 1fr; }
  .forces-table th, .forces-table td { padding: 6px 8px; font-size: 0.8rem; }
}
</style>
</head>

// ─────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────
let current  = 0;
let revealed = false;
const done   = new Set();

// ─────────────────────────────────────────────────────────────
// Build: Activity 1 — Calculation Sprint
// ─────────────────────────────────────────────────────────────
function buildCalcFace(card) {
  let html = `<div class="instructions">${card.instructions}</div>`;
  html += `<div class="table-wrap"><table class="data-table">
    <thead><tr>
      <th>#</th><th>Equation</th><th>Given</th><th>Find</th><th>Your answer</th>
    </tr></thead><tbody>`;
  for (const r of card.calcRows) {
    html += `<tr>
      <td style="text-align:center;font-weight:700;color:#9ca3af;width:28px">${r.n}</td>
      <td class="eq-cell">${r.equation}</td>
      <td style="color:#374151;font-size:0.83rem">${r.given}</td>
      <td style="font-weight:700;color:#1d4ed8;text-align:center;width:50px">${r.find}</td>
      <td class="blank-cell">…</td>
    </tr>`;
  }
  html += '</tbody></table></div>';
  return html;
}

function buildCalcAnswers(card) {
  let html = `<div class="answer-section"><div class="answer-block">
    <div class="answer-block-hdr">Model Answers</div>
    <div class="answer-block-body" style="padding:0">
      <div class="table-wrap" style="margin:0"><table class="data-table">
        <thead><tr>
          <th>#</th><th>Equation</th><th>Given</th><th>Find</th><th>Answer</th>
        </tr></thead><tbody>`;
  for (const r of card.calcRows) {
    html += `<tr>
      <td style="text-align:center;font-weight:700;color:#9ca3af;width:28px">${r.n}</td>
      <td class="eq-cell">${r.equation}</td>
      <td style="color:#374151;font-size:0.83rem">${r.given}</td>
      <td style="font-weight:700;color:#1d4ed8;text-align:center;width:50px">${r.find}</td>
      <td class="answer-cell">${r.answer}</td>
    </tr>`;
  }
  html += '</tbody></table></div></div></div></div>';
  return html;
}

// ─────────────────────────────────────────────────────────────
// Build: Activity 2 — Graph Interpretation
// ─────────────────────────────────────────────────────────────
function buildGraphFace(card) {
  let html = `<div class="instructions">${card.instructions}</div>`;
  for (const g of card.graphQs) {
    const svgData = g.svg === 'dtSVG' ? dtSVG : vtSVG;
    html += `<div class="graph-grid" style="margin-bottom:18px">
      <div class="graph-panel">
        <div class="graph-label">${g.graphLabel}</div>
        ${svgData}
      </div>
      <div style="display:flex;flex-direction:column;justify-content:center;gap:10px">
        <div class="graph-qs">`;
    for (const q of g.qs) {
      html += `<div class="graph-q">
        <div class="graph-q-ref">${q.ref}</div>
        <div>${q.stem} <span class="graph-q-marks">[${q.marks}]</span></div>
      </div>`;
    }
    html += `</div></div></div>`;
  }
  return html;
}

function buildGraphAnswers(card) {
  let html = `<div class="answer-section"><div class="answer-block">
    <div class="answer-block-hdr">Model Answers</div>
    <div class="answer-block-body">`;
  for (const a of card.graphAnswers) {
    html += `<div class="ans-row">
      <span class="ans-ref">${a.ref}</span>
      <span class="ans-tick">✓</span>
      <span>${a.text}</span>
    </div>`;
  }
  html += '</div></div></div>';
  return html;
}

// ─────────────────────────────────────────────────────────────
// Build: Activity 3 — Forces
// ─────────────────────────────────────────────────────────────
function buildForcesFace(card) {
  let html = `<div class="instructions">${card.instructions}</div>`;
  html += `<p style="font-size:0.85rem;font-weight:700;color:#0c2340;margin-bottom:8px">Part A — F = ma sprint</p>`;
  html += `<div class="table-wrap"><table class="forces-table">
    <thead><tr>
      <th>#</th><th>Force (F)</th><th>Mass (m)</th><th>Acceleration (a)</th><th>Find →</th>
    </tr></thead><tbody>`;
  for (const r of card.forceRows) {
    const fClass = r.find === 'F' ? 'find-cell' : '';
    const mClass = r.find === 'm' ? 'find-cell' : '';
    const aClass = r.find === 'a' ? 'find-cell' : '';
    html += `<tr>
      <td style="font-weight:700;color:#9ca3af">${r.n}</td>
      <td class="${fClass || ''}">${r.find === 'F' ? '?' : r.F}</td>
      <td class="${mClass || ''}">${r.find === 'm' ? '?' : r.m}</td>
      <td class="${aClass || ''}">${r.find === 'a' ? '?' : r.a}</td>
      <td class="blank-cell">…</td>
    </tr>`;
  }
  html += '</tbody></table></div>';
  html += `<p style="font-size:0.85rem;font-weight:700;color:#0c2340;margin:14px 0 8px">Part B — Stopping distances</p>`;
  html += `<div class="graph-qs">`;
  for (const q of card.stoppingQs) {
    html += `<div class="graph-q">
      <div class="graph-q-ref">${q.ref}</div>
      <div>${q.stem}</div>
    </div>`;
  }
  html += '</div>';
  return html;
}

function buildForcesAnswers(card) {
  let html = `<div class="answer-section">
    <div class="answer-block">
      <div class="answer-block-hdr">Part A — F = ma Model Answers</div>
      <div class="answer-block-body" style="padding:0">
        <div class="table-wrap" style="margin:0"><table class="forces-table">
          <thead><tr>
            <th>#</th><th>Force (F)</th><th>Mass (m)</th><th>Acceleration (a)</th><th>Answer</th>
          </tr></thead><tbody>`;
  for (const r of card.forceRows) {
    html += `<tr>
      <td style="font-weight:700;color:#9ca3af">${r.n}</td>
      <td>${r.F}</td><td>${r.m}</td><td>${r.a}</td>
      <td class="answer-cell" style="text-align:left">${r.answer}</td>
    </tr>`;
  }
  html += '</tbody></table></div></div></div>';
  html += `<div class="answer-block"><div class="answer-block-hdr">Part B — Model Answers</div><div class="answer-block-body">`;
  for (const q of card.stoppingQs) {
    html += `<div class="ans-row">
      <span class="ans-ref">${q.ref}</span>
      <span class="ans-tick">✓</span>
      <span>${q.answer}</span>
    </div>`;
  }
  html += '</div></div></div>';
  return html;
}

// ─────────────────────────────────────────────────────────────
// Build: Exam question face
// ─────────────────────────────────────────────────────────────
function buildExamFace(card) {
  let html = '<div class="exam-qs">';
  for (const q of card.questions) {
    html += `<div class="exam-q">
      <div class="exam-q-num">${q.num} <span style="font-size:0.8rem;font-weight:400;color:#6b7280">[${q.marks} marks]</span></div>`;
    if (q.context) {
      html += `<div class="exam-context">${q.context}</div>`;
    }
    html += '<div class="exam-parts">';
    for (const p of q.parts) {
      const lines = Array(p.lines).fill('<div class="write-line"></div>').join('');
      html += `<div class="exam-part">
        <div class="exam-part-ref">${p.ref}</div>
        <div class="exam-part-body">
          <div class="exam-stem">${p.stem} <span class="exam-marks">[${p.marks}]</span></div>
          ${lines}
        </div>
      </div>`;
    }
    html += '</div></div>';
  }
  html += '</div>';
  return html;
}

// ─────────────────────────────────────────────────────────────
// Build: Mark scheme face
// ─────────────────────────────────────────────────────────────
function buildMarkScheme(card) {
  let html = '<div class="ms-section">';
  for (const msQ of card.markScheme) {
    html += `<div class="ms-q">
      <div class="ms-q-hdr">${msQ.num}</div>`;
    for (const p of msQ.parts) {
      html += `<div class="ms-part">
        <div class="ms-ref">${p.ref}</div>
        <div class="ms-body">`;
      for (const pt of p.points) {
        html += `<div class="ms-pt"><span class="ms-pt-tick">✓</span><span>${pt}</span></div>`;
      }
      for (const note of p.notes) {
        html += `<div class="ms-note">${note}</div>`;
      }
      html += '</div></div>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// ─────────────────────────────────────────────────────────────
// Render current card
// ─────────────────────────────────────────────────────────────
function buildCardHTML(card, showAnswers) {
  const isExam = card.type === 'exam';
  const timeLabel = isExam ? `${card.totalMarks} marks` : `${card.duration} min`;
  const badgeType = isExam ? 'badge-exam' : 'badge-activity';
  const badgeText = isExam ? 'EXAM' : 'ACTIVITY';

  let header = `<div class="card-header">
    <div class="card-title">${card.title}</div>
    <span class="badge badge-spec">${card.spec}</span>
    <span class="badge badge-time">${timeLabel}</span>
    <span class="badge ${badgeType}">${badgeText}</span>
  </div>`;

  let body = '';
  if (!showAnswers) {
    if (card.type === 'activity')   body = buildCalcFace(card);
    else if (card.type === 'graph') body = buildGraphFace(card);
    else if (card.type === 'forces')body = buildForcesFace(card);
    else if (card.type === 'exam')  body = buildExamFace(card);
  } else {
    if (card.type === 'activity')   body = buildCalcAnswers(card);
    else if (card.type === 'graph') body = buildGraphAnswers(card);
    else if (card.type === 'forces')body = buildForcesAnswers(card);
    else if (card.type === 'exam')  body = buildMarkScheme(card);
  }

  return `${header}<div class="card-body">${body}</div>`;
}

function render() {
  const card = cards[current];
  const isExam = card.type === 'exam';

  // Progress
  const label = isExam ? 'Exam Questions' : `Activity ${current + 1} of ${cards.length - 1}`;
  document.getElementById('progressPill').textContent = label;
  const pct = ((current + 1) / cards.length) * 100;
  document.getElementById('progFill').style.width = pct + '%';

  // Content
  document.getElementById('mainArea').innerHTML = `<div class="card">${buildCardHTML(card, revealed)}</div>`;

  // Hint
  document.getElementById('hintText').textContent = revealed
    ? (isExam ? 'Check your answers against the mark scheme.' : 'Check your answers carefully, then move on.')
    : (isExam ? 'Write your answers on paper, then reveal the mark scheme.' : 'Work through the activity on paper, then reveal the model answers.');

  // Buttons
  document.getElementById('btnPrev').disabled = current === 0;
  document.getElementById('btnNext').disabled = !revealed;
  document.getElementById('btnReveal').textContent = revealed ? 'Hide Answers ↩' : 'Reveal Answers ✓';

  // Nav dots
  const dotsEl = document.getElementById('navDots');
  dotsEl.innerHTML = cards.map((_, i) => {
    const cls = i === current ? 'active' : done.has(i) ? 'done' : '';
    return `<button class="nav-dot ${cls}" onclick="goTo(${i})" title="Card ${i+1}"></button>`;
  }).join('');

  // Complete banner
  document.getElementById('completeBanner').style.display = 'none';
}

function toggleReveal() {
  revealed = !revealed;
  if (revealed) done.add(current);
  render();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < cards.length) {
    current = next;
    revealed = false;
    render();
  } else if (dir === 1) {
    document.getElementById('completeBanner').style.display = 'block';
    document.getElementById('mainArea').innerHTML = '';
    document.getElementById('hintText').textContent = '';
  }
}

function goTo(idx) {
  current = idx;
  revealed = done.has(idx);
  render();
}

render();
</script>
