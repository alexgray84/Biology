<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcadia Future Week activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&family=Newsreader:ital,opsz,wght@1,6..72,400..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="act">
<div id="app"><noscript><p style="padding:40px">This page needs JavaScript. <a href="index.html">Back to all activities</a>.</p></noscript></div>

<script src="data.js"></script>
<script>
(function () {
  var D = window.AFW;
  if (!D) { document.getElementById('app').innerHTML = '<p style="padding:40px">Could not load the activities. <a href="index.html">Go back and try again</a>.</p>'; return; }
  var T = D.tracks;
  var id = (new URLSearchParams(location.search).get('id') || '').toUpperCase();
  var a = D.acts[id];
  var app = document.getElementById('app');
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  if (!a) {
    app.innerHTML = '<div class="wrap" style="padding-top:80px;padding-bottom:80px"><h1 class="h2">We couldn’t find that activity</h1><p style="margin:20px 0"><a class="btn" href="index.html#activities">See all activities</a></p></div>';
    return;
  }

  var t = a.track ? T[a.track] : null;
  var yrs = 'Years ' + a.years[0] + '–' + a.years[1];
  var total = a.steps.reduce(function (n, s) { return n + s.m; }, 0);
  document.title = a.title + ' · Arcadia Future Week';

  /* ── small renderers ── */
  var stageNo = 0;
  var stage = function (it, rest, inner) {
    stageNo += 1;
    return '<section class="stage"><h2><span class="n" aria-hidden="true">' + stageNo + '</span><span><span class="it">' + it + '</span> ' + rest + '</span></h2>' + inner + '</section>';
  };
  var deck = function (c) {
    if (!c || !c.items.length) { return ''; }
    return '<div class="deck"><h3>' + esc(c.title) + '</h3>' + (c.note ? '<p>' + esc(c.note) + '</p>' : '') + (c.pick ? '<p><button type="button" class="pill pickbtn">Pick one for us</button> <span class="picked" role="status"></span></p><p class="small">One person presses, once. Everyone uses that card.</p>' : '') + '<ul>' + c.items.map(function (x) {
      return typeof x === 'string' ? '<li>' + esc(x) + '</li>' : '<li><span class="k">' + esc(x.k || '') + '</span>' + esc(x.t || '') + '<small>' + esc(x.d || '') + '</small></li>';
    }).join('') + '</ul></div>';
  };

  /* T20: hidden target pictures */
  var TARGETS = {
    A: '<svg viewBox="0 0 240 240" role="img" aria-label="Target A: a wind tower"><g fill="none" stroke="#0b0b0b" stroke-width="4" stroke-linejoin="round"><rect x="95" y="90" width="50" height="120"/><rect x="85" y="40" width="70" height="50"/><path d="M99 48v34M113 48v34M127 48v34M141 48v34"/><path d="M40 210h160"/></g></svg>',
    B: '<svg viewBox="0 0 240 240" role="img" aria-label="Target B: a ring-shaped building"><g fill="none" stroke="#0b0b0b" stroke-width="4"><ellipse cx="120" cy="115" rx="90" ry="62"/><ellipse cx="120" cy="115" rx="62" ry="38"/><path d="M20 177h200"/></g></svg>',
    C: '<svg viewBox="0 0 240 240" role="img" aria-label="Target C: a simple robot"><g fill="none" stroke="#0b0b0b" stroke-width="4" stroke-linejoin="round"><rect x="85" y="40" width="70" height="50"/><circle cx="106" cy="62" r="7"/><circle cx="134" cy="62" r="7"/><path d="M120 40V22"/><circle cx="120" cy="17" r="5"/><rect x="70" y="98" width="100" height="80"/><path d="M70 115H42M170 115h28M95 178v34M145 178v34"/></g></svg>'
  };
  var targets = !a.targets ? '' :
    '<div class="targets"><h3>Hidden target pictures: prompter only</h3><p>Prompter: use this on your own device and keep the screen away from your machine. Tap a target to see it, and tap “Hide” before your machine looks. Show it to both of you only at step 7. Machine: do not open the targets on your own device.</p>' +
    '<div class="picks"><button type="button" class="pill" data-target="A" aria-pressed="false">Show target A</button><button type="button" class="pill" data-target="B" aria-pressed="false">Show target B</button><button type="button" class="pill" data-target="C" aria-pressed="false">Show target C</button><button type="button" class="pill" data-target="" aria-pressed="true">Hide</button></div>' +
    '<div class="stagebox" id="tstage">Target hidden</div></div>';

  /* T30: paragraph with planted errors */
  var P = D.paragraph || null;
  var para = (!a.paragraph || !P) ? '' :
    '<div class="box"><p class="para" id="para">' + P.html + '</p><div class="paratools"><button type="button" class="pill" id="uline" aria-pressed="false">Underline the errors (wait for step 5)</button></div></div>';

  /* F50: shared results table, so no board is needed */
  var GROUPS = ['Movement', 'Breathing', 'Still (control)'];
  var results = !a.results ? '' :
    '<div class="results" id="results"><h3>Results table</h3><p>The scribe types in each person’s mean before and mean after, in centimetres. Change = before − after, so a plus number means faster. The results stay on this device only and are not sent anywhere.</p>' +
    '<div class="radd"><label>Group <select id="rg">' + GROUPS.map(function (g, i) { return '<option value="' + i + '">' + g + '</option>'; }).join('') + '</select></label>' +
    '<label>Mean before (cm) <input id="rb" type="number" inputmode="decimal" step="0.1" min="1" max="30"></label>' +
    '<label>Mean after (cm) <input id="ra" type="number" inputmode="decimal" step="0.1" min="1" max="30"></label>' +
    '<button type="button" class="btn" id="radd">Add result</button><button type="button" class="pill" id="rclear">Clear all</button></div><p class="rmsg" id="rmsg" role="status"></p><div class="rgrid" id="rgrid"></div></div>';

  var allQs = !a.allQuestions ? '' :
    '<div class="deck"><h3>The 15 Dubai Future Week questions</h3><ul>' + Object.keys(T).map(function (k) {
      return T[k].questions.map(function (q) { return '<li><span class="k">HOW WE’LL ' + esc(T[k].word.toUpperCase()) + '</span>' + esc(q) + '</li>'; }).join('');
    }).join('') + '</ul></div>';

  var stepHtml = function (s, i) {
    return '<li class="step" data-i="' + i + '"><span class="big" aria-hidden="true">' + (i + 1) + '</span><div class="mid"><div class="tags"><span class="tag yl">' + s.m + (s.m === 1 ? ' minute' : ' minutes') + '</span><span class="tag">' + esc(s.who) + '</span></div><h3>' + esc(s.t) + '</h3><p>' + esc(s.d) + '</p></div>' +
      '<div class="clockcol"><span class="clock" role="timer" aria-label="Step ' + (i + 1) + ' timer">' + s.m + ':00</span><button type="button" data-step="' + i + '">Start timer</button></div></li>';
  };
  var lastIsThink = /used to think/i.test(a.steps[a.steps.length - 1].t);
  var cut = lastIsThink ? a.steps.length - 1 : a.steps.length;
  var steps = a.steps.slice(0, cut).map(stepHtml).join('');
  var thinkStep = lastIsThink ? '<ol class="steps" role="list" start="' + (cut + 1) + '">' + stepHtml(a.steps[cut], cut) + '</ol>' : '';

  var model = a.model;
  var modelHtml = '<div class="model"><button type="button" id="mbtn" aria-expanded="false" aria-controls="minner"><span>Finished your own? Now see the model.</span><span class="tog">Show</span></button><div class="inner" id="minner" hidden>' +
    (model.intro ? '<p>' + model.intro + '</p>' : '') +
    '<ol>' + model.marks.map(function (m, i) { return '<li><i aria-hidden="true">' + (i + 1) + '</i><span>' + (model.plain ? '' : '<small>Checklist point ' + (i + 1) + '</small>') + m + '</span></li>'; }).join('') + '</ol>' +
    (model.after ? '<p>' + model.after + '</p>' : '') + '</div></div>';

  var start = D.order.indexOf(id);
  var picks = [1, 6, 11].map(function (o) { return D.order[(start + o) % D.order.length]; }).filter(function (x) { return x !== id; });

  app.innerHTML =
    '<section class="ahero"><div class="wrap">' +
    '<header class="bar bar--flat"><a class="brand" href="index.html"><img src="assets/crest.png" alt="Arcadia British School crest"><span><b>Future Week</b><small>Arcadia British School</small></span></a>' +
    '<a class="cta" href="index.html#activities"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>All activities</a></header>' +
    '<div class="row"><div class="copy">' +
    '<span class="tchip">' + (t ? '<span class="it">' + t.n + ' · how we’ll</span> ' + esc(t.word) : '<span class="it">bonus ·</span> any track') + '</span>' +
    '<h1>' + esc(a.title) + '</h1><p class="sum">' + esc(a.blurb) + '</p>' +
    '<ul class="facts"><li class="m">' + a.mins + ' minutes</li><li class="y">' + yrs + '</li><li>' + esc(D.teams[a.team].label) + '</li><li>Kit: ' + esc(a.kit) + '</li>' + (a.comp ? '<li class="c">Competition entry</li>' : '') + '</ul>' +
    '</div><img class="art" src="' + (t ? t.img : 'assets/hero.jpg') + '" alt="' + esc(t ? t.alt : '') + '"></div>' +
    '</div></section>' +

    '<main class="wrap amain"><div class="flow">' +
    stage('know this', 'first', '<div class="box drop"><p>' + esc(a.drop) + '</p></div>') +
    stage('an example', 'before you start', '<div class="box eg"><p>' + a.example + '</p></div>') +
    stage('what to', 'do', '<p class="hint">You can run this yourselves. Start the timer on each step to keep things moving: it beeps when time is up. Working with others? Choose one person to run the timers and read each step out. ' + total + ' minutes of the ' + a.mins + ' are planned, so there is time to settle and pack up.</p>' + (a.fewer ? '<div class="box fewer"><p><b>Fewer of you?</b> ' + esc(a.fewer) + '</p></div>' : '') + (a.rules ? '<div class="box rules"><p><b>Ground rules.</b> ' + esc(a.rules) + '</p></div>' : '') + deck(a.cards) + deck(a.cards3) + deck(a.cards2) + targets + para + allQs + '<ol class="steps" role="list">' + steps + '</ol>' + results + '<div class="box help"><p><b>If you’re stuck.</b> ' + esc(a.support) + '</p><p><b>Go further.</b> ' + esc(a.stretch) + '</p></div>') +
    stage('check it', 'against the checklist', '<ul class="check" role="list">' + a.checklist.map(function (c, i) { return '<li><label><input type="checkbox" id="c' + i + '"><span>' + esc(c) + '</span></label></li>'; }).join('') + '</ul>') +
    stage('see the', 'model', '<p class="hint">Open this only after you have checked your own work. Find one thing the model does that yours does not.</p>' + modelHtml) +
    stage('one last', 'thought', '<div class="think"><span>I used to think…</span><span>Now I think…</span></div>' + thinkStep) +
    '</div>' +

    '<aside class="side">' +
    '<div class="sbox q"><h2>' + (a.ownQ ? '<span class="it">Arcadia’s</span> question' : a.qLabel ? esc(a.qLabel) : '<span class="it">the big</span> question') + '</h2><p>' + esc(a.question) + '</p></div>' +
    '<div class="sbox dfw"><h2><span class="it">from</span> Dubai Future Week</h2><p>' + esc(a.from) + '</p></div>' +
    '<div class="sbox"><h2><span class="it">you</span> make</h2><p>' + esc(a.make) + '</p></div>' +
    (a.comp ? '<div class="sbox cmp"><h2><span class="it">competition</span> entry</h2><p>This is an entry route for ' + esc(a.comp) + '. You send in your own work.</p><ol><li>Tick it against the three-point checklist.</li><li>Photograph it, or fix an entry slip to the back.</li><li>Send it through the entry form, or hand in the paper.</li></ol><p><a class="btn" href="enter.html">How to enter</a></p></div>' : '') +
    '<div class="sbox alone"><h2><span class="it">who you</span> need</h2><p><b>' + esc(D.teams[a.team].label) + '.</b> ' + esc(D.teams[a.team].note) + ' No teacher is needed: you run it yourselves.</p></div>' +
    '</aside></main><p class="sr" id="tsay" role="status"></p>' +

    '<section class="wrap next"><h2><span class="it">try</span> next</h2><div class="row">' + picks.map(function (n) {
      var b = D.acts[n], bt = b.track ? T[b.track] : null;
      return '<a class="ncard lift" href="activity.html?id=' + n + '"><img src="' + (bt ? bt.img : 'assets/hero.jpg') + '" alt="" loading="lazy"><span class="shade" aria-hidden="true"></span><span class="m">' + b.mins + ' min</span><span class="nm"><span class="it">' + (bt ? 'how we’ll ' + esc(bt.word) : 'bonus') + '</span><b>' + esc(b.title) + '</b></span></a>';
    }).join('') + '</div></section>' +

    '<footer class="foot2"><div class="wrap"><span class="who"><img src="assets/crest.png" alt=""><span><strong style="font-weight:600">Arcadia British School</strong> <span class="it">Dubai</span></span></span><span>Inspired by Dubai Future Week, 18–21 November 2026. A school project, not an official Dubai Future Week event.</span></div></footer>';

  /* ── F50 results table ── */
  var rows = [], RKEY = 'afw-f50-results';
  try { rows = JSON.parse(localStorage.getItem(RKEY) || '[]').filter(function (r) { return r && r.g >= 0 && r.g < 3 && r.b > 0 && r.a > 0; }); } catch (e) { rows = []; }
  function drawResults() {
    var host = document.getElementById('rgrid'); if (!host) { return; }
    host.innerHTML = GROUPS.map(function (g, gi) {
      var mine = rows.map(function (r, i) { return { r: r, i: i }; }).filter(function (x) { return x.r.g === gi; });
      var sum = mine.reduce(function (n, x) { return n + (x.r.b - x.r.a); }, 0);
      var mean = mine.length ? Math.round(sum / mine.length * 10) / 10 : null;
      var mb = mine.length ? mine.reduce(function (n, x) { return n + x.r.b; }, 0) / mine.length : 0, ma = mine.length ? mine.reduce(function (n, x) { return n + x.r.a; }, 0) / mine.length : 0;
      try { localStorage.setItem(RKEY, JSON.stringify(rows)); } catch (e) { /* private mode: keep in memory */ }
      return '<div class="rcol"><h4>' + g + '</h4><table><thead><tr><th>Before</th><th>After</th><th>Change</th><th><span class="sr">Remove</span></th></tr></thead><tbody>' +
        (mine.length ? mine.map(function (x) { return '<tr><td>' + x.r.b.toFixed(1) + '</td><td>' + x.r.a.toFixed(1) + '</td><td>' + (x.r.b - x.r.a).toFixed(1) + '</td><td><button type="button" data-del="' + x.i + '" aria-label="Remove this result">×</button></td></tr>'; }).join('') : '<tr><td colspan="4">No results yet</td></tr>') +
        '</tbody></table><p class="rmean">' + (mean === null ? 'Mean change: none yet' : 'Pupils: ' + mine.length + '. Mean before ' + mb.toFixed(1) + ' cm, after ' + ma.toFixed(1) + ' cm. Mean change: <b>' + (mean === 0 ? '0.0 cm, no change' : Math.abs(mean).toFixed(1) + ' cm ' + (mean > 0 ? 'faster' : 'slower')) + '</b>') + '</p></div>';
    }).join('');
  }
  function addResult() {
    var b = parseFloat(document.getElementById('rb').value), af = parseFloat(document.getElementById('ra').value), msg = document.getElementById('rmsg');
    if (!(b >= 1 && b <= 30) || !(af >= 1 && af <= 30)) { msg.textContent = 'Type both means as numbers between 1 and 30.'; return; }
    rows.push({ g: Number(document.getElementById('rg').value), b: b, a: af });
    document.getElementById('rb').value = ''; document.getElementById('ra').value = ''; msg.textContent = 'Added.';
    drawResults(); document.getElementById('rb').focus();
  }
  drawResults();
  if (a.paragraph) { var mb0 = document.getElementById('mbtn'); mb0.disabled = true; mb0.querySelector('span').textContent = 'Locked until you reveal the errors in step 5.'; }
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && (e.target.id === 'rb' || e.target.id === 'ra')) { addResult(); } });

  /* ── timers: one runs at a time ── */
  var active = -1, remaining = 0, running = false, endAt = 0;
  var els = Array.prototype.slice.call(document.querySelectorAll('.step'));
  var fmt = function (s) { var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; };
  function paint() {
    els.forEach(function (el) {
      var i = Number(el.dataset.i), on = i === active, done = on && remaining === 0 && !running;
      var clock = el.querySelector('.clock'), btn = el.querySelector('button');
      el.classList.toggle('on', on && !done); el.classList.toggle('done', done);
      clock.textContent = done ? 'Time’s up' : fmt(on ? remaining : a.steps[i].m * 60);
      clock.classList.toggle('up', done);
      btn.textContent = !on ? 'Start timer' : done ? 'Restart' : running ? 'Pause' : 'Resume';
    });
  }
  var actx = null;
  function ding() {
    try { if (navigator.vibrate) { navigator.vibrate([200, 100, 200]); } } catch (e) { /* no vibration */ }
    try {
      if (!actx) { return; }
      [0, 0.35].forEach(function (at) {
        var o = actx.createOscillator(), g = actx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.0001, actx.currentTime + at); g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + at + 0.3);
        o.start(actx.currentTime + at); o.stop(actx.currentTime + at + 0.32);
      });
    } catch (e) { /* no sound */ }
  }
  function sync() {
    if (!running) { return; }
    remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    if (remaining === 0) { running = false; document.getElementById('tsay').textContent = 'Step ' + (active + 1) + ': time is up'; ding(); }
  }
  setInterval(function () { if (!running) { return; } var b = remaining; sync(); if (remaining !== b) { paint(); } }, 250);
  document.addEventListener('visibilitychange', function () { if (running) { sync(); paint(); } });

  document.addEventListener('click', function (e) {
    var sb = e.target.closest('button[data-step]');
    if (sb) {
      try { if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { actx = new AC(); } } else if (actx.state === 'suspended') { actx.resume(); } } catch (err) { actx = null; }
      var i = Number(sb.dataset.step), done = i === active && remaining === 0 && !running;
      if (i !== active || done) { active = i; remaining = a.steps[i].m * 60; endAt = Date.now() + remaining * 1000; running = true; document.getElementById('tsay').textContent = ''; }
      else if (running) { sync(); running = false; }
      else { endAt = Date.now() + remaining * 1000; running = true; }
      paint(); return;
    }
    var mb = e.target.closest('#mbtn');
    if (mb) {
      var inner = document.getElementById('minner'), open = inner.hidden;
      inner.hidden = !open; mb.setAttribute('aria-expanded', String(open)); mb.querySelector('.tog').textContent = open ? 'Hide' : 'Show';
      return;
    }
    var tb = e.target.closest('button[data-target]');
    if (tb) {
      var k = tb.dataset.target;
      document.getElementById('tstage').innerHTML = k ? TARGETS[k] : 'Target hidden';
      document.querySelectorAll('button[data-target]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === tb)); });
      return;
    }
    var pk = e.target.closest('.pickbtn');
    if (pk) {
      var lis = pk.closest('.deck').querySelectorAll('li'), n = Math.floor(Math.random() * lis.length);
      lis.forEach(function (li, i) { li.classList.toggle('chosen', i === n); });
      pk.parentNode.querySelector('.picked').textContent = 'Picked: ' + lis[n].textContent;
      pk.textContent = 'Pick again';
      return;
    }
    if (e.target.id === 'radd') { addResult(); return; }
    if (e.target.id === 'rclear') { if (!rows.length || window.confirm('Clear every result in the table?')) { rows = []; drawResults(); } return; }
    var del = e.target.closest('button[data-del]');
    if (del) { rows.splice(Number(del.dataset.del), 1); drawResults(); return; }
    var ub = e.target.closest('#uline');
    if (ub) {
      var on = document.getElementById('para').classList.toggle('show');
      var lock = document.getElementById('mbtn'); if (lock) { lock.disabled = false; lock.querySelector('span').textContent = 'Finished your own? Now see the model.'; }
      ub.setAttribute('aria-pressed', String(on));
    }
  });
})();
</script>
</body>
</html>
