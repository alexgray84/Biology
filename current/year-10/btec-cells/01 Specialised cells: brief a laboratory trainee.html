<script>const lesson = {"shape":"concept-and-model","architecture_version":3,"phases":[{"type":"doNow","layout":"retrieval-sheet","label":"Retrieve","nav":"1","title":"Start from memory","lead":"Work alone in your book. Write five numbered answers.","minutes":4,"tasks":["Name the structure that contains chromosomes.","State the job of the cell membrane.","What happens in mitochondria?","Name a plant structure absent from animal cells.","Draw a simple cell and label one structure."],"review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>Nucleus; controls movement of substances; aerobic respiration releases energy; cellulose wall, chloroplast or large permanent vacuole. A labelled membrane, cytoplasm or nucleus is valid.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Start with the structures you remember. Sketch a cell outline before adding internal labels.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Draw the outline before adding an internal structure and its job.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why a root cell usually has no chloroplasts.</p>"}},"product":"Five answers with corrections"},{"type":"practice","layout":"context-brief","label":"Learning","nav":"2","title":"Today’s learning","lead":"Write the lesson title and the school Scheme-of-Work reference in your book.","minutes":2,"points":["Explain how a specialised cell structure supports its function.","Improve a laboratory explanation using biological evidence.","This is classroom practice. Keep it separate from controlled assignment evidence."],"callout":"SOW-E5 / A.M1: Specialised Cells (A.M1): school Scheme of Work, cell E5.","support":{"start":{"title":"Get started","heading":"","body":"<p>Underline the action word explain. Notice how the outcome asks for a reason as well as a name.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Turn explain into a question beginning how or why.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>State what evidence would make your final record trustworthy.</p>"}},"product":"Title and reference recorded"},{"type":"concept","layout":"split-explanation","label":"Build the model","nav":"3","title":"Same basic cell, different job","lead":"Read each row. Sketch one cell and label the feature that helps it work.","minutes":6,"table":[["Cell","Structure","Function link"],["Palisade","Many chloroplasts","Absorb light for photosynthesis"],["Sperm","Many mitochondria","Release energy for tail movement"],["Root hair","Long extension","Large surface for absorbing water and mineral ions"],["Ciliated airway cell","Moving cilia","Move mucus and trapped particles"]],"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose one named structure. Sketch it and connect its label to the process it supports.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Join the structure label to a sentence beginning this allows.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why one of these features would be unhelpful in a different cell.</p>"}},"product":"One labelled cell sketch"},{"type":"data","layout":"evidence-workbench","label":"Build the model","nav":"4","title":"Build a structure-to-function chain","lead":"Read the two chains. Explain each middle step in your own words in your book.","minutes":5,"tasks":["Circle the process in each chain.","Explain why “helps the cell” is not enough."],"table":[["Structure","What it does","Why it matters"],["Many chloroplasts","Chlorophyll absorbs light","Photosynthesis can make glucose"],["Many mitochondria","Aerobic respiration releases energy","A sperm tail can move"]],"review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>The process is light absorption or aerobic respiration. “Helps” does not say what happens or how the feature supports the function.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Find the relevant structure in the grid. Read across to its function before writing your explanation.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use three short sentences: has; does; allows.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why sperm cells cannot replace photosynthetic leaf cells.</p>"}},"product":"Two causal chains"},{"type":"model","layout":"worked-model","label":"Model","nav":"5","title":"Explain it to a trainee","lead":"Watch the model. Then explain sperm mitochondria in your book.","minutes":6,"tasks":["Write your own three-sentence explanation for sperm mitochondria."],"steps":[{"text":"Too vague: chloroplasts help a palisade cell work.","weak":true},{"text":"Choose a visible feature: many chloroplasts."},{"text":"Explain the process: chlorophyll absorbs light energy."},{"text":"Link the function: that energy is used in photosynthesis to make glucose."}],"review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>A sperm cell contains many mitochondria. Aerobic respiration releases energy. This supports tail movement so the sperm can swim towards the egg.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Start with the observation in the example. Decide which biological process connects it to the conclusion.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use has ___; this releases ___; this supports ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why the nucleus cannot replace the mitochondria in your explanation.</p>"}},"product":"One causal explanation"},{"type":"hinge","layout":"diagnostic-decision","label":"Check","nav":"6","title":"Which explanation fits?","lead":"Choose a letter. Explain why.","minutes":3,"callout":"A sperm cell has many mitochondria. Why does this help?","support":false,"choices":["They release energy through respiration for tail movement.","They make energy from nothing.","They control all cell activities.","They mean the cell can do every job better."],"answer":0,"feedback":"A: respiration releases energy for tail movement.","recheck":"Muscle cells contract repeatedly. Explain why they need many mitochondria.","product":"Letter and reason"},{"type":"question","layout":"full-question","label":"Model","nav":"7","title":"Rehearse with a partner","lead":"Explain your reasoning aloud first. Then each write your own answer.","minutes":5,"tasks":["Explain one structure for each cell.","Ask your partner which process connects the structure to its job."],"callout":"A root hair cell has a long extension. A muscle cell has many mitochondria.","review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>The extension provides a larger surface in contact with soil for absorption. Muscle mitochondria release energy through aerobic respiration for contraction.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Underline the named structures in the description. Recall the function of each before writing.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Say your sentence using because, then write it.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>State which observation is evidence and which part is your explanation.</p>"}},"product":"An individual practice answer"},{"type":"exit","layout":"quiet-exit","label":"Apply","nav":"8","title":"Write the trainee briefing","lead":"Work alone in your book for eight minutes. Models closed.","minutes":8,"tasks":["Explain how each named feature supports the cell’s function.","Write a short briefing that a new trainee could understand.","State why one feature would not suit the other cell."],"criteria":["Names an observed feature.","Explains the biological process.","Links the process to function."],"callout":"An airway cell has moving cilia. A root hair cell has a long extension into soil.","review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>Cilia beat to move mucus and trapped particles along the airway. The root-hair extension increases surface area in contact with soil for water and mineral-ion uptake. Cilia do not replace the absorptive surface; the extension does not move airway mucus.</p>"},"support":false,"product":"Independent written record"},{"type":"question","layout":"full-question","label":"Respond","nav":"9","title":"Check and repair","lead":"Check your work. Correct one sentence in another colour.","minutes":3,"tasks":["Underline the evidence you used.","Box the process or reason.","Rewrite one sentence that is vague or unsupported."],"review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>Weak: cilia help the cell. Repair: cilia beat to move mucus and trapped particles along the airway.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose a sentence that only names a feature. Identify the process your sentence has left out.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Add because and a specific process or observation.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain how your correction changes what the trainee would conclude.</p>"}},"assessment":{"type":"self","label":"Self-assessment","detail":"One written correction"}},{"type":"exit","layout":"quiet-exit","label":"Exit","nav":"10","title":"Leave one useful explanation","lead":"Write two sentences on a slip. Hand it in as you leave.","minutes":3,"tasks":["Why does naming many mitochondria not fully explain a cell’s function?","Add the missing biological link."],"review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>You must explain that aerobic respiration releases energy and link the energy to the named cell’s activity.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Underline the key claim in the question. Recall a structure that would support or challenge it.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use one sentence for the claim and another for the supporting reason.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Compare your answer with a new cell example and explain whether the same reasoning applies.</p>"}},"product":"Two-sentence exit slip"}]};
