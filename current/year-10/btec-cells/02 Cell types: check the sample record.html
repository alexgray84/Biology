<script>const lesson = {"shape":"concept-and-model","architecture_version":3,"phases":[{"type":"doNow","layout":"retrieval-sheet","label":"Retrieve","nav":"1","title":"Start from memory","lead":"Work alone in your book. Write five numbered answers.","minutes":4,"tasks":["Name the structure that contains chromosomes.","State the job of the cell membrane.","What happens in mitochondria?","Name a plant structure absent from animal cells.","Draw a simple cell and label one structure."],"review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>Nucleus; controls movement of substances; aerobic respiration releases energy; cellulose wall, chloroplast or large permanent vacuole. A labelled membrane, cytoplasm or nucleus is valid.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Start with the structures you remember. Sketch a cell outline before adding internal labels.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Draw the outline before adding an internal structure and its job.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why a root cell usually has no chloroplasts.</p>"}},"product":"Five answers with corrections"},{"type":"practice","layout":"context-brief","label":"Learning","nav":"2","title":"Today’s learning","lead":"Write the lesson title and the school Scheme-of-Work reference in your book.","minutes":2,"points":["Identify plant, animal, fungal and bacterial cells from cellular evidence.","Explain the function of two structures in a eukaryotic cell.","Check a sample record and state what its evidence cannot prove.","This is classroom practice. Keep it separate from controlled assignment evidence."],"callout":"SOW-D5 / A.P1: Eukaryotic Cells (A.P1): school Scheme of Work, cell D5.","support":{"start":{"title":"Get started","heading":"","body":"<p>Underline the action word explain. Notice how the outcome asks for a reason as well as a name.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Turn explain into a question beginning how or why.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>State what evidence would make your final record trustworthy.</p>"}},"product":"Title and reference recorded"},{"type":"concept","layout":"visual-first-explanation","label":"Build the model","nav":"3","title":"Which structures do the work?","lead":"Sketch a general eukaryotic cell. Add three labelled structure-function notes.","minutes":6,"table":[["Structure","Function"],["Nucleus","Contains DNA that directs cell activity"],["Cell membrane","Controls movement in and out"],["Cytoplasm","Site of many chemical reactions"],["Mitochondria","Aerobic respiration releases energy"],["Ribosomes","Make proteins"]],"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose one named structure. Sketch it and connect its label to the process it supports.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Add one structure at a time; write its function beside its label.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why a highly active cell may need more mitochondria.</p>"}},"product":"Labelled sketch with functions"},{"type":"ai","layout":"claim-verification","label":"Build the model","nav":"4","title":"Does a wall prove plant?","lead":"Use the grid to correct the claim.","minutes":5,"tasks":["Name two groups other than plants that can have a wall.","Explain which extra observation would help."],"table":[["Cell group","Useful evidence"],["Plant","Cellulose wall; chloroplasts in photosynthetic cells"],["Animal","Nucleus; no cell wall"],["Fungus","Nucleus; chitin wall; no chloroplasts"],["Bacterium","Usually a wall; no nucleus; circular DNA; may have plasmids"]],"claim":"The sample has a cell wall, so it must be a plant.","review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>Fungi and bacteria can also have walls. Check nucleus, wall composition and other features before deciding.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Find the relevant structure in the grid. Read across to its function before writing your explanation.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Write: A wall supports ___, but does not rule out ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why a root cell without chloroplasts is still a plant cell.</p>"}},"product":"Corrected claim"},{"type":"model","layout":"worked-model","label":"Model","nav":"5","title":"Correct the sample label","lead":"Write the observation. Then write the conclusion.","minutes":6,"steps":[{"text":"Observation: a nucleus is visible."},{"text":"Reject “one cell means bacterium”: yeast is also single-celled.","weak":true},{"text":"A nucleus shows eukaryotic organisation."},{"text":"Chitin wall and no chloroplasts support a fungal identification."}],"callout":"Training sample A: one cell; nucleus; chitin wall; no chloroplasts. The record says bacterium.","review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>A supports fungus: nucleus shows eukaryote; chitin wall supports fungus. One cell does not prove bacterium.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Start with the observation in the example. Decide which biological process connects it to the conclusion.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use observed ___; this supports ___ because ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Justify one additional observation needed before naming the exact species of the sample.</p>"}},"product":"Observation and conclusion"},{"type":"hinge","layout":"diagnostic-decision","label":"Check","nav":"6","title":"What follows?","lead":"Choose a letter. Explain why.","minutes":3,"callout":"A single-celled organism has a nucleus.","support":false,"choices":["It must be a bacterium: one cell.","It is eukaryotic; its group needs more evidence.","It must be a plant: it has DNA.","It has a nucleus, so cannot have ribosomes."],"answer":1,"feedback":"B: nuclei establish eukaryotic organisation. Yeast and many protoctists are also single-celled.","recheck":"Yeast has a nucleus and wall. Is it prokaryotic? Justify.","product":"Letter and reason"},{"type":"question","layout":"full-question","label":"Model","nav":"7","title":"Try a second sample","lead":"Explain your reasoning aloud first. Then each write your own answer.","minutes":5,"tasks":["Explain why the missing chloroplasts do not rule out a plant root cell.","Name two structures in this sample and explain their jobs."],"callout":"Training sample B: nucleus; cellulose wall; no chloroplasts; collected from a root.","review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>Underground root cells receive little or no light, so they usually do not photosynthesise. The cellulose wall supports plant origin. The nucleus contains DNA; the membrane controls movement of substances.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Underline the named structures in the description. Recall the function of each before writing.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Say your sentence using because, then write it.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>State which observation is evidence and which part is your explanation.</p>"}},"product":"An individual practice answer"},{"type":"exit","layout":"quiet-exit","label":"Apply","nav":"8","title":"Check the sample records","lead":"Work alone in your book for eight minutes. Models closed.","minutes":8,"tasks":["Correct each record using two pieces of evidence.","Explain the functions of the nucleus and chloroplasts in C.","Explain why D having ribosomes does not make it eukaryotic."],"criteria":["Uses observations from each sample.","Gives a justified group identification.","Explains structure functions accurately."],"callout":"Training sample C: nucleus; cellulose wall; chloroplasts. Record: animal. Training sample D: no nucleus; circular DNA; ribosomes. Record: fungus.","review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>C supports plant: cellulose wall and chloroplasts; its nucleus also shows eukaryotic organisation. D supports bacterium: no nucleus and circular DNA. C’s nucleus contains DNA; chloroplasts absorb light for photosynthesis. Both bacteria and eukaryotic cells have ribosomes; ribosomes make proteins.</p>"},"support":false,"product":"Independent written record"},{"type":"question","layout":"full-question","label":"Respond","nav":"9","title":"Check and repair","lead":"Check your work. Correct one sentence in another colour.","minutes":3,"tasks":["Underline the evidence you used.","Box the process or reason.","Rewrite one sentence that is vague or unsupported."],"review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>Weak: D has ribosomes so it is a fungus. Repair: D has no nucleus and circular DNA, supporting bacterium; bacteria also have ribosomes.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose a sentence that only names a feature. Identify the process your sentence has left out.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Add because and a specific process or observation.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain how your correction changes what the trainee would conclude.</p>"}},"assessment":{"type":"self","label":"Self-assessment","detail":"One written correction"}},{"type":"exit","layout":"quiet-exit","label":"Exit","nav":"10","title":"Leave one useful explanation","lead":"Write two sentences on a slip. Hand it in as you leave.","minutes":3,"tasks":["Why does “single-celled” not prove “bacterium”?","Name one observation that would separate bacteria from yeast."],"review":{"type":"wagoll","label":"Reveal model","title":"Check and improve","body":"<p>Yeast is single-celled but eukaryotic. Yeast has a nucleus; bacteria do not.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Underline the key claim in the question. Recall a structure that would support or challenge it.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use one sentence for the claim and another for the supporting reason.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Compare your answer with a new cell example and explain whether the same reasoning applies.</p>"}},"product":"Two-sentence exit slip"}]};
