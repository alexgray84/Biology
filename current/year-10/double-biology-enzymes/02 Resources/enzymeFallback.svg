<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-label="Lock-and-key model in four stages. 1: a substrate approaches the enzyme’s active site, which has a complementary shape. 2: the substrate binds in the active site, forming an enzyme–substrate complex. 3: the products are released. 4: the enzyme is unchanged and a new substrate approaches, so the enzyme is reused." font-family="Montserrat, system-ui, sans-serif" data-diagram="enzymeFallback"><defs><marker id="bio-arrow-enzymeFallback" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#182944"/></marker></defs><circle cx="88" cy="28" r="14" fill="#fbf8f0" stroke="#182944" stroke-width="2"/><text x="88" y="34" text-anchor="middle" font-size="17" font-weight="750" fill="#182944">1</text><path d="M112 28L239 28" fill="none" stroke="#b9b09c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-arrow-enzymeFallback)"/><g transform="translate(88 190) scale(0.78)"><path d="M-92 12C-92-4-62-7-40-3L-26 0V16L0 36L26 16V0L40-3C62-7 92-4 94 12C101 52 90 98 44 108C14 114-18 114-50 107C-92 98-100 54-92 12Z" fill="#d3e6eb" stroke="#24748d" stroke-width="3.5" stroke-linejoin="round"/><path d="M-26 0V16L0 36L26 16V0" fill="none" stroke="#bd8126" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g><circle cx="263" cy="28" r="14" fill="#fbf8f0" stroke="#182944" stroke-width="2"/><text x="263" y="34" text-anchor="middle" font-size="17" font-weight="750" fill="#182944">2</text><path d="M287 28L414 28" fill="none" stroke="#b9b09c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-arrow-enzymeFallback)"/><path d="M175.5 52V290" fill="none" stroke="#b9b09c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><g transform="translate(263 190) scale(0.78)"><path d="M-92 12C-92-