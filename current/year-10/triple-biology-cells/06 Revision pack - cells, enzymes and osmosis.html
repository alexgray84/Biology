<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f2231">
  <meta name="description" content="Year 10 Triple Biology revision pack: 7-10 mark exam-style questions with mark schemes and support for cell biology, enzymes and osmosis. One screen, button-driven.">
  <title>Cells, enzymes &amp; osmosis · Revision pack · Year 10 Triple Biology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-950: #0f2231;
      --navy-900: #16324a;
      --navy-700: #2b5069;
      --navy-100: #dbe6ee;
      --gold-600: #a9791f;
      --gold-500: #d8a83a;
      --gold-100: #f5e8c8;
      --paper-50:  #fffdf8;
      --paper-100: #fdf9f0;
      --paper-200: #f4ecdd;
      --ink-900: #1c2126;
      --ink-600: #4c5560;
      --line: #16324a24;
      --line-strong: #16324a55;
      --green-700: #1c6a4a;
      --green-100: #d9ede2;
      --sans: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper-200); font-size: 16px; }
    body {
      margin: 0; height: 100dvh; overflow: hidden;              /* one screen, no page scroll */
      background: var(--paper-200); color: var(--ink-900);
      font: 400 1rem/1.45 var(--sans); -webkit-text-size-adjust: 100%;
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    :focus-visible { outline: 3px solid var(--gold-500); outline-offset: 2px; border-radius: 4px; }
    .skip-link { position: fixed; left: 12px; top: -60px; z-index: 60; padding: 8px 14px; border-radius: 8px; background: var(--navy-950); color: var(--paper-50); font-weight: 700; text-decoration: none; }
    .skip-link:focus { top: 10px; }

    /* ── App shell: fixed rows, stage flexes ─────────── */
    /* rows: topbar · progress · spec-tabs · stage(flex) · action bar */
    .app { height: 100dvh; display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; }

    /* Top bar */
    .topbar { display: flex; align-items: center; gap: 12px; padding: 8px clamp(12px, 3vw, 26px); background: var(--navy-950); color: var(--paper-50); }
    .topbar .badge { flex: 0 0 auto; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 9px; background: var(--gold-500); color: var(--navy-950); font: 800 0.62rem/1 var(--sans); text-align: center; }
    .topbar h1 { margin: 0; font: 500 clamp(0.98rem, 2vw, 1.28rem)/1.05 var(--serif); }
    .topbar .sub { margin: 1px 0 0; font-size: 0.68rem; color: #ffffffab; font-weight: 500; }
    .topbar .home { margin-left: auto; color: #ffffffcf; text-decoration: none; font-size: 0.74rem; font-weight: 700; border: 1px solid #ffffff33; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
    .topbar .home:hover { background: #ffffff18; color: #fff; }
    .progress { height: 4px; background: #ffffff1f; }
    .progress > i { display: block; height: 100%; background: var(--gold-500); width: 25%; transition: width .35s ease; }

    /* Spec-point tabs (top strip) */
    .spectabs { display: flex; gap: 8px; padding: 9px clamp(12px, 3vw, 26px); background: var(--paper-100); border-bottom: 1px solid var(--line-strong); overflow-x: auto; scrollbar-width: thin; }
    .spectab { flex: 0 0 auto; cursor: pointer; background: var(--paper-50); border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 14px; color: var(--navy-950); font-family: var(--sans); font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: background .12s, border-color .12s, color .12s; }
    .spectab:hover { border-color: var(--navy-700); }
    .spectab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); flex: 0 0 auto; }
    .spectab .code { color: var(--gold-600); font-weight: 800; font-size: 0.72rem; }
    .spectab[aria-selected="true"] { background: var(--navy-950); border-color: var(--navy-950); color: var(--paper-50); }
    .spectab[aria-selected="true"] .code { color: var(--gold-500); }
    .spectab[aria-selected="true"] .dot { background: var(--gold-500); }
    .spectab.seen .dot { background: var(--green-700); }

    /* Stage + face */
    .stage { min-height: 0; overflow: hidden; padding: clamp(10px, 1.8vw, 18px) clamp(12px, 3vw, 26px); }
    .card { height: 100%; min-height: 0; background: var(--paper-50); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: 0 14px 36px #0f223114; overflow: hidden; }
    .face { height: 100%; min-height: 0; padding: clamp(12px, 2vw, 22px); display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }

    /* Face header (shared) */
    .fkicker { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; color: var(--gold-600); }
    .ftitlerow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
    .ftitle { margin: 0; font: 400 clamp(1.15rem, 2.5vw, 1.9rem)/1.04 var(--serif); color: var(--navy-950); letter-spacing: -0.01em; }
    .pill { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .pill--total { background: var(--gold-500); color: var(--navy-950); }
    .fspec { margin: 7px 0 0; font-size: 0.78rem; line-height: 1.35; color: var(--ink-600); max-width: 105ch; }
    .fspec b { color: var(--navy-700); text-transform: uppercase; font-size: 0.64rem; letter-spacing: 0.1em; }

    /* Question face body: figure | questions */
    .fbody { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr); gap: clamp(12px, 2vw, 22px); }
    .figcol { min-height: 0; display: flex; flex-direction: column; gap: 8px; }
    .figtabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .figtab { cursor: pointer; font-family: var(--sans); font-weight: 700; font-size: 0.72rem; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--paper-50); color: var(--navy-900); }
    .figtab[aria-selected="true"] { background: var(--navy-100); border-color: var(--navy-700); }
    /* narrow-screen Question/Figure toggle (hidden on wide screens) */
    .mtoggle { display: none; gap: 6px; grid-column: 1 / -1; }
    .mtog { cursor: pointer; font-family: var(--sans); font-weight: 700; font-size: 0.8rem; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--paper-50); color: var(--navy-900); flex: 1; min-height: 40px; }
    .mtog[aria-selected="true"] { background: var(--navy-950); border-color: var(--navy-950); color: var(--paper-50); }
    .figstage { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px; }
    .figstage svg { display: block; width: 100%; height: 100%; max-height: 100%; }
    .figstage .tablewrap { width: 100%; max-height: 100%; overflow: auto; }
    .figcap { margin: 0; font-size: 0.72rem; color: var(--ink-600); font-weight: 600; text-align: center; }

    .qcol { min-height: 0; display: flex; flex-direction: column; }
    .qintro { margin: 0 0 8px; font-size: 0.82rem; color: var(--ink-600); }
    ol.parts { list-style: none; margin: 0; padding: 2px 4px 2px 0; min-height: 0; overflow: auto; flex: 1; }
    ol.parts > li { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
    ol.parts > li:first-child { border-top: none; padding-top: 2px; }
    ol.parts .ref { font-weight: 800; color: var(--navy-900); font-size: 0.9rem; }
    ol.parts .stem { font-size: clamp(0.86rem, 1.15vw, 0.98rem); line-height: 1.4; }
    ol.parts .marks { font-weight: 800; color: var(--gold-600); font-size: 0.78rem; white-space: nowrap; }
    .cmd { font-weight: 800; color: var(--navy-950); }
    .qhint { margin: 6px 0 0; font-size: 0.72rem; color: var(--ink-600); font-style: italic; }

    /* Reading faces (mark scheme / support / how-to) */
    .rbody { min-height: 0; overflow: auto; padding-right: 6px; }
    .rbody.cols { column-width: 300px; column-gap: 22px; }
    .rbody.cols > * { break-inside: avoid; }
    .ms-intro { margin: 0 0 10px; font-size: 0.78rem; color: var(--ink-600); }
    .ms-part { margin: 0 0 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-100); }
    .ms-part__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .ms-part__ref { font-weight: 800; color: var(--navy-900); }
    .ms-part__marks { margin-left: auto; font-size: 0.68rem; font-weight: 800; color: var(--green-700); background: var(--green-100); padding: 3px 9px; border-radius: 999px; }
    .ms-points { margin: 0; padding: 0; list-style: none; }
    .ms-points li { position: relative; padding: 4px 4px 4px 22px; font-size: 0.86rem; line-height: 1.38; }
    .ms-points li::before { content: "✓"; position: absolute; left: 2px; top: 4px; color: var(--green-700); font-weight: 800; }
    .ms-note { margin-top: 7px; padding: 8px 11px; border-radius: 8px; font-size: 0.78rem; background: var(--gold-100); color: #6a4c12; }
    .ms-note b { text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.66rem; }

    .prose h3 { font: 600 0.98rem/1.15 var(--sans); color: var(--navy-950); margin: 14px 0 7px; break-after: avoid; }
    .prose h3:first-child { margin-top: 2px; }
    .prose p { margin: 0 0 10px; font-size: 0.86rem; }
    .prose ul { margin: 0 0 12px; padding-left: 1.1em; }
    .prose li { margin: 0 0 6px; font-size: 0.85rem; line-height: 1.35; }
    .prose .keyword { background: var(--gold-100); padding: 1px 5px; border-radius: 4px; font-weight: 700; }
    .callout { margin: 11px 0; padding: 10px 13px; border-radius: 9px; border-left: 4px solid var(--gold-500); background: var(--paper-100); font-size: 0.83rem; }
    .callout b { color: var(--navy-950); }
    .cmd-table { width: 100%; border-collapse: collapse; margin: 9px 0; font-size: 0.8rem; }
    .cmd-table th, .cmd-table td { border: 1px solid var(--line-strong); padding: 6px 8px; text-align: left; vertical-align: top; }
    .cmd-table th { background: var(--navy-100); color: var(--navy-950); }
    .mag-triangle { display: block; width: 170px; max-width: 100%; margin: 4px auto 8px; }

    /* Results table (in figure stage) */
    table.data { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    table.data caption { caption-side: top; text-align: left; font-size: 0.72rem; font-weight: 700; color: var(--ink-600); margin-bottom: 6px; }
    table.data th, table.data td { border: 1px solid var(--line-strong); padding: 6px 8px; text-align: center; }
    table.data thead th { background: var(--navy-900); color: var(--paper-50); font-weight: 700; }
    table.data td.blank { background: var(--gold-100); font-weight: 800; }

    /* Action bar */
    .actionbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px clamp(12px, 3vw, 26px); background: var(--navy-950); color: var(--paper-50); }
    .faceset { display: flex; gap: 6px; flex-wrap: wrap; }
    .fbtn { cursor: pointer; font-family: var(--sans); font-weight: 700; font-size: 0.8rem; border-radius: 9px; padding: 9px 14px; border: 1px solid #ffffff33; background: #ffffff12; color: var(--paper-50); min-height: 42px; display: inline-flex; align-items: center; gap: 7px; transition: background .12s, border-color .12s; }
    .fbtn:hover { background: #ffffff20; }
    .fbtn[aria-pressed="true"] { background: var(--gold-500); border-color: var(--gold-500); color: var(--navy-950); }
    .fbtn[data-face="ms"][aria-pressed="true"] { background: var(--green-100); border-color: var(--green-100); color: var(--green-700); }
    .fbtn .dotmark { width: 7px; height: 7px; border-radius: 50%; background: var(--green-700); }
    .spacer { flex: 1 1 auto; min-width: 8px; }
    .navgrp { display: flex; align-items: center; gap: 8px; }
    .navbtn { width: 42px; height: 42px; padding: 0; justify-content: center; border-radius: 50%; font-size: 1.05rem; }
    .navbtn:disabled { opacity: .35; cursor: not-allowed; }
    .posn { font-size: 0.76rem; font-weight: 700; color: #ffffffcf; min-width: 70px; text-align: center; }

    /* Narrow screens: show ONE of Question / Figure at a time via a toggle,
       so each fills the screen and neither has to scroll. */
    @media (max-width: 860px) {
      .fbody { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .mtoggle { display: flex; }
      .figcol, .qcol { grid-column: 1; grid-row: 2; min-height: 0; }
      .fbody[data-show="q"] .figcol { display: none; }
      .fbody[data-show="fig"] .qcol { display: none; }
      .qhint { display: none; }
      .face .fspec { display: none; }        /* keep the topic code in the kicker; full spec lives in Support */
      .face .ftitle { font-size: 1.12rem; }
      .qintro { margin-bottom: 5px; font-size: 0.76rem; }
      ol.parts > li { padding: 6px 0; }
      ol.parts .stem { font-size: 0.85rem; }
      .rbody.cols { column-width: auto; }
      .actionbar { gap: 6px; }
      .fbtn { font-size: 0.74rem; padding: 8px 10px; flex: 1 1 auto; justify-content: center; }
      .faceset { flex: 1 1 100%; }
      .navgrp { flex: 1 1 100%; justify-content: space-between; }
      .spacer { display: none; }
    }
    @media (max-width: 380px) {
      .fbtn { font-size: 0.68rem; padding: 8px 7px; }
    }

    /* Print: reveal everything stacked */
    @media print {
      html, body { height: auto; overflow: visible; background: #fff; }
      .app { height: auto; display: block; }
      .topbar .home, .actionbar, .spectabs, .skip-link { display: none !important; }
      .stage { overflow: visible; }
      .card, .face { height: auto; }
    }
  </style>
</head>

  <div class="app">
    <header class="topbar">
      <div class="badge">Y10<br>BIO</div>
      <div>
        <h1>Revision — Cells, enzymes &amp; osmosis</h1>
        <p class="sub">Year 10 Triple Biology · Edexcel IGCSE (4BI1) · 7–10 mark questions</p>
      </div>
      <a class="home" href="../../../units/year-10-triple/cells/">← Cells unit</a>
    </header>
    <div class="progress" aria-hidden="true"><i id="progressFill"></i></div>

    <nav class="spectabs" role="tablist" id="specTabs" aria-label="Specification points"></nav>

    <main class="stage">
      <div class="card">
        <section class="face" id="face" tabindex="-1" aria-live="polite"></section>
      </div>
    </main>

    <div class="actionbar" role="toolbar" aria-label="View controls">
      <div class="faceset" id="faceSet">

        <button class="fbtn" data-face="su"  aria-pressed="false">Support</button>
        <button class="fbtn" data-face="hta" aria-pressed="false">How to answer</button>
      </div>
      <span class="spacer"></span>

        <button class="fbtn navbtn" id="btnPrev" aria-label="Previous spec point" title="Previous">←</button>
        <span class="posn" id="posn">1 / 4</span>
        <button class="fbtn navbtn" id="btnNext" aria-label="Next spec point" title="Next">→</button>
      </div>
    </div>
  </div>

  <script>
  /* =========================================================================
     Original exam-style questions in the Edexcel IGCSE Biology (4BI1) house
     style. Not reproductions of copyrighted past papers. Diagrams original.
     ========================================================================= */

      parts: [
        { ref: "(a)", marks: 3, stem: `<span class="cmd">Define</span> the term <b>osmosis</b>.` },
        { ref: "(b)", marks: 3, stem: `<b>(i)</b> <span class="cmd">Calculate</span> the percentage change in mass for the <b>0.5&nbsp;mol&nbsp;dm⁻³</b> cylinder — the missing value in Table&nbsp;1. Show your working. <b>(ii)</b> <span class="cmd">State one</span> variable that should have been controlled.` },
        { ref: "(c)", marks: 4, stem: `The line in Fig&nbsp;5 crosses zero at about <b>0.3&nbsp;mol&nbsp;dm⁻³</b>. <span class="cmd">Explain</span>, in terms of osmosis and water potential, why the cylinders <b>gained</b> mass in dilute solutions but <b>lost</b> mass in concentrated solutions.` }
      ],
      markScheme: [
        msPart("(a)", 3, ["the (net) movement of water molecules ✓", "from a dilute solution / higher water potential to a concentrated solution / lower water potential ✓", "through / across a partially permeable membrane ✓"], "All three needed: <b>water</b> + <b>high→low water potential (dilute→concentrated)</b> + <b>partially permeable membrane</b>. 'Movement of water' alone = 1."),
        msPart("(b)", 3, ["(i) % change = (final − initial) ÷ initial × 100 = (4.60 − 5.00) ÷ 5.00 × 100 ✓ (working)", "(i) = −8.0 % ✓ (answer; must show it is a decrease / negative)", "(ii) one from: temperature; time in solution; volume of solution; size/surface area of cylinders; type/age of potato; drying before weighing ✓"], "Answer <b>−8.0 %</b>. A bare 8 % (no minus sign), or no working, is capped at 1 mark for (i)."),
        msPart("(c)", 4, ["in dilute solutions the solution has a higher water potential than the cell contents ✓", "so water enters the cells by osmosis → cylinder gains mass ✓", "in concentrated solutions the solution has a lower water potential, so water leaves the cells by osmosis → cylinder loses mass ✓", "at 0.3 mol dm⁻³ the water potentials are equal, so there is no net movement of water (no change in mass) ✓"], "Both directions explained <b>and</b> reference to water potential / concentration gradient. 4th mark for interpreting the 0.3 crossing point.")
      ],
      support: `
        <h3>Osmosis in one sentence</h3>
        <p><span class="keyword">Osmosis</span> = the net movement of <b>water molecules</b> from a region of <b>higher water potential</b> (dilute) to a region of <b>lower water potential</b> (concentrated), across a <b>partially permeable membrane</b>.</p>
        <ul>
          <li><b>Dilute solution</b> = lots of water = <b>high</b> water potential.</li>
          <li><b>Concentrated solution</b> = little water = <b>low</b> water potential.</li>
          <li>Water always moves <b>down</b> the water potential gradient (high → low).</li>
        </ul>
        <h3>The required practical</h3>
        <ul>
          <li><b>% change in mass</b> = (final − initial) ÷ initial × 100.</li>
          <li>Where the line crosses <b>0 %</b>, the concentration <b>inside</b> the cells equals that <b>outside</b> — no net osmosis.</li>
          <li>Below that point cells gain water (mass ↑); above it cells lose water (mass ↓).</li>
        </ul>
        <div class="callout"><b>Control variables:</b> temperature, time, volume of solution, and the size/surface area of the cylinders — keep these the same so only concentration is tested.</div>`,
      howTo: `
        <h3>Definition marks (part a)</h3>
        <p>A 3-mark "define" needs <b>three</b> ideas. Learn the sentence so all three land: <span class="keyword">water molecules</span> · <span class="keyword">high → low water potential</span> · <span class="keyword">partially permeable membrane</span>.</p>
        <h3>Percentage-change working (part b)</h3>
        <ul>
          <li>Formula: (final − initial) ÷ initial × 100.</li>
          <li>(4.60 − 5.00) ÷ 5.00 × 100 = −8.0 %.</li>
          <li>Keep the <b>minus sign</b> — it shows the cylinder lost mass. Losing it loses a mark.</li>
        </ul>
        <h3>Explaining the graph (part c)</h3>
        <p>Examiners want <b>both directions</b> plus the crossing point: dilute → water in → mass up; concentrated → water out → mass down; at 0.3 → equal water potential → no change. Always name <b>water potential</b> or the concentration gradient.</p>`
    }
  ];

  /* -------------------- state + rendering -------------------- */
  const state = { index: 0, mode: "q", figIndex: 0, seen: new Set() };
  const el = (id) => document.getElementById(id);
  const specTabs = el("specTabs");
  const faceEl = el("face");
  const FACES = ["q", "ms", "su", "hta"];
  const FACE_TITLES = { ms: "Mark scheme", su: "Support", hta: "How to answer" };

  function buildSpecTabs() {
    SPEC_POINTS.forEach((sp, i) => {
      const b = document.createElement("button");
      b.className = "spectab";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", i === 0 ? "true" : "false");
      b.innerHTML = `<span class="dot"></span><span class="code">${sp.code}</span><span>${sp.tab}</span>`;
      b.addEventListener("click", () => selectSpec(i));
      b.addEventListener("keydown", (e) => {
        const n = SPEC_POINTS.length;
        if (e.key === "ArrowRight") { e.preventDefault(); const k = (i + 1) % n; specTabs.children[k].focus(); selectSpec(k); }
        if (e.key === "ArrowLeft") { e.preventDefault(); const k = (i - 1 + n) % n; specTabs.children[k].focus(); selectSpec(k); }
      });
      specTabs.appendChild(b);
    });
  }

  function questionHTML(sp) {
    const figs = sp.figures;
    const tabs = figs.length > 1
      ? `<div class="figtabs" role="tablist" aria-label="Figures">${figs.map((f, i) => `<button class="figtab" role="tab" data-fi="${i}" aria-selected="${i === 0 ? "true" : "false"}">${f.tab}</button>`).join("")}</div>`
      : "";
    const partsHTML = sp.parts.map(p =>
      `<li><span class="ref">${p.ref}</span><span class="stem">${p.stem}</span><span class="marks">[${p.marks}]</span></li>`).join("");
    return `
      <div>
        <span class="fkicker">${sp.code} · ${sp.topicName}</span>
        <div class="ftitlerow"><h2 class="ftitle">${sp.title}</h2><span class="pill pill--total">Total ${sp.total} marks · original</span></div>
        <p class="fspec"><b>Spec</b> &nbsp;${sp.spec}</p>
      </div>
      <div class="fbody" id="fbody" data-show="q">
        <div class="mtoggle" role="tablist" aria-label="Show question or figure">
          <button class="mtog" data-show="q" role="tab" aria-selected="true">Question</button>
          <button class="mtog" data-show="fig" role="tab" aria-selected="false">Figure${figs.length > 1 ? "s" : ""}</button>
        </div>
        <div class="figcol">
          ${tabs}
          <div class="figstage" id="figstage">${figs[state.figIndex] ? figs[state.figIndex].node : figs[0].node}</div>
          <p class="figcap" id="figcap">${(figs[state.figIndex] || figs[0]).cap}</p>
        </div>
        <div class="qcol">
          ${sp.intro ? `<p class="qintro">${sp.intro}</p>` : ""}
          <ol class="parts">${partsHTML}</ol>
          <p class="qhint">Try every part in your book, then tap <b>Mark scheme</b>.</p>
        </div>
      </div>`;
  }

  function msHTML(sp) {
    const parts = sp.markScheme.map(p => `
      <div class="ms-part">
        <div class="ms-part__head"><span class="ms-part__ref">${p.ref}</span><span class="ms-part__marks">${p.marks} mark${p.marks === 1 ? "" : "s"}</span></div>
        <ul class="ms-points">${p.points.map(pt => `<li>${pt}</li>`).join("")}</ul>
        ${p.note ? `<div class="ms-note"><b>Examiner note — </b>${p.note}</div>` : ""}
      </div>`).join("");
    return `<p class="ms-intro">${sp.total} marks total. Award marks in any order unless a note says otherwise.</p><div class="rbody cols">${parts}</div>`;
  }

  function renderFace() {
    const sp = SPEC_POINTS[state.index];
    if (state.mode === "q") {
      faceEl.innerHTML = questionHTML(sp);
      wireFigTabs(sp);
    } else {
      const bodyHTML = state.mode === "ms"
        ? msHTML(sp)
        : `<div class="rbody"><div class="prose">${state.mode === "su" ? sp.support : sp.howTo}</div></div>`;
      faceEl.innerHTML = `
        <div>
          <span class="fkicker">${sp.code} · ${sp.title}</span>
          <div class="ftitlerow"><h2 class="ftitle">${FACE_TITLES[state.mode]}</h2></div>
        </div>
        ${bodyHTML}`;
    }
    refreshControls();
  }

  function wireFigTabs(sp) {
    // narrow-screen Question / Figure toggle
    const fbody = el("fbody");
    faceEl.querySelectorAll(".mtog").forEach(btn => {
      btn.addEventListener("click", () => {
        fbody.dataset.show = btn.dataset.show;
        faceEl.querySelectorAll(".mtog").forEach(b => b.setAttribute("aria-selected", b === btn ? "true" : "false"));
      });
    });
    if (sp.figures.length < 2) return;
    faceEl.querySelectorAll(".figtab").forEach(btn => {
      btn.addEventListener("click", () => {
        state.figIndex = +btn.dataset.fi;
        const fig = sp.figures[state.figIndex];
        el("figstage").innerHTML = fig.node;
        el("figcap").textContent = fig.cap;
        faceEl.querySelectorAll(".figtab").forEach(b => b.setAttribute("aria-selected", b === btn ? "true" : "false"));
      });
    });
  }

  function refreshControls() {
    // spec tabs
    [...specTabs.children].forEach((t, k) => {
      t.setAttribute("aria-selected", k === state.index ? "true" : "false");
      t.classList.toggle("seen", state.seen.has(k));
    });
    // face buttons
    el("faceSet").querySelectorAll(".fbtn").forEach(b => {
      const on = b.dataset.face === state.mode;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      if (b.dataset.face === "ms") {
        b.innerHTML = state.seen.has(state.index)
          ? `Mark scheme <span class="dotmark" aria-hidden="true"></span>`
          : "Mark scheme";
      }
    });
    // position + progress
    el("posn").textContent = (state.index + 1) + " / " + SPEC_POINTS.length;
    el("btnPrev").disabled = state.index === 0;
    el("btnNext").disabled = state.index === SPEC_POINTS.length - 1;
    const frac = Math.max((state.index + 1) / SPEC_POINTS.length, state.seen.size / SPEC_POINTS.length);
    el("progressFill").style.width = (frac * 100) + "%";
  }

  function selectSpec(i) {
    state.index = i;
    state.mode = "q";       // returning to a spec never auto-exposes its mark scheme
    state.figIndex = 0;
    renderFace();
  }

  function setFace(mode) {
    // toggle back to question if the same reading face is pressed again
    if (state.mode === mode && mode !== "q") mode = "q";
    state.mode = mode;
    if (mode === "ms") state.seen.add(state.index);   // revealing marks the spec seen
    renderFace();
  }

  /* -------------------- events -------------------- */
  el("faceSet").querySelectorAll(".fbtn").forEach(b => b.addEventListener("click", () => setFace(b.dataset.face)));
  el("btnPrev").addEventListener("click", () => { if (state.index > 0) selectSpec(state.index - 1); });
  el("btnNext").addEventListener("click", () => { if (state.index < SPEC_POINTS.length - 1) selectSpec(state.index + 1); });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea")) return;
    if (e.key === "Escape" && state.mode !== "q") setFace("q");
    else if (e.key.toLowerCase() === "m") setFace("ms");
    else if (e.key === "ArrowRight" && !e.target.closest(".spectab")) { if (state.index < SPEC_POINTS.length - 1) selectSpec(state.index + 1); }
    else if (e.key === "ArrowLeft" && !e.target.closest(".spectab")) { if (state.index > 0) selectSpec(state.index - 1); }
  });

  buildSpecTabs();
  selectSpec(0);
  </script>
</body>
</html>
