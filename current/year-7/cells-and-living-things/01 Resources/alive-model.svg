<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="alive-title alive-desc">
<title id="alive-title">A wind-up toy compared with a seedling over five days</title>
<desc id="alive-desc">Left: a wind-up toy car moving, labelled moves only. Right: a seedling on day 1 is short and straight; on day 5 it is taller and bends towards a sunny window. Labels: taller means growth; bends towards light means sensitivity and movement.</desc>
<rect width="900" height="520" fill="#fcfaf5"/>
<line x1="300" y1="20" x2="300" y2="500" stroke="#c9c1ae" stroke-width="3" stroke-dasharray="10 10"/>
<g font-family="Montserrat,sans-serif" fill="#132d46">
<text x="150" y="52" text-anchor="middle" font-size="34" font-weight="800">Toy</text>
<g transform="translate(50 250)">
  <rect x="0" y="40" width="200" height="60" rx="14" fill="#c4d3e6" stroke="#132d46" stroke-width="4"/>
  <path d="M40 40 Q60 0 120 0 Q160 0 170 40 Z" fill="#dbe5f1" stroke="#132d46" stroke-width="4"/>
  <circle cx="45" cy="104" r="20" fill="#fcfaf5" stroke="#132d46" stroke-width="5"/>
  <circle cx="160" cy="104" r="20" fill="#fcfaf5" stroke="#132d46" stroke-width="5"/>
  <path d="M100 0 v-24 M84 -36 h32 M84 -36 v12 M116 -36 v12" stroke="#132d46" stroke-width="5" fill="none"/>
  <path d="M-8 55 h-30 M-8 75 h-40 M-8 95 h-30" stroke="#8a6d1d" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="150" y="450" text-anchor="middle" font-size="32" font-weight="800">moves only</text>
<text x="560" y="52" text-anchor="middle" font-size="34" font-weight="800">Seedling</text>
<rect x="820" y="90" width="66" height="220" fill="#fff6d8" stroke="#132d46" stroke-width="4"/>
<line x1="853" y1="90" x2="853" y2="310" stroke="#132d46" stroke-width="3"/>
<line x1="820" y1="200" x2="886" y2="200" stroke="#132d46" stroke-width="3"/>
<g stroke="#b8860b" stroke-width="5" stroke-linecap="round"><path d="M810 140 h-40"/><path d="M810 200 h-54"/><path d="M810 260 h-40"/></g>
<text x="853" y="345" text-anchor="middle" font-size="26">window</text>
<path d="M350 400 h80 l-12 56 h-56 Z" fill="#c98c5a" stroke="#132d46" stroke-width="4"/>
<path d="M390 400 v-60" stroke="#2c7a4b" stroke-width="8" fill="none"/>
<path d="M390 350 q-22 -16 -36 -4 q16 14 36 4" fill="#5fa36f" stroke="#2c7a4b" stroke-width="3"/>
<text x="390" y="496" text-anchor="middle" font-size="30" font-weight="800">Day 1</text>
<path d="M560 400 h80 l-12 56 h-56 Z" fill="#c98c5a" stroke="#132d46" stroke-width="4"/>
<path d="M600 400 C600 300 620 220 720 170" stroke="#2c7a4b" stroke-width="8" fill="none"/>
<path d="M670 196 q-8 -28 -36 -28 q4 26 36 28" fill="#5fa36f" stroke="#2c7a4b" stroke-width="3"/>
<path d="M720 170 q24 -22 52 -10 q-24 26 -52 10" fill="#5fa36f" stroke="#2c7a4b" stroke-width="3"/>
<text x="600" y="496" text-anchor="middle" font-size="30" font-weight="800">Day 5</text>
<text x="450" y="250" text-anchor="end" font-size="28">taller =</text>
<text x="450" y="284" text-anchor="end" font-size="28" font-weight="800">growth</text>
<line x1="458" y1="262" x2="592" y2="290" stroke="#132d46" stroke-width="3"/>
<text x="360" y="112" font-size="28">bends to light =</text>
<text x="360" y="146" font-size="28" font-weight="800">sensitivity + movement</text>
<line x1="650" y1="156" x2="700" y2="178" stroke="#132d46" stroke-width="3"/>
</g>
</svg>