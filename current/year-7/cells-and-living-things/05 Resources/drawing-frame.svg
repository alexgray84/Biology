<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-label="Drawing page layout: a title box, a drawing area for 3 to 6 cells in single lines with no shading, ruled label lines and a magnification line"><title>Drawing page layout: a title box, a drawing area for 3 to 6 cells in single lines with no shading, ruled label lines and a magnification line</title><rect width="1000" height="410" fill="#fcfaf5"/><rect x="10" y="10" width="980" height="64" rx="8" fill="#fff" stroke="#6b7c99" stroke-width="2.5" stroke-dasharray="10 7"/><text x="28" y="54" font-size="32" font-weight="700" fill="#3a5a78" text-anchor="start" font-family="Montserrat, Segoe UI, sans-serif">Title: what it is + the stain</text><rect x="10" y="90" width="600" height="250" rx="8" fill="#fff" stroke="#6b7c99" stroke-width="2.5" stroke-dasharray="10 7"/><text x="310" y="170" font-size="34" font-weight="800" fill="#3a5a78" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif">Draw 3 to 6 cells</text><text x="310" y="214" font-size="32" font-weight="700" fill="#3a5a78" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif">single lines · no shading</text><text x="310" y="256" font-size="32" font-weight="700" fill="#3a5a78" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif">only what YOU see</text><line x1="610" y1="160" x2="700" y2="160" stroke="#3a5a78" stroke-width="3"/><line x1="610" y1="270" x2="700" y2="270" stroke="#3a5a78" stroke-width="3"/><text x="712" y="170" font-size="32" font-weight="700" fill="#3a5a78" text-anchor="start" font-family="Montserrat, Segoe UI, sans-serif">ruled label</text><text x="712" y="280" font-size="32" font-weight="700" fill="#3a5a78" text-anchor="start" font-family="Montserrat, Segoe UI, sans-serif">ruled label</text><text x="10" y="392" font-size="36" font-weight="800" fill="#182944" text-anchor="start" font-family="Montserrat, Segoe UI, sans-serif">Magnification: ×_____</text></svg>