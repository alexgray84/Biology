<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Two meanings of cell: a battery cell symbol in electricity, and a living cell with a nucleus in biology"><title>Two meanings of cell: a battery cell symbol in electricity, and a living cell with a nucleus in biology</title><rect width="760" height="300" fill="#fcfaf5"/><line x1="60" y1="130" x2="150" y2="130" stroke="#182944" stroke-width="5"/><line x1="230" y1="130" x2="320" y2="130" stroke="#182944" stroke-width="5"/><line x1="150" y1="70" x2="150" y2="190" stroke="#182944" stroke-width="6"/><line x1="230" y1="100" x2="230" y2="160" stroke="#182944" stroke-width="10"/><text x="190" y="240" font-size="38" font-weight="800" fill="#182944" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif">battery cell</text><text x="190" y="280" font-size="30" font-weight="600" fill="#3a5a78" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif">(electricity)</text><path d="M480 120 C470 60 560 40 620 70 C690 60 720 130 690 170 C700 220 600 230 560 200 C500 220 460 170 480 120 Z" fill="#fbe9e1" stroke="#c0566b" stroke-width="5"/><circle cx="580" cy="130" r="24" fill="#8e75b8" stroke="#5d4787" stroke-width="3"/><text x="590" y="240" font-size="38" font-weight="800" fill="#182944" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif">living cell</text><text x="590" y="280" font-size="30" font-weight="600" fill="#3a5a78" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif">(biology)</text></svg>