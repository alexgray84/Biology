<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-label="A red blood cell. Face view: a red disc with a paler middle and no nucleus. Side view: thin in the middle and thicker at the edges (biconcave), with a flexible membrane"><title>A red blood cell. Face view: a red disc with a paler middle and no nucleus. Side view: thin in the middle and thicker at the edges (biconcave), with a flexible membrane</title><rect width="900" height="390" fill="#fcfaf5"/><defs><radialGradient id="rbc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e8505a"/><stop offset=".45" stop-color="#d0313c"/><stop offset="1" stop-color="#8e1622"/></radialGradient></defs><circle cx="180" cy="200" r="120" fill="url(#rbc)" stroke="#6e1423" stroke-width="4"/><path d="M450 160 C520 130 560 175 640 175 C720 175 760 130 830 160 C870 180 870 220 830 240 C760 270 720 225 640 225 C560 225 520 270 450 240 C410 220 410 180 450 160 Z" fill="#c42b36" stroke="#6e1423" stroke-width="4"/><text x="180" y="360" font-size="32" font-weight="800" fill="#182944" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif">face view</text><text x="640" y="300" font-size="32" font-weight="800" fill="#182944" text-anchor="middle" font-family="Montserrat, Segoe UI, sans-serif">side view</text><line x1="180" y1="200" x2="238" y2="60" stroke="#182944" stroke-width="3"/><circle cx="180" cy="200" r="6" fill="#182944"/><text x="250" y="46" font-size="30" font-weight="800" fill="#182944" text-anchor="start" font-family="Montserrat, Segoe UI, sans-serif">no nucleus:</text><text x="250" y="80" font-size="30" font-weight="800" fill="#182944" text-anchor="start" font-family="Montserrat, Segoe UI, sans-serif">room for haemoglobin</text><line x1="640" y1="200" x2="640" y2="128" stroke="#182944" stroke-width="3"/><circle cx="640" cy="200" r="6" fill="#182944"/><text x="640" y="118" font-size="30" font-weight="800" fill="#182944" text-anchor="start" font-family="Montserrat, Segoe UI, sans-serif">thin in the middle</text><line x1="840" y1="225" x2="880" y2="330" stroke="#182944" stroke-width="3"/><circle cx="840" cy="225" r="6" fill="#182944"/><text x="880" y="370" font-size="30" font-weight="800" fill="#182944" text-anchor="end" font-family="Montserrat, Segoe UI, sans-serif">flexible membrane</text><text x="890" y="24" font-size="20" font-weight="500" fill="#3a5a78" text-anchor="end" font-family="Montserrat, Segoe UI, sans-serif">schematic, not to scale</text></svg>