<script>const lesson = {"shape":"discussion-and-evaluation","architecture_version":1,"phases":[{"type":"doNow","layout":"retrieval-sheet","label":"Retrieve","nav":"1","title":"What do you remember from this week?","lead":"Work alone, no notes. Write four short answers in your book.","minutes":5,"points":["Which Bunsen flame do we use to heat water quickly? Name it.","On Wednesday one reading did not sit with the other two. What did we decide to do with it?","You label a graph axis 'temperature'. What else must you write on it?","What does the word evidence mean in science? One sentence."],"review":{"type":"answers","label":"Reveal the answers","title":"Check and correct","body":"<p>1. The blue flame. 2. Keep it and check how that reading was taken, rather than delete it. 3. The unit, °C, after the name of the quantity. 4. Evidence is the measurements or observations you actually collected.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Answer the two you are sure of first, then come back.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Picture Wednesday's table. Which number did we circle, and why?</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Add one sentence: why is what someone believes not evidence?</p>"}},"product":"Four short answers in books"},{"type":"concept","layout":"visual-first-explanation","label":"Build knowledge","nav":"2","title":"What makes a claim strong?","lead":"Copy the four steps. Add one example to each.","minutes":5,"points":["Claim: what the results suggest.","Support: exact values.","Question: what remains unknown.","Stronger: evidence to collect next."],"visual":["CLAIM what someone says is true","SUPPORT the values that back it","QUESTION what it cannot answer","STRONGER what you would measure next"],"callout":"A claim can be true without being supported by these results.","support":{"start":{"title":"Get started","heading":"","body":"<p>Use one number from Wednesday's table as your first example.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Say each step aloud to your partner before you write the example.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Write a claim about our results that is true but not supported.</p>"}},"product":"Four steps with examples"},{"type":"model","layout":"worked-model","label":"Examine sources","nav":"3","title":"Judge the claim","lead":"Watch. Copy the rejected and final judgements.","minutes":6,"table":[["Time / min","Trial 1 / °C","Trial 2 / °C","Trial 3 / °C"],["0","20","20","20"],["2","34","35","34"],["4","46","45","58"],["6","59","58","60"]],"steps":[{"text":"Exactly the same amount. Those three words decide it."},{"text":"Rejected: 'Supported, because the numbers go up every time.' Going up is not going up by the same amount.","weak":true},{"text":"Trial 1 rises: 14 °C, then 12 °C, then 13 °C."},{"text":"Not supported. Close, but not exactly the same."},{"text":"Stronger: read every minute, and say how much it rises each minute."}],"claim":"The temperature rose by exactly the same amount every two minutes.","support":{"start":{"title":"Get started","heading":"","body":"<p>Write only the words I underline when I stop.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Ask after each sentence: which value is that built on?</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Rewrite the claim so our results do support it.</p>"}},"product":"Two judgements in books"},{"type":"ai","layout":"claim-verification","label":"Examine sources","nav":"4","title":"Which sentences can we trust?","lead":"Read the four sentences. Mark each one on the check sheet.","minutes":6,"points":["The water got hotter the longer it was heated.","The temperature rose by exactly 20 °C every two minutes.","The 58 °C reading was a mistake, so I removed it.","This proves a blue flame heats water faster than any other flame."],"tasks":["Mark: supported, unsupported, or beyond the results.","Write the evidence or what is missing.","What could the program not know?"],"claim":"Written in the style of an AI chatbot. It contains deliberate mistakes.","resources":[{"label":"Open the check sheet","href":"assets/04 Prepared AI explanation.html","kind":"reference"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Start with sentence 1. Find one value that shows it.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>For each sentence ask: which column or row would prove this?</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Rewrite sentence 4 so our results do support it.</p>"}},"product":"Four checked sentences"},{"type":"hinge","layout":"diagnostic-decision","label":"Check","nav":"5","title":"Is the claim supported?","lead":"Choose a letter. Explain why.","minutes":4,"callout":"Only blue-flame readings exist. Claim: blue heats faster than yellow.","support":false,"choices":["Yes: blue heated the water quickly.","No: no yellow-flame comparison was measured.","Yes: blue is known to be hotter.","No: one blue-flame reading was odd."],"answer":1,"feedback":"B: comparing heating rates requires measurements from both flames under matching conditions. A plausible claim still needs evidence.","recheck":"Three heating times: 5.1, 5.0, 5.2 minutes. Does this prove water always takes five minutes? What is missing?","product":"Letter and reason"},{"type":"practice","layout":"task-and-criteria","label":"Structure reasoning","nav":"6","title":"Now you judge a claim together","lead":"Work in pairs. Write three sentences on your whiteboard, then hold it up.","minutes":6,"tasks":["This claim is ___ by our results, because the table shows ___.","One question our results cannot answer is ___.","It would be stronger if ___."],"criteria":["Your first sentence contains a value from the table.","You name something the results cannot show.","Your improvement says what to measure next."],"claim":"Water heated on a blue flame always reaches 60 °C in six minutes.","support":{"start":{"title":"Get started","heading":"","body":"<p>Fill the first gap only, then show me.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Say the sentence aloud to your partner before you write it.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Write your third sentence without the opening on the board.</p>"}},"product":"Three sentences on a whiteboard, held up"},{"type":"exit","layout":"quiet-exit","label":"Judge","nav":"7","title":"Judge two claims on your own","lead":"Work in silence on the card. Two new claims, five steps.","minutes":9,"tasks":["Circle the claim these results support.","Write two values from the table that support it.","Say why the other claim goes further than the results allow.","Write one question these results cannot answer yet.","Write one thing that would make the weaker claim stronger."],"criteria":["Your judgement names the claim.","Two exact values are quoted.","You say what evidence is missing."],"review":{"type":"wagoll","label":"Reveal a strong response","title":"One strong response","body":"<p>A: 34–35 °C at 2 minutes and 58–60 °C at 6 minutes support warming. B predicts beyond 6 minutes; measure until 10 minutes to test it.</p>"},"resources":[{"label":"Open the claim, support, question card","href":"04 Claim evidence card.html","kind":"task"}],"support":false,"product":"Two evidence-based judgements"},{"type":"practice","layout":"task-and-criteria","label":"Respond","nav":"8","title":"Check your own card","lead":"Read your card against the three checks. Add one improvement in a different colour. Do not rub anything out.","minutes":3,"criteria":["I named which claim the results support.","I quoted two values from the table.","I said what evidence is missing, not just that the claim is wrong."],"review":{"type":"answers","label":"Reveal what each check looks like","title":"What a tick looks like","body":"<p>Check 1 is met when your sentence names Claim A or Claim B. Check 2 is met when two temperatures from the table appear in your writing. Check 3 is met when you say what was never measured, such as any time after 6 minutes.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Start with check 1. Point to the claim you named.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>If a check is missing, write the missing part underneath in colour.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Add one sentence saying what your improvement still would not settle.</p>"}},"assessment":{"type":"self","label":"Self-assessment","detail":"Three checks marked on the card and one improvement added in a different colour"}},{"type":"exit","layout":"quiet-exit","label":"Exit","nav":"9","title":"One last claim to judge","lead":"Write one sentence in your book. Then read the note about your Loop check.","minutes":3,"tasks":["Write one sentence: what evidence would you need before you believed it?","Your Loop check is five short questions. Answer them on your own when it opens."],"callout":"If the Loop check is not open, do the paper retrieval sheet instead.","claim":"A cereal packet says: 'Eating this cereal makes children grow taller.'","review":{"type":"answers","label":"Reveal the answer","title":"What the evidence would have to show","body":"<p>You would need two groups of children measured over the same time: some eating the cereal and some not. Without that comparison the packet is a claim, not evidence.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Use the words: I would need to see ___.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Ask what the packet never measured.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Name one thing that could make the two groups unfair to compare.</p>"}},"assessment":{"type":"loop","label":"Loop assignment","detail":"One sentence in books, then the five-question Loop check answered alone","loop":{"code":"Y7-SCI-W02-LOOP"}}}]};
