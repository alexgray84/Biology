<script>const lesson = {"shape":"worked-procedure","architecture_version":1,"phases":[{"type":"doNow","layout":"retrieval-sheet","label":"Diagnose","nav":"1","title":"What do you remember from Tuesday?","lead":"Work alone, no notes. Write four short answers in your book.","minutes":5,"points":["A table heading says <b>time / min</b>. What does the part after the slash tell you?","A thermometer scale is marked 30 and 40. The liquid stops halfway between them. What is the reading?","Why do scientists measure the same thing three times?","One reading on Tuesday did not fit the other two. What did we decide to do with it?"],"review":{"type":"answers","label":"Reveal the answers","title":"Check and correct","body":"<p>1. The unit — this time is measured in minutes. 2. 35 °C. 3. Repeats show whether the readings agree, so an odd one stands out. 4. Keep it and check how it was taken.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Answer the two you are sure of first, then come back.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>For question 2, count the small marks between 30 and 40.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Write the unit you would put after 'volume' and after 'mass'.</p>"}},"product":"Four short answers in books"},{"type":"concept","layout":"visual-first-explanation","label":"Model","nav":"2","title":"Same readings. Why do these two look different?","lead":"Look at both graphs. Copy the three rules into your book.","minutes":5,"points":["Rule 1. Label each axis with what was measured and its unit.","Rule 2. Equal spaces on an axis stand for equal amounts.","Rule 3. Give the graph a title saying what is plotted against what."],"svg":"<svg viewBox=\"0 0 500 270\" xmlns=\"http://www.w3.org/2000/svg\"><g fill=\"none\" stroke=\"#c7d0d5\" stroke-width=\"2\"><path d=\"M76 154h172M76 117h172M76 81h172M76 44h172\"/><path d=\"M316 166h172M316 141h172M316 117h172M316 93h172M316 68h172M316 44h172\"/></g><g fill=\"none\" stroke=\"#0d2744\" stroke-width=\"4\"><path d=\"M76 190h172M76 190V44\"/><path d=\"M316 190h172M316 190V44\"/></g><polyline points=\"96,117 138,100 180,86 222,48\" fill=\"none\" stroke=\"#9a6512\" stroke-width=\"5\"/><g fill=\"none\" stroke=\"#0d2744\" stroke-width=\"3\"><path d=\"M89 110l14 14M103 110l-14 14\"/><path d=\"M131 93l14 14M145 93l-14 14\"/><path d=\"M173 79l14 14M187 79l-14 14\"/><path d=\"M215 41l14 14M229 41l-14 14\"/></g><path d=\"M330 145L468 42\" fill=\"none\" stroke=\"#1c6b4a\" stroke-width=\"5\"/><g fill=\"none\" stroke=\"#0d2744\" stroke-width=\"3\"><path d=\"M329 134l14 14M343 134l-14 14\"/><path d=\"M371 100l14 14M385 100l-14 14\"/><path d=\"M413 71l14 14M427 71l-14 14\"/><path d=\"M455 39l14 14M469 39l-14 14\"/></g><g font-family=\"Arial, sans-serif\" font-size=\"13\" fill=\"#0d2744\" dominant-baseline=\"central\"><g text-anchor=\"end\"><text x=\"68\" y=\"190\">0</text><text x=\"68\" y=\"154\">10</text><text x=\"68\" y=\"117\">20</text><text x=\"68\" y=\"81\">50</text><text x=\"68\" y=\"44\">60</text><text x=\"308\" y=\"190\">0</text><text x=\"308\" y=\"166\">10</text><text x=\"308\" y=\"141\">20</text><text x=\"308\" y=\"117\">30</text><text x=\"308\" y=\"93\">40</text><text x=\"308\" y=\"68\">50</text><text x=\"308\" y=\"44\">60</text></g><g text-anchor=\"middle\"><text x=\"96\" y=\"207\">0</text><text x=\"138\" y=\"207\">2</text><text x=\"180\" y=\"207\">4</text><text x=\"222\" y=\"207\">6</text><text x=\"336\" y=\"207\">0</text><text x=\"378\" y=\"207\">2</text><text x=\"420\" y=\"207\">4</text><text x=\"462\" y=\"207\">6</text></g></g><g font-family=\"Arial, sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#0d2744\" dominant-baseline=\"central\"><g text-anchor=\"middle\"><text x=\"162\" y=\"227\">time / min</text><text x=\"402\" y=\"227\">time / min</text><text x=\"26\" y=\"117\" transform=\"rotate(-90 26 117)\">temperature / °C</text><text x=\"266\" y=\"117\" transform=\"rotate(-90 266 117)\">temperature / °C</text></g><g font-size=\"15\" text-anchor=\"start\"><text x=\"76\" y=\"22\">Squashed axis</text><text x=\"316\" y=\"22\">Even axis</text></g></g><g font-family=\"Arial, sans-serif\" font-size=\"13\" dominant-baseline=\"central\" text-anchor=\"start\"><g fill=\"#9a6512\"><text x=\"44\" y=\"246\">20 jumps to 50.</text><text x=\"44\" y=\"264\">The line bends.</text></g><g fill=\"#1c6b4a\"><text x=\"280\" y=\"246\">Every gap is equal.</text><text x=\"280\" y=\"264\">One straight line.</text></g></g></svg>","imageCaption":"Both graphs plot the same four readings: 20, 34, 46 and 59 °C.","support":{"start":{"title":"Get started","heading":"","body":"<p>Put a finger on each graph where the line changes direction.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Read the numbers up the side of each graph out loud.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Which graph would you use to argue the water heated suddenly? Say why that is unfair.</p>"}},"product":"The three rules copied into books"},{"type":"model","layout":"worked-model","label":"Model","nav":"3","title":"Watch me plot Trial 1","lead":"Watch first. Copy each decision when I stop.","minutes":7,"steps":[{"text":"Decision 1. Time across the bottom axis. Temperature up the side axis."},{"text":"Rejected: 20, 30, 60 up the side. A 30 °C gap is drawn the same size as a 10 °C one.","weak":true},{"text":"Decision 2. Number the side axis 0 to 60, ten degrees every two squares."},{"text":"Decision 3. Label them time / min and temperature / °C. Unit after the slash."},{"text":"Decision 4. Plot each pair with a small cross. Draw one line through them, not cross to cross."},{"text":"Decision 5. To read a value, go up to the line, then across."}],"callout":"Trial 1: 20, 34, 46, 59 °C at 0, 2, 4, 6 min.","support":{"start":{"title":"Get started","heading":"","body":"<p>Copy only the words I underline when I stop.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Say each decision to your partner before you write it.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Where would 5 minutes sit on my time axis? Point to it.</p>"}},"product":"The five decisions copied into books at each stop"},{"type":"practice","layout":"task-and-criteria","label":"Practise","nav":"4","title":"Now you set up the axes","lead":"Use the same readings. Set up your axes on your whiteboard, then hold it up.","minutes":5,"tasks":["Write the label for the bottom axis, with its unit.","Write the label for the side axis, with its unit.","Number the side axis from 0 to 60 in equal steps.","Plot the readings for 0 minutes and 2 minutes."],"criteria":["Both labels have a unit after the slash.","Every step up the side axis is worth the same.","The 0 minute point sits on 20 °C."],"support":{"start":{"title":"Get started","heading":"","body":"<p>Draw the two axis lines first. Label them before you write any numbers.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Count your squares between 0 and 10, then check the gap from 10 to 20 matches.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Number a second axis that reaches 60 °C in five steps instead of six.</p>"}},"product":"Axes and two plotted points on a whiteboard, held up"},{"type":"hinge","layout":"diagnostic-decision","label":"Check","nav":"5","title":"Which scale is fair?","lead":"Choose a letter. Explain why.","minutes":4,"callout":"Equal tick spaces. Scale 1: 0,10,20,30,40,50,60. Scale 2: 0,10,20,50,60.","support":false,"choices":["Scale 2: its line looks straighter.","Scale 1: equal spaces show equal changes.","Both: the readings are identical.","Scale 2: every number fits the paper."],"answer":1,"feedback":"Scale 1: each interval represents 10 °C. Scale 2 gives 30 °C and 10 °C the same space, distorting the line.","recheck":"Equal ticks show 0,10,20,50,60; the axis says temperature without a unit. Name two repairs.","product":"Letter and reason"},{"type":"practice","layout":"task-and-criteria","label":"Independent","nav":"6","title":"Plot your own graph","lead":"Work on your own, in silence. The sheet has the Trial 2 readings on it.","minutes":9,"tasks":["Write a title saying what is plotted against what.","Label both axes with the quantity and its unit.","Number the temperature axis to 60 °C in equal steps.","Plot the four readings, then draw a straight line of best fit close to the points."],"criteria":["Title, both labels and both units are there.","Every step up the temperature axis is worth the same.","Each cross sits where its two readings meet."],"resources":[{"label":"Open the graph paper sheet","href":"03 Graph paper.html","kind":"worksheet"}],"support":false,"product":"A completed graph of Trial 2, drawn alone on the graph-paper sheet"},{"type":"data","layout":"evidence-workbench","label":"Independent","nav":"7","title":"Read two things off your own graph","lead":"Use your line, not the table. Write two sentences in your book.","minutes":4,"tasks":["What was the temperature at 3 minutes? Say how you found it.","At about what time did the water pass 30 °C?"],"review":{"type":"answers","label":"Reveal the answers","title":"Check your reads","body":"<p>1. About 40 °C. Go up from 3 minutes to the line, then across to the temperature axis. 2. About one and a half minutes. Go across from 30 °C to the line, then down. Your numbers may differ a little, but they must come from your line.</p>"},"support":false,"product":"Two sentences in books, each naming where the number came from"},{"type":"exit","layout":"quiet-exit","label":"Respond","nav":"8","title":"Graph doctor: find the fault","lead":"Swap cards. Look silently for twenty seconds. Then diagnose the fault.","minutes":4,"tasks":["Name the part of the graph with the problem.","Write one sentence saying what a reader would wrongly believe.","Give the card back. The author writes the exact repair."],"criteria":["You name the exact feature, not just 'messy'.","You say what a reader would wrongly believe.","The repair gives the exact change to make."],"review":{"type":"answers","label":"Reveal the fault","title":"The fault and the repair","body":"<p>The 20–50 jump compresses a 30 °C rise into a 10 °C space, making it look slower. Use equal 10 °C intervals and replot.</p>"},"resources":[{"label":"Open the graph doctor card","href":"03 Graph doctor card.html","kind":"task"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Start at the numbers up the side. Read them out in order.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use rule 2 from your book: equal spaces, equal amounts.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Write what would still be true about this graph once the fault is repaired.</p>"}},"assessment":{"type":"peer","label":"Peer assessment","detail":"Fault, reason and repair"}},{"type":"exit","layout":"quiet-exit","label":"Exit","nav":"9","title":"Before you go","lead":"Think for ten seconds first. Then write your answers and show them to me on the way out.","minutes":3,"tasks":["What did that graph maker change?","Why must a reader check the axes before comparing how fast the water heated?","Now say what they would change to make the same water look as though it barely heated at all."],"criteria":["Says what the axis change would do to the line.","Says the readings themselves did not change.","Names the change in numbers, not just 'make it bigger'."],"claim":"Two graphs use exactly the same readings, but on one of them the water looks as though it heated much faster.","review":{"type":"answers","label":"Reveal the answer","title":"What changed","body":"<p>The graph maker changed the temperature scale. A smaller temperature range over the same height makes the line steeper; a larger range, such as 0 to 300 °C, makes it flatter. The readings and actual heating rate stay the same. Equal intervals are essential. Even a correctly numbered scale can give a misleading impression if you compare steepness without reading the axes.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Use the words: axis, equal, steeper.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Begin: 'They changed the ___ so that ___.'</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Name a second change that would mislead a reader in the same way.</p>"}},"product":"Three short answers in books, shown at the door"}],"support":{"start":{"title":"Get started","heading":"Get started","body":"<ul><li>Draw the two axis lines first, then label them before any numbers.</li><li>A label needs the quantity and the unit: time / min, temperature / °C.</li><li>Start the numbering at 0 and count the squares for your first step.</li></ul>"},"build":{"title":"Build understanding","heading":"Build understanding","body":"<ul><li>Check one gap against another: 0 to 10 must take the same space as 50 to 60.</li><li>Plot with a small cross, not a blob, so the reading stays exact.</li><li>To read a value, go up from the time axis to the line, then across.</li></ul>"},"stretch":{"title":"Go further","heading":"Go further","body":"<ul><li>Explain why one straight line is more useful than joining cross to cross.</li><li>Work out how much the temperature rose each minute between 2 and 6 minutes.</li><li>Describe a change to an axis that would make a small rise look enormous.</li></ul>"}}};
