<script>const lesson = {"shape":"practical-enquiry","architecture_version":1,"phases":[{"type":"doNow","layout":"retrieval-sheet","label":"Retrieve","nav":"1","title":"Before anything is lit","lead":"Work alone in your book. Number 1 to 4. No talking.","minutes":5,"points":["What does the word hazard mean?","What does a control do?","Write two lab rules you already follow.","Why must you do the steps in the right order?"],"review":{"type":"answers","label":"Check your answers","title":"Check and correct","body":"<p>1. A hazard is anything that could cause harm. 2. A control is a step that makes the harm less likely. 3. For example: bags under the bench, hair tied back, walk and do not run, stand up to work. 4. Steps in the wrong order can let gas escape or start a fire.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Start with question 3. You already know two rules.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use: A hazard is… A control is…</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Add one hazard you have seen in a kitchen and the control for it.</p>"}},"product":"Four numbered answers in books"},{"type":"diagram","layout":"model-stage","label":"Question","nav":"2","title":"Name the parts before you light anything","lead":"Today's question: what makes a flame safe to wait with? Copy the diagram. Label every part.","minutes":5,"tasks":["Copy the diagram. Label all six parts.","Write one sentence: what does the collar do?"],"model":{"figure":"<svg viewBox=\"0 0 600 520\" role=\"img\" aria-label=\"Line diagram of a Bunsen burner showing base, gas hose, barrel, collar, air hole and flame\"><path d=\"M300 40 C 336 96 330 132 300 156 C 270 132 264 96 300 40 Z\" fill=\"#f2c14b\" stroke=\"#14263d\" stroke-width=\"4\"/><rect x=\"272\" y=\"156\" width=\"56\" height=\"272\" rx=\"6\" fill=\"#dfe4e8\" stroke=\"#14263d\" stroke-width=\"4\"/><rect x=\"258\" y=\"350\" width=\"84\" height=\"62\" rx=\"10\" fill=\"#b9c2cc\" stroke=\"#14263d\" stroke-width=\"4\"/><circle cx=\"318\" cy=\"381\" r=\"13\" fill=\"#fffdf8\" stroke=\"#14263d\" stroke-width=\"3\"/><rect x=\"196\" y=\"428\" width=\"208\" height=\"44\" rx=\"16\" fill=\"#8a95a1\" stroke=\"#14263d\" stroke-width=\"4\"/><path d=\"M404 452 C 462 452 486 424 512 402\" fill=\"none\" stroke=\"#14263d\" stroke-width=\"12\" stroke-linecap=\"round\"/><path d=\"M404 452 C 462 452 486 424 512 402\" fill=\"none\" stroke=\"#c8a06a\" stroke-width=\"6\" stroke-linecap=\"round\"/></svg>","labels":[{"text":"flame","note":"sits on top of the barrel","x":50,"y":18,"side":"right"},{"text":"barrel","note":"gas and air mix inside","x":50,"y":50,"side":"left"},{"text":"collar","note":"turn it to open the hole","x":43,"y":73,"side":"left"},{"text":"air hole","note":"lets air mix with gas","x":53,"y":73,"side":"right"},{"text":"base","note":"keeps the burner steady","x":40,"y":87,"side":"left"},{"text":"gas hose","note":"carries gas to the burner","x":85,"y":78,"side":"right"}],"caption":"Teacher line drawing. Hold it next to the burner on your bench and check every part is really there."},"support":{"start":{"title":"Get started","heading":"","body":"<p>Draw the base first. It is the widest part.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use: The collar turns so that the air hole…</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Why does the burner need a wide, heavy base?</p>"}},"product":"Labelled Bunsen diagram in books"},{"type":"question","layout":"full-question","label":"Predict","nav":"3","title":"What will the flame do when the air hole opens?","lead":"Write your prediction in your book before anything is lit. One sentence for each question.","minutes":4,"points":["The air hole on your teacher's burner is closed.","In a moment your teacher will light it, then open the air hole."],"tasks":["Predict: what will the colour do?","Predict: will the flame be easier or harder to see?","Predict: will the flame get hotter or cooler?","Write one reason for each prediction."],"support":{"start":{"title":"Get started","heading":"","body":"<p>Use: I think the flame will…</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Add a reason: …because more air gets in.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>How could you tell which flame is hotter without touching it?</p>"}},"product":"Written prediction and reason in books"},{"type":"media","layout":"observation-theatre","label":"Method","nav":"4","title":"Watch the routine. One step at a time.","lead":"Hands off everything. Watch. Then write the six steps in order in your book.","minutes":7,"points":["Bench clear. Bags away. Stand up.","Hair back. Sleeves and ties tucked in.","Eye protection on, as your teacher shows.","Burner on the mat. Hose joined at both ends.","Air hole closed. Then light it as shown.","Yellow flame: waiting. Blue flame: hotter, for heating."],"tasks":["Watch the water: which flame heats it faster?"],"reveals":[{"label":"Reveal the last step","title":"How the routine ends","body":"<p>Close the air hole so the flame is yellow. Turn the gas off at the tap. Leave the burner where it is until it is cool.</p>"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Write each step as one short line.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Say each step under your breath as you watch it.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Which step protects someone who is not at your bench?</p>"}},"product":"Numbered list of the routine in books"},{"type":"model","layout":"worked-model","label":"Method","nav":"5","title":"Rehearse the order with the gas off","lead":"Nothing is lit. Say the six steps out loud as you point to each part.","minutes":5,"steps":[{"text":"Bench clear. Hose joined at both ends."},{"text":"Burner on the mat. Air hole closed."},{"text":"Light it the way your teacher showed you."},{"text":"Leave the yellow flame while you wait."},{"text":"Open the air hole only when told to heat."},{"text":"Close the air hole. Gas off. Let it cool."}],"callout":"Not this: open the air hole first so it is ready. Then the flame is hard to see and nobody knows the burner is lit.","support":{"start":{"title":"Get started","heading":"","body":"<p>Point to each part as you say its name.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Say the step, then say why that step is there.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Say the whole routine backwards from the shutdown.</p>"}},"product":"Spoken rehearsal at the bench with the gas off"},{"type":"hinge","layout":"diagnostic-decision","label":"Check","nav":"6","title":"Which action is best?","lead":"Choose a letter. Explain why.","minutes":3,"callout":"The burner is lit but waiting between heating tasks.","support":false,"choices":["Close air hole: yellow waiting flame.","Leave blue: blue means safe.","Change the flame without permission.","Leave the lit burner to fetch equipment."],"answer":0,"feedback":"A: close the air hole for a visible yellow waiting flame. Blue is hotter and harder to see. Both can burn.","recheck":"Heating has finished but the flame is blue. What should your partner do, and why?","product":"Letter and reason"},{"type":"data","layout":"evidence-workbench","label":"Collect","nav":"7","title":"Your supervised attempt","lead":"Do not touch anything until your teacher says your bench can start. Eye protection on. Follow the order you rehearsed.","minutes":8,"tasks":["Air hole closed first. Record the yellow flame.","Open the air hole only when told. Record the blue flame.","Fill in 'hotter' and 'we use it for' from what you saw.","Close the air hole, then turn the gas off when told to stop."],"table":[["Air hole","Flame colour","Easy to see?","Hotter?","We use it for"],["Closed","","","",""],["Open","","","",""]],"support":{"start":{"title":"Get started","heading":"","body":"<p>Fill in the colour column first. Write one word.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>For 'easy to see', stand back one step and look again.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Write down one thing you had to change to stay safe.</p>"}},"product":"Completed observation table in the practical record"},{"type":"concept","layout":"split-explanation","label":"Interpret","nav":"8","title":"Was your prediction right?","lead":"Read the prediction you wrote before anything was lit. Compare it with your own table.","minutes":3,"tasks":["Tick each prediction that matched what you saw.","Correct any prediction that did not. Keep your first words.","Write one sentence: what did you change, and why?"],"table":[["Flame","Easy to see?","Hotter?","We use it for"],["Yellow, air hole closed","Yes","No","Waiting"],["Blue, air hole open","No","Yes","Heating"]],"callout":"Both flames can burn you. The blue one is hotter and harder to see.","support":{"start":{"title":"Get started","heading":"","body":"<p>Take one prediction at a time. Tick it or change it.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use: I predicted… but I saw…</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Why is the flame we heat with also the hardest one to see?</p>"}},"product":"Predictions ticked or corrected in books, with one sentence on what changed"},{"type":"practice","layout":"task-and-criteria","label":"Interpret","nav":"9","title":"Which flame do we leave, and why is the other one riskier?","lead":"Twenty seconds, no writing: both flames are hot, so why is the blue one riskier to walk away from? Then write.","minutes":4,"tasks":["Write which flame we leave when nobody is heating, and why.","Explain why the blue flame is riskier to walk away from.","A burner is left blue while its pair fetches a beaker. What should happen next?"],"criteria":["Names the yellow flame as the waiting flame.","Says the yellow flame is easy to see.","Says the blue flame is hotter and harder to see, so it is riskier to leave.","Says opening the air hole lets more air mix with the gas."],"support":{"start":{"title":"Get started","heading":"","body":"<p>Use: We wait with the… flame.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use: This is safer because everyone can see…</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Why is the flame we heat with also the hardest one to see?</p>"}},"product":"Three-sentence explanation in books"},{"type":"exit","layout":"quiet-exit","label":"Evaluate","nav":"10","title":"One hazard. One control.","lead":"Write this on your own. Then check it against the list.","minutes":4,"tasks":["Write one hazard from today's practical.","Write the control you used that makes it safer.","Finish this: This protects other people because…"],"criteria":["Names a real hazard from today.","Names a control you actually used.","Says who is protected and how."],"review":{"type":"wagoll","label":"See a strong answer","title":"One strong answer","body":"<p><strong>Hazard:</strong> a lit burner left on a blue flame is very hot and hard to see. <strong>Control:</strong> close the air hole so the flame goes yellow. <strong>This protects other people because</strong> anyone walking past can see the flame before they reach across the bench.</p><p>Now improve one sentence in a different colour. Keep your first answer.</p>"},"support":false,"assessment":{"type":"self","label":"Self-assessment","detail":"Hazard and control written alone in books, then one improved sentence in a different colour"}}]};
