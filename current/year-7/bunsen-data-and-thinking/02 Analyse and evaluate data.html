<script>const lesson = {"shape":"data-and-interpretation","architecture_version":1,"phases":[{"type":"doNow","layout":"retrieval-sheet","label":"Retrieve","nav":"1","title":"What do you remember from Tuesday?","lead":"Work alone, no notes. Write four short answers in your book.","minutes":5,"points":["Which Bunsen flame do we use for heating? Name it.","Write one safety check you make before you light a Bunsen burner.","You keep the amount of water the same in every trial. What do we call something you keep the same?","Why do scientists measure the same thing three times?"],"review":{"type":"answers","label":"Reveal the answers","title":"Check and correct","body":"<p>1. The blue flame. 2. Goggles on, hair tied back, tubing checked and the safety flame set. 3. A control variable. 4. Repeats let you see whether the readings agree, so one odd number stands out.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Answer the two you are sure of first, then come back.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Picture Tuesday's bench. What did you check before you turned the gas on?</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Add one sentence: what could three very different readings tell you?</p>"}},"product":"Four short answers in books"},{"type":"data","layout":"evidence-workbench","label":"Orient","nav":"2","title":"Read the results before you judge them","lead":"These are results from Tuesday's practical. Write three things you can see. Do not explain anything yet.","minutes":4,"tasks":["What was measured, and in which unit?","Write one sentence saying what happens to the temperature as time goes on.","Copy the number that does not sit with the others into your book. Circle it."],"table":[["Time / min","Trial 1 / °C","Trial 2 / °C","Trial 3 / °C"],["0","20","20","20"],["2","34","35","34"],["4","46","45","58"],["6","59","58","60"]],"callout":"100 cm³ of water heated on a blue flame. Read every 2 minutes.","support":{"start":{"title":"Get started","heading":"","body":"<p>Read the top row first. It tells you what each column holds.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Compare across each row. Three trials at the same time should be close.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Look down Trial 3 as well as across. What else looks strange about that column?</p>"}},"product":"Three written observations in books, one number copied and circled"},{"type":"concept","layout":"visual-first-explanation","label":"Orient","nav":"3","title":"From result to claim","lead":"Copy the four steps. Add one table example to each.","minutes":4,"points":["Result: one measurement.","Pattern: what changes across readings.","Claim: what the results support.","Check: what would increase confidence."],"visual":["RESULT: one number","PATTERN: what changes","CLAIM: what it suggests","CHECK: what makes us surer"],"callout":"Too high: bulb touches hot glass. Too low: bulb outside water or read before settling.","support":{"start":{"title":"Get started","heading":"","body":"<p>Use the numbers from the row at 2 minutes for your examples.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Say each step aloud to your partner before you write it.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Which of the four steps do people skip most often? Why?</p>"}},"product":"Four steps with examples"},{"type":"model","layout":"worked-model","label":"Model","nav":"4","title":"Watch me write one careful conclusion","lead":"Watch first. When I stop, copy the three sentence openings into your book.","minutes":7,"steps":[{"text":"I look across each row. The water gets hotter as time goes on."},{"text":"Rejected: 'After 4 minutes the water reached 58 °C.' Two trials give 45 °C and 46 °C, so this uses the odd number as if it were typical.","weak":true},{"text":"Better: 'After 4 minutes the water was about 45–46 °C in two trials out of three.'"},{"text":"The 58 °C in Trial 3 is about 12 °C above the two trials that agree, 45 °C and 46 °C. I keep it and investigate it."},{"text":"Improvement that matches: hold the thermometer away from the hot glass and read it again."}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Write only the words I underline when I stop.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Ask yourself after each sentence: which number is that built on?</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Suggest a second improvement and say which reading it would fix.</p>"}},"product":"The three sentence openings copied into books"},{"type":"practice","layout":"task-and-criteria","label":"Analyse","nav":"5","title":"Now you build the sentences","lead":"Use the same three steps. Write on your whiteboard, then hold it up.","minutes":6,"tasks":["After 2 minutes all three trials agreed at about ___ °C.","The result I would investigate is ___ because ___.","One improvement that matches my reason is ___."],"criteria":["Every sentence contains a number taken from the table.","The unusual result is still there, with a reason.","The improvement fixes the thing you said was doubtful."],"support":{"start":{"title":"Get started","heading":"","body":"<p>Fill the first gap only, then show me.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Say the sentence out loud to your partner before you write it.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Write your second sentence without the opening on the board.</p>"}},"product":"Three sentences on a whiteboard, held up"},{"type":"hinge","layout":"diagnostic-decision","label":"Check","nav":"6","title":"Which result needs checking?","lead":"Choose a letter. Explain why.","minutes":4,"callout":"Repeated readings: 41 °C, 40 °C, 29 °C. What should happen first?","support":false,"choices":["Delete 29 °C: it must be wrong.","Keep 29 °C and check the measurement.","Use only 29 °C because it is surprising.","Calculate the mean without checking."],"answer":1,"feedback":"B: 40–41 °C agree. Keep the unusual 29 °C reading, check the method and repeat if possible.","recheck":"New repeats: 52 °C, 51 °C, 74 °C. What would you do with 74 °C, and why?","product":"Letter and reason"},{"type":"exit","layout":"quiet-exit","label":"Conclude","nav":"7","title":"Assessed task: data evidence","lead":"Draw a large box in your book and highlight its border. Add today’s date and the task title.","minutes":11,"tasks":["Work alone for 11 minutes. Put every answer inside your box.","Keep your first answers unchanged for teacher marking."],"review":{"type":"wagoll","label":"After teacher marking: reveal feedback","title":"One strong response","body":"<p>The water cooled in every trial, from 80 °C to about 58 °C in 6 minutes. Two trials agree at 64–65 °C after 4 minutes, so I would check the 52 °C reading. It may have been read with the thermometer out of the water, so I would read it again with the bulb in.</p>"},"resources":[{"label":"Open assessed task","href":"02 Weekly evidence page.html","kind":"assessment"}],"support":false,"assessment":{"type":"teacher","label":"Teacher-marked evidence","detail":"Independent assessed work inside the highlighted book box"}},{"type":"question","layout":"full-question","label":"Respond","nav":"8","title":"Keep your first answer","lead":"Check that every part is numbered. Keep your first answers unchanged for your teacher.","minutes":3,"tasks":["Check that you answered every numbered part.","After teacher feedback, correct one answer below the box in another colour."],"review":{"type":"answers","label":"After teacher marking: reveal feedback","title":"What a tick looks like","body":"<p>1: quote a temperature and time. 2: compare the odd reading with agreeing trials. 3: change the measurement method to address your proposed cause.</p>"},"assessment":{"type":"self","label":"Self-assessment","detail":"Original response preserved; later correction below the box"}},{"type":"question","layout":"full-question","label":"Exit","nav":"9","title":"New results. What is your first move?","lead":"Read the three times. Write one sentence in your book: what you would do first, and why.","minutes":3,"claim":"A class timed how long the same ice cube took to melt: 4.0 min, 4.2 min, 6.8 min.","review":{"type":"answers","label":"Reveal the answer","title":"First move","body":"<p>Keep the 6.8 min result and check how that timing was taken, because the other two agree at about 4 minutes. It may have been a bigger cube or a late stop on the timer, so that trial should be run again.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Which two results agree?</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use the words: keep, check, because.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Suggest what could have made the 6.8 min reading so long.</p>"}},"product":"One sentence in books"}],"support":{"start":{"title":"Get started","heading":"Get started","body":"<ul><li>A result is one number. A pattern is what happens across the whole table.</li><li>Find two readings that agree before you look at the odd one.</li><li>Begin: 'After ___ minutes the water was about ___ °C.'</li></ul>"},"build":{"title":"Build understanding","heading":"Build understanding","body":"<ul><li>Say your sentence aloud before you write it.</li><li>Every sentence needs a number from the table inside it.</li><li>An improvement must fix the reading you doubted, not everything at once.</li></ul>"},"stretch":{"title":"Go further","heading":"Go further","body":"<ul><li>Explain why keeping the odd result is more scientific than deleting it.</li><li>Suggest a second improvement and say which reading it would fix.</li><li>What would you need to see before you trusted the 58 °C reading?</li></ul>"}}};
