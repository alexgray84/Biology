<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Current electricity: recall and check · Year 7</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,350;9..144,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
      --navy-950: oklch(20% 0.085 258);
      --navy-900: oklch(25% 0.10 258);
      --navy-700: oklch(36% 0.12 258);
      --navy-100: oklch(93% 0.025 258);
      --gold-600: oklch(50% 0.13 82);
      --gold-500: oklch(76% 0.16 82);
      --gold-100: oklch(94% 0.035 82);
      --paper-50: oklch(99% 0.008 82);
      --paper-100: oklch(98% 0.012 82);
      --paper-200: oklch(95% 0.022 82);
      --ink-900: oklch(22% 0.015 75);
      --ink-600: oklch(43% 0.02 258);
      --line: oklch(36% 0.04 258 / 0.18);
      --line-strong: oklch(36% 0.06 258 / 0.34);
      --push: oklch(39% 0.14 258);
      --resist: oklch(43% 0.10 30);
      --success: oklch(40% 0.09 155);
      --surface-shadow: 0 18px 50px oklch(25% 0.08 258 / 0.08);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --sans: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper-200); }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--paper-200); color: var(--ink-900); font: 400 1rem/1.5 var(--sans); }
    button { font: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 3px solid var(--gold-500); outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: 0.38; }
    .skip-link { position: fixed; left: 16px; top: -80px; z-index: 50; padding: 10px 16px; border-radius: 8px; background: var(--navy-950); color: var(--paper-100); font-weight: 700; }
    .skip-link:focus { top: 16px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .app { width: 100%; min-width: 0; min-height: 100vh; display: grid; grid-template-rows: minmax(0, 1fr) 62px; }
    .app > * { min-width: 0; }
    .crest { width: 40px; height: 46px; flex: 0 0 40px; }
    .topic { margin: 0; padding: 28px clamp(32px, 5.6vw, 78px) 0; color: var(--navy-950); font: 400 1.35rem/1.2 var(--serif); }
    .control, .icon-control, .tool-control, .choice, .support-tab, .phase-link, .reveal-control, .timer-control {
      border: 1px solid var(--line);
      background: var(--paper-50);
      color: var(--navy-950);
      cursor: pointer;
      transition: background 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out), transform 140ms var(--ease-out);
    }
    .control { min-height: 44px; padding: 9px 15px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
    .control.primary { background: var(--navy-900); border-color: var(--navy-900); color: var(--paper-100); }
    .control:hover, .icon-control:hover, .tool-control:hover, .reveal-control:hover, .timer-control:hover { border-color: var(--navy-700); background: var(--navy-100); }
    .control.primary:hover { background: var(--navy-700); color: var(--paper-100); }
    .control:active, .icon-control:active, .tool-control:active, .reveal-control:active, .timer-control:active { transform: translateY(1px); }

    .workspace { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px 20px; }
    .workspace.has-drawer { grid-template-columns: minmax(0, 1fr) minmax(330px, 382px); }
    .lesson-stage, .student-drawer { min-width: 0; min-height: 0; overflow: hidden; border: 1px solid var(--line); background: var(--paper-100); }
    .lesson-stage { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); border-radius: 20px; box-shadow: var(--surface-shadow); }
    .screen { height: 100%; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: clamp(28px, 4.5vh, 52px) clamp(32px, 5.6vw, 78px); animation: screen-enter 220ms var(--ease-out); }
    .screen-heading { margin: 8px 0 14px -0.035em; max-width: 24ch; color: var(--navy-950); font: 350 clamp(2.5rem, 4vw, 3.75rem)/0.99 var(--serif); letter-spacing: -0.035em; text-wrap: balance; }
    .screen-heading:focus, .drawer-head h2:focus { outline: none; }
    .screen-lead { max-width: 68ch; margin: 0; color: var(--ink-600); font-size: clamp(1rem, 1.3vw, 1.2rem); line-height: 1.5; text-wrap: pretty; }
    .screen-kicker { color: var(--ink-600); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
    .screen-kicker strong { color: var(--gold-600); }
    .micro-instruction { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 20px; color: var(--navy-950); font-size: 0.9rem; font-weight: 700; }
    .micro-instruction span { display: inline-flex; align-items: center; gap: 7px; }
    .micro-instruction span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold-500); }

    .do-now-layout { display: grid; grid-template-columns: minmax(0, 0.72fr) minmax(0, 1.28fr); gap: clamp(36px, 6vw, 84px); align-items: center; }
    .do-now-number { margin: 2px 0 14px; color: var(--gold-500); font: 300 clamp(5.5rem, 9vw, 8rem)/0.78 var(--serif); font-variant-numeric: lining-nums; }
    .question-sheet { counter-reset: question; display: grid; gap: 0; border-top: 1px solid var(--line-strong); }
    .question-row { counter-increment: question; display: grid; grid-template-columns: 38px 1fr; gap: 14px; align-items: start; padding: 14px 4px; border-bottom: 1px solid var(--line); color: var(--navy-950); font-size: clamp(1rem, 1.3vw, 1.15rem); font-weight: 600; }
    .question-row::before { content: counter(question, decimal-leading-zero); color: var(--gold-600); font: 500 0.82rem/1.8 var(--serif); }

    .question-stage { max-width: 1120px; }
    .question-stage .screen-heading { max-width: 22ch; font-size: clamp(3rem, 5.3vw, 5.2rem); }
    .prediction { display: flex; gap: 10px; margin-top: 26px; }
    .choice { min-width: 150px; min-height: 48px; padding: 10px 18px; border-radius: 12px; font-weight: 700; text-align: left; }
    .choice:hover, .choice[aria-pressed="true"] { border-color: var(--navy-700); background: var(--navy-900); color: var(--paper-100); }
    .commitment { min-height: 26px; margin-top: 14px; color: var(--ink-600); font-size: 0.9rem; font-weight: 600; }

    .concept-layout { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: clamp(40px, 7vw, 96px); align-items: center; }
    .principles { display: grid; border-top: 1px solid var(--line-strong); }
    .principle { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .principle span:first-child { color: var(--gold-600); font: 500 0.8rem/1.8 var(--serif); }
    .principle p { margin: 0; color: var(--navy-950); font-size: 1.02rem; font-weight: 600; }
    .key-statement { margin-top: 24px; padding: 18px 20px; border: 1px solid var(--navy-900); border-radius: 12px; background: var(--navy-900); color: var(--paper-100); }
    .key-statement span { display: block; margin-bottom: 4px; color: var(--gold-500); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .key-statement p { margin: 0; font: 350 1.35rem/1.3 var(--serif); }

    .model-layout { display: grid; grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
    .diagram-wrap { min-width: 0; padding-block: 16px; }
    .force-diagram { display: block; width: 100%; height: auto; max-height: 340px; overflow: visible; }
    .force-diagram text { font-family: var(--sans); }
    .force-arrow { stroke-linecap: round; stroke-width: 9; }
    .force-arrow.push { stroke: var(--push); }
    .force-arrow.resist { stroke: var(--resist); }
    .motion-path { stroke: var(--gold-500); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 12 11; animation: motion-flow 1.2s linear infinite; }
    .diagram-label { fill: var(--navy-950); font-size: 18px; font-weight: 700; }
    .diagram-label.resist { fill: var(--resist); }
    .diagram-result { fill: var(--navy-950); font: 400 27px var(--serif) !important; }
    .diagram-result, .resultant-arrow { transition: opacity 220ms var(--ease-out); }
    .diagram-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .reveal-control, .timer-control { min-height: 44px; padding: 9px 14px; border-radius: 999px; font-size: 0.86rem; font-weight: 750; }
    .reveal-control.primary { border-color: var(--navy-900); background: var(--navy-900); color: var(--paper-100); }
    .step-list { display: grid; gap: 0; margin-top: 20px; border-top: 1px solid var(--line-strong); }
    .model-step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--line); animation: step-enter 200ms var(--ease-out); }
    .model-step span:first-child { color: var(--gold-600); font: 500 0.82rem/1.8 var(--serif); }
    .model-step p { margin: 0; font-weight: 600; }

    .hinge-layout { max-width: 1080px; }
    .hinge-layout .screen-heading { max-width: 25ch; font-size: clamp(2.6rem, 4.3vw, 4.2rem); }
    .answer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
    .answer-option { min-height: 64px; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-50); color: var(--ink-900); text-align: left; cursor: pointer; }
    .answer-option:hover, .answer-option[aria-pressed="true"] { border-color: var(--navy-700); background: var(--navy-100); }
    .answer-option.is-correct { border-color: var(--success); background: oklch(94% 0.025 155); }
    .answer-letter { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--navy-700); font-size: 0.82rem; font-weight: 800; }
    .answer-feedback { min-height: 50px; margin-top: 12px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-200); color: var(--navy-950); }
    .answer-feedback:empty { min-height: 0; margin: 0; padding: 0; border: 0; }

    .practice-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: clamp(36px, 6vw, 82px); align-items: center; }
    .task-list { counter-reset: task; margin-top: 20px; border-top: 1px solid var(--line-strong); }
    .task-item { counter-increment: task; display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
    .task-item::before { content: counter(task); color: var(--gold-600); font: 500 0.9rem/1.65 var(--serif); }
    .success-list { padding: 24px 0 24px 28px; border-left: 1px solid var(--line-strong); }
    .success-list h2 { margin: 0 0 14px; color: var(--navy-950); font: 400 1.55rem var(--serif); }
    .success-list p { display: flex; gap: 9px; margin: 10px 0; color: var(--ink-600); font-size: 0.92rem; }
    .success-list p::before { content: "✓"; color: var(--gold-600); font-weight: 800; }

    .source-claim { max-width: 950px; margin: 22px 0 0; padding: clamp(22px, 3vw, 34px); border: 1px solid var(--line-strong); border-radius: 14px; background: var(--paper-50); }
    .source-label { margin-bottom: 12px; color: var(--ink-600); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; }
    .source-claim blockquote { margin: 0; max-width: 34ch; color: var(--navy-950); font: 350 clamp(1.65rem, 2.5vw, 2.45rem)/1.18 var(--serif); text-wrap: balance; }
    .verification-steps { display: flex; flex-wrap: wrap; gap: 16px 28px; margin-top: 20px; color: var(--navy-950); font-weight: 700; }
    .verification-steps span { display: inline-flex; align-items: center; gap: 8px; }
    .verification-steps b { color: var(--gold-600); font-family: var(--serif); }

    .exit-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.42fr); gap: clamp(48px, 8vw, 112px); align-items: center; }
    .exit-mark { color: var(--gold-500); font: 300 clamp(5rem, 8vw, 7.5rem)/0.8 var(--serif); }
    .exit-question { margin: 16px 0 0; max-width: 42ch; color: var(--navy-950); font: 350 clamp(1.7rem, 2.6vw, 2.5rem)/1.17 var(--serif); }
    .timer-panel { padding: 28px 0 28px 32px; border-left: 1px solid var(--line-strong); }
    .timer-value { color: var(--navy-950); font: 350 clamp(3.5rem, 5.5vw, 5rem)/1 var(--serif); font-variant-numeric: tabular-nums; }
    .timer-note { margin: 8px 0 18px; color: var(--ink-600); font-size: 0.86rem; }

    .student-drawer { display: grid; grid-template-rows: auto auto minmax(0, 1fr); border-radius: 18px; box-shadow: var(--surface-shadow); animation: drawer-enter 240ms var(--ease-out); }
    .student-drawer[hidden] { display: none; }
    .drawer-head { display: flex; align-items: start; gap: 16px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 0; color: var(--navy-950); font: 400 1.55rem/1.1 var(--serif); }
    .drawer-head p { margin: 5px 0 0; color: var(--ink-600); font-size: 0.8rem; line-height: 1.4; }
    .icon-control { width: 44px; height: 44px; flex: 0 0 44px; display: grid; place-items: center; margin-left: auto; border-radius: 50%; font-size: 1.25rem; font-weight: 500; }
    .drawer-tabs { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .support-tab { min-height: 38px; padding: 7px 10px; border-color: transparent; border-radius: 999px; color: var(--ink-600); font-size: 0.72rem; font-weight: 750; white-space: nowrap; }
    .support-tab[aria-selected="true"] { background: var(--navy-900); color: var(--paper-100); }
    .drawer-body { min-height: 0; padding: 18px; overflow: auto; }
    .drawer-section-title { margin: 0 0 14px; color: var(--gold-600); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .support-list { display: grid; gap: 0; border-top: 1px solid var(--line-strong); }
    .support-item { padding: 13px 2px; border-bottom: 1px solid var(--line); }
    .support-item h3 { margin: 0; color: var(--navy-950); font-size: 0.92rem; line-height: 1.4; }
    .support-item p { margin: 5px 0 0; color: var(--ink-600); font-size: 0.8rem; line-height: 1.45; }
    .journey-list { display: grid; gap: 2px; }
    .phase-link { width: 100%; min-height: 42px; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 7px 9px; border-color: transparent; border-radius: 8px; text-align: left; font-size: 0.78rem; }
    .phase-link[aria-current="step"] { background: var(--navy-100); color: var(--navy-950); font-weight: 750; }
    .phase-link span:first-child { color: var(--gold-600); font-family: var(--serif); }
    .phase-link small { color: var(--ink-600); }

    .student-tools { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0; }
    .student-tools:empty { padding: 0; visibility: hidden; }
    .tool-control { min-height: 42px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 750; }
    .tool-control[aria-pressed="true"] { border-color: var(--navy-900); background: var(--navy-900); color: var(--paper-100); }
    .tool-icon { font-size: 0.92rem; line-height: 1; }
    .support-tool { border-color: var(--gold-500); }

    .lesson-nav { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 16px; padding: 7px 20px 10px; border-top: 1px solid var(--line); background: var(--paper-50); }
    .nav-control { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--paper-50); color: var(--navy-950); cursor: pointer; font-size: 1.2rem; font-weight: 700; }
    .nav-control:hover { border-color: var(--navy-700); background: var(--navy-100); }
    .nav-context { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; align-items: center; }
    .phase-context { min-width: 0; }
    .phase-context small { display: block; color: var(--ink-600); font-size: 0.68rem; font-weight: 750; letter-spacing: 0.11em; text-transform: uppercase; }
    .phase-context strong { display: block; overflow: hidden; color: var(--navy-950); font: 400 1.12rem/1.2 var(--serif); text-overflow: ellipsis; white-space: nowrap; }
    .next-context { color: var(--ink-600); font-size: 0.72rem; text-align: right; }
    .next-context strong { color: var(--navy-950); }

    @media (min-width: 1021px) {
      .workspace.has-drawer .screen, .workspace.has-drawer .topic { padding-inline: clamp(28px, 3vw, 46px); }
      .workspace.has-drawer .do-now-layout,
      .workspace.has-drawer .concept-layout,
      .workspace.has-drawer .model-layout,
      .workspace.has-drawer .practice-layout,
      .workspace.has-drawer .exit-layout { gap: clamp(22px, 3vw, 42px); }
      .workspace.has-drawer .force-diagram { max-height: 270px; }
    }

    @keyframes screen-enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drawer-enter { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes step-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes motion-flow { to { stroke-dashoffset: -23; } }

    @media (max-width: 1020px) {
      .workspace.has-drawer { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(200px, 35%); }
      .student-drawer { grid-template-rows: auto auto minmax(0, 1fr); }
      .screen { padding: 28px 36px; }
      .topic { padding-inline: 36px; }
      .do-now-layout, .concept-layout { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 36px; }
      .model-layout { grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 24px; }
      .practice-layout { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: 32px; }
      .exit-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 0.4fr); gap: 40px; }
    }

    @media (max-width: 760px) {
      body { min-height: 100%; }
      .app { min-height: 100dvh; grid-template-rows: auto 58px; }
      .crest { width: 34px; height: 40px; flex-basis: 34px; }
      .topic { padding: 24px 24px 0; font-size: 1.05rem; }
      .workspace, .workspace.has-drawer { display: grid; grid-template-columns: 1fr; grid-template-rows: auto auto; padding: 10px 12px; }
      .lesson-stage { min-height: 520px; }
      .screen { height: auto; min-height: 518px; justify-content: center; padding: 32px 24px; }
      .screen-heading { font-size: clamp(2.25rem, 11vw, 3.25rem); }
      .screen-lead { font-size: 1rem; }
      .do-now-layout, .concept-layout, .model-layout, .practice-layout, .exit-layout { grid-template-columns: 1fr; gap: 28px; }
      .do-now-number { font-size: 5rem; }
      .question-row { font-size: 0.96rem; padding-block: 11px; }
      .question-stage .screen-heading { font-size: clamp(2.35rem, 11vw, 3.35rem); }
      .prediction { flex-direction: column; }
      .choice { width: 100%; }
      .principles { margin-top: 4px; }
      .key-statement { margin-top: 18px; }
      .model-layout .diagram-wrap { order: -1; }
      .force-diagram { max-height: 250px; }
      .answer-grid { grid-template-columns: 1fr; }
      .practice-layout { align-items: start; }
      .success-list, .timer-panel { padding: 20px 0 0; border-left: 0; border-top: 1px solid var(--line-strong); }
      .source-claim blockquote { font-size: 1.6rem; }
      .student-drawer { max-height: none; border-radius: 16px; box-shadow: none; }
      .drawer-body { max-height: 360px; }
      .student-tools { justify-content: flex-start; padding: 0; }
      .tool-control { flex: 0 0 auto; min-height: 44px; }
      .lesson-nav { grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 10px; padding-inline: 12px; }
      .next-context { display: none; }
      .nav-context { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    }

    @media (max-height: 680px) and (min-width: 761px) {
      .app { grid-template-rows: minmax(0, 1fr) 56px; }
      .screen { padding-block: 22px; }
      .screen-heading { font-size: clamp(2.25rem, 3.6vw, 3.3rem); margin-block: 6px 10px; }
      .screen-lead { font-size: 1rem; }
      .question-row, .principle { padding-block: 9px; }
      .model-step, .task-item { padding-block: 8px; }
      .source-claim { margin-top: 14px; padding: 18px 22px; }
    }

    /* Projection: teaching text scales with both screen width and height. */
    @media (min-width: 761px) {
      .app {
        --board-body: clamp(24px, min(2.4vw, 3.6dvh), 42px);
        --board-question: clamp(28px, min(2.8vw, 4.5dvh), 50px);
        --board-heading: clamp(38px, min(4.4vw, 6.6dvh), 76px);
        --board-label: clamp(16px, min(1.5vw, 2.5dvh), 26px);
        --board-inset: clamp(24px, 2.8vw, 54px);
        height: 100dvh;
        min-height: 0;
        grid-template-rows: minmax(0, 1fr) 58px;
      }
      .workspace { padding: 8px; }

      .lesson-nav { padding: 6px 16px; }
      .phase-context small { font-size: 12px; }

      .next-context, .tool-control { font-size: 16px; }
      .workspace.has-drawer { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
      .workspace.has-drawer .lesson-stage, .workspace.has-drawer .student-drawer { grid-area: 1 / 1; }

      .drawer-section-title { color: var(--navy-950); font-size: var(--board-label); }
      .support-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
      .support-item { padding-block: 20px; }
      .support-item p { margin-top: 14px; }
    }

    @media (pointer: coarse) {
      .support-tab, .phase-link, .reveal-control, .timer-control { min-height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .motion-path { stroke-dasharray: none; }

/* Six screen families share a projection canvas and optional task widgets. */
.app { grid-template-rows: minmax(0, 1fr) auto 58px; }
.nav-context { grid-template-columns: minmax(0, 1fr) auto; }
.student-tools {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.6fr);
  gap: 8px;
  padding: 0 12px 8px;
}
.student-tools:empty { padding: 0; }
.tool-control { justify-content: center; gap: 0; border-radius: 8px; font-size: 16px; padding: 8px 10px; }
.tool-control[aria-expanded="true"] { background: var(--navy-900); border-color: var(--navy-900); color: var(--paper-100); }
.topic[hidden] { display: none; }
.app[data-family="Title"] .lesson-stage { grid-template-rows: minmax(0, 1fr); }
.title-layout { display: flex; flex-direction: column; justify-content: center; height: 100%; }
.title-layout .screen-heading { font-size: clamp(72px, min(8.2vw, 13vh), 148px); max-width: 12ch; margin: 20px 0; }
.title-question { font: 500 clamp(32px, min(4.2vw, 6.8vh), 72px)/1.15 var(--serif); max-width: 22ch; margin: 0 0 32px; }
.title-path { display: flex; flex-wrap: wrap; gap: 14px 32px; border-top: 1px solid var(--line-strong); padding-top: 24px; font-size: var(--board-body, 24px); }
.title-path span + span::before { content: "→"; color: var(--gold-600); margin-right: 24px; }
.outcome-layout { width: 100%; }
.outcome-list { list-style: none; counter-reset: outcome; padding: 0; margin: 24px 0 0; border-top: 1px solid var(--line-strong); }
.outcome-list li { counter-increment: outcome; display: grid; grid-template-columns: 32px 1fr; gap: 14px; border-bottom: 1px solid var(--line); padding: 20px 0; }
.outcome-list li::before { content: counter(outcome, decimal-leading-zero); font-family: var(--serif); }
.outcome-list strong { display: block; font-weight: 650; }
.outcome-list p { margin: 8px 0 0; }
.outcome-open { margin-top: 20px; }
.workspace.has-drawer .lesson-stage { visibility: visible; }
.workspace.has-drawer .lesson-stage, .workspace.has-drawer .student-drawer { grid-area: auto; }
.student-drawer { grid-template-rows: auto auto minmax(0, 1fr) auto; animation: none; }
.drawer-head { align-items: start; }
.drawer-head p { margin-top: 8px; }
.drawer-tabs { flex-wrap: wrap; overflow: visible; }
.drawer-tabs:empty { display: none; }
.drawer-body { overflow: hidden; max-height: none; }
.widget-page h3 { font: 500 1.35em/1.15 var(--serif); margin: 0 0 18px; }
.widget-page p { margin: 0 0 18px; }
.widget-page ul { margin: 20px 0; padding-left: 1.15em; }
.widget-page li { padding-left: 5px; margin: 0 0 16px; }
.widget-page blockquote { margin: 0 0 20px; font: 500 1.25em/1.25 var(--serif); }
.widget-note { font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
.widget-action { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 18px; border: 1px solid var(--navy-900); border-radius: 8px; background: var(--navy-900); color: var(--paper-100); font: 650 0.8em/1.3 var(--sans); cursor: pointer; }
.widget-source { color: var(--navy-700); font-size: 0.75em; text-underline-offset: 4px; }
.widget-diagram { margin-bottom: 18px; }
.widget-diagram .force-diagram { width: 100%; max-height: 180px; }
.widget-diagram .diagram-label { font-size: 46px; }
.widget-pagination { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 12px; padding: 10px 20px; border-top: 1px solid var(--line); }
.widget-pagination span { text-align: center; font-size: 16px; }
.context-anchor { margin-block: 0 !important; }
.context-key { margin: 24px 0 0; padding-top: 20px; border-top: 1px solid var(--line-strong); font-weight: 600; }
.context-key span { display: block; margin-bottom: 8px; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.06em; }
.context-key p { margin: 0; }
.context-options, .context-tasks { padding-left: 1.2em; margin: 22px 0 0; }
.context-options li, .context-tasks li { margin-bottom: 16px; padding-left: 8px; }

@media (min-width: 761px) {
  .app { grid-template-rows: minmax(0, 1fr) auto 58px; }
  .workspace.has-drawer { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 8px; }
  .workspace.has-drawer .screen, .workspace.has-drawer .topic { padding-inline: 26px; }

  .workspace.has-drawer .screen-heading { font-size: clamp(32px, min(3.3vw, 5.3vh), 56px); }

  .outcome-list li { padding-block: 16px; }
  .outcome-list p { font-size: 0.85em; }
  .drawer-head { padding: 20px 22px 14px; gap: 8px; }
  .drawer-head h2 { font-size: clamp(28px, min(2.8vw, 4.8vh), 46px); }
  .drawer-head p { font-size: clamp(18px, min(1.8vw, 2.8vh), 28px); line-height: 1.3; }
  .drawer-tabs { padding: 10px 16px; gap: 6px; }
  .support-tab { font-size: clamp(16px, 1.45vw, 22px); padding: 8px 12px; min-height: 40px; }
  .drawer-body { padding: 22px; color: var(--navy-950); font-size: clamp(23px, min(2.15vw, 3.4vh), 36px); line-height: 1.3; }
  .screen-model .force-diagram { max-height: 23vh; }
  .screen-model .model-layout { gap: 14px; }
  .screen-model .model-step { padding-block: 8px; }
}

@media (max-width: 760px) {
  .app { grid-template-rows: auto auto 58px; }
  .student-tools { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 12px 8px; }
  .tool-control { font-size: 13px; min-height: 44px; }
  .title-layout .screen-heading { font-size: clamp(56px, 15vw, 100px); }
  .title-question { font-size: 32px; }
  .title-path { flex-direction: column; font-size: 20px; }
  .title-path span + span::before { content: none; }
  .workspace.has-drawer { grid-template-columns: 1fr; grid-template-rows: auto auto; }
  .workspace.has-drawer .lesson-stage, .workspace.has-drawer .student-drawer { grid-area: auto; }
  .drawer-body { overflow: visible; font-size: 21px; }
  .student-drawer { min-height: 500px; }
  .screen-outcome { font-size: 22px; }
  .context-anchor { font-size: 21px; }
  .nav-context { grid-template-columns: minmax(0, 1fr); }
}

/* Content extensions to the approved Arcadia 1.0.0 frame. */
.screen { gap: 0; }

 A", "title": "Word fill A: current", "minutes": 4, "lead": "Copy each sentence into your book, filling the gaps.", "text": "<b>Bank:</b> ammeter &middot; amperes &middot; charge &middot; series", "items": ["Current is the rate of flow of <b>(1)</b> ______ around a circuit.", "It is measured in <b>(2)</b> ______ (symbol A) with an <b>(3)</b> ______, connected in <b>(4)</b> ______ with the component."], "task": "Write the full sentences, not just the missing words.", "support": null, "resources": []}, {"id": "p-words2", "family": "Input", "type": "content", "nav": "Word fill B", "title": "Word fill B: series and parallel", "minutes": 4, "lead": "Same again. One word is needed twice.", "text": "<b>Bank:</b> add up &middot; parallel &middot; same &middot; series &middot; splits", "items": ["A <b>(5)</b> ______ circuit has one complete path, so the current is the <b>(6)</b> ______ at every point.", "A <b>(7)</b> ______ circuit has more than one path: the current <b>(8)</b> ______ at a junction, and the branch currents <b>(9)</b> ______ to give the supply current."], "task": "Write the full sentences in your book.", "support": null, "resources": []}, {"id": "p-words3", "family": "Input", "type": "content", "nav": "Word fill C", "title": "Word fill C: voltage", "minutes": 4, "lead": "These are the gaps people lose marks on.", "text": "<b>Bank:</b> across &middot; add up &middot; difference &middot; energy &middot; full &middot; same &middot; voltmeter &middot; volts", "items": ["Voltage, or potential <b>(10)</b> ______, is how much <b>(11)</b> ______ is transferred for each coulomb of charge. It is measured in <b>(12)</b> ______ with a <b>(13)</b> ______ connected <b>(14)</b> ______ the component.", "In series the voltages <b>(15)</b> ______ to give the supply voltage. In parallel each branch joins the <b>(16)</b> ______ two points as the supply, so each has the <b>(17)</b> ______ supply voltage."], "task": "Write the full sentences in your book.", "support": null, "resources": []}, {"id": "p-words4", "family": "Input", "type": "content", "nav": "Word fill D", "title": "Word fill D: resistance", "minutes": 3, "lead": "One sentence. It explains every &lsquo;why is it dimmer?&rsquo; question you will be asked.", "text": "<b>Bank:</b> decreases &middot; dimmer &middot; increases &middot; ohms &middot; resistance", "items": ["<b>(18)</b> ______ is the opposition to the flow of charge, measured in <b>(19)</b> ______ (&#937;).", "Adding a lamp in series <b>(20)</b> ______ the total resistance, so the current <b>(21)</b> ______ and the lamps get <b>(22)</b> ______."], "task": "Learn this sentence. Then say it to your partner without looking.", "support": null, "resources": []}, {"id": "p-match", "family": "Input", "type": "table", "nav": "Match up", "title": "Match up: terms and meanings", "minutes": 5, "lead": "Meanings are shuffled. Write the pairs as 1&ndash;?, 2&ndash;? in your book.", "rows": [["Term", "Meaning &mdash; shuffled", "Term", "Meaning &mdash; shuffled"], ["<b>1</b> Current", "<b>A</b> Where a circuit splits into branches, or branches rejoin.", "<b>5</b> Parallel circuit", "<b>E</b> The opposition to the flow of charge, in ohms."], ["<b>2</b> Potential difference", "<b>B</b> The rate of flow of charge, in amperes.", "<b>6</b> Ammeter", "<b>F</b> A meter connected <i>in</i> the path."], ["<b>3</b> Resistance", "<b>C</b> A meter connected <i>across</i> a component.", "<b>7</b> Voltmeter", "<b>G</b> The energy transferred per coulomb of charge."], ["<b>4</b> Series circuit", "<b>D</b> A circuit with only one complete path.", "<b>8</b> Junction", "<b>H</b> A circuit with two or more complete paths."]], "task": "", "items": [], "support": null, "resources": []}, {"id": "p-units", "family": "Input", "type": "table", "nav": "Units table", "title": "Complete the quantity table", "minutes": 4, "lead": "Copy it and fill every gap. Each answer is hiding in a word-fill sentence.", "rows": [["Quantity", "Unit name", "Symbol", "Meter"], ["Current", "?", "?", "?"], ["Potential difference", "?", "?", "?"], ["Resistance", "?", "?", "?"], ["Charge", "?", "?", "&mdash;"], ["Energy", "?", "?", "&mdash;"]], "task": "", "items": [], "support": null, "resources": []}, {"id": "p-rules", "family": "Thinking", "type": "model", "nav": "Choosing the rule", "title": "Which rule do you need?", "minutes": 5, "lead": "Follow each step. This is the routine for every circuit question you will meet.", "diagram": "rules", "caption": "Series and parallel side by side. Gold dots mark the junctions where the current splits.", "steps": ["Trace the circuit with your finger. Count the complete paths back to the battery.", "One path means <b>series</b>. Two or more means <b>parallel</b>.", "Series: the current is the <b>same</b> everywhere; the voltages <b>add up</b> to the supply voltage.", "Parallel: the branch currents <b>add up</b> to the supply current; each branch has the <b>same</b> (full) supply voltage.", "Notice the pattern: whatever <i>adds up</i> in series stays the <i>same</i> in parallel, and the other way round.", "Last step: check your answer has a unit &mdash; A, V or &#937;."], "task": "In your book, write the four rules as two pairs. Say why the pattern is a mirror image.", "items": [], "support": null, "resources": []}, {"id": "p-asn1", "family": "Thinking", "type": "content", "nav": "Always / sometimes / never (1)", "title": "Always, sometimes or never? Round 1", "minutes": 4, "lead": "Whiteboards. Write the word <i>and</i> a reason. If you write sometimes, say <i>when</i>.", "items": ["The current is the same at every point in a series circuit.", "The current splits equally at a junction.", "Each branch of a parallel circuit has the full supply voltage.", "Adding another lamp in series makes all the lamps dimmer."], "task": "Show on the count of three. Defend the reason, not just the word.", "support": null, "resources": []}, {"id": "p-asn2", "family": "Thinking", "type": "content", "nav": "Always / sometimes / never (2)", "title": "Always, sometimes or never? Round 2", "minutes": 4, "lead": "Same rules. These four catch more people than the first four.", "items": ["If one lamp in a circuit breaks, the others go out.", "The supply voltage is shared equally between components in series.", "Current is used up as it travels round a circuit.", "A voltmeter is connected across a component."], "task": "Show on the count of three. One of these is a <i>never</i>.", "support": null, "resources": []}, {"id": "p-series", "family": "Input", "type": "content", "nav": "Read the circuit: series", "title": "Read the circuit: series", "minutes": 5, "lead": "The supply is 6 V and both lamps are identical. Treat the circuit as ideal.", "diagram": "series", "caption": "Circuit 1 &mdash; one complete path.", "items": ["What would an ammeter placed at <b>X</b> read? Explain how you know.", "State the voltage across each lamp, and name the rule you used.", "A third identical lamp is added in series. What happens to the ammeter reading?"], "task": "Answer all three in your book. Give every value a unit.", "support": null, "resources": []}, {"id": "p-parallel", "family": "Input", "type": "content", "nav": "Read the circuit: parallel", "title": "Read the circuit: parallel", "minutes": 6, "lead": "Same 6 V supply, same lamps. The supply ammeter reads 0.90 A.", "diagram": "parallel", "caption": "Circuit 2 &mdash; two complete paths.", "items": ["Calculate the current in branch <b>L2</b>.", "State the voltage across L1 and across L2. Explain why it is not 3 V each.", "The lamps are identical, so what should the branch currents be? What does 0.40 A tell you?"], "task": "Question 3 is the hard one. Trust the rule and question the apparatus.", "support": null, "resources": []}, {"id": "p-meters", "family": "Input", "type": "content", "nav": "Meter placement", "title": "In the path, or across it?", "minutes": 4, "lead": "One circuit, two meters, two completely different jobs.", "diagram": "meters", "caption": "The ammeter sits in the path. The voltmeter sits on its own branch across the lamp.", "items": ["An ammeter goes <b>in</b> the path, so all the charge flows through it.", "A voltmeter goes <b>across</b> the component, leaving the original path intact.", "A voltmeter placed <i>in</i> the path stops the current: the lamp goes out."], "task": "In your book: why is connecting an ammeter straight across the battery a bad idea?", "support": null, "resources": []}, {"id": "p-hinge1", "family": "Assess", "type": "hinge", "nav": "Hinge 1", "title": "Hinge 1: the missing voltage", "minutes": 2, "secure": true, "lead": "An ideal 6 V battery, two lamps in series. A voltmeter across the first lamp reads 4 V. The voltage across the second lamp is:", "options": ["6 V", "2 V", "3 V", "10 V"], "task": "Choose one letter. Be ready to say why &mdash; and why the others are wrong.", "items": [], "support": null, "resources": []}, {"id": "p-hinge2", "family": "Assess", "type": "hinge", "nav": "Hinge 2", "title": "Hinge 2: one lamp removed", "minutes": 2, "secure": true, "lead": "Three identical lamps are in parallel across a 6 V supply. One lamp is unscrewed. The other two:", "options": ["go out", "get dimmer", "stay at about the same brightness", "get much brighter"], "task": "Choose one letter. Justify it with paths and voltage.", "items": [], "support": null, "resources": []}, {"id": "p-hinge3", "family": "Assess", "type": "hinge", "nav": "Hinge 3", "title": "Hinge 3: adding a lamp in series", "minutes": 2, "secure": true, "lead": "A lamp is added in series to an existing series circuit, on the same supply. The ammeter reading:", "options": ["increases, because there is more to light up", "decreases, because the total resistance is greater", "stays the same, because the battery is unchanged", "decreases, because current is used up by the extra lamp"], "task": "Careful: one wrong option has the right answer but the wrong reason.", "items": [], "support": null, "resources": []}, {"id": "p-mistakes", "family": "Thinking", "type": "cases", "nav": "Spot the mistake", "title": "Spot the mistake", "minutes": 7, "lead": "Each pupil has one clear error. For each: &ldquo;It should say ______ because ______.&rdquo;", "cases": [["Amina", "&ldquo;Each lamp uses some current up, so the furthest lamp is dimmest.&rdquo;"], ["Ben", "&ldquo;In parallel the voltage splits at the junction, so each lamp gets 3 V from a 6 V battery.&rdquo;"], ["Chen", "&ldquo;To measure voltage across a lamp I broke the circuit and put the voltmeter in the gap.&rdquo;"], ["Dana", "&ldquo;A 10 &#937; and a 20 &#937; lamp in series on 6 V, so each lamp has 3 V across it.&rdquo;"]], "task": "", "items": [], "support": null, "resources": []}, {"id": "p-practice", "family": "Assess", "type": "content", "nav": "Independent practice", "title": "Independent practice", "minutes": 12, "secure": true, "label": "Independent practice · recall → apply → explain", "lead": "Open the sheet. Work on your own, in your book. Keep your first attempt.", "items": ["Parts A to E &mdash; retrieval, word fill, match up, always/sometimes/never, the circuits.", "Part G &mdash; correct all four pupil mistakes in full sentences.", "Part H &mdash; go further with resistance if you finish.", "Give a reason for every explain answer. Every value needs a unit."], "task": "", "support": null, "resources": [{"label": "Open the practice sheet", "href": "@@sheet@@"}, {"label": "Rules reference card", "href": "@@ref@@"}]}, {"id": "p-hot1", "family": "Thinking", "type": "content", "nav": "Go further: calculate", "title": "Go further: putting a number on resistance", "minutes": 5, "lead": "You have used resistance in words. Now use it as a number.", "formula": ["R = V &divide; I", "unit: the ohm, &#937;"], "items": ["A lamp has 4.0 V across it and carries 0.50 A. Calculate its resistance.", "A 10 &#937; and a 20 &#937; resistor are in series on 6 V. The current is 0.20 A. Find the voltage across each, then check they add to 6 V."], "task": "Write the equation before the numbers, every time.", "support": null, "resources": []}, {"id": "p-hot2", "family": "Thinking", "type": "content", "nav": "Go further: explain", "title": "Go further: argue it properly", "minutes": 5, "lead": "No calculating. These two are about explaining and about evidence.", "items": ["Explain why house lights are wired in parallel, not in series. Give two reasons.", "In the real lesson, two series lamps measured 2.98 V and 2.98 V while the supply measured 5.97 V, not the 6.00 V it was set to. Does that disprove the series voltage rule?"], "task": "Question 2 is the best question in this lesson. Argue it properly.", "support": null, "resources": []}, {"id": "p-exit", "family": "Assess", "type": "content", "nav": "Exit check", "title": "Exit check", "minutes": 4, "secure": true, "lead": "On your own, no notes, no talking. Hand this in.", "items": ["State the current rule for a series circuit and for a parallel circuit. (2 marks)", "Two identical lamps are in parallel across a 9 V supply. State the voltage across each and explain. (2 marks)", "Explain, using resistance, why three lamps in series are dimmer than one on the same supply. (2 marks)"], "task": "Then rate yourself on each outcome: secure, nearly, not yet. Write one next step.", "support": null, "resources": []}], "reviews": {"p-grid": {"models": [{"heading": "Retrieval grid answers", "text": "<b>1</b> The ampere (amp), symbol A. &nbsp;<b>2</b> An ammeter, connected in series so all the charge passes through it. &nbsp;<b>3</b> The volt, symbol V. &nbsp;<b>4</b> It goes out &mdash; one path only, and removing a lamp breaks it. &nbsp;<b>5</b> 0.7 A; the branch currents add where the paths rejoin. &nbsp;<b>6</b> The lamp transfers 3 joules of energy for each coulomb of charge through it. &nbsp;<b>7</b> Keep them the same &mdash; they are the control variables. &nbsp;<b>8</b> The current is smaller: two lamps give a greater total resistance, so less current on the same supply. Both lamps carry the same current as each other. &nbsp;<b>9</b> Current is not used up. It is the same all the way round a series loop. What is transferred is <b>energy</b>, not charge."}], "criteria": [{"heading": "Success criteria", "items": ["1 point each for the left column, 2 for the middle, 3 for the right.", "3-point answers need the reason, not just the outcome.", "Mark your own honestly in a coloured pen."]}], "marks": null}, "p-words1": {"models": [{"heading": "Model response", "text": "<b>1</b> charge &middot; <b>2</b> amperes &middot; <b>3</b> ammeter &middot; <b>4</b> series"}], "criteria": [{"heading": "Success criteria", "items": ["Four gaps correct.", "Full sentences copied, not just the words.", "Gap 4 is &lsquo;series&rsquo; &mdash; an ammeter always goes in the path."]}], "marks": null}, "p-words2": {"models": [{"heading": "Model response", "text": "<b>5</b> series &middot; <b>6</b> same &middot; <b>7</b> parallel &middot; <b>8</b> splits &middot; <b>9</b> add up"}], "criteria": [{"heading": "Success criteria", "items": ["Five gaps correct.", "&lsquo;Series&rsquo; is the word used twice &mdash; once here, once in part A.", "Gap 8 may be &lsquo;splits&rsquo; or &lsquo;divides&rsquo;."]}], "marks": null}, "p-words3": {"models": [{"heading": "Model response", "text": "<b>10</b> difference &middot; <b>11</b> energy &middot; <b>12</b> volts &middot; <b>13</b> voltmeter &middot; <b>14</b> across &middot; <b>15</b> add up &middot; <b>16</b> same &middot; <b>17</b> full"}], "criteria": [{"heading": "Success criteria", "items": ["Eight gaps correct.", "Gap 14 must be &lsquo;across&rsquo; &mdash; not &lsquo;in&rsquo;.", "Gap 17 may be &lsquo;full&rsquo; or &lsquo;whole&rsquo;."]}], "marks": null}, "p-words4": {"models": [{"heading": "Model response", "text": "<b>18</b> Resistance &middot; <b>19</b> ohms &middot; <b>20</b> increases &middot; <b>21</b> decreases &middot; <b>22</b> dimmer"}], "criteria": [{"heading": "Success criteria", "items": ["Five gaps correct.", "The chain must be in this order: more resistance &rarr; less current &rarr; dimmer.", "Then say the whole sentence from memory."]}], "marks": null}, "p-match": {"models": [{"heading": "Model response", "text": "<b>1&ndash;B</b> &middot; <b>2&ndash;G</b> &middot; <b>3&ndash;E</b> &middot; <b>4&ndash;D</b> &middot; <b>5&ndash;H</b> &middot; <b>6&ndash;F</b> &middot; <b>7&ndash;C</b> &middot; <b>8&ndash;A</b>"}], "criteria": [{"heading": "Success criteria", "items": ["All eight pairs correct.", "2&ndash;G and 7&ndash;C are the two most often swapped: one is the quantity, one is the meter."]}], "marks": null}, "p-units": {"models": [{"heading": "Model response", "text": "Current &mdash; ampere (amp), <b>A</b>, ammeter connected in series. &nbsp;Potential difference &mdash; volt, <b>V</b>, voltmeter connected across. &nbsp;Resistance &mdash; ohm, <b>&#937;</b>; there is no single meter at this stage &mdash; it is worked out from voltage &divide; current. &nbsp;Charge &mdash; coulomb, <b>C</b>. &nbsp;Energy &mdash; joule, <b>J</b>."}], "criteria": [{"heading": "Success criteria", "items": ["Every unit name and symbol correct.", "Both meters named with how they are connected.", "Resistance: credit &lsquo;worked out from V &divide; I&rsquo;."]}], "marks": null}, "p-rules": {"models": [{"heading": "Model response", "text": "Series: current the <b>same</b>, voltages <b>add up</b>. Parallel: currents <b>add up</b>, voltage the <b>same</b>. The pattern mirrors because a series circuit has one path shared by everything, so the flow is common and the energy is shared; a parallel circuit gives each branch its own path between the same two points, so the energy per coulomb is common and the flow is shared."}], "criteria": [{"heading": "Success criteria", "items": ["Four rules recorded in two pairs.", "An explanation of the mirror pattern using paths.", "Units named: A for current, V for voltage."]}], "marks": null}, "p-asn1": {"models": [{"heading": "Model response", "text": "<b>1 Always</b> &mdash; one path, so the same charge passes every point. &nbsp;<b>2 Sometimes</b> &mdash; only for branches of equal resistance; the lower-resistance branch takes more. They still add to the supply current. &nbsp;<b>3 Always</b> (ideally) &mdash; each branch spans the same two supply points; in a real circuit it is very slightly less. &nbsp;<b>4 Always</b>, on the same supply &mdash; more resistance means less current, and the voltage is shared between more lamps."}], "criteria": [{"heading": "Success criteria", "items": ["The right word for all four.", "A reason for each, naming the rule.", "Statement 2 says <i>when</i> equal splitting does and does not happen."]}], "marks": null}, "p-asn2": {"models": [{"heading": "Model response", "text": "<b>5 Sometimes</b> &mdash; yes in series, no in parallel, unless the break is in the shared supply wire. &nbsp;<b>6 Sometimes</b> &mdash; only for equal resistances; the drops always add up, but a bigger resistance takes a bigger share. &nbsp;<b>7 Never</b> &mdash; charge is not destroyed; energy is transferred instead. &nbsp;<b>8 Always</b> &mdash; a voltmeter compares two points, so it needs its own branch across the component."}], "criteria": [{"heading": "Success criteria", "items": ["The right word for all four.", "Statement 7 is the never; say what <i>is</i> used up instead.", "Every &lsquo;sometimes&rsquo; says when it is true and when it is not."]}], "marks": null}, "p-series": {"models": [{"heading": "Model response", "text": "<b>1</b> 0.30 A &mdash; the same. One path, so the current is the same at every point. &nbsp;<b>2</b> 3 V across each. Series voltages add to the supply voltage, and identical lamps share equally: 3 + 3 = 6 V. &nbsp;<b>3</b> The reading falls. Three lamps give a greater total resistance, so less current on the same supply &mdash; and all three would be dimmer."}], "criteria": [{"heading": "Success criteria", "items": ["All three answers with units.", "Q1 justified by &lsquo;one path&rsquo;, not by the lamps being identical.", "Q2 names the rule as well as giving the number."]}], "marks": null}, "p-parallel": {"models": [{"heading": "Model response", "text": "<b>1</b> 0.90 &minus; 0.40 = <b>0.50 A</b>; the branch currents add to the supply current. &nbsp;<b>2</b> <b>6 V across each</b>. Each branch joins the same two supply points, so each gets the whole supply voltage. Voltage is not split at the junction &mdash; it is the <i>current</i> that splits there. &nbsp;<b>3</b> Identical lamps across the same voltage should carry <b>equal</b> currents, so you would expect about 0.45 A each. A 0.40 / 0.50 split means the lamps are not really identical, or a reading or connection is faulty. Good scientists check the apparatus when the numbers disagree with the rule."}], "criteria": [{"heading": "Success criteria", "items": ["Correct subtraction with the unit A.", "6 V justified by &lsquo;the same two points&rsquo;.", "Q3 questions the apparatus rather than abandoning the rule."]}], "marks": null}, "p-meters": {"models": [{"heading": "Model response", "text": "An ammeter has a very low resistance. Connected straight across the battery it creates an easy extra path, so a very large current flows through it. That changes the circuit and can damage the meter &mdash; and it measures the new path, not the lamp's current."}], "criteria": [{"heading": "Success criteria", "items": ["Low resistance identified.", "A very large current through the new path.", "Recognises the measurement is of the wrong thing."]}], "marks": null}, "p-hinge1": {"models": [{"heading": "Model response", "text": "<b>B &mdash; 2 V.</b> Series drops add to the supply voltage: 6 &minus; 4 = 2 V.<br><b>A</b> applies the parallel rule in series. <b>C</b> assumes equal sharing, but the 4 V reading already proves the lamps are not equal. <b>D</b> adds instead of subtracting."}], "criteria": [{"heading": "Success criteria", "items": ["1 mark: the correct option.", "1 mark: the sum rule, with the subtraction shown and the unit V."]}], "marks": "2 marks"}, "p-hinge2": {"models": [{"heading": "Model response", "text": "<b>C &mdash; stay at about the same brightness.</b> Each branch is its own complete path across the same two supply points, so each keeps the full supply voltage and its own current.<br><b>A</b> is the series answer. <b>B</b> assumes the voltage is shared between branches. <b>D</b> assumes the spare current is pushed into the others."}], "criteria": [{"heading": "Success criteria", "items": ["1 mark: the correct option.", "1 mark: justified by separate paths and the full supply voltage."]}], "marks": "2 marks"}, "p-hinge3": {"models": [{"heading": "Model response", "text": "<b>B.</b> More components in series means a greater total resistance, so a smaller current on the same supply.<br><b>D</b> reaches the right answer by the wrong reason &mdash; current is never used up. <b>C</b> forgets that the whole circuit, not the battery alone, sets the current."}], "criteria": [{"heading": "Success criteria", "items": ["1 mark: the correct option.", "1 mark: resistance named as the cause.", "No credit for D &mdash; the reasoning is the misconception this lesson is correcting."]}], "marks": "2 marks"}, "p-mistakes": {"models": [{"heading": "Model response", "text": "<b>Amina</b> &mdash; current is not used up and position does not affect brightness. The current is the same all the way round, so identical series lamps are equally bright wherever they sit; it is <b>energy</b> that is transferred. &nbsp;<b>Ben</b> &mdash; it is the <b>current</b> that splits at a junction, not the voltage. Each branch spans the same two supply points, so each lamp has the full <b>6 V</b>. &nbsp;<b>Chen</b> &mdash; that is how an <b>ammeter</b> is connected. A voltmeter in the path stops the current. Leave the lamp's own connections and add the voltmeter on a separate branch across it. &nbsp;<b>Dana</b> &mdash; equal sharing only applies to equal resistances. The drops still add to 6 V, but the bigger resistance takes the bigger share: <b>2 V</b> across the 10 &#937; lamp and <b>4 V</b> across the 20 &#937; lamp."}], "criteria": [{"heading": "Success criteria", "items": ["The error named for all four.", "A corrected version written as a full sentence.", "The correction gives the reason, not just the right number."]}], "marks": null}, "p-hot1": {"models": [{"heading": "Model response", "text": "<b>1</b> R = V &divide; I = 4.0 &divide; 0.50 = <b>8.0 &#937;</b>. &nbsp;<b>2</b> V = I &times; R, so 0.20 &times; 10 = <b>2.0 V</b> and 0.20 &times; 20 = <b>4.0 V</b>. Check: 2.0 + 4.0 = 6.0 V, the supply voltage. The same current passes through both, so the larger resistance takes the larger voltage."}], "criteria": [{"heading": "Success criteria", "items": ["Equation written before the numbers.", "Working shown, with &#937; and V.", "Q2 checked against the series rule."]}], "marks": null}, "p-hot2": {"models": [{"heading": "Model response", "text": "<b>1</b> Any two of: each light gets the full mains voltage, so full brightness; each can be switched independently; if one fails the others stay on, because each has its own complete path. &nbsp;<b>2</b> <b>No.</b> 2.98 + 2.98 = 5.96 V, which matches the <i>measured</i> 5.97 V to within rounding. The 6.00 V is the setting on the source; once current flows there are small losses inside the source, in the leads and in the switch, so the terminal voltage is slightly lower. The rule holds for the whole loop."}], "criteria": [{"heading": "Success criteria", "items": ["Two distinct reasons for Q1.", "Q2 distinguishes the source setting from the measured terminal voltage.", "Q2 accounts for the difference rather than rejecting the rule."]}], "marks": null}, "p-exit": {"models": [{"heading": "Model response", "text": "<b>1</b> Series: the current is the <b>same</b> at every point (1). Parallel: the <b>branch currents add up</b> to the supply current (1). &nbsp;<b>2</ tion": {"id": "p-grid", "label": "Open the retrieval grid"}}, {"heading": "Hinge questions", "text": "Three questions, on your own, no talking.", "action": {"id": "p-hinge1", "label": "Open the first hinge"}}, {"heading": "Independent practice", "text": "The full sheet. Keep your first attempt.", "action": {"id": "p-practice", "label": "Open the practice"}}, {"heading": "Exit check", "text": "Explain without your notes.", "action": {"id": "p-exit", "label": "Open the exit check"}}]}]}, "adaptation": {"title": "Adaptation", "subtitle": "Support for Students of Determination — a foothold first, then work on your own.", "tabs": [{"label": "Get started", "pages": [{"heading": "Start with one step", "text": "Two steps every time: (1) underline the one word that is wrong, (2) write &ldquo;It should say ______ because ______.&rdquo;", "review": {"models": [{"heading": "Model response", "text": "Amina: underline &lsquo;uses some up&rsquo;. It should say the current is the same all the way round, because charge is not used up &mdash; energy is transferred instead."}], "criteria": [{"heading": "Success criteria", "items": ["One wrong word or phrase underlined.", "The correction written with a because."]}], "marks": null}}]}, {"label": "Build understanding", "pages": [{"heading": "Build the answer", "text": "Amina is done for you as a model &mdash; open the answers, read that one, then do Ben, Chen and Dana in the same shape.", "review": {"models": [{"heading": "Model response", "text": "Amina: underline &lsquo;uses some up&rsquo;. It should say the current is the same all the way round, because charge is not used up &mdash; energy is transferred instead."}], "criteria": [{"heading": "Success criteria", "items": ["One wrong word or phrase underlined.", "The correction written with a because."]}], "marks": null}}]}]}, "hot": {"title": "Higher-order thinking", "subtitle": "Test a limit or explain a contrast.", "tabs": [{"label": "Go further", "pages": [{"heading": "Push the idea", "text": "Three of these four mistakes come from applying a <i>real rule</i> in the <i>wrong place</i>. Identify which rule each pupil has borrowed, and say where it does belong.", "review": {"models": [{"heading": "Model response", "text": "<b>Ben</b> borrowed the series voltage-sharing rule and used it in parallel; it belongs to components along one path. <b>Chen</b> borrowed the ammeter connection and used it for a voltmeter; it belongs in the path, not across. <b>Dana</b> borrowed equal sharing, which belongs only to equal resistances. Only <b>Amina</b>'s idea is not a real rule at all &mdash; current is never used up."}], "criteria": [{"heading": "Success criteria", "items": ["Each borrowed rule named and placed correctly.", "Amina identified as the genuine misconception."]}], "marks": null}}]}]}}, "p-hot1": {"resources": {"title": "Resources", "subtitle": "Use a reference, then return.", "tabs": [{"label": "Reference", "pages": [{"heading": "Open the full practice sheet", "text": "Every task on one page, with answers you can reveal to self-assess.", "href": "@@sheet@@"}, {"heading": "Circuit rules reference card", "text": "Units, the four rules, and the four things to stop saying. Rules only — no answers.", "href": "@@ref@@"}]}]}, "assessments": {"title": "Assessments", "subtitle": "Show your reasoning, then check it.", "tabs": [{"label": "Checks", "pages": [{"heading": "Retrieval grid", "text": "Six minutes, no notes. Score out of 18.", "action": {"id": "p-grid", "label": "Open the retrieval grid"}}, {"heading": "Hinge questions", "text": "Three questions, on your own, no talking.", "action": {"id": "p-hinge1", "label": "Open the first hinge"}}, {"heading": "Independent practice", "text": "The full sheet. Keep your first attempt.", "action": {"id": "p-practice", "label": "Open the practice"}}, {"heading": "Exit check", "text": "Explain without your notes.", "action": {"id": "p-exit", "label": "Open the exit check"}}]}]}, "adaptation": {"title": "Adaptation", "subtitle": "Support for Students of Determination — a foothold first, then work on your own.", "tabs": [{"label": "Get started", "pages": [{"heading": "Start with one step", "text": "Write the equation first, every time: R = V &divide; I. Then put each number under the word it belongs to.", "review": {"models": [{"heading": "Model response", "text": "R = V &divide; I = 4.0 &divide; 0.50 = <b>8.0 &#937;</b>."}], "criteria": [{"heading": "Success criteria", "items": ["Equation written before the numbers.", "Answer given with the unit &#937;."]}], "marks": null}}]}, {"label": "Build understanding", "pages": [{"heading": "Build the answer", "text": "For Q1: V = 4.0 V and I = 0.50 A. So R = 4.0 &divide; 0.50 = ______. Add the unit &#937;.", "review": {"models": [{"heading": "Model response", "text": "R = V &divide; I = 4.0 &divide; 0.50 = <b>8.0 &#937;</b>."}], "criteria": [{"heading": "Success criteria", "items": ["Equation written before the numbers.", "Answer given with the unit &#937;."]}], "marks": null}}]}]}, "hot": {"title": "Higher-order thinking", "subtitle": "Test a limit or explain a contrast.", "tabs": [{"label": "Go further", "pages": [{"heading": "Push the idea", "text": "In Q2 the same current passes through both resistors, yet they have different voltages across them. Explain how both of those facts can be true at once.", "review": {"models": [{"heading": "Model response", "text": "They describe different things. <b>Current</b> is the flow, and in one path the flow must be the same everywhere. <b>Voltage</b> is the energy given up per coulomb, and a bigger resistance takes more energy from each coulomb that passes. So the same coulombs travel through both, handing over twice as much energy in the 20 &#937; resistor as in the 10 &#937; one."}], "criteria": [{"heading": "Success criteria", "items": ["Both quantities defined separately.", "No contradiction claimed between them."]}], "marks": null}}]}]}}, "p-hot2": {"resources": {"title": "Resources", "subtitle": "Use a reference, then return.", "tabs": [{"label": "Reference", "pages": [{"heading": "Open the full practice sheet", "text": "Every task on one page, with answers you can reveal to self-assess.", "href": "@@sheet@@"}, {"heading": "Circuit rules reference card", "text": "Units, the four rules, and the four things to stop saying. Rules only — no answers.", "href": "@@ref@@"}]}]}, "assessments": {"title": "Assessments", "subtitle": "Show your reasoning, then check it.", "tabs": [{"label": "Checks", "pages": [{"heading": "Retrieval grid", "text": "Six minutes, no notes. Score out of 18.", "action": {"id": "p-grid", "label": "Open the retrieval grid"}}, {"heading": "Hinge questions", "text": "Three questions, on your own, no talking.", "action": {"id": "p-hinge1", "label": "Open the first hinge"}}, {"heading": "Independent practice", "text": "The full sheet. Keep your first attempt.", "action": {"id": "p-practice", "label": "Open the practice"}}, {"heading": "Exit check", "text": "Explain without your notes.", "action": {"id": "p-exit", "label": "Open the exit check"}}]}]}, "adaptation": {"title": "Adaptation", "subtitle": "Support for Students of Determination — a foothold first, then work on your own.", "tabs": [{"label": "Get started", "pages": [{"heading": "Start with one step", "text": "For Q1, picture your own house: what happens to the kitchen light when you switch off the hall light?", "review": {"models": [{"heading": "Model response", "text": "Each light gets the full mains voltage, so it is at full brightness; and each has its own path, so it can be switched on its own and keeps working if another bulb fails."}], "criteria": [{"heading": "Success criteria", "items": ["Two distinct reasons.", "Each reason linked to a parallel rule."]}], "marks": null}}]}, {"label": "Build understanding", "pages": [{"heading": "Build the answer", "text": "Two reasons is the target. One about <b>brightness</b> (full voltage), one about <b>switching or failure</b> (separate paths).", "review": {"models": [{"heading": "Model response", "text": "Each light gets the full mains voltage, so it is at full brightness; and each has its own path, so it can be switched on its own and keeps working if another bulb fails."}], "criteria": [{"heading": "Success criteria", "items": ["Two distinct reasons.", "Each reason linked to a parallel rule."]}], "marks": null}}]}]}, "hot": {"title": "Higher-order thinking", "subtitle": "Test a limit or explain a contrast.", "tabs": [{"label": "Go further", "pages": [{"heading": "Push the idea", "text": "What measurement would <i>test</i> whether the missing 0.03 V is really lost in the source and leads, rather than the rule failing?", "review": {"models": [{"heading": "Model response", "text": "Measure the voltage across the <b>leads and switch</b> while the current flows, and compare the source's <b>terminal voltage</b> at rest with its value under load. If the terminal voltage falls as soon as current flows, and the lead drops account for the remainder, the missing voltage is fully explained and the loop rule holds. A rule is only in trouble once every loss has been measured and the sums still do not close."}], "criteria": [{"heading": "Success criteria", "items": ["A specific measurement proposed, not just an explanation.", "Recognises a rule is tested by accounting for the discrepancy."]}], "marks": null}}]}]}}}};</script>
