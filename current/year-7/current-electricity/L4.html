<style>/* Edu OS lesson runtime — Arcadia quiet academic canvas.
   Type scale is set for a 1920 × 1080 classroom display (core text ≈ 30–36 px, headings ≥ 60 px,
   labels ≥ 20 px) and collapses for laptops below 1280 px. See LESSON_BUILD_MEMORY.md. */

:root {
  --navy: #14263d; --ink: #223142; --muted: #4f5c6b; --gold: #b78324; --gold-soft: #f2c96d;
  --paper: #faf7f0; --wash: #eee8dc; --white: #fffdf8; --line: #c8c5bc; --blue: #dbeaf0; --green: #dceade; --amber: #fff8e7;
  --serif: Fraunces, Georgia, "Times New Roman", serif;
  --sans: Montserrat, "Helvetica Neue", Arial, sans-serif;
  /* Scale: 1vw at 1920 = 19.2px */
  --t-label: clamp(0.85rem, 1.05vw, 1.3rem);   /* 20 px at 1920 */
  --t-body: clamp(1.1rem, 1.6vw, 2rem);        /* 31 px */
  --t-lead: clamp(1.25rem, 1.75vw, 2.25rem);   /* 34 px */
  --t-h1: clamp(2.6rem, 3.6vw, 4.6rem);        /* 69 px */
  --t-h2: clamp(1.4rem, 1.9vw, 2.4rem);        /* 36 px */
  font-family: var(--sans);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--wash); color: var(--ink); }
button { font: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.skip { position: fixed; top: -5rem; left: 1rem; background: var(--navy); color: #fff; padding: .6rem 1rem; z-index: 99; }
.skip:focus { top: 1rem; }

.app { height: 100vh; display: grid; grid-template-rows: 72px 5px minmax(0, 1fr) 68px; background: var(--paper); }
.top { display: flex; align-items: center; gap: 1.2rem; padding: 0 2rem; border-bottom: 1px solid var(--line); background: var(--white); }
.kicker { font-size: .72rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
.topic { font-family: var(--serif); font-size: 1.35rem; color: var(--navy); }
.topic em { font-style: normal; color: var(--gold); }
.controls { margin-left: auto; display: flex; gap: .5rem; }
.mode, .support-toggle { border: 1px solid var(--line); border-radius: 999px; padding: .55rem .95rem; background: var(--white); font-weight: 700; color: var(--navy); cursor: pointer; }
.progress { background: #e2d8c5; }
.progress span { display: block; width: 0; height: 100%; background: var(--gold); transition: width .25s; }
.main { min-height: 0; padding: 1rem 1.4rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; }
.main.drawer-open { grid-template-columns: minmax(0, 1fr) minmax(300px, 22vw); }
.stage, .drawer { min-height: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--white); overflow: hidden; }
.drawer { overflow: auto; }
/* One screen, no scrolling: the screen is exactly the stage height and every child shrinks to fit. */
.screen { height: 100%; padding: clamp(1.4rem, 3vh, 2.8rem) clamp(2rem, 4.5vw, 5.5rem); display: flex; flex-direction: column; justify-content: center; animation: in .22s ease-out; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .progress span { transition: none; } }

.label { font-size: var(--t-label); letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--gold); }
.assessment-badge { display: inline-block; margin-left: 1rem; padding: .25em .8em; border-radius: 999px; background: var(--navy); color: var(--gold-soft); font-size: var(--t-label); letter-spacing: .08em; text-transform: uppercase; font-weight: 800; }
h1 { max-width: 20ch; margin: .3rem 0 .8rem; font: 400 var(--t-h1) / 1 var(--serif); letter-spacing: -.035em; color: var(--navy); }
h2 { margin: 0 0 .5rem; font: 400 var(--t-h2) / 1.15 var(--serif); color: var(--navy); }
.lead { max-width: 62ch; margin: 0; color: var(--muted); font-size: var(--t-lead); line-height: 1.4; }
.callout { margin: 1.2rem 0 0; padding: 1rem 1.2rem; border-left: 6px solid var(--gold); background: var(--amber); font-size: var(--t-body); font-weight: 600; line-height: 1.35; }
.claim { margin: 1.2rem 0 0; padding: 1.2rem 1.4rem; border: 2px dashed var(--navy); border-radius: 14px; font: 400 var(--t-lead) / 1.35 var(--serif); color: var(--navy); }

/* Layout families */
.layout { display: grid; gap: clamp(1.6rem, 3.5vw, 4rem); align-items: center; min-height: 0; max-height: 100%; }
.layout.two { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); }
.layout.visual-left { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); }
.layout.visual-left > .text { order: 2; }
.layout.single { grid-template-columns: minmax(0, 1fr); max-width: 1400px; }
.layout.stacked { grid-template-columns: minmax(0, 1fr); align-items: start; }
.text { min-width: 0; min-height: 0; }
.aside { min-width: 0; min-height: 0; max-height: 100%; display: flex; flex-direction: column; gap: 1rem; }
.layout.visual-left { height: 100%; }
.layout.visual-left > .aside { height: 100%; justify-content: center; }

.list { display: grid; gap: .55rem; margin: 0; padding: 0; list-style: none; }
.list li { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .8rem; padding: .6rem 0; border-bottom: 1px solid var(--line); font-size: var(--t-body); font-weight: 600; line-height: 1.3; }
.list li:last-child { border-bottom: 0; }
.n { color: var(--gold); font-family: var(--serif); }
.tasks { display: grid; gap: .55rem; margin: 1rem 0 0; counter-reset: task; }
.tasks div { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .8rem; padding: .6rem 0; border-bottom: 1px solid var(--line); font-size: var(--t-body); font-weight: 600; line-height: 1.3; }
.tasks div::before { counter-increment: task; content: counter(task); color: var(--gold); font: 500 var(--t-body) var(--serif); }
.resource-bar { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1rem; }
.resource-button { display: inline-flex; align-items: center; gap: .8rem; width: fit-content; padding: .75rem 1.1rem; border: 2px solid var(--navy); border-radius: 999px; background: var(--navy); color: #fff; font-size: var(--t-label); font-weight: 800; text-decoration: none; }
.resource-button::after { content: "↗"; color: var(--gold-soft); font-size: 1.15em; }
.resource-button small { padding-left: .75rem; border-left: 1px solid #ffffff55; color: var(--gold-soft); font-size: .72em; letter-spacing: .1em; text-transform: uppercase; }
.resource-button:hover { background: #203b5d; }
.feedback-bar { display: none; margin-top: .9rem; padding-top: .8rem; border-top: 1px solid var(--line); align-items: center; gap: .8rem; }
.present .feedback-bar { display: flex; }
.feedback-bar > span { color: var(--muted); font-size: var(--t-label); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.feedback-bar .reveal { margin: 0; }
.criteria { margin: 1rem 0 0; padding: 1rem 1.3rem; background: var(--navy); color: #fff; border-radius: 14px; }
.criteria h2 { margin: 0 0 .4rem; color: var(--gold-soft); }
.criteria p { margin: .4rem 0; font-size: var(--t-body); line-height: 1.3; }
.product { margin: 1rem 0 0; font-size: var(--t-label); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.figure { width: 100%; margin: 0; min-height: 0; display: flex; flex-direction: column; flex: 1 1 auto; }
.figure img, .figure > svg { display: block; width: 100%; min-height: 0; flex: 1 1 auto; max-height: 100%; object-fit: contain; border-radius: 14px; background: var(--white); border: 1px solid var(--line); }
.figure figcaption { flex: 0 0 auto; margin-top: .6rem; color: var(--muted); font-size: var(--t-label); line-height: 1.35; }

/* Labelled model: figure shapes in the middle, HTML labels in side columns, leader lines drawn after layout. */
.model { position: relative; flex: 1 1 auto; min-height: 0; display: grid; font-size: var(--t-body); grid-template-columns: minmax(6em, 8.5em) minmax(0, 1fr) minmax(6em, 8.5em); gap: .6em; align-items: stretch; }
.layout.visual-left:has(.model) { grid-template-columns: minmax(0, 1.7fr) minmax(0, .8fr); }
.model.no-left { grid-template-columns: minmax(0, 1fr) minmax(6em, 8.5em); }
.model.no-right { grid-template-columns: minmax(6em, 8.5em) minmax(0, 1fr); }
.model-figure { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 14px; background: var(--white); padding: .8rem; }
.model-figure svg { width: 100%; height: 100%; max-height: 100%; }
.model-figure .panel-title { position: absolute; top: .6rem; font-size: var(--t-label); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.model-figure .panel-title.left { left: 1rem; } .model-figure .panel-title.right { right: 1rem; }
.model-labels { position: relative; min-width: 0; min-height: 0; }
.model-label { position: absolute; left: 0; right: 0; }
.model-labels.right { text-align: left; } .model-labels.left { text-align: right; }
.model-label { font-size: 1em; font-weight: 700; color: var(--navy); line-height: 1.15; padding: .2em .5em; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); }
.model-label small { display: block; font-size: var(--t-label); font-size: .66em; font-weight: 600; color: var(--muted); }
.model-leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.model-leaders line { stroke: var(--navy); stroke-width: 2.5; }
.model-leaders circle { fill: var(--navy); }
.model-caption { flex: 0 0 auto; margin-top: .5rem; color: var(--muted); font-size: var(--t-label); line-height: 1.35; }
.diagram { width: 100%; min-height: 32vh; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(135deg, #edf3f3, #f6ede1); padding: 1.3rem; }
.flow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .8rem; font-weight: 800; font-size: var(--t-body); }
.node { padding: .9rem 1.1rem; border-radius: 12px; background: #fff; border: 1px solid var(--line); text-align: center; max-width: 22ch; }
.arrow { color: var(--gold); font-size: var(--t-h2); }

.evidence { width: 100%; border-collapse: collapse; font-size: clamp(1rem, 1.35vw, 1.6rem); }
.evidence th, .evidence td { padding: .7rem .8rem; border: 1px solid var(--line); text-align: left; vertical-align: top; line-height: 1.3; }
.evidence th { background: var(--navy); color: #fff; }
.evidence td:first-child { font-weight: 700; }

.steps { display: grid; gap: .7rem; margin: 1rem 0 0; }
.step { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 1rem; padding: .9rem 1.1rem; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); font-size: var(--t-body); line-height: 1.3; }
.step .n { font-size: var(--t-h2); }
.step.weak { border-style: dashed; color: var(--muted); }
.step.weak::after { content: "rejected"; grid-column: 2; font-size: var(--t-label); text-transform: uppercase; letter-spacing: .1em; color: var(--gold); font-weight: 800; }

.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; margin-top: 1.2rem; }
.choice { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .8rem; align-items: start; min-height: 5rem; border: 2px solid var(--line); background: var(--white); border-radius: 14px; padding: .9rem 1rem; text-align: left; font-size: var(--t-body); font-weight: 700; line-height: 1.3; color: var(--navy); }
.choice .n { font-size: var(--t-h2); }
.choice.correct { border-color: var(--gold); background: var(--amber); }
.reveal-bar { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.2rem; }
.reveal-bar, .reveal { display: none; } /* reveals are teacher controls: Present mode only */
.present .reveal-bar { display: flex; } .present .reveal { display: inline-block; }
.reveal { border: 1px solid var(--navy); border-radius: 999px; padding: .55rem 1.1rem; background: var(--white); color: var(--navy); font-weight: 700; cursor: pointer; font-size: var(--t-label); }
.reveal[aria-expanded="true"] { background: var(--navy); color: #fff; }
.revealed { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 14px; background: var(--green); font-size: var(--t-body); line-height: 1.35; }
.revealed[hidden] { display: none; }
.revealed h2 { font-size: var(--t-body); }
/* Keep the answer and follow-up question readable together at board scale. */
.screen[data-layout="diagnostic-decision"] .layout.single { max-width: none; }
.screen[data-layout="diagnostic-decision"] .revealed { margin-top: .6rem; padding: .65rem 1rem; }
.screen[data-layout="diagnostic-decision"] .revealed h2 { margin: 0 0 .35rem; }
.screen[data-layout="diagnostic-decision"] .revealed p { margin: .3rem 0; }

.drawer { padding: 1.2rem; }
.drawer[hidden] { display: none; }
.drawer h2 { margin: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1rem 0; }
.tab { border: 1px solid var(--line); border-radius: 999px; background: var(--white); padding: .45rem .7rem; font-size: .78rem; font-weight: 800; cursor: pointer; }
.tab.active { background: var(--navy); color: #fff; }
.support { font-size: 1.05rem; line-height: 1.5; }
.support h3 { margin: .2rem 0 .5rem; font: 400 1.35rem var(--serif); color: var(--navy); }
.support ul { padding-left: 1.2rem; }

/* Three.js terminal-velocity laboratory. The model stays usable without motion or WebGL. */
.terminal-lab { width: 100%; min-height: 0; }
.terminal-lab-loading { min-height: 28rem; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 16px; background: #dceff5; color: var(--navy); font-weight: 800; }
.terminal-lab-card { position: relative; display: grid; grid-template-rows: minmax(18rem, 1fr) auto auto auto; gap: .55rem; width: 100%; height: min(68vh, 650px); min-height: 34rem; padding: .65rem; border: 1px solid #afc7cf; border-radius: 18px; background: #f7fbfc; box-shadow: 0 18px 48px #18324a14; overflow: hidden; }
.terminal-view { position: relative; min-height: 0; overflow: hidden; border-radius: 13px; background: #dceff5; }
.terminal-view canvas { display: block; width: 100%; height: 100%; }
.terminal-stage-readout { position: absolute; top: .75rem; left: .75rem; display: grid; gap: .12rem; max-width: min(78%, 24rem); padding: .65rem .8rem; border-radius: 12px; background: #fffdf8eb; color: var(--navy); box-shadow: 0 8px 30px #17324d20; backdrop-filter: blur(7px); }
.terminal-stage-readout small { color: var(--gold); font-size: .68rem; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
.terminal-stage-readout strong { font: 500 1.05rem/1.1 var(--serif); }
.terminal-stage-readout span { color: var(--muted); font-size: .76rem; font-weight: 700; }
.terminal-force-key { position: absolute; right: .65rem; bottom: .65rem; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .35rem; }
.terminal-force-key[hidden] { display: none; }
.force-chip { padding: .32rem .52rem; border-radius: 999px; background: #fffdf8e8; color: var(--navy); font-size: .65rem; font-weight: 800; box-shadow: 0 4px 14px #17324d1f; }
.force-chip.weight { border-left: 5px solid #e04f45; }
.force-chip.drag { border-left: 5px solid #158b9f; }
.force-chip.result { border-left: 5px solid #d99518; }
.terminal-stage-tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: .32rem; }
.terminal-stage-tabs[hidden] { display: none; }
.terminal-stage-tabs button, .terminal-controls button { min-height: 2.1rem; border: 1px solid #9eb2bc; border-radius: 9px; background: #fff; color: var(--navy); font: 800 .68rem/1.15 var(--sans); cursor: pointer; }
.terminal-stage-tabs button:hover, .terminal-controls button:hover { border-color: var(--navy); background: #edf4f5; }
.terminal-stage-tabs button.active { border-color: var(--navy); background: var(--navy); color: #fff; }
.terminal-variables { display: grid; grid-template-columns: auto repeat(2, minmax(0, 1fr)); gap: .35rem; align-items: center; }
.terminal-variables[hidden] { display: none; }
.terminal-variables span { color: var(--muted); font-size: .68rem; font-weight: 800; }
.terminal-variables button { min-height: 2.1rem; border: 1px solid #9eb2bc; border-radius: 9px; background: #fff; color: var(--navy); font: 800 .68rem/1.15 var(--sans); cursor: pointer; }
.terminal-variables button.active { border-color: var(--navy); background: var(--navy); color: #fff; }
.terminal-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: .32rem; }
.terminal-controls button { padding: .4rem .35rem; }
.terminal-controls button[aria-pressed="true"], .terminal-controls button[aria-expanded="true"] { border-color: var(--gold); background: #f9edcc; }
.terminal-controls button:disabled { opacity: .7; cursor: default; }
.terminal-controls [data-action="explain"] { display: none; }
.present .terminal-controls [data-action="explain"] { display: block; }
.terminal-caption { margin: 0; color: var(--muted); font-size: .64rem; line-height: 1.25; }
.terminal-explanation { position: absolute; z-index: 3; right: 1.3rem; bottom: 7.2rem; width: min(26rem, 78%); padding: .8rem 1rem; border: 1px solid #9eb2bc; border-radius: 12px; background: #fffdf8f5; color: var(--navy); box-shadow: 0 16px 34px #17324d2b; }
.terminal-explanation[hidden] { display: none; }
.terminal-explanation strong { font-size: .82rem; }
.terminal-explanation p { margin: .35rem 0 0; color: var(--muted); font-size: .76rem; line-height: 1.35; }
.terminal-simple { min-height: 18rem; display: grid; grid-template-columns: minmax(8rem, .72fr) minmax(0, 1.28fr); gap: 1rem; align-items: center; padding: 1rem; border-radius: 13px; background: linear-gradient(145deg, #e3f3f6, #f8eee1); }
.terminal-simple[hidden] { display: none; }
.terminal-simple-diagram { display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; align-items: center; height: 15rem; }
.simple-person { position: relative; width: 2.7rem; height: 4rem; border-radius: 45% 45% 30% 30%; background: var(--navy); }
.simple-person span { position: absolute; left: .75rem; top: -1.35rem; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: #c98562; border: 3px solid #101923; }
.simple-person i { position: absolute; left: -.7rem; top: .65rem; width: 4.1rem; height: .55rem; border-radius: 999px; background: var(--gold); transform: rotate(-6deg); }
.simple-arrow { position: relative; width: .38rem; border-radius: 999px; }
.simple-arrow::after { content: ""; position: absolute; left: 50%; width: 0; height: 0; transform: translateX(-50%); border-left: .58rem solid transparent; border-right: .58rem solid transparent; }
.simple-arrow span { position: absolute; left: 1rem; top: 50%; color: var(--navy); font-size: .72rem; font-weight: 800; transform: translateY(-50%); }
.simple-arrow.drag { align-self: end; background: #158b9f; }
.simple-arrow.drag::after { top: -.55rem; border-bottom: .8rem solid #158b9f; }
.simple-arrow.weight { align-self: start; background: #e04f45; }
.simple-arrow.weight::after { bottom: -.55rem; border-top: .8rem solid #e04f45; }
.terminal-simple-copy { display: grid; gap: .55rem; color: var(--navy); }
.terminal-simple-copy strong { font: 500 1.25rem/1.15 var(--serif); }
.terminal-simple-copy span { padding-bottom: .4rem; border-bottom: 1px solid #afc7cf; font-size: .82rem; font-weight: 700; }
.sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
button:focus-visible, a:focus-visible { outline: 4px solid #2f78cc; outline-offset: 3px; }

.nav { display: grid; grid-template-columns: 54px minmax(0, 1fr) 54px; gap: 1rem; align-items: center; padding: .65rem 1.5rem; background: var(--navy); color: #fff; }
.nav button { width: 48px; height: 48px; border: 1px solid #738195; border-radius: 50%; background: transparent; color: #fff; font-size: 1.4rem; cursor: pointer; }
.nav button:disabled { opacity: .3; }
.navtext { min-width: 0; }
.navtext small { color: #d7c7a4; font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.navtext strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 1.15rem var(--serif); }
.nav .next { justify-self: end; }

/* Present mode: board only */
.present .top { display: none; }
.present .app { grid-template-rows: 5px minmax(0, 1fr) 68px; }
.present .main { padding: 0; grid-template-columns: minmax(0, 1fr); }
.present .stage { border: 0; border-radius: 0; }
.present .drawer { display: none; }
.present .screen { padding: clamp(1.6rem, 3.5vh, 3rem) clamp(3rem, 6vw, 8rem); }

@keyframes in { from { opacity: .2; transform: translateY(10px); } to { opacity: 1; transform: none; } }

@media (max-width: 1279px) {
  :root { --t-body: 1.05rem; --t-lead: 1.15rem; --t-h1: 2.4rem; --t-h2: 1.4rem; --t-label: .78rem; }
  .screen { padding: 1.6rem 2rem; justify-content: flex-start; }
}
@media (max-width: 850px) {
  .main.drawer-open { grid-template-columns: 1fr; }
  .drawer { display: none; }
  .layout.two, .layout.visual-left { grid-template-columns: 1fr; }
  .layout.visual-left > .text { order: 0; }
  .choices { grid-template-columns: 1fr; }
  .top { padding: 0 1rem; }
  .topic { font-size: 1rem; }
  .terminal-lab-card { height: 35rem; }
  .terminal-controls { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* Local access layer: retain Arcadia's palette, figures and layout families. */
.app{height:100dvh;grid-template-rows:auto 5px minmax(0,1fr) auto}
.top{padding:.7rem 1.4rem;flex-wrap:wrap;gap:.7rem;position:relative;z-index:2}

<script>const lesson = {"shape":"practical-enquiry","architecture_version":3,"phases":[{"type":"doNow","layout":"retrieval-sheet","label":"Question","nav":"1","title":"Same word, different quantity?","lead":"Answer in your book before opening review.","minutes":3,"points":[],"tasks":["State the unit of current and draw its meter symbol.","A 0.70 A supply feeds two branches. One carries 0.25 A. Find the other.","Predict whether two identical series lamps each get the full source voltage."],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":"<section class=\"answer-item\"><h3>1. State the unit of current and draw its meter symbol.</h3><p>Current is measured in amperes (A); the ammeter symbol is a circle containing A.</p><p class=\"scheme\"><b>Success criteria:</b> Correct unit and symbol.</p><img src=\"figures/voltmeter.svg\" alt=\"A voltmeter across the lamp terminals, with the main circuit intact.\" style=\"max-width:100%\"><p>One acceptable schematic; component positions may differ if the connections match.</p></section><section class=\"answer-item\"><h3>2. A 0.70 A supply feeds two branches. One carries 0.25 A. Find the other.</h3><p>0.70 − 0.25 = 0.45 A.</p><p class=\"scheme\"><b>Success criteria:</b> Subtraction with A.</p></section><section class=\"answer-item\"><h3>3. Predict whether two identical series lamps each get the full source voltage.</h3><p>Prediction: no; the source voltage is shared between them. The measurement will test this.</p><p class=\"scheme\"><b>Success criteria:</b> A prediction with a reason. Revisit it after the experiment.</p></section>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Recall amperes and A.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>I predict ___ because ___. I will check by ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Why should a current result not simply be copied into a voltage column?</p>"}},"product":"An individual oral, drawn or written response; compare with the model and improve one point."},{"type":"practice","layout":"context-brief","label":"Learning","nav":"2","title":"Today: measure energy per charge","lead":"Read the goals. Choose what your evidence must include.","minutes":2,"points":["LO1 · Describe potential difference as energy transferred per unit charge, measured in volts.","LO2 · Connect and draw a voltmeter across the two points being compared.","LO3 · Use measurements to explain and apply series and parallel voltage rules."],"tasks":["What evidence would show both correct meter use and the voltage pattern?"],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":"<section class=\"answer-item\"><h3>1. What evidence would show both correct meter use and the voltage pattern?</h3><p>Correctly connected voltmeter diagrams plus readings across the source terminals and each lamp in both arrangements.</p><p class=\"scheme\"><b>Success criteria:</b> A method/diagram and comparative readings, not a numerical answer alone.</p></section>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Find the word voltmeter.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>I will show ___ by recording/drawing ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Why are measurements at only one point insufficient for potential difference?</p>"}},"product":"An individual oral, drawn or written response; compare with the model and improve one point."},{"type":"concept","layout":"split-explanation","label":"Build the model","nav":"3","title":"Voltage compares two points","lead":"Explain what one voltage reading means.","minutes":4,"points":["Potential difference, or voltage, is energy transferred per unit charge between two points.","Charge is measured in coulombs (C). A volt is one joule per coulomb: 1 V = 1 J/C.","A 3 V drop across a lamp means it transfers 3 joules for each coulomb passing through. Charge is not used up."],"tasks":["What does 4 V across a lamp mean?","How does voltage differ from current?"],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":"<section class=\"answer-item\"><h3>1. What does 4 V across a lamp mean?</h3><p>The lamp transfers 4 joules of energy for each coulomb of charge passing through it.</p><p class=\"scheme\"><b>Success criteria:</b> Energy per unit charge, with joules and coulombs.</p></section><section class=\"answer-item\"><h3>2. How does voltage differ from current?</h3><p>Voltage is energy transferred per unit charge between points, measured in V. Current is the rate of charge flow, measured in A.</p><p class=\"scheme\"><b>Success criteria:</b> Both meanings and units.</p></section>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Read “per” as “for each”.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>A reading of ___ V means ___ joules for each coulomb.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Two lamps each have 3 V across them. Must they have the same current?</p>"}},"image":"figures/voltmeter.svg","imageAlt":"A voltmeter across the lamp terminals, with the main circuit intact.","imageCaption":"A voltmeter across the lamp terminals, with the main circuit intact. Standard-symbol schematic; component positions may differ in the simulator.","imageKind":"illustration","product":"An individual oral, drawn or written response; compare with the model and improve one point."},{"type":"model","layout":"worked-model","label":"Method","nav":"4","title":"Put the voltmeter across","lead":"Watch the connections. Then draw your meter position.","minutes":5,"points":["Keep the lamp connected in the main circuit. Add a voltmeter in parallel across its two terminals.","To measure the source, connect across the battery terminals. Then measure each lamp the same way.","In Circuit Lab, use meter magnitudes for this comparison. Reversing the meter connections changes the sign."],"tasks":["Draw a voltmeter across a lamp without breaking the lamp path.","What if both voltmeter leads touch the same terminal?"],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":"<section class=\"answer-item\"><h3>1. Draw a voltmeter across a lamp without breaking the lamp path.</h3><p>A circle containing V on a separate measuring branch; one lead goes to each lamp terminal, while the original lamp path stays connected.</p><p class=\"scheme\"><b>Success criteria:</b> Correct V symbol, two distinct terminals, intact lamp path.</p><img src=\"figures/voltmeter.svg\" alt=\"A voltmeter across the lamp terminals, with the main circuit intact.\" style=\"max-width:100%\"><p>One acceptable schematic; component positions may differ if the connections match.</p></section><section class=\"answer-item\"><h3>2. What if both voltmeter leads touch the same terminal?</h3><p>The potential difference between that point and itself is 0 V. It is not a measurement across the lamp.</p><p class=\"scheme\"><b>Success criteria:</b> 0 V and same-point explanation.</p></section>"},"resources":[{"label":"Meter connection guide","href":"L4-lab.html#meter"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Find the two lamp terminals.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>The voltmeter compares ___ with ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Why does inserting a voltmeter instead of a wire stop current in this simulator?</p>"}},"image":"figures/voltmeter.svg","imageAlt":"A voltmeter across the lamp terminals, with the main circuit intact.","imageCaption":"A voltmeter across the lamp terminals, with the main circuit intact. Standard-symbol schematic; component positions may differ in the simulator.","imageKind":"illustration","product":"An individual oral, drawn or written response; compare with the model and improve one point."},{"type":"diagram","layout":"model-stage","label":"Predict","nav":"5","title":"Predict before measuring","lead":"Write a prediction for each arrangement.","minutes":3,"points":["Series: each coulomb passes through both lamps. Their energy transfers add, so their voltage drops add.","Parallel: each branch spans the same pair of supply sides. Each branch has approximately the supply terminal voltage.","Ideal prediction for a 6 V supply and two identical lamps: series ≈3 V each; parallel ≈6 V each."],"tasks":["Why is the series prediction 3 V per identical lamp, rather than 6 V per lamp?","Why is the parallel prediction different?"],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":"<section class=\"answer-item\"><h3>1. Why is the series prediction 3 V per identical lamp, rather than 6 V per lamp?</h3><p>The two equal-resistance lamps share the energy transferred per coulomb. Their voltage drops add to the supply voltage, so ideally 3 + 3 = 6 V.</p><p class=\"scheme\"><b>Success criteria:</b> Energy-per-charge reasoning and equal components.</p></section><section class=\"answer-item\"><h3>2. Why is the parallel prediction different?</h3><p>Each lamp branch connects across the same two supply sides, so each has the whole supply potential difference rather than sharing it along one lamp path.</p><p class=\"scheme\"><b>Success criteria:</b> Same pair of points, not “voltage is split at the junction”.</p></section>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Start from the ideal 6 V supply.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>In ___, each lamp has about ___ V because ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Must all series components share the voltage equally?</p>"}},"image":"figures/series.svg","imageAlt":"Two lamps in one series loop.","imageCaption":"Two lamps in one series loop. Standard-symbol schematic; component positions may differ in the simulator.","imageKind":"illustration","product":"An individual oral, drawn or written response; compare with the model and improve one point."},{"type":"practice","layout":"task-and-criteria","label":"Collect","nav":"6","title":"Measure three voltages: series","lead":"Use the voltage investigation sheet. Record your own values.","minutes":7,"points":["Use the Series circuit example at 6 V with two 10 Ω lamps; keep its switch closed.","Add voltmeters across the source terminals, lamp 1 and lamp 2. Record each magnitude in V.","Add the two lamp readings. Compare the sum with the source-terminal reading."],"tasks":["What pattern do your series readings show?","Why use a voltmeter across the source rather than copying the 6 V setting?"],"criteria":["Meters across the intended terminals.","Three readings labelled in V.","A sum compared with measured supply voltage."],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":"<section class=\"answer-item\"><h3>1. What pattern do your series readings show?</h3><p>For the example circuit: source terminals ≈5.97 V; lamp 1 ≈2.98 V and lamp 2 ≈2.98 V (about 2.9843 V each before rounding). The lamp drops approximately add to the measured supply-terminal voltage.</p><p class=\"scheme\"><b>Success criteria:</b> Three labelled readings in V, correct sum and approximately-equal comparison.</p></section><section class=\"answer-item\"><h3>2. Why use a voltmeter across the source rather than copying the 6 V setting?</h3><p>The setting is the source emf in the model. Internal resistance causes a voltage drop when current flows, so the terminal voltage is slightly lower.</p><p class=\"scheme\"><b>Success criteria:</b> Distinguish source setting from measured terminal voltage.</p></section>"},"resources":[{"label":"Lab guide & recording table","href":"L4-lab.html#investigation"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Use the starter with three meters if needed.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>___ V + ___ V ≈ ___ V. This shows ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Does a tiny difference between the sum and the source reading automatically disprove the rule?</p>"}},"image":"figures/seriesV.svg","imageAlt":"Voltmeters across two series lamps. Also measure across the source in your investigation.","imageCaption":"Voltmeters across two series lamps. Also measure across the source in your investigation. Standard-symbol schematic; component positions may differ in the simulator.","imageKind":"illustration","product":"Own readings with units and an evidence-based explanation."},{"type":"data","layout":"evidence-workbench","label":"Collect","nav":"7","title":"Repeat the comparison: parallel","lead":"Change the arrangement. Keep the component values fixed.","minutes":6,"points":["Choose the Parallel circuit example with 6 V and two 10 Ω lamps. Keep the supply switch closed.","Measure across the source terminals and across each lamp. Record three magnitudes.","Compare each lamp with the source. Do not add the lamp readings as though they were in one path."],"tasks":["What pattern do your parallel readings show?","Why is 5.88 V different from the 6 V source setting?"],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":"<section class=\"answer-item\"><h3>1. What pattern do your parallel readings show?</h3><p>Typical values: source terminals ≈5.88 V and each lamp ≈5.88 V. Each lamp is approximately at the measured supply voltage. The two lamp drops are not added because they are on separate paths.</p><p class=\"scheme\"><b>Success criteria:</b> Three values/units; each branch compared with supply; separate paths explained.</p></section><section class=\"answer-item\"><h3>2. Why is 5.88 V different from the 6 V source setting?</h3><p>The source has internal resistance. The current produces an internal voltage loss, leaving a smaller terminal potential difference; wires add small external losses.</p><p class=\"scheme\"><b>Success criteria:</b> Use the measured terminal value and the model’s assumptions.</p></section>"},"resources":[{"label":"Lab guide & recording table","href":"L4-lab.html#investigation"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Load parallel after saving the series reading.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Lamp ___ has ___ V, which is approximately ___ because ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>If one parallel lamp has twice the resistance, does it get half the voltage?</p>"}},"image":"figures/parallelV.svg","imageAlt":"A voltmeter across one parallel lamp. Measure the other lamp and source in your investigation too.","imageCaption":"A voltmeter across one parallel lamp. Measure the other lamp and source in your investigation too. Standard-symbol schematic; component positions may differ in the simulator.","imageKind":"illustration","product":"Own readings with units and an evidence-based explanation."},{"type":"concept","layout":"split-explanation","label":"Interpret","nav":"8","title":"Turn results into two rules","lead":"Use one row of evidence for each explanation.","minutes":4,"points":["Series: the voltage drops around a complete loop add to the source voltage. Include all components in the path.","Parallel: branches between the same two points have the same potential difference. Small lead losses explain small simulator differences.","Your report needs actual measured values, a relationship and an explanation using energy per charge or endpoints."],"tasks":["Write one evidence-based sentence for series and one for parallel.","Which rule applies to unequal series lamps?"],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":"<section class=\"answer-item\"><h3>1. Write one evidence-based sentence for series and one for parallel.</h3><p>Series example: “About 2.984 V + 2.984 V is close to the 5.970 V supply-terminal reading, so the lamp drops add along the loop.” Parallel: “Both lamps were about 5.88 V, close to the source terminals, because each branch spans the same supply sides.”</p><p class=\"scheme\"><b>Success criteria:</b> Use own readings with units, correct relationship and a reason.</p></section><section class=\"answer-item\"><h3>2. Which rule applies to unequal series lamps?</h3><p>Their voltage drops still add around the loop. They need not be equal.</p><p class=\"scheme\"><b>Success criteria:</b> Preserve the sum rule; reject automatic equal sharing.</p></section>"},"resources":[{"label":"Lab guide & recording table","href":"L4-lab.html#investigation"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Read the series row first.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>My results show ___ because ___; a small difference may be due to ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>A voltmeter reads 6 V across each of two parallel lamps. Why is the supply not necessarily 12 V?</p>"}},"product":"Own readings with units and an evidence-based explanation."},{"type":"hinge","layout":"diagnostic-decision","label":"Check","nav":"9","title":"What does the missing voltmeter show?","lead":"Choose and justify. The values here are ideal.","minutes":3,"points":[],"tasks":["An ideal 6 V source feeds two series lamps. One lamp has 2 V across it. What is across the other?"],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":"<section class=\"answer-item\"><h3>1. An ideal 6 V source feeds two series lamps. One lamp has 2 V across it. What is across the other?</h3><p>B: 4 V. In the ideal circuit the two lamp drops sum to 6 V, so 6 − 2 = 4 V.</p><p class=\"scheme\"><b>Success criteria:</b> 1 mark for B; 1 for sum rule/subtraction with V.</p></section>"},"support":false,"choices":["3 V, because there are two lamps.","4 V, because the drops add to 6 V.","6 V, because each lamp gets all of it.","8 V, because 6 + 2 = 8."],"answer":1,"feedback":"B. The voltage drops add to the source voltage: 2 + 4 = 6 V. Equal sharing is not guaranteed.","recheck":"An ideal 9 V source has two series components. One has a 4 V drop. What is the other drop?","callout":"An ideal 6 V source feeds two series lamps. One lamp has 2 V across it. What is across the other?","product":"An individual choice and scientific justification before review."},{"type":"model","layout":"worked-model","label":"Model","nav":"10","title":"Model a voltage explanation","lead":"Follow the calculation, then complete a different one.","minutes":3,"points":["Worked example, ideal: a 9 V source and two series components. One has 5 V. The other has 9 − 5 = 4 V.","For each coulomb, 5 J is transferred in one component and 4 J in the other: 9 J in total.","Reject 9 ÷ 2 unless equal sharing is justified. Start with the total and known drop."],"tasks":["An ideal 8 V supply feeds two series lamps. One drop is 3 V. Find and explain the other.","Across an ideal 8 V supply, what is the voltage of each of two parallel lamp branches?"],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":"<section class=\"answer-item\"><h3>1. An ideal 8 V supply feeds two series lamps. One drop is 3 V. Find and explain the other.</h3><p>8 − 3 = 5 V. For each coulomb, 3 J + 5 J = 8 J is transferred by the two lamps.</p><p class=\"scheme\"><b>Success criteria:</b> Correct subtraction, V, and energy per charge explanation.</p></section><section class=\"answer-item\"><h3>2. Across an ideal 8 V supply, what is the voltage of each of two parallel lamp branches?</h3><p>8 V across each branch, because both connect across the same supply points.</p><p class=\"scheme\"><b>Success criteria:</b> 8 V each and same-endpoints reason.</p></section>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Write total voltage first.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>___ − ___ = ___ V. Each coulomb transfers ___ J here.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Does 5 V across a lamp mean only 5 joules are transferred during the whole lesson?</p>"}},"product":"An individual oral, drawn or written response; compare with the model and improve one point."},{"type":"practice","layout":"task-and-criteria","label":"Evaluate","nav":"11","title":"Apply the rules on your own","lead":"Use the independent page. Show your working and diagram.","minutes":6,"points":[],"tasks":["Two series components have an ideal supply of 10 V. One drop is 4 V. Calculate the other. (2 marks)","Two parallel lamps are connected across an ideal 10 V supply. State each voltage and explain. (2 marks)","Draw a voltmeter correctly across one lamp. (2 marks)","Explain what 6 V across a lamp means. (2 marks)"],"criteria":["Workings and units.","A correctly connected voltmeter.","Explanations using energy per charge or endpoints."],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":"<section class=\"answer-item\"><h3>1. Two series components have an ideal supply of 10 V. One drop is 4 V. Calculate the other. (2 marks)</h3><p>10 − 4 = 6 V.</p><p class=\"scheme\"><b>Mark scheme (original classroom question):</b> 1 correct subtraction; 1 correct answer with V.</p></section><section class=\"answer-item\"><h3>2. Two parallel lamps are connected across an ideal 10 V supply. State each voltage and explain. (2 marks)</h3><p>10 V across each lamp. Each branch spans the same two supply points.</p><p class=\"scheme\"><b>Mark scheme (original classroom question):</b> 1 both values; 1 same-endpoints explanation.</p></section><section class=\"answer-item\"><h3>3. Draw a voltmeter correctly across one lamp. (2 marks)</h3><p>V in a circle, connected by a separate branch across the two lamp terminals, leaving the lamp’s original path intact.</p><p class=\"scheme\"><b>Mark scheme (original classroom question):</b> 1 symbol; 1 correct across connection with intact lamp path.</p><img src=\"figures/voltmeter.svg\" alt=\"A voltmeter across the lamp terminals, with the main circuit intact.\" style=\"max-width:100%\"><p>One acceptable schematic; component positions may differ if the connections match.</p></section><section class=\"answer-item\"><h3>4. Explain what 6 V across a lamp means. (2 marks)</h3><p>The lamp transfers 6 J of energy per 1 C of charge passing through it.</p><p class=\"scheme\"><b>Mark scheme (original classroom question):</b> 1 energy transfer; 1 correct per-charge value/units. Accept “6 joules for each coulomb”.</p></section>"},"resources":[{"label":"Independent questions & drawing","href":"L4-practice.html#section-11"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Underline series or parallel.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>The rule I use is ___. Therefore ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Two series lamps have unequal drops but equal current. Is that contradictory?</p>"}},"assessment":{"type":"self","label":"Self-assessment","detail":"A voltage comparison table, annotated diagrams and an individual explanation using measured and ideal values."}},{"type":"exit","layout":"quiet-exit","label":"Exit","nav":"12","title":"Finish with one correction","lead":"State the rule, then improve one answer.","minutes":2,"points":[],"tasks":["Where does a voltmeter connect, and what does it measure?","Complete both rules: in series, voltage drops ___. Across parallel branches between the same points, voltage is ___.","What is one change you made after review?"],"review":{"type":"answers","label":"Model answer & mark scheme","title":"Review after your attempt","body":" <script>const differentiation=[{"steps":["Recall amperes and A.","Subtract one branch current from the total.","Make a voltage prediction to test later."],"stem":"I predict ___ because ___. I will check by ___.","record":"Use the symbol reference, large symbols or a pupil-directed scribe. A clear connection matters more than a perfectly straight line.","vocab":[["Predict","State what you expect before testing."]],"question":"Why should a current result not simply be copied into a voltage column?","check":"Current and voltage measure different quantities and use different units. Current is charge flow rate; voltage is energy transferred per unit charge.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. Current and voltage measure different quantities and use different units. Current is charge flow rate; voltage is energy transferred per unit charge."},{"steps":["Find the word voltmeter.","Find compare.","Name a drawing and a set of readings you need."],"stem":"I will show ___ by recording/drawing ___.","record":"Rehearse aloud. Point to the diagram or direct a partner to record your words. Keep the same scientific explanation.","vocab":[["Potential difference","Energy transferred per unit charge between two points."]],"question":"Why are measurements at only one point insufficient for potential difference?","check":"Potential difference compares two points. A voltmeter must connect to both points to measure the energy transferred per unit charge between them.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. Potential difference compares two points. A voltmeter must connect to both points to measure the energy transferred per unit charge between them."},{"steps":["Read “per” as “for each”.","Replace 4 V with 4 J for each C.","Contrast energy per charge with flow per second."],"stem":"A reading of ___ V means ___ joules for each coulomb.","record":"Rehearse aloud. Point to the diagram or direct a partner to record your words. Keep the same scientific explanation.","vocab":[["Joule (J)","Unit of energy."],["Coulomb (C)","Unit of charge."],["Volt (V)","One joule per coulomb."]],"question":"Two lamps each have 3 V across them. Must they have the same current?","check":"No. The current also depends on resistance. The same potential difference can drive different currents through different resistances.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. No. The current also depends on resistance. The same potential difference can drive different currents through different resistances."},{"steps":["Find the two lamp terminals.","Keep both original lamp connections.","Connect one voltmeter lead to each terminal."],"stem":"The voltmeter compares ___ with ___.","record":"Choose builder, connection director or recorder. Use the starter circuit if needed. Read one value at a time; a partner may type your dictated values.","vocab":[["Across","Between the two terminals of a component."],["Parallel connection","A separate branch across the same two points."]],"question":"Why does inserting a voltmeter instead of a wire stop current in this simulator?","check":"The model voltmeter has infinite resistance and carries no current. Inserting it in the main path opens that path. It must be connected across the points while leaving the main path intact.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. The model voltmeter has infinite resistance and carries no current. Inserting it in the main path opens that path. It must be connected across the points while leaving the main path intact."},{"steps":["Start from the ideal 6 V supply.","For series, share between two equal lamps.","For parallel, compare each branch’s endpoints."],"stem":"In ___, each lamp has about ___ V because ___.","record":"Rehearse aloud. Point to the diagram or direct a partner to record your words. Keep the same scientific explanation.","vocab":[["Voltage drop","Potential difference across a component transferring energy."]],"question":"Must all series components share the voltage equally?","check":"No. Their voltage drops add to the supply voltage, but equal sharing applies only to equal resistances in this steady model. A larger resistance has a larger drop at the same series current.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. No. Their voltage drops add to the supply voltage, but equal sharing applies only to equal resistances in this steady model. A larger resistance has a larger drop at the same series current."},{"steps":["Use the starter with three meters if needed.","Read supply, lamp 1, lamp 2 in that order.","Add the two lamp values."],"stem":"___ V + ___ V ≈ ___ V. This shows ___.","record":"Choose builder, connection director or recorder. Use the starter circuit if needed. Read one value at a time; a partner may type your dictated values.","vocab":[["Terminal voltage","Measured voltage between the source terminals."],["≈","Approximately equal to."]],"question":"Does a tiny difference between the sum and the source reading automatically disprove the rule?","check":"No. Rounded display readings and small voltage drops in leads or the closed switch can account for the difference. The sum around the full loop includes all those drops.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. No. Rounded display readings and small voltage drops in leads or the closed switch can account for the difference. The sum around the full loop includes all those drops."},{"steps":["Load parallel after saving the series reading.","Check each meter spans the right two terminals.","Compare each lamp with the supply."],"stem":"Lamp ___ has ___ V, which is approximately ___ because ___.","record":"Choose builder, connection director or recorder. Use the starter circuit if needed. Read one value at a time; a partner may type your dictated values.","vocab":[["Same endpoints","Connected across the same two supply sides."]],"question":"If one parallel lamp has twice the resistance, does it get half the voltage?","check":"No. Across the same two points it has approximately the same voltage. It carries less current. Tiny lead losses can make small differences in the simulator.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. No. Across the same two points it has approximately the same voltage. It carries less current. Tiny lead losses can make small differences in the simulator."},{"steps":["Read the series row first.","Use “add” only for drops along that path.","Read parallel and compare its endpoints."],"stem":"My results show ___ because ___; a small difference may be due to ___.","record":"Rehearse aloud. Point to the diagram or direct a partner to record your words. Keep the same scientific explanation.","vocab":[["Relationship","How measured quantities are connected."]],"question":"A voltmeter reads 6 V across each of two parallel lamps. Why is the supply not necessarily 12 V?","check":"Each measurement spans the same two supply points by a different branch. They are alternative paths, not consecutive 6 V drops along one path.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. Each measurement spans the same two supply points by a different branch. They are alternative paths, not consecutive 6 V drops along one path."},{"steps":["Find the total: 6 V.","Find the known drop: 2 V.","Complete 2 + ___ = 6."],"stem":"The missing voltage is ___ V because ___.","record":"Rehearse aloud. Point to the diagram or direct a partner to record your words. Keep the same scientific explanation.","vocab":[["Ideal","Ignoring small losses in source, wires and switch for this question."]],"question":"Why is “half of 6 V” not a reliable method here?","check":"Equal sharing needs equal resistances. The supplied 2 V drop already shows this is not an equal 3 V + 3 V split. Use the sum rule.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. Equal sharing needs equal resistances. The supplied 2 V drop already shows this is not an equal 3 V + 3 V split. Use the sum rule."},{"steps":["Write total voltage first.","Subtract the known series drop.","Use “joules for each coulomb” to explain."],"stem":"___ − ___ = ___ V. Each coulomb transfers ___ J here.","record":"Rehearse aloud. Point to the diagram or direct a partner to record your words. Keep the same scientific explanation.","vocab":[["Per unit charge","For each coulomb."]],"question":"Does 5 V across a lamp mean only 5 joules are transferred during the whole lesson?","check":"No. It means 5 joules for every coulomb. The total energy depends on how much charge passes, so voltage alone does not specify total energy.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. No. It means 5 joules for every coulomb. The total energy depends on how much charge passes, so voltage alone does not specify total energy."},{"steps":["Underline series or parallel.","Choose the matching rule.","Explain the two points your meter compares."],"stem":"The rule I use is ___. Therefore ___.","record":"Use the symbol reference, large symbols or a pupil-directed scribe. A clear connection matters more than a perfectly straight line.","vocab":[["Calculate","Find a value using a relationship."]],"question":"Two series lamps have unequal drops but equal current. Is that contradictory?","check":"No. Current is equal along one path, while each component can transfer a different amount of energy per coulomb. Different resistances produce different voltage drops.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. No. Current is equal along one path, while each component can transfer a different amount of energy per coulomb. Different resistances produce different voltage drops."},{"steps":["Recall across and volts.","State each voltage rule separately.","Explain one correction."],"stem":"I corrected ___ because ___.","record":"Rehearse aloud. Point to the diagram or direct a partner to record your words. Keep the same scientific explanation.","vocab":[["Review","Compare with a model and make a reasoned improvement."]],"question":"What would you check first if a parallel lamp reads zero volts unexpectedly?","check":"Check whether the circuit is powered/closed and whether the meter really spans that lamp’s two different terminals. Two leads on the same terminal read zero; inspect the actual connections before changing the rule.","prompt":"Make a claim, use the circuit or readings as evidence, then explain the link.","supportAnswer":"Use the model response for this section to check the science. Check whether the circuit is powered/closed and whether the meter really spans that lamp’s two different terminals. Two leads on the same terminal read zero; inspect the actual connections before changing the rule."}];const lessonTools={"resources":[{"label":"Lab guide & re   if(!('speechSynthesis' in window)){note.textContent='Read aloud is unavailable in this browser. Use your device reading tools or ask someone to read with you.';alert(note.textContent);return;}
  const content=stage.innerText+' '+Array.from(stage.querySelectorAll('img')).map(img=>img.alt).join('. ')+(panel?' '+drawer.innerText:'');
  const utterance=new SpeechSynthesisUtterance(content);utterance.lang='en-GB';utterance.rate=.9;
  speechSynthesis.cancel();const run=++speechRun;
  utterance.onend=()=>{if(run===speechRun)stop();};utterance.onerror=()=>{if(run!==speechRun)return;stop();note.textContent='Read aloud stopped. Your device reading tools may also be available.';};
  speaking=true;$('#read-aloud').textContent='Stop reading';$('#read-aloud').setAttribute('aria-pressed','true');speechSynthesis.speak(utterance);
 };
 $('.prev').onclick=()=>navigate(-1);$('.next').onclick=()=>navigate(1);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(panel)closePanel();else stop();return;}if(e.target.closest('input,textarea,select,button,a,summary,[contenteditable],.drawer'))return;if(e.key==='ArrowRight'){e.preventDefault();navigate(1);}if(e.key==='ArrowLeft'){e.preventDefault();navigate(-1);}});
 addEventListener('pagehide',stop);applyPreferences();render(true);
})();
</script>

</body>
</html>
