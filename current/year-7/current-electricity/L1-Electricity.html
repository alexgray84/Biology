<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electricity: build, test and draw | Year 7 Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>/* Edu OS lesson runtime — Arcadia quiet academic canvas.
   Type scale is set for a 1920 × 1080 classroom display (core text ≈ 30–36 px, headings ≥ 60 px,
   labels ≥ 20 px) and collapses for laptops below 1280 px. See LESSON_BUILD_MEMORY.md. */

:root {
  --navy: #14263d; --ink: #223142; --muted: #4f5c6b; --gold: #b78324; --gold-soft: #f2c96d;
  --paper: #faf7f0; --wash: #eee8dc; --white: #fffdf8; --line: #c8c5bc; --blue: #dbeaf0; --green: #dceade; --amber: #fff8e7;
  --serif: Fraunces, Georgia, "Times New Roman", serif;
  --sans: Montserrat, "Helvetica Neue", Arial, sans-serif;
  /* Scale: 1vw at 1920 = 19.2px */
  --t-label: clamp(0.85rem, 1.05vw, 1.3rem);   /* 20 px at 1920 */
  --t-body: clamp(1.1rem, 1.6vw, 2rem);        /* 31 px */
  --t-lead: clamp(1.25rem, 1.75vw, 2.25rem);   /* 34 px */
  --t-h1: clamp(2.6rem, 3.6vw, 4.6rem);        /* 69 px */
  --t-h2: clamp(1.4rem, 1.9vw, 2.4rem);        /* 36 px */
  font-family: var(--sans);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--wash); color: var(--ink); }
button { font: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.skip { position: fixed; top: -5rem; left: 1rem; background: var(--navy); color: #fff; padding: .6rem 1rem; z-index: 99; }
.skip:focus { top: 1rem; }

.app { height: 100vh; display: grid; grid-template-rows: 72px 5px minmax(0, 1fr) 68px; background: var(--paper); }
.top { display: flex; align-items: center; gap: 1.2rem; padding: 0 2rem; border-bottom: 1px solid var(--line); background: var(--white); }
.kicker { font-size: .72rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
.topic { font-family: var(--serif); font-size: 1.35rem; color: var(--navy); }
.topic em { font-style: normal; color: var(--gold); }
.controls { margin-left: auto; display: flex; gap: .5rem; }
.mode, .support-toggle { border: 1px solid var(--line); border-radius: 999px; padding: .55rem .95rem; background: var(--white); font-weight: 700; color: var(--navy); cursor: pointer; }
.progress { background: #e2d8c5; }
.progress span { display: block; width: 0; height: 100%; background: var(--gold); transition: width .25s; }
.main { min-height: 0; padding: 1rem 1.4rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; }
.main.drawer-open { grid-template-columns: minmax(0, 1fr) minmax(300px, 22vw); }
.stage, .drawer { min-height: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--white); overflow: hidden; }
.drawer { overflow: auto; }
/* One screen, no scrolling: the screen is exactly the stage height and every child shrinks to fit. */
.screen { height: 100%; padding: clamp(1.4rem, 3vh, 2.8rem) clamp(2rem, 4.5vw, 5.5rem); display: flex; flex-direction: column; justify-content: center; animation: in .22s ease-out; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .progress span { transition: none; } }

.label { font-size: var(--t-label); letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--gold); }
.assessment-badge { display: inline-block; margin-left: 1rem; padding: .25em .8em; border-radius: 999px; background: var(--navy); color: var(--gold-soft); font-size: var(--t-label); letter-spacing: .08em; text-transform: uppercase; font-weight: 800; }
h1 { max-width: 20ch; margin: .3rem 0 .8rem; font: 400 var(--t-h1) / 1 var(--serif); letter-spacing: -.035em; color: var(--navy); }
h2 { margin: 0 0 .5rem; font: 400 var(--t-h2) / 1.15 var(--serif); color: var(--navy); }
.lead { max-width: 62ch; margin: 0; color: var(--muted); font-size: var(--t-lead); line-height: 1.4; }
.callout { margin: 1.2rem 0 0; padding: 1rem 1.2rem; border-left: 6px solid var(--gold); background: var(--amber); font-size: var(--t-body); font-weight: 600; line-height: 1.35; }
.claim { margin: 1.2rem 0 0; padding: 1.2rem 1.4rem; border: 2px dashed var(--navy); border-radius: 14px; font: 400 var(--t-lead) / 1.35 var(--serif); color: var(--navy); }

/* Layout families */
.layout { display: grid; gap: clamp(1.6rem, 3.5vw, 4rem); align-items: center; min-height: 0; max-height: 100%; }
.layout.two { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); }
.layout.visual-left { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); }
.layout.visual-left > .text { order: 2; }
.layout.single { grid-template-columns: minmax(0, 1fr); max-width: 1400px; }
.layout.stacked { grid-template-columns: minmax(0, 1fr); align-items: start; }
.text { min-width: 0; min-height: 0; }
.aside { min-width: 0; min-height: 0; max-height: 100%; display: flex; flex-direction: column; gap: 1rem; }
.layout.visual-left { height: 100%; }
.layout.visual-left > .aside { height: 100%; justify-content: center; }

.list { display: grid; gap: .55rem; margin: 0; padding: 0; list-style: none; }
.list li { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .8rem; padding: .6rem 0; border-bottom: 1px solid var(--line); font-size: var(--t-body); font-weight: 600; line-height: 1.3; }
.list li:last-child { border-bottom: 0; }
.n { color: var(--gold); font-family: var(--serif); }
.tasks { display: grid; gap: .55rem; margin: 1rem 0 0; counter-reset: task; }
.tasks div { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .8rem; padding: .6rem 0; border-bottom: 1px solid var(--line); font-size: var(--t-body); font-weight: 600; line-height: 1.3; }
.tasks div::before { counter-increment: task; content: counter(task); color: var(--gold); font: 500 var(--t-body) var(--serif); }
.resource-bar { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1rem; }
.resource-button { display: inline-flex; align-items: center; gap: .8rem; width: fit-content; padding: .75rem 1.1rem; border: 2px solid var(--navy); border-radius: 999px; background: var(--navy); color: #fff; font-size: var(--t-label); font-weight: 800; text-decoration: none; }
.resource-button::after { content: "↗"; color: var(--gold-soft); font-size: 1.15em; }
.resource-button small { padding-left: .75rem; border-left: 1px solid #ffffff55; color: var(--gold-soft); font-size: .72em; letter-spacing: .1em; text-transform: uppercase; }
.resource-button:hover { background: #203b5d; }
.feedback-bar { display: none; margin-top: .9rem; padding-top: .8rem; border-top: 1px solid var(--line); align-items: center; gap: .8rem; }
.present .feedback-bar { display: flex; }
.feedback-bar > span { color: var(--muted); font-size: var(--t-label); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.feedback-bar .reveal { margin: 0; }
.criteria { margin: 1rem 0 0; padding: 1rem 1.3rem; background: var(--navy); color: #fff; border-radius: 14px; }
.criteria h2 { margin: 0 0 .4rem; color: var(--gold-soft); }
.criteria p { margin: .4rem 0; font-size: var(--t-body); line-height: 1.3; }
.product { margin: 1rem 0 0; font-size: var(--t-label); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.figure { width: 100%; margin: 0; min-height: 0; display: flex; flex-direction: column; flex: 1 1 auto; }
.figure img, .figure > svg { display: block; width: 100%; min-height: 0; flex: 1 1 auto; max-height: 100%; object-fit: contain; border-radius: 14px; background: var(--white); border: 1px solid var(--line); }
.figure figcaption { flex: 0 0 auto; margin-top: .6rem; color: var(--muted); font-size: var(--t-label); line-height: 1.35; }

/* Labelled model: figure shapes in the middle, HTML labels in side columns, leader lines drawn after layout. */
.model { position: relative; flex: 1 1 auto; min-height: 0; display: grid; font-size: var(--t-body); grid-template-columns: minmax(6em, 8.5em) minmax(0, 1fr) minmax(6em, 8.5em); gap: .6em; align-items: stretch; }
.layout.visual-left:has(.model) { grid-template-columns: minmax(0, 1.7fr) minmax(0, .8fr); }
.model.no-left { grid-template-columns: minmax(0, 1fr) minmax(6em, 8.5em); }
.model.no-right { grid-template-columns: minmax(6em, 8.5em) minmax(0, 1fr); }
.model-figure { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 14px; background: var(--white); padding: .8rem; }
.model-figure svg { width: 100%; height: 100%; max-height: 100%; }
.model-figure .panel-title { position: absolute; top: .6rem; font-size: var(--t-label); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.model-figure .panel-title.left { left: 1rem; } .model-figure .panel-title.right { right: 1rem; }
.model-labels { position: relative; min-width: 0; min-height: 0; }
.model-label { position: absolute; left: 0; right: 0; }
.model-labels.right { text-align: left; } .model-labels.left { text-align: right; }
.model-label { font-size: 1em; font-weight: 700; color: var(--navy); line-height: 1.15; padding: .2em .5em; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); }
.model-label small { display: block; font-size: var(--t-label); font-size: .66em; font-weight: 600; color: var(--muted); }
.model-leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.model-leaders line { stroke: var(--navy); stroke-width: 2.5; }
.model-leaders circle { fill: var(--navy); }
.model-caption { flex: 0 0 auto; margin-top: .5rem; color: var(--muted); font-size: var(--t-label); line-height: 1.35; }
.diagram { width: 100%; min-height: 32vh; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(135deg, #edf3f3, #f6ede1); padding: 1.3rem; }
.flow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .8rem; font-weight: 800; font-size: var(--t-body); }
.node { padding: .9rem 1.1rem; border-radius: 12px; background: #fff; border: 1px solid var(--line); text-align: center; max-width: 22ch; }
.arrow { color: var(--gold); font-size: var(--t-h2); }

.evidence { width: 100%; border-collapse: collapse; font-size: clamp(1rem, 1.35vw, 1.6rem); }
.evidence th, .evidence td { padding: .7rem .8rem; border: 1px solid var(--line); text-align: left; vertical-align: top; line-height: 1.3; }
.evidence th { background: var(--navy); color: #fff; }
.evidence td:first-child { font-weight: 700; }

.steps { display: grid; gap: .7rem; margin: 1rem 0 0; }
.step { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 1rem; padding: .9rem 1.1rem; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); font-size: var(--t-body); line-height: 1.3; }
.step .n { font-size: var(--t-h2); }
.step.weak { border-style: dashed; color: var(--muted); }
.step.weak::after { content: "rejected"; grid-column: 2; font-size: var(--t-label); text-transform: uppercase; letter-spacing: .1em; color: var(--gold); font-weight: 800; }

.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; margin-top: 1.2rem; }
.choice { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .8rem; align-items: start; min-height: 5rem; border: 2px solid var(--line); background: var(--white); border-radius: 14px; padding: .9rem 1rem; text-align: left; font-size: var(--t-body); font-weight: 700; line-height: 1.3; color: var(--navy); }
.choice .n { font-size: var(--t-h2); }
.choice.correct { border-color: var(--gold); background: var(--amber); }
.reveal-bar { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.2rem; }
.reveal-bar, .reveal { display: none; } /* reveals are teacher controls: Present mode only */
.present .reveal-bar { display: flex; } .present .reveal { display: inline-block; }
.reveal { border: 1px solid var(--navy); border-radius: 999px; padding: .55rem 1.1rem; background: var(--white); color: var(--navy); font-weight: 700; cursor: pointer; font-size: var(--t-label); }
.reveal[aria-expanded="true"] { background: var(--navy); color: #fff; }
.revealed { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 14px; background: var(--green); font-size: var(--t-body); line-height: 1.35; }
.revealed[hidden] { display: none; }
.revealed h2 { font-size: var(--t-body); }
/* Keep the answer and follow-up question readable together at board scale. */
.screen[data-layout="diagnostic-decision"] .layout.single { max-width: none; }
.screen[data-layout="diagnostic-decision"] .revealed { margin-top: .6rem; padding: .65rem 1rem; }
.screen[data-layout="diagnostic-decision"] .revealed h2 { margin: 0 0 .35rem; }
.screen[data-layout="diagnostic-decision"] .revealed p { margin: .3rem 0; }

.drawer { padding: 1.2rem; }
.drawer[hidden] { display: none; }
.drawer h2 { margin: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1rem 0; }
.tab { border: 1px solid var(--line); border-radius: 999px; background: var(--white); padding: .45rem .7rem; font-size: .78rem; font-weight: 800; cursor: pointer; }
.tab.active { background: var(--navy); color: #fff; }
.support { font-size: 1.05rem; line-height: 1.5; }
.support h3 { margin: .2rem 0 .5rem; font: 400 1.35rem var(--serif); color: var(--navy); }
.support ul { padding-left: 1.2rem; }

/* Three.js terminal-velocity laboratory. The model stays usable without motion or WebGL. */
.terminal-lab { width: 100%; min-height: 0; }
.terminal-lab-loading { min-height: 28rem; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 16px; background: #dceff5; color: var(--navy); font-weight: 800; }
.terminal-lab-card { position: relative; display: grid; grid-template-rows: minmax(18rem, 1fr) auto auto auto; gap: .55rem; width: 100%; height: min(68vh, 650px); min-height: 34rem; padding: .65rem; border: 1px solid #afc7cf; border-radius: 18px; background: #f7fbfc; box-shadow: 0 18px 48px #18324a14; overflow: hidden; }
.terminal-view { position: relative; min-height: 0; overflow: hidden; border-radius: 13px; background: #dceff5; }
.terminal-view canvas { display: block; width: 100%; height: 100%; }
.terminal-stage-readout { position: absolute; top: .75rem; left: .75rem; display: grid; gap: .12rem; max-width: min(78%, 24rem); padding: .65rem .8rem; border-radius: 12px; background: #fffdf8eb; color: var(--navy); box-shadow: 0 8px 30px #17324d20; backdrop-filter: blur(7px); }
.terminal-stage-readout small { color: var(--gold); font-size: .68rem; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
.terminal-stage-readout strong { font: 500 1.05rem/1.1 var(--serif); }
.terminal-stage-readout span { color: var(--muted); font-size: .76rem; font-weight: 700; }
.terminal-force-key { position: absolute; right: .65rem; bottom: .65rem; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .35rem; }
.terminal-force-key[hidden] { display: none; }
.force-chip { padding: .32rem .52rem; border-radius: 999px; background: #fffdf8e8; color: var(--navy); font-size: .65rem; font-weight: 800; box-shadow: 0 4px 14px #17324d1f; }
.force-chip.weight { border-left: 5px solid #e04f45; }
.force-chip.drag { border-left: 5px solid #158b9f; }
.force-chip.result { border-left: 5px solid #d99518; }
.terminal-stage-tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: .32rem; }
.terminal-stage-tabs[hidden] { display: none; }
.terminal-stage-tabs button, .terminal-controls button { min-height: 2.1rem; border: 1px solid #9eb2bc; border-radius: 9px; background: #fff; color: var(--navy); font: 800 .68rem/1.15 var(--sans); cursor: pointer; }
.terminal-stage-tabs button:hover, .terminal-controls button:hover { border-color: var(--navy); background: #edf4f5; }
.terminal-stage-tabs button.active { border-color: var(--navy); background: var(--navy); color: #fff; }
.terminal-variables { display: grid; grid-template-columns: auto repeat(2, minmax(0, 1fr)); gap: .35rem; align-items: center; }
.terminal-variables[hidden] { display: none; }
.terminal-variables span { color: var(--muted); font-size: .68rem; font-weight: 800; }
.terminal-variables button { min-height: 2.1rem; border: 1px solid #9eb2bc; border-radius: 9px; background: #fff; color: var(--navy); font: 800 .68rem/1.15 var(--sans); cursor: pointer; }
.terminal-variables button.active { border-color: var(--navy); background: var(--navy); color: #fff; }
.terminal-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: .32rem; }
.terminal-controls button { padding: .4rem .35rem; }
.terminal-controls button[aria-pressed="true"], .terminal-controls button[aria-expanded="true"] { border-color: var(--gold); background: #f9edcc; }
.terminal-controls button:disabled { opacity: .7; cursor: default; }
.terminal-controls [data-action="explain"] { display: none; }
.present .terminal-controls [data-action="explain"] { display: block; }
.terminal-caption { margin: 0; color: var(--muted); font-size: .64rem; line-height: 1.25; }
.terminal-explanation { position: absolute; z-index: 3; right: 1.3rem; bottom: 7.2rem; width: min(26rem, 78%); padding: .8rem 1rem; border: 1px solid #9eb2bc; border-radius: 12px; background: #fffdf8f5; color: var(--navy); box-shadow: 0 16px 34px #17324d2b; }
.terminal-explanation[hidden] { display: none; }
.terminal-explanation strong { font-size: .82rem; }
.terminal-explanation p { margin: .35rem 0 0; color: var(--muted); font-size: .76rem; line-height: 1.35; }
.terminal-simple { min-height: 18rem; display: grid; grid-template-columns: minmax(8rem, .72fr) minmax(0, 1.28fr); gap: 1rem; align-items: center; padding: 1rem; border-radius: 13px; background: linear-gradient(145deg, #e3f3f6, #f8eee1); }
.terminal-simple[hidden] { display: none; }
.terminal-simple-diagram { display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; align-items: center; height: 15rem; }
.simple-person { position: relative; width: 2.7rem; height: 4rem; border-radius: 45% 45% 30% 30%; background: var(--navy); }
.simple-person span { position: absolute; left: .75rem; top: -1.35rem; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: #c98562; border: 3px solid #101923; }
.simple-person i { position: absolute; left: -.7rem; top: .65rem; width: 4.1rem; height: .55rem; border-radius: 999px; background: var(--gold); transform: rotate(-6deg); }
.simple-arrow { position: relative; width: .38rem; border-radius: 999px; }
.simple-arrow::after { content: ""; position: absolute; left: 50%; width: 0; height: 0; transform: translateX(-50%); border-left: .58rem solid transparent; border-right: .58rem solid transparent; }
.simple-arrow span { position: absolute; left: 1rem; top: 50%; color: var(--navy); font-size: .72rem; font-weight: 800; transform: translateY(-50%); }
.simple-arrow.drag { align-self: end; background: #158b9f; }
.simple-arrow.drag::after { top: -.55rem; border-bottom: .8rem solid #158b9f; }
.simple-arrow.weight { align-self: start; background: #e04f45; }
.simple-arrow.weight::after { bottom: -.55rem; border-top: .8rem solid #e04f45; }
.terminal-simple-copy { display: grid; gap: .55rem; color: var(--navy); }
.terminal-simple-copy strong { font: 500 1.25rem/1.15 var(--serif); }
.terminal-simple-copy span { padding-bottom: .4rem; border-bottom: 1px solid #afc7cf; font-size: .82rem; font-weight: 700; }
.sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
button:focus-visible, a:focus-visible { outline: 4px solid #2f78cc; outline-offset: 3px; }

.nav { display: grid; grid-template-columns: 54px minmax(0, 1fr) 54px; gap: 1rem; align-items: center; padding: .65rem 1.5rem; background: var(--navy); color: #fff; }
.nav button { width: 48px; height: 48px; border: 1px solid #738195; border-radius: 50%; background: transparent; color: #fff; font-size: 1.4rem; cursor: pointer; }
.nav button:disabled { opacity: .3; }
.navtext { min-width: 0; }
.navtext small { color: #d7c7a4; font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.navtext strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 1.15rem var(--serif); }
.nav .next { justify-self: end; }

/* Present mode: board only */
.present .top { display: none; }
.present .app { grid-template-rows: 5px minmax(0, 1fr) 68px; }
.present .main { padding: 0; grid-template-columns: minmax(0, 1fr); }
.present .stage { border: 0; border-radius: 0; }
.present .drawer { display: none; }
.present .screen { padding: clamp(1.6rem, 3.5vh, 3rem) clamp(3rem, 6vw, 8rem); }

@keyframes in { from { opacity: .2; transform: translateY(10px); } to { opacity: 1; transform: none; } }

@media (max-width: 1279px) {
  :root { --t-body: 1.05rem; --t-lead: 1.15rem; --t-h1: 2.4rem; --t-h2: 1.4rem; --t-label: .78rem; }
  .screen { padding: 1.6rem 2rem; justify-content: flex-start; }
}
@media (max-width: 850px) {
  .main.drawer-open { grid-template-columns: 1fr; }
  .drawer { display: none; }
  .layout.two, .layout.visual-left { grid-template-columns: 1fr; }
  .layout.visual-left > .text { order: 0; }
  .choices { grid-template-columns: 1fr; }
  .top { padding: 0 1rem; }
  .topic { font-size: 1rem; }
  .terminal-lab-card { height: 35rem; }
  .terminal-controls { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* Local access layer: retain Arcadia's palette, figures and layout families. */
.app{height:100dvh;grid-template-rows:auto 5px minmax(0,1fr) auto}
.top{padding:.7rem 1.4rem;flex-wrap:wrap;gap:.7rem;position:relative;z-index:2}

cuit diagram with the cell and lamp supplied, and a space to complete the switch","imageCaption":"Practice diagram: add the missing symbol and connections.","imageKind":"illustration","product":"A completed diagram, with a visible correction after review."},{"type":"hinge","layout":"diagnostic-decision","label":"Check","nav":"10","title":"What changes when the switch opens?","lead":"Choose A, B, C or D on your whiteboard. Add a reason.","minutes":3,"support":false,"choices":["The cell has used up all its energy.","The gap breaks the conducting path.","The lamp uses up the current.","Current can travel only as far as the gap."],"answer":1,"feedback":"B. The open switch makes a gap. The circuit no longer has a complete conducting path, so current stops and the lamp goes out.","recheck":"The switch stays closed, but a wire is removed from the lamp holder. Will the lamp light? Explain using the path.","callout":"A working cell–lamp–switch circuit has one loop. The switch is opened. Why does the lamp go out?","product":"An individual choice and a reason."},{"type":"practice","layout":"task-and-criteria","label":"Apply","nav":"11","title":"Draw a circuit someone else can build","lead":"Work on your own. Draw in your book or on the sheet.","minutes":4,"tasks":["Draw one cell, one lamp and a closed switch in a complete loop.","Explain what happens when the switch opens."],"criteria":["Standard symbols and joined terminals.","Ruled wires with no accidental gaps.","An explanation using the path."],"review":{"type":"mark-scheme","label":"Reveal and review","title":"Check your own diagram","body":"<p>Check one long–short cell pair, a circle-and-cross lamp and joined switch contacts. Every wire joins a terminal. Example: “Opening the switch breaks the path, so current stops and the lamp goes out.”</p>"},"resources":[{"label":"Open your own drawing space","href":"pupil-sheet.html#independent","kind":"worksheet"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose one cell, one lamp and a closed switch.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>My diagram shows ___. When the switch opens, ___ because ___. Draw by hand, use the symbol composer, or direct someone to place the symbols you choose. Explain the connections yourself. Keep your usual access arrangements.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Add a second lamp in the same loop. Can you position a single switch so it turns off only one lamp? Justify your answer using the paths. Consider different switch positions in one loop. Explain whether moving it creates a separate route.</p>"}},"product":"One individually drawn circuit and a causal explanation."},{"type":"exit","layout":"quiet-exit","label":"Exit","nav":"12","title":"Check it. Improve it.","lead":"Use the checklist. Make one improvement to your own work.","minutes":2,"points":["Check your cell, lamp and switch symbols.","Trace the complete path. Repair any gaps.","Explain: why does an open switch stop this lamp lighting?"],"review":{"type":"answers","label":"Reveal and review","title":"Check and improve","body":"<p>An open switch makes a gap in this circuit. There is no complete conducting path, so current stops and the lamp goes out.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose one item from the checklist.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>At first I ___. I changed ___ because ___. This makes my diagram clearer by ___. Point to the correction, make it in the composer, or explain it aloud. A partner may record your exact explanation. You do not need to rewrite the whole answer.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Which error matters more scientifically: a wobbly wire line that clearly joins the terminals, or a neat line that leaves a gap? Evaluate both using the purpose of a circuit diagram. Distinguish presentation from scientific meaning. State what the reader needs to understand.</p>"}},"assessment":{"type":"self","label":"Self-assessment","detail":"One visible correction and an individual exit explanation."}}]};

<script>const differentiation=[{"steps":["Find the cell in the picture.","Choose one other part you recognise.","Say what you predict if a wire is removed."],"vocab":[["Predict","Say what you think will happen."],["Connection","Where two parts are joined."]],"stem":"I predict ___ because ___. The part of the circuit that matters is ___.","record":"Point and explain, or give your prediction aloud before writing one sentence. Your partner can record your words.","question":"The equipment is moved farther apart, but all connections stay the same. Would the lamp’s behaviour change? Justify your prediction.","prompt":"Separate the position of a part from the way it is connected. State what must remain unchanged.","check":"A strong answer says that rearranging the same connected circuit does not itself change the conducting path. No wire is removed or stretched until it disconnects."},{"steps":["Read or listen to the three learning goals.","Choose the one you want to practise most.","Say what work could show that you have learned it."],"vocab":[["Symbol","A standard sign for a component."],["Evidence","Something that supports your explanation."]],"stem":"I want to improve ___. I could show this by ___.","record":"Point to a goal, tick it on the sheet or explain your choice. You do not need to copy all the goals.","question":"Which is stronger evidence of understanding: making a lamp light once, or drawing and explaining its circuit? Evaluate what each can show.","prompt":"Give a strength and a limitation of each. Explain why using both could help.","check":"A working circuit shows successful construction but could be copied or found by trial. An accurate drawing with an explanation shows knowledge of the connections; using both gives better evidence."},{"steps":["Look at one equipment–symbol pair at a time.","Find the long and short lines in the cell symbol.","Match or draw the three symbols beside their names."],"vocab":[["Cell","One source that supplies energy to a circuit."],["Battery","Two or more cells connected together in this lesson."],["Terminal","A connection point on a component."]],"stem":"I chose this symbol because it shows ___. It differs from ___ because ___.","record":"Use the reference strip or the symbol composer. You can choose and place symbols using taps or the keyboard instead of drawing each line by hand.","question":"A drawing of two connected cells uses the symbol for one cell. Is this a harmless simplification? Justify your judgement.","prompt":"Distinguish changing a drawing’s appearance from changing the information it communicates.","check":"The representation loses the distinction between one cell and two. Standard symbols simplify appearance while retaining the relevant component information. Use repeated long–short pairs for the two-cell battery."},{"steps":["Find the lamp’s circle and cross.","Compare the open and closed switch symbols.","Explain what changes at the switch contacts."],"vocab":[["Contact","A conducting part that touches another part to join a path."],["Ammeter","A meter that measures current."],["Ampere (A)","The unit of current."]],"stem":"These symbols are similar because ___. They differ because ___. This matters because ___.","record":"Match or point to the symbols before drawing. Use a larger outline or the symbol composer. Accurate choices and connections matter more than smooth handwriting.","question":"Two diagrams have identical components, but only one shows a gap at the switch. Explain why this small difference can change the whole circuit’s behaviour.","prompt":"Follow the path around both diagrams. Give a cause-and-effect explanation rather than just naming the symbols.","check":"The open contacts interrupt the single conducting loop, so current stops and the lamp goes out. Closed contacts complete the path, assuming the other connections and equipment work."},{"steps":["Start at one cell terminal.","Trace each connection through the components.","Finish at the other cell terminal. Identify any gap."],"vocab":[["Current","The rate of flow of electric charge."],["Voltage","Energy transferred per unit charge; a source provides the drive."],["Complete path","An unbroken conducting route around the circuit."]],"stem":"I traced from ___ through ___ to ___. The path is ___, so ___.","record":"Trace with your eyes or point to the connections. If pointing or tracing is difficult, describe the next component and let a partner follow your instructions.","question":"“The lamp is off, so the cell must have no voltage.” Evaluate this claim. Give another explanation and a way to distinguish between the explanations.","prompt":"Consider a gap and a depleted cell separately. Suggest a check that changes only one thing.","check":"The lamp can be off because the path is open while the cell still has voltage. Checking the switch and connections, or measuring the cell voltage with correctly used equipment later in the unit, helps distinguish the explanations."},{"steps":["Use only the supplied low-voltage kit. Find both lamp-holder terminals.","Say the route: cell, switch, lamp, cell.","Watch your teacher check the connections before the supply is connected."],"vocab":[["Terminal","A point where a lead connects."],["Short circuit","A very low-resistance path that bypasses the intended components."]],"stem":"The next connection should join ___ to ___ because ___.","record":"Be the connection director if small clips are difficult: name and check each terminal while your partner handles the lead. Swap to another accessible role. Ask for help with stiff clips.","question":"A pupil adds a wire directly between the cell terminals to make the route “more complete”. Explain why this is not an improvement.","prompt":"Discuss the route through the lamp and the new bypass. Reason from the diagram only: do not build the bypass.","check":"The added wire bypasses the intended load and can allow excessive current. A useful complete circuit includes the intended components; the source terminals must never be joined directly."},{"steps":["Choose builder and checker roles.","Get your circuit checked, then test the switch open.","Test it closed. Record both observations and swap roles."],"vocab":[["Observation","What you notice during a test."],["Fair comparison","Changing one thing while keeping relevant others the same."]],"stem":"With the switch ___, I observed ___. We kept ___ the same. This supports ___ because ___.","record":"Use the ready-made table, say your observation for a partner to record, or type it. Choose the practical role that lets you contribute safely; do not force small connectors.","question":"The lamp stays off when the switch is closed. Design an ordered set of checks that could identify the problem. Explain why you chose that order.","prompt":"Begin with a visual check. Change one thing at a time so a successful result tells you something.","check":"First check for an unintended gap or a connection to the wrong terminal with the supply disconnected. Then, with teacher assistance, check the lamp or source one at a time. Closed contacts alone do not guarantee a complete working circuit."},{"steps":["Choose the symbols before adding wires.","Place each component with space around it.","Join the terminals, then trace the complete path."],"vocab":[["Circuit diagram","A representation of components and their connections."],["Standard","Shared and recognisable to other people."]],"stem":"I have kept ___ the same as the equipment. I have changed ___ in the drawing because ___.","record":"Use the large step-by-step model or choose symbols in the composer. A ruler guide, larger drawing space or directing a scribe can reduce the motor demand.","question":"Can two diagrams look different but represent the same circuit? Create or describe an example and explain how you would prove they match.","prompt":"Move a component to a different side of the drawn loop without changing its connections. Compare the order and paths.","check":"Different shapes or component positions can represent the same connections. Trace each terminal-to-terminal connection to show that both have the same single loop and components."},{"steps":["Find the two wire ends beside the space.","Choose a closed switch symbol.","Connect both ends and trace the whole loop."],"vocab":[["Complete","With no unintended gaps in this route."],["Bypass","An extra path that goes around a component."]],"stem":"I repaired ___ by ___. This changes the path because ___.","record":"Use the partial frame or complete the circuit in the composer. If a line is difficult to draw, describe precisely which terminals must join.","question":"A switch is drawn open, but an extra wire joins its two terminals. Would opening that switch control the lamp? Explain and suggest a repair.","prompt":"Trace both possible routes at the switch. Think about what the extra wire does. Use a diagram only.","check":"The extra wire bypasses the open contacts, so the switch no longer breaks the lamp’s path. Remove the unintended bypass from the diagram. Discuss as a drawing fault, not a practical build."},{"steps":["Listen to or read the question once.","Compare the explanations one at a time.","Choose a letter and explain what happens to the path."],"vocab":[["Working circuit","A circuit that lights the lamp before the change."],["Explain","Give a reason that connects cause and effect."]],"stem":"I choose ___ because ___. The connection that changes is ___.","record":"Use a letter card, point, type or say the letter and your reason. Reading support remains available. Make your own choice before comparing with a partner.","question":"A pupil says, “Current still flows from the cell until it reaches the open switch.” Analyse this explanation. How would you improve it?","prompt":"Answer the main question first. Then consider whether the single loop still has a complete route back to the source.","check":"Steady current does not keep flowing in part of this broken loop. An open switch interrupts the conducting path, so the current stops throughout the single loop. This question is for discussion after the first response."},{"steps":["Choose one cell, one lamp and a closed switch.","Join them in one complete loop.","Explain what changes when the switch opens."],"vocab":[["Justify","Support an answer with a reason."],["Connection","A link between component terminals."]],"stem":"My diagram shows ___. When the switch opens, ___ because ___.","record":"Draw by hand, use the symbol composer, or direct someone to place the symbols you choose. Explain the connections yourself. Keep your usual access arrangements.","question":"Add a second lamp in the same loop. Can you position a single switch so it turns off only one lamp? Justify your answer using the paths.","prompt":"Consider different switch positions in one loop. Explain whether moving it creates a separate route.","check":"No, not while both lamps remain in the same single loop controlled by that switch. Opening the loop stops current through both. A separate branch would change the arrangement, which is developed in L3."},{"steps":["Choose one item from the checklist.","Find it in your own work.","Make one improvement and explain why it helps."],"vocab":[["Evaluate","Judge using clear reasons or criteria."],["Improve","Make a change that addresses a specific problem."]],"stem":"At first I ___. I changed ___ because ___. This makes my diagram clearer by ___.","record":"Point to the correction, make it in the composer, or explain it aloud. A partner may record your exact explanation. You do not need to rewrite the whole answer.","question":"Which error matters more scientifically: a wobbly wire line that clearly joins the terminals, or a neat line that leaves a gap? Evaluate both using the purpose of a circuit diagram.","prompt":"Distinguish presentation from scientific meaning. State what the reader needs to understand.","check":"A clear but wobbly connection may still communicate the correct circuit. A neat unintended gap changes the circuit meaning. Improve readability where possible, but prioritise correct symbols and connections over motor neatness."}];
/* Local L1 classroom controls. No pupil data or remote services. */
(() => {
 const $=s=>document.querySelector(s), stage=$('.stage'), drawer=$('.drawer');
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let index=0, panel='', focusMode=false, action=0, speaking=false, speechRun=0;
 const preferences={size:'100',space:false,plain:false,paper:'cream',motion:matchMedia('(prefers-reduced-motion: reduce)').matches};
 const list=items=>items?.length?`<ul class="list">${items.map((v,i)=>`<li><span class="n">${i+1}</span><span>${v}</span></li>`).join('')}</ul>`:'';
 const vocab=r=>`<dl>${r.vocab.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`;
 const routesHelp=r=>`<h3>Words to use</h3>${vocab(r)}<h3>Start your explanation</h3><p class="sentence">${esc(r.stem)}</p><h3>Choose how to respond</h3><p>${esc(r.record)}</p>`;
 const links='<div class="access-links"><a href="pupil-sheet.html#reference" target="_blank" rel="noopener">Symbols and recording sheets ↗</a><a href="symbol-composer.html" target="_blank" rel="noopener">Tap / keyboard diagram composer ↗</a></div>';
 const note=document.createElement('span');note.className='sr-only';note.setAttribute('role','status');$('.top').append(note);
 function stop(){speechRun++;if('speechSynthesis' in window) speechSynthesis.cancel();speaking=false;$('#read-aloud').textContent='Read aloud';$('#read-aloud').setAttribute('aria-pressed','false');}
 function applyPreferences(){
  const el=document.documentElement;el.style.fontSize=preferences.size+'%';el.dataset.spacing=preferences.space;el.dataset.plain=preferences.plain;el.dataset.motion=preferences.motion;
  const bg={cream:['#faf7f0','#fffdf8'],white:['#ffffff','#ffffff'],blue:['#eaf3f7','#f1f7fa']}[preferences.paper];
  el.style.setProperty('--paper',bg[0]);el.style.setProperty('--white',bg[1]);
 }
 function panelBody(){const r=differentiation[index],p=lesson.phases[index];
  if(panel==='support')return `<h3>Take it in steps</h3><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${routesHelp(r)}${links}`;
  if(panel==='stretch')return `<p class="thinking-label">Reason · explain · justify</p><h3>Think further</h3><p class="big-question">${esc(r.question)}</p><h3>A way into the question</h3><p>${esc(r.prompt)}</p><p class="sentence">My view is ___ because ___. The connection or evidence that supports it is ___. If ___ changed, then ___.</p><details><summary>Support for this challenge</summary>${routesHelp(r)}${links}</details>`;
  if(panel==='review')return `${p.answer!==undefined?`<h3>Answer: ${'ABCD'[p.answer]}</h3><p>${p.feedback}</p>`:p.review?`<h3>${esc(p.review.title)}</h3>${p.review.body}`:'<p>Ask a pupil to explain a connection or symbol, then compare with the lesson model.</p>'}<details><summary>Discuss the stretch question</summary><p>${esc(r.check)}</p></details>${p.recheck?`<details><summary>Follow-up check</summary><p>${p.recheck}</p></details>`:''}`;
  return `<p>Choose what helps you. These choices stay on as you move through the lesson.</p><label>Text size<select id="text-size">${['100','120','140'].map(v=>`<option value="${v}" ${preferences.size===v?'selected':''}>${v}%</option>`).join('')}</select></label><label class="check-option"><input type="checkbox" id="more-space" ${preferences.space?'checked':''}> More space between words and lines</label><label class="check-option"><input type="checkbox" id="plain-font" ${preferences.plain?'checked':''}> Plain font for all text</label><label>Page colour<select id="page-colour">${[['cream','Warm cream'],['white','White'],['blue','Pale blue']].map(([v,t])=>`<option value="${v}" ${preferences.paper===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="check-option"><input type="checkbox" id="reduce-motion" ${preferences.motion?'checked':''}> Reduce motion</label><p><b>Read aloud</b> reads the section, then the open panel. Press it again to stop. Voices depend on your device.</p><p><b>One step</b> gives one action at a time while keeping the diagram and safety information visible.</p><p>You can point, speak, type or direct a partner where the task allows. Use your usual access arrangements.</p><button id="reset-access">Reset access choices</button>`;
 }
 function paintPanel(moveFocus=false){
  drawer.hidden=!panel;$('.main').classList.toggle('drawer-open',!!panel);
  document.querySelectorAll('[data-panel]').forEach(b=>{b.setAttribute('aria-expanded',String(b.dataset.panel===panel));b.classList.toggle('active',b.dataset.panel===panel);});
  if(!panel)return;
  const title={support:'Support',stretch:'Stretch & challenge',access:'Access choices',review:'Review together'}[panel];
  drawer.innerHTML=`<div class="drawer-heading"><h2 id="panel-title" tabindex="-1">${title}</h2><button id="close-panel" aria-label="Close ${title}">×</button></div><p class="section-context">Section ${index+1} · ${esc(lesson.phases[index].title)}</p>${panelBody()}`;
  drawer.setAttribute('aria-labelledby','panel-title');drawer.scrollTop=0;
  $('#close-panel').onclick=()=>closePanel();
  if(panel==='access'){
   for(const [id,key,event] of [['text-size','size','change'],['more-space','space','change'],['plain-font','plain','change'],['page-colour','paper','change'],['reduce-motion','motion','change']])$('#'+id).addEventListener(event,e=>{stop();preferences[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;applyPreferences();});
   $('#reset-access').onclick=()=>{Object.assign(preferences,{size:'100',space:false,plain:false,paper:'cream',motion:matchMedia('(prefers-reduced-motion: reduce)').matches});applyPreferences();paintPanel(true);};
  }
  if(moveFocus)$('#panel-title').focus({preventScroll:true});
 }
 function closePanel(){const previous=panel;stop();panel='';paintPanel();$(`[data-panel="${previous}"]`)?.focus();}
 function paintStep(){const box=$('#one-step-card'),r=differentiation[index];box.hidden=!focusMode;$('.screen').classList.toggle('one-step-active',focusMode);if(!focusMode)return;
  box.innerHTML=`<div class="step-heading"><b>One step · ${action+1} of ${r.steps.length}</b><span><button id="step-prev" aria-label="Previous instruction" ${action===0?'disabled':''}>←</button><button id="step-next" aria-label="Next instruction" ${action===r.steps.length-1?'disabled':''}>→</button></span></div><p aria-live="polite">${esc(r.steps[action])}</p>`;
  ['prev','next'].forEach(direction=>$('#step-'+direction).onclick=()=>{stop();action+=direction==='next'?1:-1;paintStep();const target=$('#step-'+direction);(target.disabled?$('#step-'+(direction==='next'?'prev':'next')):target).focus();});
 }
 function render(initial=false){stop();const p=lesson.phases[index];
  const figure=p.image?`<figure class="figure"><img src="${esc(p.image)}" alt="${esc(p.imageAlt)}"><figcaption>${esc(p.imageCaption)}</figcaption></figure>`:'';
  const points=list(p.points), criteria=p.criteria?.length?`<aside class="criteria"><h2>Success criteria</h2>${p.criteria.map(s=>`<p>✓ ${s}</p>`).join('')}</aside>`:'';
  const visual=figure||points;const family=({'image-led-decision':'visual-left','visual-first-explanation':'visual-left','model-stage':'visual-left','context-brief':'visual-left','evidence-workbench':'stacked','quiet-exit':'single','diagnostic-decision':'single'}[p.layout]||'two');
  const single=family==='single'||(!visual&&!criteria);
  const choices=p.choices?.length?`<div class="choices">${p.choices.map((s,i)=>`<div class="choice"><span class="n">${'ABCD'[i]}</span><span>${s}</span></div>`).join('')}</div>`:'';
  stage.innerHTML=`<article class="screen"><div class="layout ${single?'single':family}"><div class="text"><div class="label">${esc(p.label)}${p.assessment?`<span class="assessment-badge">${esc(p.assessment.label)}</span>`:''}</div><h1 tabindex="-1">${p.title}</h1><p class="lead">${p.lead||''}</p>${p.callout?`<p class="callout">${p.callout}</p>`:''}<section id="one-step-card" aria-label="Current instruction" hidden></section>${figure?points:''}${choices}${p.tasks?.length?`<div class="tasks">${p.tasks.map(s=>`<div>${s}</div>`).join('')}</div>`:''}${p.resources?.length?`<div class="resource-bar">${p.resources.map(r=>`<a class="resource-button" href="${esc(r.href)}" target="_blank" rel="noopener">${esc(r.label)} ↗</a>`).join('')}</div>`:''}<p class="product">${esc(p.product||p.assessment?.detail||'')}</p>${single?`${figure?'':points}${criteria}`:''}</div>${single?'':`<div class="aside">${visual}${criteria}</div>`}</div></article>`;
  $('.progress span').style.width=((index+1)/lesson.phases.length*100)+'%';$('.navtext').innerHTML=`<small>${index+1} of ${lesson.phases.length} · ${esc(p.label)}</small><strong>${esc(p.title)}</strong>`;
  $('.prev').disabled=index===0;$('.next').disabled=index===lesson.phases.length-1;
  paintStep();paintPanel();stage.scrollTop=0;if(!initial)stage.querySelector('h1').focus({preventScroll:true});
 }
 function navigate(delta){const next=Math.max(0,Math.min(lesson.phases.length-1,index+delta));if(next===index)return;index=next;action=0;if(panel==='review')panel='';render();}
 document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{stop();if(panel===b.dataset.panel){closePanel();return;}panel=b.dataset.panel;paintPanel(true);});
 $('#focus-step').onclick=()=>{stop();focusMode=!focusMode;$('#focus-step').setAttribute('aria-pressed',String(focusMode));paintStep();};
 $('#read-aloud').onclick=()=>{
  if(speaking){stop();return;}
  if(!('speechSynthesis' in window)){note.textContent='Read aloud is unavailable in this browser. Use your device reading tools or ask someone to read with you.';alert(note.textContent);return;}
  const content=stage.innerText+' '+Array.from(stage.querySelectorAll('img')).map(img=>img.alt).join('. ')+(panel?' '+drawer.innerText:'');
  const utterance=new SpeechSynthesisUtterance(content);utterance.lang='en-GB';utterance.rate=.9;
  speechSynthesis.cancel();const run=++speechRun;
  utterance.onend=()=>{if(run===speechRun)stop();};utterance.onerror=()=>{if(run!==speechRun)return;stop();note.textContent='Read aloud stopped. Your device reading tools may also be available.';};
  speaking=true;$('#read-aloud').textContent='Stop reading';$('#read-aloud').setAttribute('aria-pressed','true');speechSynthesis.speak(utterance);
 };
 $('.prev').onclick=()=>navigate(-1);$('.next').onclick=()=>navigate(1);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(panel)closePanel();else stop();return;}if(e.target.closest('input,textarea,select,button,a,summary,[contenteditable],.drawer'))return;if(e.key==='ArrowRight'){e.preventDefault();navigate(1);}if(e.key==='ArrowLeft'){e.preventDefault();navigate(-1);}});
 addEventListener('pagehide',stop);applyPreferences();render(true);
})();
</script>
