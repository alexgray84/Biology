<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Look closely at the plant parts</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="models.css">
</head>
<body>
<main class="model-app">
  <div class="model-head"><h1 id="model-title">Plant parts</h1><span class="model-note">Model · not to scale</span></div>
  <div class="model-stage" id="model-stage">
    <canvas id="model-canvas" aria-label="3D model of a plant part. Use the rotate buttons to turn it."></canvas>
    <svg id="label-lines" aria-hidden="true"></svg><div id="labels" aria-live="off"></div>
    <div id="fallback" hidden><img id="fallback-image" src="models-fallback.svg" alt=""><p id="fallback-text">Use this picture to answer the question.</p></div>
  </div>
  <div class="model-controls" aria-label="Model controls">
    <button type="button" id="rotate-left" aria-label="Rotate model left">Rotate left</button>
    <button type="button" id="rotate-right" aria-label="Rotate model right">Rotate right</button>
    <button type="button" id="reset-view">Reset view</button>
    <button type="button" id="prediction" hidden>I have made my prediction</button>
    <button type="button" id="change-feature" hidden disabled>Remove hooks</button>
    <button type="button" id="open-pod" hidden>Open fruit</button>
  </div>
  <p class="model-status" id="model-status" role="status">Look closely. Use what you can see to explain your answer.</p>
</main>
<script src="three.min.js"></script><script src="flower-geometry.js"></script><script src="static-specimens.js"></script><script src="seed-models.js"></script>
</body>
</html>
