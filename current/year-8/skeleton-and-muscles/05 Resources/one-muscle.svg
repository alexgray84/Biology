<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" role="img" aria-label="One muscle only: the biceps contracts and pulls the forearm through a cord-like tendon about the elbow pivot. No muscle is drawn on the other side, so nothing pulls the bone back."><title>One muscle only: the biceps contracts and pulls the forearm through a cord-like tendon about the elbow pivot. No muscle is drawn on the other side, so nothing pulls the bone back.</title><rect width="700" height="540" rx="10" fill="#fcfaf5"/><g transform="translate(0 30)"><rect x="58" y="295" width="238" height="30" rx="14" fill="#f4ead6" stroke="#7d6a4a" stroke-width="4"/><circle cx="58" cy="310" r="26" fill="#f4ead6" stroke="#7d6a4a" stroke-width="3"/><path d="M294.6 347.9 L431.2 91.0" fill="none" stroke="#7d6a4a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M294.6 347.9 L431.2 91.0" fill="none" stroke="#f4ead6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><circle cx="294.6" cy="347.9" r="10.799999999999999" fill="#f4ead6" stroke="#7d6a4a" stroke-width="3"/><circle cx="431.2" cy="91.0" r="10.799999999999999" fill="#f4ead6" stroke="#7d6a4a" stroke-width="3"/><path d="M294.6 347.9 L431.2 91.0" stroke="#f4ead6" stroke-width="15" stroke-linecap="butt"/><path d="M284.8 311.0 L408.2 78.7" fill="none" stroke="#7d6a4a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M284.8 311.0 L408.2 78.7" fill="none" stroke="#f4ead6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="284.8" cy="311.0" r="9.36" fill="#f4ead6" stroke="#7d6a4a" stroke-width="3"/><circle cx="408.2" cy="78.7" r="9.36" fill="#f4ead6" stroke="#7d6a4a" stroke-width="3"/><path d="M284.8 311.0 L408.2 78.7" stroke="#f4ead6" stroke-width="13" stroke-linecap="butt"/><line x1="64.0" y1="288.0" x2="124.9" y2="249.5" stroke="#5a5f68" stroke-width="7" stroke-linecap="round"/><line x1="268.7" y1="264.8" x2="297.5" y2="267.9" stroke="#5a5f68" stroke-width="7" stroke-linecap="round"/><g transform="translate(124.9 249.5) rotate(6.1)"><path d="M0 0 C36.2 -66 108.5 -66 144.6 0 C108.5 66 36.2 66 0 0 Z" fill="#c9544f" stroke="#7f2a26" stroke-width="3.5"/></g><circle cx="300" cy="310" r="19" fill="#fff" stroke="#182944" stroke-width="5"/><path d="M289 310 H311 M300 299 V321" stroke="#182944" stroke-width="4"/><line x1="252.8" y1="173.2" x2="182.4" y2="186.9" stroke="#7f2a26" stroke-width="8" stroke-linecap="round"/><polygon points="160.8,191.2 185.0,200.3 179.8,173.6" fill="#7f2a26"/></g><text x="40" y="90" font-size="32" font-weight="800" text-anchor="start" fill="#7f2a26" font-family="Montserrat, Segoe UI, sans-serif">biceps contracts: shorter, fatter</text><text x="470" y="370" font-size="30" font-weight="700" text-anchor="start" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">elbow pivot</text><line x1="466" y1="362" x2="322" y2="340" stroke="#182944" stroke-width="2.5"/><text x="30" y="440" font-size="32" font-weight="800" text-anchor="start" fill="#5a5f68" font-family="Montserrat, Segoe UI, sans-serif">tendon: joins muscle to bone</text><line x1="90" y1="412" x2="97" y2="297" stroke="#182944" stroke-width="2.5"/><text x="350" y="508" font-size="30" font-weight="800" text-anchor="middle" fill="#9c2f2a" font-family="Montserrat, Segoe UI, sans-serif">Back again? Nothing is drawn to pull it!</text></svg>