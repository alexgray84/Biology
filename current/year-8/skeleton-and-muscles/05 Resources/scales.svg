<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" role="img" aria-label="Scales on a bench. A hand presses down on the scales and the arrow at the hand is labelled: the scales sense the total downward force at the hand. The display minus the start reading, times ten, gives the force in newtons."><title>Scales on a bench. A hand presses down on the scales and the arrow at the hand is labelled: the scales sense the total downward force at the hand. The display minus the start reading, times ten, gives the force in newtons.</title><rect width="980" height="480" rx="10" fill="#fcfaf5"/><rect x="130" y="440" width="640" height="24" fill="#9b8a6c" stroke="#7d6a4a" stroke-width="3"/><rect x="320" y="372" width="280" height="68" rx="12" fill="#e8e6e0" stroke="#182944" stroke-width="4"/><rect x="386" y="384" width="150" height="44" rx="6" fill="#16323f"/><text x="461" y="417" font-size="32" font-weight="800" text-anchor="middle" fill="#c8f1d6" font-family="Montserrat, Segoe UI, sans-serif">15.5 kg</text><path d="M250 86 L290 230" fill="none" stroke="#7d6a4a" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 86 L290 230" fill="none" stroke="#f4ead6" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="86" r="18.72" fill="#f4ead6" stroke="#7d6a4a" stroke-width="3"/><circle cx="290" cy="230" r="18.72" fill="#f4ead6" stroke="#7d6a4a" stroke-width="3"/><path d="M250 86 L290 230" stroke="#f4ead6" stroke-width="26" stroke-linecap="butt"/><path d="M290 230 L450 348" fill="none" stroke="#7d6a4a" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 230 L450 348" fill="none" stroke="#f4ead6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><circle cx="290" cy="230" r="17.28" fill="#f4ead6" stroke="#7d6a4a" stroke-width="3"/><circle cx="450" cy="348" r="17.28" fill="#f4ead6" stroke="#7d6a4a" stroke-width="3"/><path d="M290 230 L450 348" stroke="#f4ead6" stroke-width="24" stroke-linecap="butt"/><path d="M420 360 L510 360 L520 372 L400 372 Z" fill="#f4ead6" stroke="#7d6a4a" stroke-width="4"/><line x1="462.0" y1="240.0" x2="462.0" y2="328.0" stroke="#9c2f2a" stroke-width="11" stroke-linecap="round"/><polygon points="462.0,356.0 479.4,328.0 444.6,328.0" fill="#9c2f2a"/><text x="486" y="240" font-size="32" font-weight="800" text-anchor="start" fill="#7a2420" font-family="Montserrat, Segoe UI, sans-serif">the scales sense the total</text><text x="486" y="276" font-size="32" font-weight="800" text-anchor="start" fill="#7a2420" font-family="Montserrat, Segoe UI, sans-serif">downward force at the hand</text><text x="530" y="326" font-size="30" font-weight="700" text-anchor="start" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">(15.5 − 0.5) kg × 10</text><text x="530" y="360" font-size="30" font-weight="700" text-anchor="start" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">= about 150 N</text></svg>