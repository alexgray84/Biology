<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 400" role="img" aria-label="Chain: calcium in food is absorbed in the gut, vitamin D helps here, calcium reaches the bones and makes them hard. Vitamin D comes from food and from the skin in sunlight. A lack can cause rickets, where bones soften and bend."><title>Chain: calcium in food is absorbed in the gut, vitamin D helps here, calcium reaches the bones and makes them hard. Vitamin D comes from food and from the skin in sunlight. A lack can cause rickets, where bones soften and bend.</title><rect width="1140" height="400" rx="10" fill="#fcfaf5"/><rect x="10" y="70" width="300" height="120" rx="14" fill="#fff" stroke="#182944" stroke-width="4"/><text x="160.0" y="130.0" font-size="32" font-weight="800" text-anchor="middle" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Calcium</text><text x="160.0" y="168.0" font-size="26" font-weight="600" text-anchor="middle" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">in food</text><line x1="320.0" y1="130.0" x2="380.0" y2="130.0" stroke="#182944" stroke-width="7" stroke-linecap="round"/><polygon points="400.0,130.0 380.0,117.6 380.0,142.4" fill="#182944"/><rect x="410" y="70" width="320" height="120" rx="14" fill="#fff" stroke="#182944" stroke-width="4"/><text x="570.0" y="130.0" font-size="32" font-weight="800" text-anchor="middle" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Absorbed</text><text x="570.0" y="168.0" font-size="26" font-weight="600" text-anchor="middle" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">from the gut into blood</text><line x1="740.0" y1="130.0" x2="800.0" y2="130.0" stroke="#182944" stroke-width="7" stroke-linecap="round"/><polygon points="820.0,130.0 800.0,117.6 800.0,142.4" fill="#182944"/><rect x="830" y="70" width="300" height="120" rx="14" fill="#f4ead6" stroke="#182944" stroke-width="4"/><text x="980.0" y="130.0" font-size="32" font-weight="800" text-anchor="middle" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Hard, strong</text><text x="980.0" y="168.0" font-size="26" font-weight="600" text-anchor="middle" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">growing bones</text><rect x="440" y="238" width="260" height="66" rx="33" fill="#fcf2d8" stroke="#8a5d00" stroke-width="4"/><text x="570" y="282" font-size="34" font-weight="800" text-anchor="middle" fill="#6b4600" font-family="Montserrat, Segoe UI, sans-serif">vitamin D</text><line x1="570.0" y1="236.0" x2="570.0" y2="216.0" stroke="#8a5d00" stroke-width="7" stroke-linecap="round"/><polygon points="570.0,196.0 557.6,216.0 582.4,216.0" fill="#8a5d00"/><text x="600" y="228" font-size="28" font-weight="700" text-anchor="start" fill="#6b4600" font-family="Montserrat, Segoe UI, sans-serif">helps here</text><text x="10" y="278" font-size="28" font-weight="700" text-anchor="start" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Sun on skin</text><line x1="190.0" y1="268.0" x2="414.0" y2="268.0" stroke="#8a5d00" stroke-width="5" stroke-linecap="round"/><polygon points="430.0,268.0 414.0,258.1 414.0,277.9" fill="#8a5d00"/><text x="300" y="252" font-size="26" font-weight="600" text-anchor="middle" fill="#6b4600" font-family="Montserrat, Segoe UI, sans-serif">makes vitamin D</text><rect x="10" y="334" width="1120" height="62" rx="12" fill="#fbeaea" stroke="#9c2f2a" stroke-width="4"/><text x="570" y="376" font-size="32" font-weight="800" text-anchor="middle" fill="#7a2420" font-family="Montserrat, Segoe UI, sans-serif">Lack of calcium or vitamin D: bones soften and bend (rickets)</text></svg>