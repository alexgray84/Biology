00" text-anchor="start" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">cartilage</text><text x="590" y="258" font-size="28" font-weight="600" text-anchor="start" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">on BOTH bone ends</text><line x1="350" y1="308" x2="580" y2="350" stroke="#182944" stroke-width="2.5"/><circle cx="350" cy="308" r="5" fill="#182944"/><text x="590" y="362" font-size="40" font-weight="800" text-anchor="start" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">synovial fluid</text><text x="590" y="398" font-size="28" font-weight="600" text-anchor="start" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">in the capsule, a tough bag</text><line x1="438" y1="300" x2="580" y2="490" stroke="#182944" stroke-width="2.5"/><circle cx="438" cy="300" r="5" fill="#182944"/><text x="590" y="502" font-size="40" font-weight="800" text-anchor="start" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">ligament</text><text x="590" y="538" font-size="28" font-weight="600" text-anchor="start" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">outside the bones, bone to bone</text></svg>