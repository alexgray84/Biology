<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 442" role="img" aria-label="Three types of joint. Hinge at the elbow and knee moves one way, in one arc. Ball-and-socket at the shoulder and hip moves in many directions and rotates. Fixed joints between the skull plates do not move."><title>Three types of joint. Hinge at the elbow and knee moves one way, in one arc. Ball-and-socket at the shoulder and hip moves in many directions and rotates. Fixed joints between the skull plates do not move.</title><rect width="1220" height="442" rx="10" fill="#fcfaf5"/><rect x="70" y="55" width="62" height="120" rx="20" fill="#f4ead6" stroke="#7d6a4a" stroke-width="4"/><g transform="rotate(-48 128 150)"><rect x="114" y="130" width="60" height="150" rx="20" fill="#f4ead6" stroke="#7d6a4a" stroke-width="4"/></g><path d="M285 215 A 130 130 0 0 0 285 65" fill="none" stroke="#182944" stroke-width="7"/><line x1="285.0" y1="90.0" x2="285.3" y2="80.0" stroke="#182944" stroke-width="7" stroke-linecap="round"/><polygon points="286.0,60.0 272.9,79.6 297.7,80.4" fill="#182944"/><line x1="285.0" y1="192.0" x2="285.3" y2="200.0" stroke="#182944" stroke-width="7" stroke-linecap="round"/><polygon points="286.0,220.0 297.7,199.6 272.9,200.5" fill="#182944"/><text x="316" y="148" font-size="26" font-weight="700" text-anchor="start" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">one arc</text><text x="205" y="322" font-size="40" font-weight="800" text-anchor="middle" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Hinge</text><text x="205" y="360" font-size="28" font-weight="700" text-anchor="middle" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">elbow, knee,</text><text x="205" y="394" font-size="28" font-weight="700" text-anchor="middle" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">joints along the finger</text><text x="205" y="430" font-size="26" font-weight="600" text-anchor="middle" fill="#182944" font-family="Montserrat, Sego