<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 365" role="img" aria-label="Bacterial membrane lies inside a chemically non-cellulose wall; cytoplasm, ribosomes and free circular chromosome are labelled; no nucleus or mitochondria"><title>Bacterial membrane lies inside a chemically non-cellulose wall; cytoplasm, ribosomes and free circular chromosome are labelled; no nucleus or mitochondria</title><rect width="100%" height="100%" fill="#fcfaf5"/><g font-family="Montserrat, Segoe UI, sans-serif" fill="#21345b"><g transform="translate(80 30) scale(1.0)"><rect x="35" y="55" width="300" height="170" rx="80" fill="#e4eccf" stroke="#6f8f3a" stroke-width="8"/><rect x="46" y="66" width="278" height="148" rx="69" fill="#f7f3e4" stroke="#c0566b" stroke-width="3"/><path d="M135 115 C100 80 260 80 240 130 C280 170 145 195 130 155 C90 152 100 125 135 115Z" fill="none" stroke="#5d4787" stroke-width="4"/><circle cx="75" cy="130" r="4" fill="#21345b"/><circle cx="86" cy="157" r="4" fill="#21345b"/><circle cx="110" cy="184" r="4" fill="#21345b"/><circle cx="250" cy="178" r="4" fill="#21345b"/><circle cx="277" cy="139" r="4" fill="#21345b"/><circle cx="258" cy="98" r="4" fill="#21345b"/><circle cx="195" cy="194" r="4" fill="#21345b"/></g><text x="240" y="32" font-size="30" font-weight="800" text-anchor="middle">Typical bacterial cell</text><path d="M280 85 L472 72" stroke="#21345b" stroke-width="2" fill="none"/><text x="480" y="80" font-size="28" font-weight="600" text-anchor="start">wall: strengthens the cell</text><path d="M126 154 L472 124" stroke="#21345b" stroke-width="2" fill="none"/><text x="480" y="132" font-size="28" font-weight="600" text-anchor="start">membrane: controls passage</text><path d="M190 214 L472 176" stroke="#21345b" stroke-width="2" fill="none"/><text x="480" y="184" font-size="28" font-weight="600" text-anchor="start">cytoplasm: most reactions</text><path d="M320 160 L472 228" stroke="#21345b" stroke-width="2" fill="none"/><text x="480" y="236" font-size="28" font-weight="600" text-anchor="start">chromosome: carries genes</text><path d="M355 170 L472 280" stroke="#21345b" stroke-width="2" fill="none"/><text x="480" y="288" font-size="28" font-weight="600" text-anchor="start">ribosomes: make proteins</text><text x="460" y="343" font-size="27" font-weight="700" text-anchor="middle">DNA free in cytoplasm; no nucleus or mitochondria.</text></g></svg>