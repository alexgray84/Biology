<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Table of approximate gas percentages in breathed-in and breathed-out air"><title>Table of approximate gas percentages in breathed-in and breathed-out air</title><rect width="760" height="330" fill="#fcfaf5"/><rect x="10" y="10" width="740" height="56" fill="#21345B"/><text x="26" y="47" font-size="24" font-weight="800" fill="#fff" font-family="Montserrat, Segoe UI, sans-serif">Gas</text><text x="290" y="47" font-size="22" font-weight="800" fill="#fff" font-family="Montserrat, Segoe UI, sans-serif">Breathed in (≈ %)</text><text x="515" y="47" font-size="22" font-weight="800" fill="#fff" font-family="Montserrat, Segoe UI, sans-serif">Breathed out (≈ %)</text><rect x="10" y="66" width="740" height="56" fill="#f3efe4" stroke="#cfc7b5"/><text x="26" y="103" font-size="24" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Oxygen</text><text x="290" y="103" font-size="24" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">21</text><text x="515" y="103" font-size="24" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">16</text><rect x="10" y="122" width="740" height="56" fill="#fff" stroke="#cfc7b5"/><text x="26" y="159" font-size="24" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Carbon dioxide</text><text x="290" y="159" font-size="24" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">0.04</text><text x="515" y="159" font-size="24" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">4</text><rect x="10" y="178" width="740" height="56" fill="#f3efe4" stroke="#cfc7b5"/><text x="26" y="215" font-size="24" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Nitrogen</text><text x="290" y="215" font-size="24" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">78</text><text x="515" y="215" font-size="24" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">78</text><rect x="10" y="234" width="740" height="56" fill="#fff" stroke="#cfc7b5"/><text x="26" y="271" font-size="24" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Water vapour</text><text x="290" y="271" font-size="24" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">varies</text><text x="515" y="271" font-size="24" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">usually more</text><text x="14" y="318" font-size="17" fill="#3a5a78" font-family="Montserrat, Segoe UI, sans-serif">Rounded typical values, not this class’s. Not meant to add to 100%.</text></svg>