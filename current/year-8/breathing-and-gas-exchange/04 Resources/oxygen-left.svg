<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Oxygen bars: 21% breathed in; 16% breathed out is still oxygen, and 5 percentage points went into the blood"><title>Oxygen bars: 21% breathed in; 16% breathed out is still oxygen, and 5 percentage points went into the blood</title><rect width="760" height="260" fill="#fcfaf5"/><text x="10" y="70" font-size="22" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">in</text><rect x="70" y="40" width="630" height="44" fill="#2d6cdf" opacity=".85"/><text x="80" y="70" font-size="20" font-weight="700" fill="#fff" font-family="Montserrat, Segoe UI, sans-serif">21% oxygen</text><text x="10" y="160" font-size="22" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">out</text><rect x="70" y="130" width="480" height="44" fill="#2d6cdf" opacity=".85"/><rect x="550" y="130" width="150" height="44" fill="none" stroke="#2d6cdf" stroke-width="3" stroke-dasharray="8 6"/><text x="80" y="160" font-size="20" font-weight="700" fill="#fff" font-family="Montserrat, Segoe UI, sans-serif">16%: still here</text><text x="558" y="210" font-size="18" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">5 points: into the blood</text></svg>