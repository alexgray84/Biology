<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" role="img" aria-label="Bar chart: approximate oxygen 21% in and 16% out; carbon dioxide 0.04% in and 4% out; nitrogen 78% in and out."><title>Bar chart: approximate oxygen 21% in and 16% out; carbon dioxide 0.04% in and 4% out; nitrogen 78% in and out.</title><rect width="760" height="424" fill="#fcfaf5"/><text x="10" y="76" font-size="32" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Oxygen</text><rect x="200" y="38" width="86.1" height="34" fill="#2d6cdf" opacity=".85"/><text x="296.1" y="66" font-size="30" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">in ~21%</text><rect x="200" y="82" width="65.6" height="34" fill="#a8463f" opacity=".85"/><text x="275.6" y="110" font-size="30" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">out ~16%</text><text x="10" y="188" font-size="32" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">CO₂</text><rect x="200" y="150" width="3.0" height="34" fill="#2d6cdf" opacity=".85"/><text x="213.0" y="178" font-size="30" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">in ~0.04%</text><rect x="200" y="194" width="16.4" height="34" fill="#a8463f" opacity=".85"/><text x="226.4" y="222" font-size="30" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">out ~4%</text><text x="10" y="300" font-size="32" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Nitrogen</text><rect x="200" y="262" width="319.8" height="34" fill="#2d6cdf" opacity=".85"/><text x="529.8" y="290" font-size="30" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">in ~78%</text><rect x="200" y="306" width="319.8" height="34" fill="#a8463f" opacity=".85"/><text x="529.8" y="334" font-size="30" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">out ~78%</text><text x="10" y="404" font-size="26" fill="#3a5a78" font-family="Montserrat, Segoe UI, sans-serif">Rounded values. Not every gas in air is listed.</text></svg>