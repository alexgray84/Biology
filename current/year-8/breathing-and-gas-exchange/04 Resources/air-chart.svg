<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Bar chart: approximate oxygen 21% in and 16% out; carbon dioxide 0.04% in and 4% out; nitrogen 78% in and out."><title>Bar chart: approximate oxygen 21% in and 16% out; carbon dioxide 0.04% in and 4% out; nitrogen 78% in and out.</title><rect width="760" height="380" fill="#fcfaf5"/><text x="10" y="70" font-size="22" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Oxygen</text><rect x="200" y="48" width="143.6" height="28" fill="#2d6cdf" opacity=".8"/><text x="351.6" y="69" font-size="20" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">in: ~21%</text><rect x="200" y="86" width="109.4" height="28" fill="#a8463f" opacity=".8"/><text x="317.4" y="107" font-size="20" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">out: ~16%</text><text x="10" y="175" font-size="22" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Carbon dioxide</text><rect x="200" y="153" width="2.0" height="28" fill="#2d6cdf" opacity=".8"/><text x="210.0" y="174" font-size="20" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">in: ~0.04%</text><rect x="200" y="191" width="27.4" height="28" fill="#a8463f" opacity=".8"/><text x="235.4" y="212" font-size="20" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">out: ~4%</text><text x="10" y="280" font-size="22" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Nitrogen</text><rect x="200" y="258" width="533.5" height="28" fill="#2d6cdf" opacity=".8"/><text x="741.5" y="279" font-size="20" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">in: ~78%</text><rect x="200" y="296" width="533.5" height="28" fill="#a8463f" opacity=".8"/><text x="741.5" y="317" font-size="20" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">out: ~78%</text><text x="10" y="372" font-size="16" fill="#3a5a78" font-family="Montserrat, Segoe UI, sans-serif">Rounded typical values. Water vapour varies; the rows are not meant to add to 100%.</text></svg>