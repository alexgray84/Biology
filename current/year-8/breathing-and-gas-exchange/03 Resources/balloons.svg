<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-label="One big sac beside eight sacs half as wide: the same total air, but twice the total surface"><title>One big sac beside eight sacs half as wide: the same total air, but twice the total surface</title><rect width="880" height="330" fill="#fcfaf5"/><circle cx="170" cy="160" r="110" fill="#fbe3e8" stroke="#c76a8a" stroke-width="5"/><text x="170" y="310" text-anchor="middle" font-size="21" font-weight="800" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">one big sac</text><circle cx="434" cy="102" r="55" fill="#fbe3e8" stroke="#c76a8a" stroke-width="4"/><circle cx="546" cy="102" r="55" fill="#fbe3e8" stroke="#c76a8a" stroke-width="4"/><circle cx="658" cy="102" r="55" fill="#fbe3e8" stroke="#c76a8a" stroke-width="4"/><circle cx="770" cy="102" r="55" fill="#fbe3e8" stroke="#c76a8a" stroke-width="4"/><circle cx="434" cy="216" r="55" fill="#fbe3e8" stroke="#c76a8a" stroke-width="4"/><circle cx="546" cy="216" r="55" fill="#fbe3e8" stroke="#c76a8a" stroke-width="4"/><circle cx="658" cy="216" r="55" fill="#fbe3e8" stroke="#c76a8a" stroke-width="4"/><circle cx="770" cy="216" r="55" fill="#fbe3e8" stroke="#c76a8a" stroke-width="4"/><text x="602" y="310" text-anchor="middle" font-size="21" font-weight="800" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">eight small sacs: twice the surface</text><text x="440" y="28" text-anchor="middle" font-size="18" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">Same total air inside each side</text></svg>