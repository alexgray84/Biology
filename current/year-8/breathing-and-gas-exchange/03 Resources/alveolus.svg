<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-label="One alveolus beside a capillary: oxygen moves from air into blood, carbon dioxide from blood into air"><title>One alveolus beside a capillary: oxygen moves from air into blood, carbon dioxide from blood into air</title><rect width="700" height="400" fill="#fcfaf5"/><circle cx="280" cy="210" r="140" fill="#fbe3e8" stroke="#c76a8a" stroke-width="5"/><rect x="250" y="20" width="60" height="70" fill="#efe3cc" stroke="#b8a27c" stroke-width="3"/><defs><linearGradient id="bl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e1423"/><stop offset="1" stop-color="#d8323b"/></linearGradient></defs><rect x="420" y="60" width="40" height="300" rx="18" fill="url(#bl)" opacity=".7"/><path d="M330 170 L445 170" stroke="#2d6cdf" stroke-width="5" marker-end="url(#a)"/><path d="M445 250 L330 250" stroke="#6b6f78" stroke-width="5" marker-end="url(#b)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2d6cdf"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6b6f78"/></marker></defs><text x="200" y="215" font-size="24" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">alveolus (air)</text><text x="470" y="215" font-size="24" font-weight="700" fill="#182944" font-family="Montserrat, Segoe UI, sans-serif">capillary (blood)</text><text x="335" y="160" font-size="20" fill="#2d6cdf" font-family="Montserrat, Segoe UI, sans-serif">O₂</text><text x="335" y="280" font-size="20" fill="#6b6f78" font-family="Montserrat, Segoe UI, sans-serif">CO₂</text></svg>