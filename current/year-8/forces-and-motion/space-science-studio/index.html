const STUDIO_TOPICS={"forces":{"name":"Forces","question":"How can we make a rocket speed up?","idea":"A rocket already moving upwards speeds up when the resultant force is upwards.","facts":["Forces have a size and a direction. Subtract the total downward force from the upward thrust.","In our simplified example, weight is 400 N and drag is 100 N. With 800 N thrust, the resultant is 300 N upwards.","Balanced forces mean no change in velocity. A moving rocket does not instantly stop when forces balance."],"misconception":"More upward thrust than weight alone is not enough: include drag too.","modes":[["800","Speeding up · 800 N thrust"],["500","Constant speed · 500 N thrust"],["300","Slowing down · 300 N thrust"]],"caption":"A simplified vertical rocket already moving upwards. Values are invented for this lesson; forces are treated as constant at this instant.","check":"What happens to its speed if thrust becomes 500 N, with weight and drag unchanged?"},"space":{"name":"Space","question":"Why do we have day and night?","idea":"Earth rotates. A place has day when it faces the Sun and night when it faces away.","facts":["Earth rotates on its axis approximately once every 24 hours.","The Sun lights roughly half of Earth at any one time.","Earth also orbits the Sun, taking about one year. Orbiting is not the cause of the daily day–night cycle."],"misconception":"Night is not caused by the Moon covering the Sun.","modes":[["day","Show a place in daylight"],["night","Show a place at night"]],"caption":"A simplified view from above a pole. The dotted line divides the lit and dark halves; not to scale.","check":"A place is facing away from the Sun. What must Earth do for that place to have daylight again?"},"seasons":{"name":"Seasons","question":"Why are the seasons opposite?","idea":"Earth’s tilted axis makes each hemisphere receive different sunlight and day lengths as Earth orbits the Sun.","facts":["Earth’s axis is tilted about 23.5° from the perpendicular to its orbital plane. It keeps approximately the same direction during a year.","When the Northern Hemisphere tilts towards the Sun, it has more direct sunlight and longer daylight: northern summer. The Southern Hemisphere has winter.","About six months later, the pattern reverses. Seasons are not caused by Earth being closer to or farther from the Sun."],"misconception":"Both hemispheres are on the same Earth at the same distance from the Sun, but can have opposite seasons.","modes":[["both","Compare June and December"],["june","Focus on June"],["december","Focus on December"]],"caption":"Two positions in Earth’s orbit, shown side by side. The axes keep the same direction. Sizes and distances are not to scale.","check":"It is December. Which hemisphere has longer daylight, and why?"}};
const RETRIEVAL=[{"q":"A rocket moves upwards. Thrust is 800 N; weight and drag together are 500 N. What happens?","options":["It speeds up upwards.","It continues at the same speed.","It immediately moves downwards."],"answer":0,"why":"800 − 500 = 300 N upwards. The resultant is in the same direction as its motion, so it speeds up."},{"q":"What mainly causes our daily day–night cycle?","options":["Earth moving closer to the Sun.","Earth rotating on its axis.","The Moon blocking the sunlight."],"answer":1,"why":"Earth rotates approximately once every 24 hours, carrying places into and out of sunlight."},{"q":"When the Northern Hemisphere has summer, why does the Southern Hemisphere have winter?","options":["The whole Earth is farther from the Sun.","The Sun switches on and off.","Earth’s tilted axis gives the hemispheres different sunlight and day lengths."],"answer":2,"why":"The hemisphere tilted towards the Sun gets more direct sunlight and longer daylight. The opposite hemisphere receives less direct sunlight and shorter daylight."}];

function scienceDiagram(topic,mode){const id=++DIAGRAM_ID;return rawScienceDiagram(topic,mode).replaceAll(`arrow-${topic}`,`arrow-${topic}-${id}`);}
function rawScienceDiagram(topic,mode){
 const start=(title,desc)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" role="img" aria-label="${title}. ${desc}" style="font-family:Arial,sans-serif;font-size:18px"><title>${title}</title><desc>${desc}</desc><defs><marker id="arrow-${topic}" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 Z" fill="#363095"/></marker></defs>`;
 if(topic==='forces'){
  const thrust=Number(mode)||800,net=thrust-500,up=thrust/5;
  return start('Forces on a rocket moving upwards',`Thrust ${thrust} newtons upwards; weight 400 newtons and drag 100 newtons downwards. Resultant ${Math.abs(net)} newtons ${net>0?'upwards':net<0?'downwards':'— forces balanced'}.`)+`<text x="310" y="28" text-anchor="middle" fill="#202034">Already moving upwards</text><path d="M283 176 L283 125 L310 83 L337 125 L337 176 Z" fill="#e0dcff" stroke="#363095" stroke-width="2"/><line x1="310" y1="190" x2="310" y2="${190-up}" stroke="#363095" stroke-width="4" marker-end="url(#arrow-forces)"/><text x="345" y="${Math.max(60,185-up/2)}" fill="#202034">Thrust ${thrust} N</text><line x1="257" y1="190" x2="257" y2="270" stroke="#363095" stroke-width="4" marker-end="url(#arrow-forces)"/><text x="230" y="265" text-anchor="end" fill="#202034">Weight 400 N</text><line x1="364" y1="190" x2="364" y2="210" stroke="#363095" stroke-width="4" marker-end="url(#arrow-forces)"/><text x="393" y="225" fill="#202034">Drag 100 N</text><text x="310" y="313" text-anchor="middle" fill="#363095" font-weight="bold">Resultant: ${net===0?'0 N · constant speed':`${Math.abs(net)} N ${net>0?'up · speeding up':'down · slowing down'}`}</text><text x="310" y="341" text-anchor="middle" font-size="15" fill="#595971">Arrow lengths show force sizes; simplified instantaneous model.</text></svg>`;
 }
 if(topic==='space'){
 const day=mode!=='night';
 return start('Day and night as Earth rotates',`Sunlight comes from the left. Left half is lit, right half is dark. The marked place is in ${day?'daylight':'night'}.`)+`<circle cx="73" cy="155" r="48" fill="#f5b839"/><text x="73" y="236" text-anchor="middle">Sun</text>${[110,155,200].map(y=>`<line x1="140" y1="${y}" x2="286" y2="${y}" stroke="#363095" stroke-width="3" marker-end="url(#arrow-space)"/>`).join('')}<text x="215" y="269" text-anchor="middle">Sunlight</text><circle cx="414" cy="155" r="100" fill="#37314e"/><path d="M414 55 A100 100 0 0 0 414 255 Z" fill="#96d8db"/><line x1="414" y1="47" x2="414" y2="263" stroke="#fff" stroke-dasharray="5 5"/><text x="357" y="160" text-anchor="middle">DAY</text><text x="466" y="160" text-anchor="middle" fill="#fff">NIGHT</text><circle cx="${day?365:460}" cy="202" r="8" fill="#f66d3d" stroke="#fff" stroke-width="2"/><text x="414" y="305" text-anchor="middle">Marked place: ${day?'daylight':'night'}</text><text x="310" y="339" text-anchor="middle" font-size="16">Earth rotates approximately once every 24 hours.</text></svg>`;
 }
 const earth=(x,left)=>`<g opacity="${mode==='both'||mode==='june'&&left||mode==='december'&&!left?'1':'.22'}"><circle cx="${x}" cy="157" r="67" fill="#96d8db"/><line x1="${x-35}" y1="238" x2="${x+35}" y2="76" stroke="#363095" stroke-width="3"/><line x1="${x-61}" y1="131" x2="${x+61}" y2="183" stroke="#363095" stroke-width="2" stroke-dasharray="5 4"/><text x="${x+45}" y="77" fill="#363095">N</text><text x="${x-49}" y="251" fill="#363095">S</text><text x="${x}" y="35" text-anchor="middle" font-weight="bold">${left?'June':'December'}</text><text x="${x}" y="287" text-anchor="middle" font-size="17">North: ${left?'summer':'winter'}</text><text x="${x}" y="314" text-anchor="middle" font-size="17">South: ${left?'winter':'summer'}</text></g>`;
 return start('Opposite seasons in June and December','The axes keep the same tilt direction. In June the Northern Hemisphere points towards the Sun; in December it points away.')+`<circle cx="310" cy="157" r="42" fill="#f5b839"/><text x="310" y="222" text-anchor="middle">Sun</text><line x1="261" y1="157" x2="208" y2="157" stroke="#363095" stroke-width="3" marker-end="url(#arrow-seasons)"/><line x1="359" y1="157" x2="412" y2="157" stroke="#363095" stroke-width="3" marker-end="url(#arrow-seasons)"/>${earth(124,true)}${earth(496,false)}<text x="310" y="344" text-anchor="middle" font-size="15">Dashed lines: equators · solid lines: tilted axes · not to scale</text></svg>`;
}

const makeDefault=()=>({schemaVersion:1,step:-1,teamCode:'',topic:'seasons',roleSwapped:false,retrieval:{A:{answers:['','',''],checked:false},B:{answers:['','',''],checked:false}},critique:{claims:['',''],correction:'',revealed:false},plans:Object.fromEntries(Object.keys(STUDIO_TOPICS).map(t=>[t,{prediction:'',explanation:'',diagram:'',check:'',teacherReady:false}])),exhibits:Object.fromEntries(Object.keys(STUDIO_TOPICS).map(t=>[t,blankExhibit(t)])),tests:Object.fromEntries(Object.keys(STUDIO_TOPICS).map(t=>[t,{saved:false,before:blankExhibit(t),audience:'Another pair',understood:'',hesitation:'',suggestion:'',reason:'',recorded:false,after:blankExhibit(t)}])),exit:{A:{science:'',decision:'',career:''},B:{science:'',decision:'',career:''}}});
function cleanState(input){
 if(!input||input.schemaVersion!==1)throw Error('This is not a NEXT Studio version 1 backup.');

 const s=copy(input,makeDefault());s.step=Number.isInteger(s.step)&&s.step>=-1&&s.step<8?s.step:-1;s.topic=Object.hasOwn(STUDIO_TOPICS,s.topic)?s.topic:'seasons';

}

}
function teacherFramework(){return '<h3>Your CREATE challenge</h3><p>Turn science into an explanation that helps a younger audience. Think like a science communicator, test like a learning experience designer, and check claims like a scientific editor.</p><p>Year 8 CREATE is part of THINK → CREATE → INNOVATE → EXPLORE → EXPERIENCE → SPECIALISE → TRANSITION.</p>'; }
function sequenceTable(){return `<table class="teacher-sequence"><thead><tr><th>Time</th><th>Stage</th><th>Checkpoint</th></tr></thead><tbody>${STUDIO_STAGES.map((s,i)=>`<tr><td>${s.range}</td><td>${s.name}</td><td>${STAGE_GUIDANCE[i].done}</td></tr>`).join('')}</tbody></table>`;}
function partnerButtons(){return `<div class="tabs" aria-label="Choose partner">${['A','B'].map(p=>`<button class="tab" data-action="partner" data-partner="${p}" aria-pressed="${partner===p}">Partner ${p}</button>`).join('')}</div>`;}
function stageBody(n){
 const t=state.topic,topic=STUDIO_TOPICS[t],test=state.tests[t];
 if(n===0){const r=state.retrieval[partner];return `<section class="working-page">${partnerButtons()}<h2>Partner ${partner}: your own thinking</h2><p>Choose an answer to each question before checking. Your partner should not coach you.</p>${RETRIEVAL.map((q,i)=>`<fieldset><legend>${i+1}. ${q.q}</legend>${q.options.map((o,j)=>`<label class="choice"><input type="radio" name="retrieve-${partner}-${i}" data-path="retrieval.${partner}.answers.${i}" value="${j}" ${r.answers[i]===String(j)?'checked':''}><span>${o}</span></label>`).join('')}${r.checked?`<p class="feedback ${r.answers[i]===String(q.answer)?'correct':'revisit'}"><strong>${r.answers[i]===String(q.answer)?'Your reasoning agrees.':'Revisit this idea.'}</strong> ${q.why}</p>`:''}</fieldset>`).join('')}${button('Check my answers','check-retrieval')}<p class="small-note partner-status">Partner A: ${state.retrieval.A.checked?'checked':'not yet checked'} · Partner B: ${state.retrieval.B.checked?'checked':'not yet checked'}</p></section>`;}
 if(n===1)return `<section class="working-page"><h2>The commission</h2><p>A Year 6 visitor should leave able to explain one idea, not just remember a fact. You have three screens and one question. Make every word and diagram earn its place.</p>${field('Team code (optional)','teamCode','Use a teacher-assigned code, not your names.',1,30)}<h2>Choose your science question</h2><div class="topic-grid">${Object.entries(STUDIO_TOPICS).map(([id,x])=>`<button class="topic-choice" data-action="topic" data-topic="${id}" aria-pressed="${t===id}"><h3>${x.name}</h3><p>${x.question}</p></button>`).join('')}</div>${reference()}<div class="reveal-box"><h3>Roles with shared responsibility</h3><p><strong>A starts as science editor:</strong> check the cause, vocabulary and diagram. <strong>B starts as experience designer:</strong> build a clear visitor journey. Both partners suggest ideas and explain science. Swap at halfway in Create.</p></div></section>`;
 if(n===2)return `<div class="columns"><section class="working-page"><h2>Inspect the draft</h2><div class="critique-draft"><strong>Deliberately flawed AI-style teaching example</strong><blockquote>“Summer happens because Earth moves closer to the Sun. This warms the whole planet, so both hemispheres have summer at the same time.”</blockquote><p class="small-note">Prepared for this lesson. Not a live AI response or a reliable source.</p></div><p>Which claims need correcting? Select both problems and explain why.</p>${['Seasons happen because Earth moves closer to the Sun.','Both hemispheres have summer at the same time.'].map((c,i)=>`<label class="choice"><input type="checkbox" data-path="critique.claims.${i}" data-string-check="yes" ${state.critique.claims[i]==='yes'?'checked':''}><span>${c}</span></label>`).join('')}</section><section class="working-page">${field('Our corrected explanation','critique.correction','Use: tilted axis, sunlight, daylight and opposite hemispheres.',4)}${button('Reveal the science check','reveal-critique')}${state.critique.revealed?`<div class="reveal-box"><h3>Check your cause, not just your wording</h3><p>Both claims are wrong. Earth’s tilted axis changes sunlight angle and daylight duration in each hemisphere as Earth orbits the Sun. A hemisphere tilted towards the Sun has summer while the other has winter. Changing Earth–Sun distance does not explain the seasons.</p><p>Does your explanation include this chain of causes? Improve it if needed.</p></div>`:''}</section></div>`;
 if(n===3)return `<div class="columns"><section class="working-page"><h2>Your plan: ${topic.name}</h2>${field('1 · What will your visitor predict?',`plans.${t}.prediction`,'Choose a question with two plausible answers.',2)}${field('2 · What is the scientific explanation?',`plans.${t}.explanation`,'Rehearse aloud first. Name the cause, then its effect.',3)}${field('What must your diagram show?',`plans.${t}.diagram`,'Describe the arrows, labels or position you will point out.',2)}${field('3 · How will you check understanding?',`plans.${t}.check`,'Use a new situation, not exactly the prediction question.',2)}${check('Our teacher has checked our scientific explanation.',`plans.${t}.teacherReady`)}</section><section class="working-page"><h2>Before you build</h2><p><strong>Your question:</strong> ${topic.question}</p>${reference()}<h3>Try the visitor test in your head</h3><ul><li>What might a Year 6 pupil think already?</li><li>Which diagram detail explains the cause?</li><li>Could someone answer by understanding, not guessing?</li></ul><p class="small-note">Support: say it before writing. Stretch: change a condition and ask what would happen.</p></section></div>`;
 if(n===4)return `<section class="working-page create-intro"><p><strong>${topic.name}:</strong> ${topic.question}</p>${!state.plans[t].teacherReady?'<p class="feedback revisit">Ask your teacher to check the science in your plan before building.</p>':''}${check('We have swapped roles and device control.','roleSwapped')}<p class="small-note">First half: A edits science, B designs. Second half: reverse. Keep A/B labels for individual answers.</p>${reference()}</section>${editorHTML()}`;
 if(n===5)return `<div class="columns"><section class="working-page"><h2>Run an audience test</h2><ol class="peer-protocol"><li>Save your first version to keep the “before” evidence.</li><li>Swap devices with another pair in Visitor view.</li><li>Listen without rescuing the explanation with hints.</li><li>Return here and record specific observations.</li></ol>${completionHTML()}<div class="button-row">${button(test.saved?'Open visitor view again':'Save first version & open visitor view','visitor')}</div><p class="small-note">${test.saved?'First version saved for this topic. Reopening does not overwrite it.':'Opening the first test saves your current exhibit as the before version.'}</p></section><section class="working-page"><h2>Audience notes</h2><label class="field"><span>Who tested it?</span><select data-path="tests.${t}.audience">${['Another pair','Teacher','Partner rehearsal'].map(x=>`<option ${test.audience===x?'selected':''}>${x}</option>`).join('')}</select></label>${field('What could the visitor explain?',`tests.${t}.understood`,'Record something they said or did, including their final answer.',3)}${field('Where did they hesitate or misunderstand?',`tests.${t}.hesitation`,'Point to the screen, word or diagram detail.',3)}${field('What did they suggest?',`tests.${t}.suggestion`,'Ask what would make it clearer.',2)}</section></div>`;
 if(n===6)return `<section class="working-page create-intro"><h2>Choose your most useful change</h2><p><strong>Audience observation:</strong> ${esc(test.hesitation||'None recorded yet — revisit Test or ask a visitor.')}</p><p><strong>Suggestion:</strong> ${esc(test.suggestion||'No suggestion recorded yet.')}</p>${!test.saved?'<p class="feedback revisit">Complete an audience test first to keep a starting version.</p>':''}${field('Why will your change help the visitor?',`tests.${t}.reason`,'Link it to the observation. Explain the science or learning benefit.',2)}${button('Record this revision','record-revision')}<div id="revisionStatus">${revisionHTML()}</div></section>${editorHTML()}`;
 return `<div class="columns"><section class="working-page">${partnerButtons()}<h2>Partner ${partner}: your exit ticket</h2><p>Write independently. Use your own example or sentence, not a copy of the exhibit.</p>${field('Explain the science you used',`exit.${partner}.science`,`Your topic: ${topic.question} Include the cause and its effect.`,4)}${field('A decision I made, and why it helped',`exit.${partner}.decision`,'Give a specific choice. What evidence supports it?',3)}${field('A career connection I can explain',`exit.${partner}.career`,'Choose science communicator, learning experience designer or scientific editor. Name a skill and when you used it.',3)}</section><section class="working-page"><h2>Keep the evidence</h2><ul class="evidence-list"><li><strong>Team product:</strong> your three-screen exhibit.</li><li><strong>Process:</strong> plan, audience notes and reasoned revision.</li><li><strong>Individual learning:</strong> separate A/B explanations.</li></ul><p class="assessment-note">A polished exhibit is not proof that both partners understand.</p><div id="evidenceStatus">${evidenceStatus()}</div><div class="button-row">${button('Download exhibit','export-exhibit')}${button('Download evidence','export-evidence','',true)}${button('Download backup','backup','',true)}</div><p class="small-note">Nothing is submitted automatically. Follow your teacher’s sharing instructions. Evidence contains both partners’ responses; the exhibit does not.</p></section></div>`;
}
function editorHTML(){const t=state.topic,d=state.exhibits[t],p=`exhibits.${t}`;return `<div class="editor-layout"><section class="working-page"><h2>Your exhibit editor</h2>${field('Exhibit title',p+'.title','Make the idea clear in a few words.',1,90)}<h3>Screen 1 · Predict</h3>${field('Prediction question',p+'.predictQuestion','Give two plausible answers.',2,220)}${field('Answer A',p+'.optionA','',1,150)}${field('Answer B',p+'.optionB','',1,150)}<label class="field"><span>Scientifically correct answer</span><select data-path="${p}.correctOption"><option value="A" ${d.correctOption==='A'?'selected':''}>Answer A</option><option value="B" ${d.correctOption==='B'?'selected':''}>Answer B</option></select></label><h3>Screen 2 · Explain</h3>${field('Your scientific explanation',p+'.explanation','Aim for 2–4 short sentences. Explain why your prediction answer is correct.',4,650)}<label class="field"><span>Diagram view</span><small>Choose the evidence that supports your explanation.</small><select data-path="${p}.diagramMode">${STUDIO_TOPICS[t].modes.map(([v,l])=>`<option value="${v}" ${v===d.diagramMode?'selected':''}>${l}</option>`).join('')}</select></label>${field('Your diagram caption',p+'.caption','Point to a label or arrow and explain what it tells the visitor.',2,350)}<h3>Screen 3 · Check</h3>${field('A new question for the visitor',p+'.checkQuestion',`Possible direction: ${STUDIO_TOPICS[t].check}`,3,300)}${field('The answer, with a reason',p+'.checkAnswer','Visitors should try before revealing this.',3,450)}</section><aside class="preview-pane"><h2>Live visitor preview</h2><p class="caption">Your writing appears here. Try all three screens. Empty fields are labelled, not filled in for you.</p><div id="previewHost">${exhibitHTML()}</div><div id="completionHost">${completionHTML()}</div></aside></div>`;}
function exhibitHTML(d=state.exhibits[state.topic],topic=state.topic,page=previewPage,reveal=previewAnswer,choice=previewChoice){
 const text=(v,p)=>v?esc(v):`<span class="placeholder">${p}</span>`;let body='';
 if(page===0)body=`<h2>${text(d.title,'Your exhibit title')}</h2><p>${text(d.predictQuestion,'Write your prediction question in the editor.')}</p><fieldset><legend>Your prediction</legend>${['A','B'].map(k=>`<label class="choice"><input type="radio" name="visitorPrediction" value="${k}" data-preview-choice="true" ${choice===k?'checked':''}><span>${k}. ${text(d['option'+k],'Add answer '+k+'.')}</span></label>`).join('')}</fieldset><p class="small-note">Choose, then open Explain to check your reasoning.</p>`;
 if(page===1)body=`<h2>Here’s why</h2>${choice?`<p class="feedback"><strong>You chose ${choice}.</strong> The creators’ correct answer is ${d.correctOption}. Check that their explanation supports it.</p>`:''}<p>${text(d.explanation,'Write your scientific explanation in the editor.')}</p>${figure(topic,d.diagramMode)}<p>${text(d.caption,'Write a caption explaining a specific diagram feature.')}</p>`;
 if(page===2)body=`<h2>Can you use the idea?</h2><p>${text(d.checkQuestion,'Write a new question in the editor.')}</p><p class="small-note">Say your answer and reason before revealing the creators’ answer.</p>${button(reveal?'Hide the answer':'Reveal the answer','preview-reveal','',true)}${reveal?`<div class="exhibit-answer"><p>${text(d.checkAnswer,'Write your reasoned answer in the editor.')}</p></div>`:''}`;
 return `<section class="exhibit" aria-label="Three-screen science exhibit"><div class="exhibit-top"><span>${STUDIO_TOPICS[topic].name} · ${['Predict','Explain','Check'][page]}</span><span>${page+1} of 3</span></div><div class="exhibit-body">${body}</div><div class="exhibit-nav">${button('← Back','preview-back',page===0?'disabled':'',true)}${button(page===2?'Back to Predict':'Next →',page===2?'preview-first':'preview-next')}</div></section>`;
}
function missingFields(){const d=state.exhibits[state.topic];return [['title','title'],['predictQuestion','prediction'],['optionA','answer A'],['optionB','answer B'],['explanation','explanation'],['caption','diagram caption'],['checkQuestion','check question'],['checkAnswer','reasoned answer']].filter(([k])=>!d[k].trim()).map(x=>x[1]);}
function completionHTML(){const m=missingFields();return `<p class="feedback ${m.length?'revisit':'correct'}">${m.length?'<strong>Still to write:</strong> '+m.join(', ')+'.':'<strong>All exhibit fields are filled.</strong> Check the science with your teacher.'}</p><p class="small-note">This checks completeness, not scientific accuracy.</p>`;}
function differences(t){return Object.keys(t.before).filter(k=>t.before[k]!==t.after[k]);}
const FIELD_NAMES={title:'Title',predictQuestion:'Prediction question',optionA:'Answer A',optionB:'Answer B',correctOption:'Correct answer',explanation:'Explanation',caption:'Caption',diagramMode:'Diagram view',checkQuestion:'Check question',checkAnswer:'Reasoned answer'};
function revisionHTML(){const t=state.tests[state.topic];return t.recorded?`<div class="reveal-box"><h3>Revision recorded</h3><p>Changed: ${differences(t).map(k=>FIELD_NAMES[k]).join(', ')}.</p><p><strong>Reason:</strong> ${esc(t.reason)}</p><p class="small-note">If you edit again, record again to update this evidence snapshot.</p></div>`:'<p class="small-note">No revision recorded yet. Edit below, explain why, then record.</p>';}
function evidenceStatus(){return `<ul class="status-list">${['A','B'].map(p=>{const done=Object.values(state.exit[p]).every(x=>x.trim());return `<li class="${done?'status-good':'status-missing'}">Partner ${p}: ${done?'all three reflections written':'reflections still to complete'}</li>`;}).join('')}<li>${state.tests[state.topic].recorded?'Revision recorded':'Revision not yet recorded'}</li></ul>`;}
function refreshPreview(){if($('#previewHost'))$('#previewHost').innerHTML=exhibitHTML();if($('#completionHost'))$('#completionHost').innerHTML=completionHTML();}
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.path)return;setPath(el.dataset.path,el.type==='checkbox'?(el.dataset.stringCheck?(el.checked?'yes':''):el.checked):el.value);if(el.dataset.path.startsWith('retrieval.')){state.retrieval[partner].checked=false;$$('.feedback').forEach(x=>x.remove());}save();if(el.dataset.path.startsWith('exhibits.'))refreshPreview();if(el.dataset.path.startsWith('exit.')&&$('#evidenceStatus'))$('#evidenceStatus').innerHTML=evidenceStatus();});
document.addEventListener('change',e=>{if(e.target.dataset.previewChoice)previewChoice=e.target.value;if(e.target.id==='importFile')importBackup(e.target.files[0]);});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.step!==undefined){go(Number(b.dataset.step));return;}const a=b.dataset.action;if(!a)return;
 if(a==='start')go(0);else if(a==='previous')go(state.step-1);else if(a==='next')go(Math.min(7,state.step+1));
 else if(a==='partner'){partner=b.dataset.partner;render();}
 else if(a==='topic'){state.topic=b.dataset.topic;previewPage=0;save();render();toast(STUDIO_TOPICS[state.topic].name+' selected. Other topic drafts are kept.');}
 else if(a==='check-retrieval'){if(state.retrieval[partner].answers.some(x=>x==='')){toast('Answer all three questions before checking.');return;}state.retrieval[partner].checked=true;save();render();}
 else if(a==='reveal-critique'){if(!state.critique.correction.trim()){toast('Write your correction before revealing the science check.');return;}state.critique.revealed=!state.critique.revealed;save();render();}
 else if(['preview-next','preview-back','preview-first'].includes(a)){previewPage=a==='preview-first'?0:Math.max(0,Math.min(2,previewPage+(a==='preview-next'?1:-1)));previewAnswer=false;refreshPreview();$('#previewHost').scrollIntoView({block:'nearest'});}
 else if(a==='preview-reveal'){previewAnswer=!previewAnswer;refreshPreview();}
 else if(a==='visitor'){if(missingFields().length){toast('Complete the exhibit before testing. Return to Create.');return;}const t=state.tests[state.topic];if(!t.saved){t.before={...state.exhibits[state.topic]};t.saved=true;}save();visitor=true;previewPage=0;previewAnswer=false;previewChoice='';render();window.scrollTo(0,0);}
 else if(a==='visitor-close'){visitor=false;render();window.scrollTo(0,0);}
 else if(a==='record-revision'){const t=state.tests[state.topic];if(!t.saved){toast('Save a first version in Test before recording a revision.');return;}if(!t.reason.trim()){toast('Explain why your change helps the visitor.');return;}t.after={...state.exhibits[state.topic]};if(!differences(t).length){toast('Change an exhibit field, then record your revision.');return;}t.recorded=true;save();$('#revisionStatus').innerHTML=revisionHTML();toast('Before, after and reason recorded.');}
 else if(a==='timer'){timerRunning=!timerRunning;if(timerRunning){if(timerLeft===0)resetTimer();timerRunning=true;timerEnd=Date.now()+timerLeft*1000;}renderTimer();}
 else if(a==='timer-reset')resetTimer();else if(a==='save')openSave();else if(a==='backup')download(JSON.stringify(state,null,2),'next-studio-backup.json','application/json');else if(a==='export-exhibit')exportExhibit();else if(a==='export-evidence')download(evidenceDocument(),'next-studio-evidence.html','text/html');else if(a==='reset-confirm')resetConfirmation();else if(a==='reset-now'){state=makeDefault();teacher=false;visitor=false;partner='A';save();$('#utilityDialog').close();go(-1);toast('A new local team workspace is ready.');}
});
$('#homeButton').addEventListener('click',()=>go(-1));$('#teacherButton').addEventListener('click',()=>{teacher=!teacher;render();toast(teacher?'Teacher projector view. Pair work stays on each device.':'Pupil workspace restored.');});$('#saveButton').addEventListener('click',openSave);$('#closeDialog').addEventListener('click',()=>$('#utilityDialog').close());$('#aboutButton').addEventListener('click',()=>dialog('About NEXT Studio',`<p>A 50-minute Year 8 CREATE pilot, following forces, space and seasons. New innovation branding; not an Arcadia brand template.</p>${teacherFramework()}<h3>Science sources</h3>${sourceLinks()}<p>Science diagrams are authored teaching models. Decorative imagery was created with Higgsfield; design used Impeccable. No live AI is used by this lesson.</p><p>No analytics, accounts, automatic submission or cloud sync.</p>`));
function dialog(title,body){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;if(!$('#utilityDialog').open)$('#utilityDialog').showModal();}
function openSave(){dialog('Save, export or resume',`<p><strong>${storageOK?'Your work is saved in this browser on this device.':'Browser saving is unavailable.'}</strong> Downloads are your reliable backup. Private browsing, clearing data, moving the file or using another browser may lose local progress.</p><div class="button-row">${button('Download backup','backup')}${button('Download exhibit','export-exhibit','',true)}${button('Download evidence','export-evidence','',true)}</div><h3>Resume from a backup</h3><p class="small-note">Opening a backup replaces this workspace after confirmation. Download the current backup first if you need to keep it.</p><label class="field"><span>Choose a NEXT Studio backup (.json)</span><input id="importFile" type="file" accept=".json,application/json"></label><p id="importStatus" role="status"></p><hr><h3>Start a different team</h3><p>Download this team’s work first. A fresh workspace clears only this lesson’s local progress.</p>${button('Start a new team…','reset-confirm','',true)}`);}
async function importBackup(file){if(!file)return;try{if(file.size>1000000)throw Error('Choose a NEXT Studio backup under 1 MB.');const incoming=cleanState(JSON.parse(await file.text()));if(!confirm('Replace this lesson’s local workspace with this backup? Download your current backup first if needed.')){$('#importStatus').textContent='Import cancelled. Work is unchanged.';return;}state=incoming;visitor=false;teacher=false;save();$('#utilityDialog').close();resetTimer();render();toast('Backup opened. Your lesson work has been restored.');}catch(e){$('#importStatus').textContent='Could not open this backup. '+(e instanceof SyntaxError?'Choose a valid NEXT Studio JSON file.':e.message);}}
function resetConfirmation(){dialog('Keep this team’s work first',`<p>This clears only the current lesson workspace in this browser, not downloaded files. Download a backup first.</p><div class="button-row">${button('Download backup','backup')}${button('Clear workspace & start new team','reset-now','',true)}</div>`);}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast(name+' download requested. Check your browser’s downloads.');}
function sourceLinks(){return `<ul>${SOURCES.map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noopener noreferrer">${name}</a></li>`).join('')}</ul>`;}
resetTimer();render();if(!loadProblem)save();
</script><script>const EXPORT_CSS=`*{box-sizing:border-box}body{font:18px/1.55 Arial,sans-serif;color:#202034;background:#f0eff9;margin:0;padding:24px}main{max-width:900px;margin:auto;background:white;padding:36px;border-radius:14px}h1,h2,h3{line-height:1.15;color:#363095}h1{font-size:38px}h2{margin-top:28px}p,li{max-width:75ch}p{white-space:pre-wrap}button{font:inherit;padding:12px 20px;background:#363095;color:white;border:0;border-radius:9px;cursor:pointer;min-height:44px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #df4716;outline-offset:4px}button:disabled{opacity:.4;cursor:default}nav{display:flex;justify-content:space-between;gap:16px;margin-top:24px}svg{width:100%;height:auto}figure{background:#f5f4fb;padding:16px;margin:20px 0;border-radius:10px}figcaption,.small-note{font-size:14px;color:#595971}.choice{display:block;padding:12px;border:1px solid #b6b1d0;border-radius:8px;margin:10px 0}.answer{padding:18px;background:#eeebfb;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #ccc;vertical-align:top}.record{border-top:1px solid #ccc;padding:14px 0}.warning{padding:14px;background:#fff0e8}a{color:#363095}.print-button{margin-bottom:20px}@media(max-width:600px){body{padding:10px}main{padding:22px}h1{font-size:30px}}@media print{body{background:white;padding:0;font-size:11pt}main{padding:0;max-width:none}button,nav{display:none!important}.record,figure{break-inside:avoid}h1,h2,h3{break-after:avoid}a{color:inherit}section[hidden]{display:block!important}}`;
function htmlDocument(title,body,script=''){return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>${EXPORT_CSS}</style></head><body><main>${body}</main>${script?'<script>'+script+'<\/script>':''}</body></html>`;}
function exportExhibit(){
 if(missingFields().length){toast('Complete all exhibit fields before downloading. Return to Create.');return;}
 const d=state.exhibits[state.topic],t=state.topic;
 const body=`<p class="small-note">NEXT Studio · Student-created science exhibit</p><h1>${esc(d.title)}</h1><p id="pageLabel">Screen 1 of 3 · Predict</p><section id="screen0"><h2>${esc(d.predictQuestion)}</h2><fieldset><legend>Your prediction</legend>${['A','B'].map(k=>`<label class="choice"><input type="radio" name="prediction" value="${k}"> ${k}. ${esc(d['option'+k])}</label>`).join('')}</fieldset><p>Choose, then open Explain to check your reasoning.</p></section><section id="screen1" hidden><h2>Here’s why</h2><p id="choiceFeedback"></p><p>${esc(d.explanation)}</p>${figure(t,d.diagramMode)}<p>${esc(d.caption)}</p></section><section id="screen2" hidden><h2>${esc(d.checkQuestion)}</h2><p>Say your answer and reason before revealing it.</p><button id="reveal">Reveal the answer</button><div id="answer" class="answer" hidden><p>${esc(d.checkAnswer)}</p></div></section><nav><button id="back" disabled>Back</button><button id="next">Next</button></nav><p class="small-note">Created by a pupil team. This is their explanation, not an automatically verified answer.</p>`;
 const script=`let page=0;const labels=['Predict','Explain','Check'];function show(){for(let i=0;i<3;i++)document.getElementById('screen'+i).hidden=i!==page;document.getElementById('pageLabel').textContent='Screen '+(page+1)+' of 3 · '+labels[page];document.getElementById('back').disabled=page===0;document.getElementById('next').textContent=page===2?'Back to Predict':'Next';document.getElementById('answer').hidden=true;document.getElementById('reveal').textContent='Reveal the answer';const chosen=document.querySelector('input[name=prediction]:checked');document.getElementById('choiceFeedback').textContent=(chosen?'You chose '+chosen.value+'. ':'')+'The creators’ correct answer is ${d.correctOption}. Does their explanation support it?';document.getElementById('pageLabel').setAttribute('tabindex','-1');document.getElementById('pageLabel').focus();}document.getElementById('next').onclick=()=>{page=(page+1)%3;show()};document.getElementById('back').onclick=()=>{page=Math.max(0,page-1);show()};document.getElementById('reveal').onclick=()=>{const a=document.getElementById('answer');a.hidden=!a.hidden;document.getElementById('reveal').textContent=a.hidden?'Reveal the answer':'Hide the answer'};`;
 download(htmlDocument(d.title,body,script),'next-studio-exhibit.html','text/html');
}
function evidenceDocument(){
 const t=state.topic,test=state.tests[t],d=state.exhibits[t];
 const labels={...FIELD_NAMES,prediction:'Prediction plan',diagram:'Diagram plan',check:'Check plan',teacherReady:'Teacher science check',audience:'Test audience',understood:'What the visitor understood',hesitation:'Hesitation / misconception',suggestion:'Visitor suggestion',science:'My scientific explanation',decision:'My decision and reason',career:'My career connection'};
 const entries=obj=>Object.entries(obj).map(([k,v])=>`<div class="record"><strong>${esc(labels[k]||k)}</strong><p>${esc(typeof v==='boolean'?(v?'Yes':'No'):v||'Not recorded')}</p></div>`).join('');
 const pair=p=>`<h3>Partner ${p}</h3>${RETRIEVAL.map((q,i)=>`<p><strong>${esc(q.q)}</strong><br>${esc(state.retrieval[p].answers[i]!==''?q.options[Number(state.retrieval[p].answers[i])]:'Not answered')}</p>`).join('')}`;
 return htmlDocument('NEXT Studio · Evidence record',`<button class="print-button" onclick="window.print()">Print / save as PDF</button><h1>Science Studio evidence</h1><p>Team code: ${esc(state.teamCode||'Not provided')} · Topic: ${STUDIO_TOPICS[t].name}<br>Saved: ${new Date().toLocaleString('en-GB')}</p><p class="warning">Contains pupil learning evidence. Share only through the teacher’s approved route. A completed field is not a verified scientific judgement.</p><h2>Individual retrieval</h2>${pair('A')}${pair('B')}<h2>AI-draft correction</h2><p>${esc(state.critique.correction||'Not recorded')}</p><h2>Team plan</h2>${entries(state.plans[t])}<h2>Current exhibit</h2>${entries(d)}${figure(t,d.diagramMode)}<h2>Audience test</h2>${entries({audience:test.audience,understood:test.understood,hesitation:test.hesitation,suggestion:test.suggestion})}<h2>Reasoned revision</h2><p>${esc(test.reason||'No reason recorded')}</p>${test.recorded?differences(test).map(k=>`<div class="record"><h3>${FIELD_NAMES[k]}</h3><p><strong>Before:</strong> ${esc(test.before[k])}</p><p><strong>After:</strong> ${esc(test.after[k])}</p></div>`).join(''):'<p>No revision recorded.</p>'}<p>Roles swapped: ${state.roleSwapped?'Yes':'Not yet recorded'}</p><h2>Individual exit tickets</h2>${['A','B'].map(p=>`<h3>Partner ${p}</h3>${entries(state.exit[p])}`).join('')}<h2>Teacher interpretation</h2><p>Check accuracy, clarity and useful improvement. Read individual explanations separately from the team product. An attractive exhibit alone is not proof of both pupils’ learning.</p>`);
}
</script>
