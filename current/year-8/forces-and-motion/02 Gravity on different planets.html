<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravity on different planets · Year 8</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,350;9..144,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
      --navy-950: oklch(20% 0.085 258);
      --navy-900: oklch(25% 0.10 258);
      --navy-700: oklch(36% 0.12 258);
      --navy-100: oklch(93% 0.025 258);
      --gold-600: oklch(50% 0.13 82);
      --gold-500: oklch(76% 0.16 82);
      --gold-100: oklch(94% 0.035 82);
      --paper-50: oklch(99% 0.008 82);
      --paper-100: oklch(98% 0.012 82);
      --paper-200: oklch(95% 0.022 82);
      --ink-900: oklch(22% 0.015 75);
      --ink-600: oklch(43% 0.02 258);
      --line: oklch(36% 0.04 258 / 0.18);
      --line-strong: oklch(36% 0.06 258 / 0.34);
      --push: oklch(39% 0.14 258);
      --resist: oklch(43% 0.10 30);
      --success: oklch(40% 0.09 155);
      --surface-shadow: 0 18px 50px oklch(25% 0.08 258 / 0.08);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --sans: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper-200); }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--paper-200); color: var(--ink-900); font: 400 1rem/1.5 var(--sans); }
    button { font: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 3px solid var(--gold-500); outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: 0.38; }
    .skip-link { position: fixed; left: 16px; top: -80px; z-index: 50; padding: 10px 16px; border-radius: 8px; background: var(--navy-950); color: var(--paper-100); font-weight: 700; }
    .skip-link:focus { top: 16px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .app { width: 100%; min-width: 0; min-height: 100vh; display: grid; grid-template-rows: minmax(0, 1fr) 62px; }
    .app > * { min-width: 0; }
    .crest { width: 40px; height: 46px; flex: 0 0 40px; }
    .topic { margin: 0; padding: 28px clamp(32px, 5.6vw, 78px) 0; color: var(--navy-950); font: 400 1.35rem/1.2 var(--serif); }
    .control, .icon-control, .tool-control, .choice, .support-tab, .phase-link, .reveal-control, .timer-control {
      border: 1px solid var(--line);
      background: var(--paper-50);
      color: var(--navy-950);
      cursor: pointer;
      transition: background 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out), transform 140ms var(--ease-out);
    }
    .control { min-height: 44px; padding: 9px 15px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
    .control.primary { background: var(--navy-900); border-color: var(--navy-900); color: var(--paper-100); }
    .control:hover, .icon-control:hover, .tool-control:hover, .reveal-control:hover, .timer-control:hover { border-color: var(--navy-700); background: var(--navy-100); }
    .control.primary:hover { background: var(--navy-700); color: var(--paper-100); }
    .control:active, .icon-control:active, .tool-control:active, .reveal-control:active, .timer-control:active { transform: translateY(1px); }

    .workspace { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px 20px; }
    .workspace.has-drawer { grid-template-columns: minmax(0, 1fr) minmax(330px, 382px); }
    .lesson-stage, .student-drawer { min-width: 0; min-height: 0; overflow: hidden; border: 1px solid var(--line); background: var(--paper-100); }
    .lesson-stage { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); border-radius: 20px; box-shadow: var(--surface-shadow); }
    .screen { height: 100%; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: clamp(28px, 4.5vh, 52px) clamp(32px, 5.6vw, 78px); animation: screen-enter 220ms var(--ease-out); }
    .screen-heading { margin: 8px 0 14px -0.035em; max-width: 24ch; color: var(--navy-950); font: 350 clamp(2.5rem, 4vw, 3.75rem)/0.99 var(--serif); letter-spacing: -0.035em; text-wrap: balance; }
    .screen-heading:focus, .drawer-head h2:focus { outline: none; }
    .screen-lead { max-width: 68ch; margin: 0; color: var(--ink-600); font-size: clamp(1rem, 1.3vw, 1.2rem); line-height: 1.5; text-wrap: pretty; }
    .screen-kicker { color: var(--ink-600); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
    .screen-kicker strong { color: var(--gold-600); }
    .micro-instruction { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 20px; color: var(--navy-950); font-size: 0.9rem; font-weight: 700; }
    .micro-instruction span { display: inline-flex; align-items: center; gap: 7px; }
    .micro-instruction span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold-500); }

    .do-now-layout { display: grid; grid-template-columns: minmax(0, 0.72fr) minmax(0, 1.28fr); gap: clamp(36px, 6vw, 84px); align-items: center; }
    .do-now-number { margin: 2px 0 14px; color: var(--gold-500); font: 300 clamp(5.5rem, 9vw, 8rem)/0.78 var(--serif); font-variant-numeric: lining-nums; }
    .question-sheet { counter-reset: question; display: grid; gap: 0; border-top: 1px solid var(--line-strong); }
    .question-row { counter-increment: question; display: grid; grid-template-columns: 38px 1fr; gap: 14px; align-items: start; padding: 14px 4px; border-bottom: 1px solid var(--line); color: var(--navy-950); font-size: clamp(1rem, 1.3vw, 1.15rem); font-weight: 600; }
    .question-row::before { content: counter(question, decimal-leading-zero); color: var(--gold-600); font: 500 0.82rem/1.8 var(--serif); }

    .question-stage { max-width: 1120px; }
    .question-stage .screen-heading { max-width: 22ch; font-size: clamp(3rem, 5.3vw, 5.2rem); }
    .prediction { display: flex; gap: 10px; margin-top: 26px; }
    .choice { min-width: 150px; min-height: 48px; padding: 10px 18px; border-radius: 12px; font-weight: 700; text-align: left; }
    .choice:hover, .choice[aria-pressed="true"] { border-color: var(--navy-700); background: var(--navy-900); color: var(--paper-100); }
    .commitment { min-height: 26px; margin-top: 14px; color: var(--ink-600); font-size: 0.9rem; font-weight: 600; }

    .concept-layout { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: clamp(40px, 7vw, 96px); align-items: center; }
    .principles { display: grid; border-top: 1px solid var(--line-strong); }
    .principle { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .principle span:first-child { color: var(--gold-600); font: 500 0.8rem/1.8 var(--serif); }
    .principle p { margin: 0; color: var(--navy-950); font-size: 1.02rem; font-weight: 600; }
    .key-statement { margin-top: 24px; padding: 18px 20px; border: 1px solid var(--navy-900); border-radius: 12px; background: var(--navy-900); color: var(--paper-100); }
    .key-statement span { display: block; margin-bottom: 4px; color: var(--gold-500); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .key-statement p { margin: 0; font: 350 1.35rem/1.3 var(--serif); }

    .model-layout { display: grid; grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
    .diagram-wrap { min-width: 0; padding-block: 16px; }
    .force-diagram { display: block; width: 100%; height: auto; max-height: 340px; overflow: visible; }
    .force-diagram text { font-family: var(--sans); }
    .force-arrow { stroke-linecap: round; stroke-width: 9; }
    .force-arrow.push { stroke: var(--push); }
    .force-arrow.resist { stroke: var(--resist); }
    .motion-path { stroke: var(--gold-500); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 12 11; animation: motion-flow 1.2s linear infinite; }
    .diagram-label { fill: var(--navy-950); font-size: 18px; font-weight: 700; }
    .diagram-label.resist { fill: var(--resist); }
    .diagram-result { fill: var(--navy-950); font: 400 27px var(--serif) !important; }
    .diagram-result, .resultant-arrow { transition: opacity 220ms var(--ease-out); }
    .diagram-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .reveal-control, .timer-control { min-height: 44px; padding: 9px 14px; border-radius: 999px; font-size: 0.86rem; font-weight: 750; }
    .reveal-control.primary { border-color: var(--navy-900); background: var(--navy-900); color: var(--paper-100); }
    .step-list { display: grid; gap: 0; margin-top: 20px; border-top: 1px solid var(--line-strong); }
    .model-step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--line); animation: step-enter 200ms var(--ease-out); }
    .model-step span:first-child { color: var(--gold-600); font: 500 0.82rem/1.8 var(--serif); }
    .model-step p { margin: 0; font-weight: 600; }

    .hinge-layout { max-width: 1080px; }
    .hinge-layout .screen-heading { max-width: 25ch; font-size: clamp(2.6rem, 4.3vw, 4.2rem); }
    .answer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
    .answer-option { min-height: 64px; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-50); color: var(--ink-900); text-align: left; cursor: pointer; }
    .answer-option:hover, .answer-option[aria-pressed="true"] { border-color: var(--navy-700); background: var(--navy-100); }
    .answer-option.is-correct { border-color: var(--success); background: oklch(94% 0.025 155); }
    .answer-letter { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--navy-700); font-size: 0.82rem; font-weight: 800; }
    .answer-feedback { min-height: 50px; margin-top: 12px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-200); color: var(--navy-950); }
    .answer-feedback:empty { min-height: 0; margin: 0; padding: 0; border: 0; }

    .practice-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: clamp(36px, 6vw, 82px); align-items: center; }
    .task-list { counter-reset: task; margin-top: 20px; border-top: 1px solid var(--line-strong); }
    .task-item { counter-increment: task; display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
    .task-item::before { content: counter(task); color: var(--gold-600); font: 500 0.9rem/1.65 var(--serif); }
    .success-list { padding: 24px 0 24px 28px; border-left: 1px solid var(--line-strong); }
    .success-list h2 { margin: 0 0 14px; color: var(--navy-950); font: 400 1.55rem var(--serif); }
    .success-list p { display: flex; gap: 9px; margin: 10px 0; color: var(--ink-600); font-size: 0.92rem; }
    .success-list p::before { content: "✓"; color: var(--gold-600); font-weight: 800; }

    .source-claim { max-width: 950px; margin: 22px 0 0; padding: clamp(22px, 3vw, 34px); border: 1px solid var(--line-strong); border-radius: 14px; background: var(--paper-50); }
    .source-label { margin-bottom: 12px; color: var(--ink-600); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; }
    .source-claim blockquote { margin: 0; max-width: 34ch; color: var(--navy-950); font: 350 clamp(1.65rem, 2.5vw, 2.45rem)/1.18 var(--serif); text-wrap: balance; }
    .verification-steps { display: flex; flex-wrap: wrap; gap: 16px 28px; margin-top: 20px; color: var(--navy-950); font-weight: 700; }
    .verification-steps span { display: inline-flex; align-items: center; gap: 8px; }
    .verification-steps b { color: var(--gold-600); font-family: var(--serif); }

    .exit-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.42fr); gap: clamp(48px, 8vw, 112px); align-items: center; }
    .exit-mark { color: var(--gold-500); font: 300 clamp(5rem, 8vw, 7.5rem)/0.8 var(--serif); }
    .exit-question { margin: 16px 0 0; max-width: 42ch; color: var(--navy-950); font: 350 clamp(1.7rem, 2.6vw, 2.5rem)/1.17 var(--serif); }
    .timer-panel { padding: 28px 0 28px 32px; border-left: 1px solid var(--line-strong); }
    .timer-value { color: var(--navy-950); font: 350 clamp(3.5rem, 5.5vw, 5rem)/1 var(--serif); font-variant-numeric: tabular-nums; }
    .timer-note { margin: 8px 0 18px; color: var(--ink-600); font-size: 0.86rem; }

    .student-drawer { display: grid; grid-template-rows: auto auto minmax(0, 1fr); border-radius: 18px; box-shadow: var(--surface-shadow); animation: drawer-enter 240ms var(--ease-out); }
    .student-drawer[hidden] { display: none; }
    .drawer-head { display: flex; align-items: start; gap: 16px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 0; color: var(--navy-950); font: 400 1.55rem/1.1 var(--serif); }
    .drawer-head p { margin: 5px 0 0; color: var(--ink-600); font-size: 0.8rem; line-height: 1.4; }
    .icon-control { width: 44px; height: 44px; flex: 0 0 44px; display: grid; place-items: center; margin-left: auto; border-radius: 50%; font-size: 1.25rem; font-weight: 500; }
    .drawer-tabs { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .support-tab { min-height: 38px; padding: 7px 10px; border-color: transparent; border-radius: 999px; color: var(--ink-600); font-size: 0.72rem; font-weight: 750; white-space: nowrap; }
    .support-tab[aria-selected="true"] { background: var(--navy-900); color: var(--paper-100); }
    .drawer-body { min-height: 0; padding: 18px; overflow: auto; }
    .drawer-section-title { margin: 0 0 14px; color: var(--gold-600); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .support-list { display: grid; gap: 0; border-top: 1px solid var(--line-strong); }
    .support-item { padding: 13px 2px; border-bottom: 1px solid var(--line); }
    .support-item h3 { margin: 0; color: var(--navy-950); font-size: 0.92rem; line-height: 1.4; }
    .support-item p { margin: 5px 0 0; color: var(--ink-600); font-size: 0.8rem; line-height: 1.45; }
    .journey-list { display: grid; gap: 2px; }
    .phase-link { width: 100%; min-height: 42px; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 7px 9px; border-color: transparent; border-radius: 8px; text-align: left; font-size: 0.78rem; }
    .phase-link[aria-current="step"] { background: var(--navy-100); color: var(--navy-950); font-weight: 750; }
    .phase-link span:first-child { color: var(--gold-600); font-family: var(--serif); }
    .phase-link small { color: var(--ink-600); }

    .student-tools { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0; }
    .student-tools:empty { padding: 0; visibility: hidden; }
    .tool-control { min-height: 42px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 750; }
    .tool-control[aria-pressed="true"] { border-color: var(--navy-900); background: var(--navy-900); color: var(--paper-100); }
    .tool-icon { font-size: 0.92rem; line-height: 1; }
    .support-tool { border-color: var(--gold-500); }

    .lesson-nav { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 16px; padding: 7px 20px 10px; border-top: 1px solid var(--line); background: var(--paper-50); }
    .nav-control { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--paper-50); color: var(--navy-950); cursor: pointer; font-size: 1.2rem; font-weight: 700; }
    .nav-control:hover { border-color: var(--navy-700); background: var(--navy-100); }
    .nav-context { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; align-items: center; }
    .phase-context { min-width: 0; }
    .phase-context small { display: block; color: var(--ink-600); font-size: 0.68rem; font-weight: 750; letter-spacing: 0.11em; text-transform: uppercase; }
    .phase-context strong { display: block; overflow: hidden; color: var(--navy-950); font: 400 1.12rem/1.2 var(--serif); text-overflow: ellipsis; white-space: nowrap; }
    .next-context { color: var(--ink-600); font-size: 0.72rem; text-align: right; }
    .next-context strong { color: var(--navy-950); }

    @media (min-width: 1021px) {
      .workspace.has-drawer .screen, .workspace.has-drawer .topic { padding-inline: clamp(28px, 3vw, 46px); }
      .workspace.has-drawer .do-now-layout,
      .workspace.has-drawer .concept-layout,
      .workspace.has-drawer .model-layout,
      .workspace.has-drawer .practice-layout,
      .workspace.has-drawer .exit-layout { gap: clamp(22px, 3vw, 42px); }
      .workspace.has-drawer .force-diagram { max-height: 270px; }
    }

    @keyframes screen-enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drawer-enter { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes step-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes motion-flow { to { stroke-dashoffset: -23; } }

    @media (max-width: 1020px) {
      .workspace.has-drawer { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(200px, 35%); }
      .student-drawer { grid-template-rows: auto auto minmax(0, 1fr); }
      .screen { padding: 28px 36px; }
      .topic { padding-inline: 36px; }
      .do-now-layout, .concept-layout { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 36px; }
      .model-layout { grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 24px; }
      .practice-layout { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: 32px; }
      .exit-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 0.4fr); gap: 40px; }
    }

    @media (max-width: 760px) {
      body { min-height: 100%; }
      .app { min-height: 100dvh; grid-template-rows: auto 58px; }
      .crest { width: 34px; height: 40px; flex-basis: 34px; }
      .topic { padding: 24px 24px 0; font-size: 1.05rem; }
      .workspace, .workspace.has-drawer { display: grid; grid-template-columns: 1fr; grid-template-rows: auto auto; padding: 10px 12px; }
      .lesson-stage { min-height: 520px; }
      .screen { height: auto; min-height: 518px; justify-content: center; padding: 32px 24px; }
      .screen-heading { font-size: clamp(2.25rem, 11vw, 3.25rem); }
      .screen-lead { font-size: 1rem; }
      .do-now-layout, .concept-layout, .model-layout, .practice-layout, .exit-layout { grid-template-columns: 1fr; gap: 28px; }
      .do-now-number { font-size: 5rem; }
      .question-row { font-size: 0.96rem; padding-block: 11px; }
      .question-stage .screen-heading { font-size: clamp(2.35rem, 11vw, 3.35rem); }
      .prediction { flex-direction: column; }
      .choice { width: 100%; }
      .principles { margin-top: 4px; }
      .key-statement { margin-top: 18px; }
      .model-layout .diagram-wrap { order: -1; }
      .force-diagram { max-height: 250px; }
      .answer-grid { grid-template-columns: 1fr; }
      .practice-layout { align-items: start; }
      .success-list, .timer-panel { padding: 20px 0 0; border-left: 0; border-top: 1px solid var(--line-strong); }
      .source-claim blockquote { font-size: 1.6rem; }
      .student-drawer { max-height: none; border-radius: 16px; box-shadow: none; }
      .drawer-body { max-height: 360px; }
      .student-tools { justify-content: flex-start; padding: 0; }
      .tool-control { flex: 0 0 auto; min-height: 44px; }
      .lesson-nav { grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 10px; padding-inline: 12px; }
      .next-context { display: none; }
      .nav-context { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    }

    @media (max-height: 680px) and (min-width: 761px) {
      .app { grid-template-rows: minmax(0, 1fr) 56px; }
      .screen { padding-block: 22px; }
      .screen-heading { font-size: clamp(2.25rem, 3.6vw, 3.3rem); margin-block: 6px 10px; }
      .screen-lead { font-size: 1rem; }
      .question-row, .principle { padding-block: 9px; }
      .model-step, .task-item { padding-block: 8px; }
      .source-claim { margin-top: 14px; padding: 18px 22px; }
    }

    /* Projection: teaching text scales with both screen width and height. */
    @media (min-width: 761px) {
      .app {
        --board-body: clamp(24px, min(2.4vw, 3.6dvh), 42px);
        --board-question: clamp(28px, min(2.8vw, 4.5dvh), 50px);
        --board-heading: clamp(38px, min(4.4vw, 6.6dvh), 76px);
        --board-label: clamp(16px, min(1.5vw, 2.5dvh), 26px);
        --board-inset: clamp(24px, 2.8vw, 54px);
        height: 100dvh;
        min-height: 0;
        grid-template-rows: minmax(0, 1fr) 58px;
      }
      .workspace { padding: 8px; }

      .lesson-nav { padding: 6px 16px; }
      .phase-context small { font-size: 12px; }

      .next-context, .tool-control { font-size: 16px; }
      .workspace.has-drawer { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
      .workspace.has-drawer .lesson-stage, .workspace.has-drawer .student-drawer { grid-area: 1 / 1; }

      .drawer-section-title { color: var(--navy-950); font-size: var(--board-label); }
      .support-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
      .support-item { padding-block: 20px; }
      .support-item p { margin-top: 14px; }
    }

    @media (pointer: coarse) {
      .support-tab, .phase-link, .reveal-control, .timer-control { min-height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .motion-path { stroke-dasharray: none; }

/* Six screen families share a projection canvas and optional task widgets. */
.app { grid-template-rows: minmax(0, 1fr) auto 58px; }
.nav-context { grid-template-columns: minmax(0, 1fr) auto; }
.student-tools {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.6fr);
  gap: 8px;
  padding: 0 12px 8px;
}
.student-tools:empty { padding: 0; }
.tool-control { justify-content: center; gap: 0; border-radius: 8px; font-size: 16px; padding: 8px 10px; }
.tool-control[aria-expanded="true"] { background: var(--navy-900); border-color: var(--navy-900); color: var(--paper-100); }
.topic[hidden] { display: none; }
.app[data-family="Title"] .lesson-stage { grid-template-rows: minmax(0, 1fr); }
.title-layout { display: flex; flex-direction: column; justify-content: center; height: 100%; }
.title-layout .screen-heading { font-size: clamp(72px, min(8.2vw, 13vh), 148px); max-width: 12ch; margin: 20px 0; }
.title-question { font: 500 clamp(32px, min(4.2vw, 6.8vh), 72px)/1.15 var(--serif); max-width: 22ch; margin: 0 0 32px; }
.title-path { display: flex; flex-wrap: wrap; gap: 14px 32px; border-top: 1px solid var(--line-strong); padding-top: 24px; font-size: var(--board-body, 24px); }
.title-path span + span::before { content: "→"; color: var(--gold-600); margin-right: 24px; }
.outcome-layout { width: 100%; }
.outcome-list { list-style: none; counter-reset: outcome; padding: 0; margin: 24px 0 0; border-top: 1px solid var(--line-strong); }
.outcome-list li { counter-increment: outcome; display: grid; grid-template-columns: 32px 1fr; gap: 14px; border-bottom: 1px solid var(--line); padding: 20px 0; }
.outcome-list li::before { content: counter(outcome, decimal-leading-zero); font-family: var(--serif); }
.outcome-list strong { display: block; font-weight: 650; }
.outcome-list p { margin: 8px 0 0; }
.outcome-open { margin-top: 20px; }
.workspace.has-drawer .lesson-stage { visibility: visible; }
.workspace.has-drawer .lesson-stage, .workspace.has-drawer .student-drawer { grid-area: auto; }
.student-drawer { grid-template-rows: auto auto minmax(0, 1fr) auto; animation: none; }
.drawer-head { align-items: start; }
.drawer-head p { margin-top: 8px; }
.drawer-tabs { flex-wrap: wrap; overflow: visible; }
.drawer-tabs:empty { display: none; }
.drawer-body { overflow: hidden; max-height: none; }
.widget-page h3 { font: 500 1.35em/1.15 var(--serif); margin: 0 0 18px; }
.widget-page p { margin: 0 0 18px; }
.widget-page ul { margin: 20px 0; padding-left: 1.15em; }
.widget-page li { padding-left: 5px; margin: 0 0 16px; }
.widget-page blockquote { margin: 0 0 20px; font: 500 1.25em/1.25 var(--serif); }
.widget-note { font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
.widget-action { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 18px; border: 1px solid var(--navy-900); border-radius: 8px; background: var(--navy-900); color: var(--paper-100); font: 650 0.8em/1.3 var(--sans); cursor: pointer; }
.widget-source { color: var(--navy-700); font-size: 0.75em; text-underline-offset: 4px; }
.widget-diagram { margin-bottom: 18px; }
.widget-diagram .force-diagram { width: 100%; max-height: 180px; }
.widget-diagram .diagram-label { font-size: 46px; }
.widget-pagination { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 12px; padding: 10px 20px; border-top: 1px solid var(--line); }
.widget-pagination span { text-align: center; font-size: 16px; }
.context-anchor { margin-block: 0 !important; }
.context-key { margin: 24px 0 0; padding-top: 20px; border-top: 1px solid var(--line-strong); font-weight: 600; }
.context-key span { display: block; margin-bottom: 8px; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.06em; }
.context-key p { margin: 0; }
.context-options, .context-tasks { padding-left: 1.2em; margin: 22px 0 0; }
.context-options li, .context-tasks li { margin-bottom: 16px; padding-left: 8px; }

@media (min-width: 761px) {
  .app { grid-template-rows: minmax(0, 1fr) auto 58px; }
  .workspace.has-drawer { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 8px; }
  .workspace.has-drawer .screen, .workspace.has-drawer .topic { padding-inline: 26px; }

  .workspace.has-drawer .screen-heading { font-size: clamp(32px, min(3.3vw, 5.3vh), 56px); }

  .outcome-list li { padding-block: 16px; }
  .outcome-list p { font-size: 0.85em; }
  .drawer-head { padding: 20px 22px 14px; gap: 8px; }
  .drawer-head h2 { font-size: clamp(28px, min(2.8vw, 4.8vh), 46px); }
  .drawer-head p { font-size: clamp(18px, min(1.8vw, 2.8vh), 28px); line-height: 1.3; }
  .drawer-tabs { padding: 10px 16px; gap: 6px; }
  .support-tab { font-size: clamp(16px, 1.45vw, 22px); padding: 8px 12px; min-height: 40px; }
  .drawer-body { padding: 22px; color: var(--navy-950); font-size: clamp(23px, min(2.15vw, 3.4vh), 36px); line-height: 1.3; }
  .screen-model .force-diagram { max-height: 23vh; }
  .screen-model .model-layout { gap: 14px; }
  .screen-model .model-step { padding-block: 8px; }
}

@media (max-width: 760px) {
  .app { grid-template-rows: auto auto 58px; }
  .student-tools { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 12px 8px; }
  .tool-control { font-size: 13px; min-height: 44px; }
  .title-layout .screen-heading { font-size: clamp(56px, 15vw, 100px); }
  .title-question { font-size: 32px; }
  .title-path { flex-direction: column; font-size: 20px; }
  .title-path span + span::before { content: none; }
  .workspace.has-drawer { grid-template-columns: 1fr; grid-template-rows: auto auto; }
  .workspace.has-drawer .lesson-stage, .workspace.has-drawer .student-drawer { grid-area: auto; }
  .drawer-body { overflow: visible; font-size: 21px; }
  .student-drawer { min-height: 500px; }
  .screen-outcome { font-size: 22px; }
  .context-anchor { font-size: 21px; }
  .nav-context { grid-template-columns: minmax(0, 1fr); }
}

/* Content extensions to the approved Arcadia 1.0.0 frame. */
.screen { gap: 0; }

 Moon 60 × 1.6 = 96 N. Mass stays 60 kg; only the weight changes."}], "criteria": [{"heading": "Success criteria", "items": ["Write the formula, substitution and unit each time.", "Keep the mass the same for the same object."]}], "marks": null}, "p-guided": {"models": [{"heading": "Model response", "text": "Fluency 1–2: 5 × 3.7 = 18.5 N (Mars); 5 × 1.6 = 8 N (Moon). Continue the sheet showing formula, substitution and unit each time."}], "criteria": [{"heading": "Success criteria", "items": ["Write the formula, substitution and unit each time.", "Keep the mass the same for the same object."]}], "marks": null}, "p-idea": {"models": [{"heading": "Model response", "text": "Mass is the amount of matter and stays the same. Weight is the pull of gravity and depends on g. So the same object weighs less where g is smaller."}], "criteria": [{"heading": "Success criteria", "items": ["Use correct scientific terms and relationships.", "Cover each part of the task; equivalent wording is valid."]}], "marks": null}, "p-hinge": {"models": [{"heading": "Model response", "text": "Planet X. A smaller radius puts the surface closer to the centre, so the field at the surface is stronger. Equal mass alone does not decide surface gravity."}], "criteria": [{"heading": "Success criteria", "items": ["Choose the correct option.", "Justify it with the scientific mechanism."]}], "marks": null}, "p-practice": {"models": [{"heading": "Model response", "text": "Full answers are on the practice sheet mark scheme. Key values — A: 20, 3.2, 37, 100, 5, 32, 53.4, 11.1, 1000, 6.25 N. Rover (Part C): Earth 400, Moon 64, Mars 148, Jupiter 1000 N."}], "criteria": [{"heading": "Success criteria", "items": ["Write the formula, substitution and unit each time.", "Keep the mass the same for the same object."]}], "marks": null}, "p-review": {"models": [{"heading": "Model response", "text": "Self-assessment: mark honestly in green against the mark scheme, ticking each mark earned. Peer-assessment: check a partner’s working shows formula, substitution and unit, and that comparisons cover both objects. DIRT: correct one error on a fresh line."}], "criteria": [{"heading": "Success criteria", "items": ["Award marks only where the working and unit are shown.", "Give your partner one specific, kind improvement.", "Complete one correction to show progress."]}], "marks": null}, "p-hot": {"models": [{"heading": "Model response", "text": "1) Mars (50 × 3.7 = 185 N). 2) Same radius, double mass → double g → twice the weight on P. 3) A larger radius weakens the field, and enough radius can outweigh extra mass. 4) [3] smaller g on the Moon; W = mg with mass unchanged; so smaller weight. 5) 18.5 − 8 = 10.5 N. 6) Earth 300 kg; Moon 1875 kg."}], "criteria": [{"heading": "Success criteria", "items": ["Use correct scientific terms and relationships.", "Cover each part of the task; equivalent wording is valid."]}], "marks": null}, "p-exit": {"models": [{"heading": "Model response", "text": "You always have mass — it is the matter you are made of and never disappears. The same object weighs less on the Moon because the Moon’s gravitational field strength is smaller than Earth’s."}], "criteria": [{"heading": "Success criteria", "items": ["Use correct scientific terms and relationships.", "Cover each part of the task; equivalent wording is valid."]}], "marks": null}}, "widgets": {"outcomes": {"resources": {"title": "Resources", "subtitle": "Use a reference, then return.", "tabs": [{"label": "Practice", "pages": [{"heading": "Open the practice questions", "text": "Fluency, reasoning and apply — with answers to self/peer-assess.", "href": "data:text/html;base64,PCFkb2N0eXBlIGh0bWw+PGh0bWwgbGFuZz0iZW4tR0IiPjxtZXRhIGNoYXJzZXQ9InV0Zi04Ij48bWV0YSBuYW1lPSJ2aWV3cG9ydCIgY29udGVudD0id2lkdGg9ZGV2aWNlLXdpZHRoLGluaXRpYWwtc2NhbGU9MSI+PHRpdGxlPkdyYXZpdHkgb24gZGlmZmVyZW50IHBsYW5ldHMg4oCUIHByYWN0aWNlPC90aXRsZT48c3R5bGU+Kntib3gtc2l6aW5nOmJvcmRlci1ib3h9Ym9keXttYXJnaW46MDtiYWNrZ3JvdW5kOiNmNGYxZTk7Y29sb3I6IzE3MzE0M avitational field strength (g)", "text": "Force of gravity on each kilogram, in N/kg. Earth ≈ 10, Moon ≈ 1.6, Mars ≈ 3.7, Jupiter ≈ 25."}, {"heading": "W = m × g", "text": "Weight = mass × gravitational field strength."}]}, {"label": "Models", "pages": [{"heading": "Return to the worked example", "text": "Revisit how the weight was calculated.", "action": {"id": "p-model", "label": "Open the model"}}]}]}, "assessments": {"title": "Assessments", "subtitle": "Show your reasoning, then check it.", "tabs": [{"label": "Checks", "pages": [{"heading": "Independent practice", "text": "Fluency → reasoning → apply. Keep your first attempt.", "action": {"id": "p-practice", "label": "Open the practice"}}, {"heading": "Mark and improve", "text": "Self-assess, then peer-assess against the answers.", "action": {"id": "p-review", "label": "Open the marking screen"}}, {"heading": "Challenge", "text": "Stretch and exam practice, with answers.", "action": {"id": "p-hot", "label": "Open the challenge"}}, {"heading": "Exit check", "text": "Explain without your notes.", "action": {"id": "p-exit", "label": "Open the exit check"}}]}]}, "adaptation": {"title": "Adaptation", "subtitle": "Use a foothold, then try alone.", "tabs": [{"label": "Get started", "pages": [{"heading": "Start with one step", "text": "Think of the unit you write after a force.", "review": {"models": [{"heading": "Model response", "text": "Unit of mass: kilogram (kg). Unit of weight: newton (N). W = m × g. An astronaut’s mass does not change on the Moon."}], "criteria": [{"heading": "Success criteria", "items": ["Use correct scientific terms and relationships.", "Cover each part of the task; equivalent wording is valid."]}], "marks": null}}]}, {"label": "Build understanding", "pages": [{"heading": "Build the answer", "text": "Weight is a force; mass is the matter.", "review": {"models": [{"heading": "Model response", "text": "Unit of mass: kilogram (kg). Unit of weight: newton (N). W = m × g. An astronaut’s mass does no g": "Independent practice", "text": "Fluency → reasoning → apply. Keep your first attempt.", "action": {"id": "p-practice", "label": "Open the practice"}}, {"heading": "Mark and improve", "text": "Self-assess, then peer-assess against the answers.", "action": {"id": "p-review", "label": "Open the marking screen"}}, {"heading": "Challenge", "text": "Stretch and exam practice, with answers.", "action": {"id": "p-hot", "label": "Open the challenge"}}, {"heading": "Exit check", "text": "Explain without your notes.", "action": {"id": "p-exit", "label": "Open the exit check"}}]}]}, "adaptation": {"title": "Adaptation", "subtitle": "Use a foothold, then try alone.", "tabs": [{"label": "Get started", "pages": [{"heading": "Start with one step", "text": "Underline the word that never changes.", "review": {"models": [{"heading": "Model response", "text": "Mass is the amount of matter and stays the same. Weight is the pull of gravity and depends on g. So the same object weighs less where g is smaller."}], "criteria": [{"heading": "Success criteria", "items": ["Use correct scientific terms and relationships.", "Cover each part of the task; equivalent wording is valid."]}], "marks": null}}]}, {"label": "Build understanding", "pages": [{"heading": "Build the answer", "text": "Finish: “Mass stays the same because…, but weight changes because…”.", "review": {"models": [{"heading": "Model response", "text": "Mass is the amount of matter and stays the same. Weight is the pull of gravity and depends on g. So the same object weighs less where g is smaller."}], "criteria": [{"heading": "Success criteria", "items": ["Use correct scientific terms and relationships.", "Cover each part of the task; equivalent wording is valid."]}], "marks": null}}]}]}, "hot": {"title": "Higher-order thinking", "subtitle": "Test a limit or explain a contrast.", "tabs": [{"label": "Go further", "pages": [{"heading": "Push the idea", "text": "Explain why an object in orbit is not really “weightless”.", "review": {"models": [{"heading": "Model response", "text": "Gravity still acts in orbit; the object is in free fall, so it feels weightless but its mass and the force on it are not zero."}], "criteria": [{"heading": "Success criteria", "items": ["Use correct scientific terms and relationships.", "Cover each part of the task; equivalent wording is valid."]}], "marks": null}}]}]}, "ai": {"title": "AI literacy", "subtitle": "Optional prepared task · no live AI.", "tabs": [{"label": "Check and explain", "pages": [{"heading": "Check a prepared claim", "text": "Prepared AI-style suggestion: “Astronauts float on the Moon because there is no gravity there.” Identify and correct the error.", "review": {"models": [{"heading": "Model response", "text": "There is gravity on the Moon — about 1.6 N/kg. Astronauts weigh less there but are not weightless and their mass is unchanged."}], "criteria": [{"heading": "Success criteria", "items": ["Keep your own first attempt.", "Identify the error and justify the correction.", "Say what evidence you checked."]}], "marks": null}}]}]}, "uae": {"title": "UAE National Agenda", "subtitle": "Apply science in a local scenario.", "tabs": [{"label": "Apply the science", "pages": [{"heading": "A probe across the Solar System", "text": "A fictional UAE space team sends a 40 kg probe to Mars (g = 3.7 N/kg). Calculate its weight on Earth and on Mars, then explain the difference.", "review": {"models": [{"heading": "Model response", "text": "Earth 40 × 10 = 400 N; Mars 40 × 3.7 = 148 N. Mass stays 40 kg; Mars has a weaker field, so the weight is smaller."}], "criteria": [{"heading": "Success criteria", "items": ["Write the formula, substitution and unit each time.", "Keep the mass the same for the same object."]}], "marks": null}, "note": "Fictional classroom scenario"}]}]}}, "p-review": {"resources": {"title": "Resources", "subtitle": "Use a reference, then return.", "tabs": [{"label": "Practice", "pages": [{"heading": "Open the practice questions", "text" l": "Get started", "pages": [{"heading": "Start with one step", "text": "List what makes a planet pull harder on each kilogram.", "review": {"models": [{"heading": "Model response", "text": "1) Mars (50 × 3.7 = 185 N). 2) Same radius, double mass → double g → twice the weight on P. 3) A larger radius weakens the field, and enough radius can outweigh extra mass. 4) [3] smaller g on the Moon; W = mg with mass unchanged; so smaller weight. 5) 18.5 − 8 = 10.5 N. 6) Earth 300 kg; Moon 1875 kg."}], "criteria": [{"heading": "Success criteria", "items": ["Use correct scientific terms and relationships.", "Cover each part of the task; equivalent wording is valid."]}], "marks": null}}]}, {"label": "Build understanding", "pages": [{"heading": "Build the answer", "text": "Compare two planets: one more massive, one larger.", "review": {"models": [{"heading": "Model response", "text": "1) Mars (50 × 3.7 = 185 N). 2) Same radius, double mass → double g → twice the weight on P. 3) A larger radius weakens the field, and enough radius can outweigh extra mass. 4) [3] smaller g on the Moon; W = mg with mass unchanged; so smaller weight. 5) 18.5 − 8 = 10.5 N. 6) Earth 300 kg; Moon 1875 kg."}], "criteria": [{"heading": "Success criteria", "items": ["Use correct scientific terms and relationships.", "Cover each part of the task; equivalent wording is valid."]}], "marks": null}}]}]}, "hot": {"title": "Higher-order thinking", "subtitle": "Test a limit or explain a contrast.", "tabs": [{"label": "Go further", "pages": [{"heading": "Push the idea", "text": "Predict Earth’s surface g if its mass stayed the same but its radius doubled.", "review": {"models": [{"heading": "Model response", "text": "Surface g would fall sharply, because the surface would be much further from the centre even though the mass is unchanged."}], "criteria": [{"heading": "Success criteria", "items": ["Use correct scientific terms and relationships.", "Cover each part of the task; equivalent wording is valid."]}], "marks": null}}]}]}, "ai": {"title": "AI literacy", "subtitle": "Optional prepared task · no live AI.", "tabs": [{"label": "Check and explain", "pages": [{"heading": "Check a prepared claim", "text": "Prepared AI-style suggestion: “Astronauts float on the Moon because there is no gravity there.” Identify and correct the error.", "review": {"models": [{"heading": "Model response", "text": "There is gravity on the Moon — about 1.6 N/kg. Astronauts weigh less there but are not weightless and their mass is unchanged."}], "criteria": [{"heading": "Success criteria", "items": ["Keep your own first attempt.", "Identify the error and justify the correction.", "Say what evidence you checked."]}], "marks": null}}]}]}, "uae": {"title": "UAE National Agenda", "subtitle": "Apply science in a local scenario.", "tabs": [{"label": "Apply the science", "pages": [{"heading": "A probe across the Solar System", "text": "A fictional UAE space team sends a 40 kg probe to Mars (g = 3.7 N/kg). Calculate its weight on Earth and on Mars, then explain the difference.", "review": {"models": [{"heading": "Model response", "text": "Earth 40 × 10 = 400 N; Mars 40 × 3.7 = 148 N. Mass stays 40 kg; Mars has a weaker field, so the weight is smaller."}], "criteria": [{"heading": "Success criteria", "items": ["Write the formula, substitution and unit each time.", "Keep the mass the same for the same object."]}], "marks": null}, "note": "Fictional classroom scenario"}]}]}}, "p-exit": {"resources": {"title": "Resources", "subtitle": "Use a reference, then return.", "tabs": [{"label": "Practice", "pages": [{"heading": "Open the practice questions", "text": "Fluency, reasoning and apply — with answers to self/peer-assess.", "href": "data:text/html;base64,PCFkb2N0eXBlIGh0bWw+PGh0bWwgbGFuZz0iZW4tR0IiPjxtZXRhIGNoYXJzZXQ9InV0Zi04Ij48bWV0YSBuYW1lPSJ2aWV3cG9ydCIgY29udGVudD0id2lkdGg9ZGV2aWNlLXdpZHRoLGluaXRpYWwtc2NhbGU9MSI+PHRpdGxlPkdyYXZpdHkgb24gZGlmZmVyZW50IHBsYW5ldHMg4oCUIHByYWN0aWNlPC90aXRsZT48c3R5bGU+Kntib3gtc2l6a <script>/* Arcadia biology lesson renderer. Screen IDs are explicit; pupil answers stay in books. */
(() => {
  const lesson=window.LESSON;
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const states={}, widgetStates={};
  let index=0, activeWidget=null, cell=null, answerContext=null;
  const initial=location.hash.slice(1);
  if(lesson.phases.some(p=>p.id===initial)) index=lesson.phases.findIndex(p=>p.id===initial);
  const state=()=>states[phase().id]??(states[phase().id]={step:0,focus:'nucleus',scenario:0,showNet:false});
  const phase=()=>lesson.phases[index];
  const names=[['resources','Resources'],['assessments','Assessments'],['adaptation','Adaptation'],['hot','HOT'],['ai','AI literacy'],['uae','UAE National Agenda']];
  const button=(label,action,value,attrs='')=>`<button type="button" data-action="${action}" data-value="${esc(value)}" ${attrs}>${label}</button>`;
  const list=items=>`<ul class="bio-list">${items.map(s=>`<li>${s}</li>`).join('')}</ul>`;
  const figure=(name,caption,secondary=false)=>`<figure class="bio-figure${secondary?' is-secondary':''}">${BioDiagrams.render(name,state())}<figcaption>${caption||'Schematic model. Colours and sizes are illustrative.'}</figcaption></figure>`;
  function content(p) {
    const s=state();
    if(p.type==='title')return `<div class="title-layout"><p class="screen-kicker">Year 8 Science · ${esc(lesson.unit)} · Lesson ${lesson.unitLesson}</p><h1 class="screen-heading" tabindex="-1">${lesson.title}</h1><p class="title-question">${lesson.question}</p><div class="title-path">${lesson.path.map(x=>`<span>${x}</span>`).join('')}</div></div>`;
    const heading=`<p class="bio-eyebrow">${p.label||p.family}</p><h1 class="screen-heading" tabindex="-1">${p.title}</h1>${p.lead?`<p class="screen-lead">${p.lead}</p>`:''}`;
    if(p.type==='outcome')return `${heading}<ol class="outcome-list">${lesson.outcomes.map(o=>`<li><div><strong>${o[0]}</strong><span class="spec-ref">Year 8 curriculum · ${o[1]}</span></div></li>`).join('')}</ol>`;
    if(p.type==='exam')return `${heading}<div class="exam-layout"><div><ul class="bio-list"><li>Work independently on the yellow sheet provided.</li><li>Follow the instructions on your paper.</li><li>Check your answers if you finish early.</li></ul><p class="bio-task">Use clear scientific words. Stop when directed.</p></div><div class="exam-timer"><p class="bio-eyebrow">Time remaining</p><output id="exam-clock" aria-label="Time remaining" aria-live="off"></output><form id="timer-settings" class="timer-settings"><label for="timer-minutes">Minutes</label><div class="bio-controls"><input id="timer-minutes" name="minutes" type="number" min="1" max="180" step="1" value="${duration/60}" required><button type="submit">Set time</button></div></form><div class="bio-controls">${button('Start','timer','start')}${button('Pause','timer','pause')}${button('Reset','timer','reset')}${button('+1 min','timer','add')}</div><p class="exam-note" id="timer-status" role="status">Ready to start.</p></div></div>`;
    if(p.type==='structures') {
      const entries=lesson.structures, selected=entries.find(e=>e.id===s.focus)||entries[0];
      return `${heading}<div class="bio-layout"><figure class="bio-figure"><div class="cell-view" id="cell-view"><div class="cell-fallback">${BioDiagrams.render('structures')}</div></div><figcaption>Cutaway animal cell · drag or focus the model and use arrow keys to rotate. Colours and sizes are illustrative.</figcaption></figure><div class="bio-copy"><p class="structure-name"><span class="focus-swatch" style="background:${selected.color}"></span>${selected.name}</p><p>${selected.text}</p><div class="bio-controls" aria-label="Explore cell structures">${entries.map(e=>button(esc(e.name),'structure',e.id,`aria-pressed="${e.id===s.focus}"`)).join('')}</div></div></div><p class="bio-task">${p.task}</p>`;
    }
    if(p.type==='eye')return `${heading}<iframe class="eye-embed" title="Rotatable labelled eye" src="Resources/eye-model.html?embed"></iframe><p class="bio-task">${p.task}</p>`;
    if(p.type==='table')return `${heading}<table class="science-table">${p.rows.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</table>${p.items?list(p.items):''}<p class="bio-task">${p.task||''}</p>`;
    if(p.type==='model')return `${heading}<div class="bio-layout">${p.diagram?figure(p.diagram,p.caption):''}<div><div class="bio-step"><span class="step-number">STEP ${s.step+1} OF ${p.steps.length}</span><p>${p.steps[s.step]}</p></div><div class="bio-controls">${button('← Back','step',-1,s.step===0?'disabled':'')}${button('Next step →','step',1,s.step===p.steps.length-1?'disabled':'')}</div></div></div>${p.task?`<p class="bio-task">${p.task}</p>`:''}`;
    if(p.type==='osmosis')return `${heading}<div class="bio-layout">${figure('osmosis','Water = blue circles; sucrose = gold squares. Counts illustrate particles; they do not measure concentration.')}<div class="bio-copy"><p>Inside stays at <strong>5% sucrose</strong>. Change the solution outside.</p><div class="bio-controls" aria-label="Concentration outside">${[0,15,5].map(v=>button(v+'% sucrose','scenario',v,`aria-pressed="${s.scenario===v}"`)).join('')}</div><p class="bio-task">Predict the net movement. Explain your choice before showing it.</p><div class="bio-controls">${button(s.showNet?'Hide net direction':'Show net direction','net','')}</div></div></div>`;
    if(p.type==='hinge')return `${heading}<div class="answer-grid">${p.options.map((opt,i)=>button(`<span class="answer-letter">${'ABCD'[i]}</span><span>${opt}</span>`,'choice',i,`class="answer-option" aria-pressed="${s.choice===i}"`)).join('')}</div><p class="bio-task">${p.task||'Choose one answer. Give the evidence that supports it.'}</p>${s.choice!==undefined?`<p class="exam-note">Selected: ${'ABCD'[s.choice]}. Explain your reasoning in your book or aloud.</p>`:''}`;
    if(p.type==='cases')return `${heading}<div class="bio-cases">${p.cases.map(c=>`<div class="bio-case"><b>${c[0]}</b><p>${c[1]}</p></div>`).join('')}</div>${p.task?`<p class="bio-task">${p.task}</p>`:''}`;
    if(p.type==='quote')return `${heading}<blockquote class="bio-quote">${p.quote}</blockquote>${list(p.items)}${p.credit?`<p class="routine-credit">${p.credit}</p>`:''}`;
    const copy=`<div class="bio-copy">${p.text?`<p>${p.text}</p>`:''}${p.items?list(p.items):''}${p.formula?`<div class="bio-formula">${p.formula.map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div>`;
    return `${heading}${p.diagram?`<div class="bio-layout">${copy}${figure(p.diagram,p.caption,p.secondaryDiagram)}</div>`:copy}${p.task?`<p class="bio-task">${p.task}</p>`:''}`;
  }
  function render(focusHeading=false) {
    cell?.dispose();cell=null;
    const p=phase();
    $('app').dataset.family=p.family;
    document.querySelector('.topic').hidden=p.family==='Title';
    $('screen').className='screen '+(p.type==='title'?'':'bio-screen');
    const review=LessonAnswers.has(p,lesson)?`<div class="review-access-row">${button('Model answer &amp; mark scheme','answers','',`class="review-access" aria-expanded="${activeWidget==='answers'&&!answerContext}" aria-controls="student-drawer"`)}</div>`:'';
    const keepEye=p.type==='eye'&&$('screen').querySelector('.eye-embed');
    if(keepEye){$('screen').querySelector('.review-access-row').outerHTML=review;}else $('screen').innerHTML=review+content(p)+(p.resources?.length?`<div class="resource-links">${p.resources.map(r=>`<a href="${esc(r.href)}" target="_blank" rel="noopener">${r.label} ↗</a>`).join('')}</div>`:'');
    $('phase-position').textContent=`Screen ${index+1} of ${lesson.phases.length}`;
    $('phase-name').textContent=p.nav||p.title||lesson.title;
    $('next-context').innerHTML=`${index<lesson.phases.length-1?`Next: <strong>${esc(lesson.phases[index+1].nav||lesson.phases[index+1].title)}</strong>`:'Lesson complete'} ${button('⛶','fullscreen','',`class="nav-fullscreen" aria-label="Toggle fullscreen"`)}`;
    $('previous-screen').disabled=index===0;$('next-screen').disabled=index===lesson.phases.length-1;
    const widgets=p.secure?[]:p.family==='Learning outcome'?[names[0]]:['Input','Assess','Thinking'].includes(p.family)?names:[];
    if(activeWidget!=='answers'&&!widgets.some(w=>w[0]===activeWidget))activeWidget=null;
    $('student-tools').innerHTML=widgets.map(([id,label])=>button(label,'widget',id,`class="tool-control" aria-expanded="${id===activeWidget}" aria-controls="student-drawer"`)).join('');
    renderPanel();
    if(p.type==='structures')cell=CellModel.mount($('cell-view'),state());
    if(p.type==='exam')tick();
    try{history.replaceState(null,'','#'+p.id);}catch(_){}
    if(focusHeading)$('screen').querySelector('h1')?.focus({preventScroll:true});
  }
  function go(id) {
    const target=typeof id==='number'?id:lesson.phases.findIndex(p=>p.id===id);
    if(target<0||target>=lesson.phases.length)return;
    index=target;answerContext=null;activeWidget=phase().type==='outcome'?'resources':null;render(true);
  }
  function panelKey(){return phase().id+':'+activeWidget+(activeWidget==='answers'&&answerContext?':'+answerContext.widget+':'+answerContext.tab+':'+answerContext.page:'');}
  function focusTrigger(id){document.querySelector(id==='answers'?'[data-action="answers"]':`[data-action="widget"][data-value="${id}"]`)?.focus({preventScroll:true});}
  function renderPanel(focus=false) {
    const drawer=$('student-drawer');
    $('lesson-main').classList.toggle('has-drawer',Boolean(activeWidget));
    drawer.hidden=!activeWidget;
    if(!activeWidget){drawer.innerHTML='';return;}
    const panel=activeWidget==='answers'?LessonAnswers.panel(phase(),lesson,state(),answerContext):LessonWidgets.panel(activeWidget,phase(),lesson);
    const key=panelKey();
    const w=widgetStates[key]??(widgetStates[key]={tab:0,page:0});
    const tab=panel.tabs[w.tab]||panel.tabs[0];
    w.page=Math.min(w.page,tab.pages.length-1);const page=tab.pages[w.page];
    drawer.innerHTML=`<header class="drawer-head"><div><h2 id="drawer-title" tabindex="-1">${panel.title}</h2><p>${panel.subtitle}</p>${activeWidget==='answers'&&answerContext?button('← Return to task','answer-back','',`class="review-return"`):''}</div>${button('×','close','',`class="icon-control" aria-label="Close ${panel.title}"`)}</header><div class="drawer-tabs" role="tablist" aria-label="${panel.title} sections">${panel.tabs.map((t,i)=>button(t.label,'tab',i,`class="support-tab" role="tab" id="widget-tab-${i}" aria-selected="${i===w.tab}" aria-controls="widget-page" tabindex="${i===w.tab?0:-1}"`)).join('')}</div><div class="drawer-body" role="tabpanel" id="widget-page" aria-labelledby="widget-tab-${w.tab}"><article class="widget-page">${page.note?`<p class="widget-note">${page.note}</p>`:''}<h3>${page.heading}</h3>${page.quote?`<blockquote>${page.quote}</blockquote>`:''}${page.text?`<p>${page.text}</p>`:''}${page.items?`<ul>${page.items.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${page.source?`<a class="widget-source" target="_blank" rel="noopener" href="${esc(page.source)}">${page.sourceLabel||'Read the source'} ↗</a>`:''}${page.action?button(page.action.label+' →','go',page.action.id,'class="widget-action"'):''}${page.href?`<a class="widget-action" href="${esc(page.href)}" target="_blank" rel="noopener">${page.linkLabel||'Open resource'} ↗</a>`:''}${activeWidget!=='answers'&&LessonAnswers.widget(activeWidget,phase(),lesson,w.tab,w.page)?button('Model answer &amp; mark scheme','widget-answer','',`class="widget-action review-widget" aria-controls="student-drawer"`):''}</article></div><nav class="widget-pagination" aria-label="Widget pages">${button('←','page',-1,`aria-label="Previous widget page" ${w.page===0?'disabled':''}`)}<span>${w.page+1} / ${tab.pages.length}</span>${button('→','page',1,`aria-label="Next widget page" ${w.page===tab.pages.length-1?'disabled':''}`)}</nav>`;
    if(focus)$('drawer-title').focus({preventScroll:true});
  }
  let duration=22*60, remaining=duration, deadline=null;
  function tick(){
    if(deadline!==null){
      remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));
      if(remaining===0){deadline=null;$('status').textContent='Assessment time has ended. Put your pen down.';}
    }
    if($('exam-clock')){
      $('exam-clock').textContent=`${Math.floor(remaining/60).toString().padStart(2,'0')}:${(remaining%60).toString().padStart(2,'0')}`;
      const message=remaining===0?'Time is up. Put your pen down.':deadline!==null?'Work independently.':remaining===duration?'Ready to start.':'Timer paused.';
      if($('timer-status').textContent!==message)$('timer-status').textContent=message;
    }
  }
  document.addEventListener('submit',e=>{
    if(e.target.id!=='timer-settings')return;
    e.preventDefault();
    const input=$('timer-minutes');
    if(!input.reportValidity())return;
    duration=Number(input.value)*60;remaining=duration;deadline=null;
    $('status').textContent=`Timer set to ${input.value} minutes. Press Start when ready.`;
    tick();
  });
  setInterval(tick,500);
  $('previous-screen').addEventListener('click',()=>go(index-1));
  $('next-screen').addEventListener('click',()=>go(index+1));
  document.addEventListener('click',async e=>{
    const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
    const a=b.dataset.action,v=b.dataset.value,s=state();
    if(a==='widget'){answerContext=null;activeWidget=activeWidget===v?null:v;render();if(activeWidget)$('drawer-title').focus({preventScroll:true});else document.querySelector(`[data-action="widget"][data-value="${v}"]`)?.focus();}
    if(a==='close'){const old=activeWidget;activeWidget=null;answerContext=null;render();focusTrigger(old);}
    if(a==='tab'||a==='page'){const w=widgetStates[panelKey()];if(a==='tab'){w.tab=Number(v);w.page=0;}else w.page+=Number(v);renderPanel();if(a==='tab')document.getElementById('widget-tab-'+w.tab)?.focus();else {$('widget-page').tabIndex=-1;$('widget-page').focus({preventScroll:true});}}
    if(a==='answers'){const closing=activeWidget==='answers'&&!answerContext;answerContext=null;activeWidget=closing?null:'answers';render();if(closing)focusTrigger('answers');else $('drawer-title').focus({preventScroll:true});}
    if(a==='widget-answer'){const w=widgetStates[panelKey()];answerContext={widget:activeWidget,tab:w.tab,page:w.page};activeWidget='answers';render();$('drawer-title').focus({preventScroll:true});}
    if(a==='answer-back'&&answerContext){activeWidget=answerContext.widget;answerContext=null;render();document.querySelector('[data-action="widget-answer"]')?.focus({preventScroll:true});}
    if(a==='go')go(v);
    if(a==='step'){s.step=Math.max(0,Math.min(phase().steps.length-1,s.step+Number(v)));render();$('screen').querySelector('.bio-step').setAttribute('tabindex','-1');$('screen').querySelector('.bio-step').focus({preventScroll:true});}
    if(a==='structure'){s.focus=v;render();document.querySelector(`[data-action="structure"][data-value="${v}"]`)?.focus();}
    if(a==='scenario'){s.scenario=Number(v);s.showNet=false;render();document.querySelector(`[data-action="scenario"][data-value="${v}"]`)?.focus();}
    if(a==='net'){s.showNet=!s.showNet;render();document.querySelector('[data-action="net"]')?.focus();}
    if(a==='choice'){s.choice=Number(v);render();document.querySelector(`[data-action="choice"][data-value="${v}"]`)?.focus();}
    if(a==='timer'){
      tick();
      if(v==='start'&&deadline===null&&remaining>0)deadline=Date.now()+remaining*1000;
      if(v==='pause')deadline=null;
      if(v==='reset'){deadline=null;remaining=duration;}
      if(v==='add'){remaining+=60;if(deadline!==null)deadline+=60000;}
      tick();
    }
    if(a==='fullscreen'){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){$('status').textContent='Fullscreen is unavailable in this viewer. Open the HTML in your browser.';}}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&activeWidget){e.preventDefault();const old=activeWidget;activeWidget=null;answerContext=null;render();focusTrigger(old);return;}
    if(e.target.closest('[role="tablist"]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const w=widgetStates[panelKey()];const tabs=(activeWidget==='answers'?LessonAnswers.panel(phase(),lesson,state(),answerContext):LessonWidgets.panel(activeWidget,phase(),lesson)).tabs;w.tab=(w.tab+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;w.page=0;renderPanel();document.getElementById('widget-tab-'+w.tab)?.focus();return;}
    if(e.target.closest('button,a,canvas,input,select,textarea'))return;
    if(e.key==='ArrowRight'){e.preventDefault();go(index+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1);}
  });
  if(phase().type==='outcome')activeWidget='resources';
  render();
})();
</script>
</body></html>
