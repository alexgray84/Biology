<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>W01-A02 evidence sheet: design for the pharmacist</title>
<style>
  :root { --navy:#21345B; --navy-soft:#e8edf5; --gold:#B8860B; --ink:#1c2233; --muted:#4d586d; --line:#7c8492; --paper:#fffdfa; --screen:#e9e7e2; --sans:"Montserrat","Avenir Next",Arial,sans-serif; --serif:Georgia,serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--screen); color:var(--ink); font-family:var(--sans); }
  .toolbar { position:sticky; top:0; z-index:2; display:flex; gap:12px; align-items:center; padding:10px 20px; background:#f8f7f4; border-bottom:1px solid #ccd0d7; }
  .toolbar strong { margin-right:auto; color:var(--navy); font-family:var(--serif); }
  .toolbar span { display:block; color:var(--muted); font-size:.72rem; }
  .toolbar button { min-height:38px; padding:8px 14px; border:1px solid var(--navy); border-radius:8px; background:var(--navy); color:#fff; font:inherit; font-size:.76rem; font-weight:750; cursor:pointer; }
  .print-page { width:210mm; height:148.5mm; margin:18px auto 28px; overflow:hidden; background:#fff; box-shadow:0 20px 55px rgb(23 38 69 / .15); }
  .sheet { width:210mm; height:148.5mm; padding:7mm 9mm 6mm; background:var(--paper); overflow:hidden; display:grid; grid-template-rows:11mm 1fr; gap:2mm; }
  .sheet + .sheet { display:none; }
  .sheet:first-child { border-bottom:.4mm dashed #667085; }
  .identity { display:flex; gap:6mm; align-items:flex-end; font-size:7pt; color:var(--muted); }
  .identity span { display:inline-block; min-width:48mm; border-bottom:.3mm solid var(--ink); margin-left:2mm; }
  .zone { display:grid; grid-template-rows:15mm 14mm 1fr 22mm 17mm 6mm; border:.45mm solid var(--navy); background:#fff; }
  .head { display:grid; grid-template-columns:1fr 52mm; background:var(--navy); color:#fff; }
  .head .t { padding:2.4mm 3mm; min-width:0; }
  .head small { display:block; color:#f1dc9d; font-size:6pt; font-weight:800; letter-spacing:.07em; text-transform:uppercase; }
  .head h1 { margin:0; font:700 10.4pt/1.1 var(--serif); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { display:grid; grid-template-columns:1fr 1fr; border-left:.3mm solid rgb(255 255 255 / .35); }
  .meta div { padding:2.3mm; }
  .meta div + div { border-left:.3mm solid rgb(255 255 255 / .35); }
  .meta span { display:block; color:#f1dc9d; font-size:5.5pt; font-weight:800; text-transform:uppercase; }
  .meta strong { display:block; margin-top:1mm; font-size:7pt; line-height:1.1; }
  .task { display:grid; grid-template-columns:20mm 1fr; border-bottom:.3mm solid var(--line); }
  .lab { display:flex; align-items:center; padding:0 3mm; border-right:.3mm solid var(--line); background:var(--navy-soft); color:var(--navy); font-size:6.4pt; font-weight:850; letter-spacing:.04em; text-transform:uppercase; }
  .task p { margin:0; display:flex; align-items:center; padding:1.5mm 3mm; font-size:7.1pt; font-weight:650; line-height:1.25; }
  .resp { display:grid; grid-template-columns:1fr 1fr 1fr; border-bottom:.3mm solid var(--line); }
  .resp > div { position:relative; padding:5mm 2.5mm 2mm; }
  .resp > div + div { border-left:.3mm solid var(--line); }
  .resp b { position:absolute; top:1.5mm; left:2.5mm; color:var(--navy); font-size:6pt; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
  .lines { height:100%; background:repeating-linear-gradient(to bottom, transparent 0, transparent 6.1mm, #c7cbd3 6.1mm, #c7cbd3 6.35mm); }
  .review { display:grid; grid-template-columns:1.35fr .9fr; border-bottom:.3mm solid var(--line); }
  .rubric { display:grid; grid-template-rows:6mm repeat(3,1fr); border-right:.3mm solid var(--line); }
  .rh, .rr { display:grid; grid-template-columns:1fr 10mm 10mm 10mm; align-items:center; }
  .rh { background:var(--navy-soft); color:var(--navy); font-size:5.5pt; font-weight:800; text-align:center; }
  .rh span:first-child { padding-left:2.5mm; text-align:left; }
  .rr { border-top:.25mm solid #c7cbd3; font-size:6pt; }
  .rr strong { padding:0 2.5mm; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .sb { width:4.5mm; height:4.5mm; justify-self:center; border:.3mm solid var(--line); }
  .action { display:grid; grid-template-rows:6mm 1fr; }
  .action h2 { margin:0; padding:1.6mm 2.5mm; background:var(--navy-soft); color:var(--navy); font-size:5.7pt; text-transform:uppercase; }
  .codes { display:grid; grid-template-columns:repeat(5,1fr); gap:1mm; padding:1.5mm; }
  .codes span { text-align:center; color:var(--muted); font-size:5pt; line-height:1.1; }
  .codes b { width:5mm; height:5mm; display:grid; place-items:center; margin:0 auto .8mm; border:.3mm solid var(--navy); color:var(--navy); font-size:6pt; }
  .respond { display:grid; grid-template-columns:20mm 1fr; border-bottom:.3mm solid var(--line); }
  .respond > div:last-child { position:relative; padding:1.5mm 3mm; }
  .respond > div:last-child::before { content:"Correct one control or one limit in a different pen. Keep the first version."; position:absolute; top:1.2mm; left:3mm; color:var(--muted); font-size:5.5pt; }
  .respond .lines { background:repeating-linear-gradient(to bottom, transparent 0, transparent 5.5mm, #c7cbd3 5.5mm, #c7cbd3 5.75mm); }
  footer { display:grid; grid-template-columns:1.2fr .8fr .8fr; align-items:center; padding:0 3mm; background:#f3f4f6; color:var(--muted); font-size:5.5pt; }
  footer strong { color:var(--navy); }
  footer span:nth-child(2), footer span:nth-child(3) { text-align:right; }
  @page { size:A4 portrait; margin:0; }
  @media print { body { background:#fff; } .toolbar { display:none; } .print-page { height:297mm; margin:0; box-shadow:none; } .sheet { print-color-adjust:exact; -webkit-print-color-adjust:exact; } .sheet + .sheet { display:grid; } }
</style>
</head>
<body>
<header class="toolbar"><div><strong>Evidence sheet Y8-8.01-W01-A02</strong><span>Prints as two identical A5 sheets on one A4 page.</span></div><button type="button" onclick="window.print()">Print A4</button></header>

<main class="print-page" id="page"></main>

<template id="sheet">
  <article class="sheet">
    <div class="identity">Name <span></span> Class <span></span> Date <span></span></div>
    <section class="zone">
      <header class="head">
        <div class="t"><small>Teacher-marked evidence</small><h1>Write your own design for the pharmacist</h1></div>
        <div class="meta"><div><span>Evidence ID</span><strong>Y8-8.01-W01-A02</strong></div><div><span>Returned</span><strong>Tuesday 8 September</strong></div></div>
      </header>
      <section class="task">
        <div class="lab">Do it</div>
        <p>Does chewing an antacid tablet make it neutralise acid faster than swallowing it whole? Write the design you would recommend, predict the result using surface area, and name one thing the design cannot prove.</p>
      </section>
      <section class="resp">
        <div><b>1 · Change · Measure · Keep the same</b><div class="lines"></div></div>
        <div><b>2 · Prediction and why</b><div class="lines"></div></div>
        <div><b>3 · One thing it cannot prove</b><div class="lines"></div></div>
      </section>
      <section class="review">
        <div class="rubric">
          <div class="rh"><span>Teacher review</span><span>0</span><span>1</span><span>2</span></div>
          <div class="rr"><strong>K: surface area, not amount, explains the prediction</strong><i class="sb"></i><i class="sb"></i><i class="sb"></i></div>
          <div class="rr"><strong>A: only form changes; equal mass, acid concentration/volume and endpoint fixed</strong><i class="sb"></i><i class="sb"></i><i class="sb"></i></div>
          <div class="rr"><strong>D: states one honest limit of the design</strong><i class="sb"></i><i class="sb"></i><i class="sb"></i></div>
        </div>
        <div class="action">
          <h2>Circle one next action</h2>
          <div class="codes">
            <span><b>S</b>Surface vs amount</span>
            <span><b>C</b>Control</span>
            <span><b>E</b>Endpoint</span>
            <span><b>L</b>Limit</span>
            <span><b>V</b>Vocabulary</span>
          </div>
        </div>
      </section>
      <section class="respond"><div class="lab">Respond</div><div><div class="lines"></div></div></section>
      <footer><span><strong>Markbook 8.01:</strong> K / A / D + next action + response complete</span><span>Confidence: 1&nbsp; 2&nbsp; 3&nbsp; 4</span><span>Response checked: □</span></footer>
    </section>
  </article>
</template>

<script>
  const page = document.querySelector('#page'), tpl = document.querySelector('#sheet');
  for (let i = 0; i < 2; i += 1) page.append(tpl.content.cloneNode(true));
</script>
</body>
</html>
