<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" role="img"><title>Starvation is one form of malnutrition</title><rect width="1120" height="250" fill="#fffefa"/><rect x="20" y="15" width="1080" height="220" fill="#eee8d9" stroke="#21345b" stroke-width="3"/><text x="45" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#21345b">MALNUTRITION: deficiency, excess or imbalance</text><rect x="45" y="80" width="470" height="130" fill="#fffefa" stroke="#21345b" stroke-width="3"/><text x="65" y="125" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#21345b">STARVATION</text><text x="65" y="165" font-family="Arial,sans-serif" font-size="27" font-weight="600" fill="#21345b">Prolonged inadequate energy</text><text x="560" y="120" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#21345b">Other forms include:</text><text x="560" y="160" font-family="Arial,sans-serif" font-size="27" font-weight="600" fill="#21345b">nutrient deficiency; energy excess</text></svg>