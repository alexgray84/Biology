<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="A villus in the small-intestine lining; schematic, not to scale"><title>A villus in the small-intestine lining; schematic, not to scale</title><desc>One finger-like villus with an epithelial lining one cell thick, a red capillary network and a central lacteal. Small sugars and amino acids cross the lining into capillaries; most absorbed fat takes the lymphatic route.</desc><rect width="1000" height="330" fill="#fffefa"/><path d="M365 279 V119 C365 10 525 10 525 119 V279" fill="#f5dfd8" stroke="#936e65" stroke-width="16"/><path d="M385 275 V125 C385 47 505 47 505 125 V275" fill="none" stroke="#b12635" stroke-width="8"/><path d="M410 275 V135 C410 91 480 91 480 135 V275" fill="none" stroke="#7f2330" stroke-width="5"/><path d="M446 275 V127" fill="none" stroke="#7b8460" stroke-width="15" stroke-linecap="round"/><path d="M310 130 H385 M310 189 H386" fill="none" stroke="#253752" stroke-width="3.5"/><path d="M385 130 l-12 -7 v14z M386 189 l-12 -7 v14z" fill="#253752"/><text x="190" y="65" font-size="28" font-weight="700" text-anchor="middle" fill="#21345b" font-family="Arial, Helvetica, sans-serif">gut contents</text><text x="190" y="105" font-size="25" font-weight="500" text-anchor="middle" fill="#21345b" font-family="Arial, Helvetica, sans-serif">sugars + amino acids</text><text x="445" y="318" font-size="23" font-weight="600" text-anchor="middle" fill="#21345b" font-family="Arial, Helvetica, sans-serif">blood carries absorbed nutrients away</text><path d="M663 46 L525 125" stroke="#21345b" stroke-width="2" fill="none"/><text x="675" y="55" font-size="26" font-weight="600" text-anchor="start" fill="#21345b" font-family="Arial, Helvetica, sans-serif">lining: one cell thick</text><path d="M663 121 L505 175" stroke="#21345b" stroke-width="2" fill="none"/><text x="675" y="130" font-size="26" font-weight="600" text-anchor="start" fill="#21345b" font-family="Arial, Helvetica, sans-serif">capillary network</text><path d="M663 196 L448 160" stroke="#21345b" stroke-width="2" fill="none"/><text x="675" y="205" font-size="26" font-weight="600" text-anchor="start" fill="#21345b" font-family="Arial, Helvetica, sans-serif">lacteal (lymph vessel)</text></svg>