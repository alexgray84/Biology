<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Two intestinal lining models: folded villi provide more surface area than a flat lining"><title>Two intestinal lining models: folded villi provide more surface area than a flat lining</title><rect width="1000" height="300" fill="#fffefa"/><text x="240" y="45" font-size="30" font-weight="700" text-anchor="middle" fill="#21345b" font-family="Arial, Helvetica, sans-serif">A: flat lining</text><text x="745" y="45" font-size="30" font-weight="700" text-anchor="middle" fill="#21345b" font-family="Arial, Helvetica, sans-serif">B: many villi</text><path d="M40 200 H450" fill="none" stroke="#936e65" stroke-width="14"/><path d="M540 210 V125 Q540 70 575 70 Q610 70 610 125 V210 H635 V125 Q635 70 670 70 Q705 70 705 125 V210 H730 V125 Q730 70 765 70 Q800 70 800 125 V210 H825 V125 Q825 70 860 70 Q895 70 895 125 V210 H925" fill="#f5dfd8" stroke="#936e65" stroke-width="12"/><text x="500" y="274" font-size="26" font-weight="600" text-anchor="middle" fill="#21345b" font-family="Arial, Helvetica, sans-serif">More lining surface available for absorption; same width of gut.</text></svg>