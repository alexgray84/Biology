<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-label="Digestive structures, front-view schematic, not to scale"><title>Digestive structures, front-view schematic, not to scale</title><desc>Continuous food route: mouth, oesophagus, stomach, duodenum and coiled small intestine, large intestine, rectum and anus. Teeth lie in the mouth. Salivary glands open into the mouth; liver, gall bladder and pancreas add secretions through ducts into the duodenum. Accessory organs are not on the food route.</desc><rect width="1000" height="900" fill="#fffefa"/><defs><marker id="route-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#253752"/></marker><marker id="duct-arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5Z" fill="#495344"/></marker></defs><path d="M500 95 V260 Q500 275 548 281" fill="none" stroke="#79564f" stroke-width="30" stroke-linecap="round"/><path d="M500 95 V260 Q500 275 548 281" fill="none" stroke="#f3d6ce" stroke-width="23" stroke-linecap="round"/><path d="M546 272 C555 253 584 263 591 283 C607 272 644 280 651 307 C663 346 636 377 596 377 C564 379 551 361 537 362 C521 363 520 342 536 339 C553 335 558 320 550 304 C546 294 544 281 546 272Z" fill="#efd0cf" stroke="#79564f" stroke-width="4"/><path d="M537 352 Q473 348 473 387 Q473 430 531 433 Q581 435 588 466 Q596 486 569 489 H432 Q403 490 420 511 Q426 517 443 517 H571 Q600 520 587 540 Q580 547 561 547 H433 Q404 549 420 570 Q426 577 447 577 H568 Q601 579 586 601 Q580 608 559 608 H449 Q408 609 375 639" fill="none" stroke="#765c6f" stroke-width="29" stroke-linejoin="round" stroke-linecap="round"/><path d="M537 352 Q473 348 473 387 Q473 430 531 433 Q581 435 588 466 Q596 486 569 489 H432 Q403 490 420 511 Q426 517 443 517 H571 Q600 520 587 540 Q580 547 561 547 H433 Q404 549 420 570 Q426 577 447 577 H568 Q601 579 586 601 Q580 608 559 608 H449 Q408 609 375 639" fill="none" stroke="#e9deeb