<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="363" viewBox="0 0 1120 363"><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#776c55"/></marker></defs><g fill="#182942" font-family="Arial, sans-serif" font-weight="600"><rect x="8" y="64" width="229" height="126" rx="12" fill="#f6e0cb" stroke="#7c7567" stroke-width="2"/><text text-anchor="middle" x="122.5" y="120.0" font-size="25"><tspan x="122.5" dy="0">Granite</tspan><tspan x="122.5" dy="31">(igneous rock)</tspan></text><path d="M238,99 L293,55" fill="none" stroke="#776c55" stroke-width="3" marker-end="url(#tip)"/><path d="M238,151 L293,203" fill="none" stroke="#776c55" stroke-width="3" marker-end="url(#tip)"/><rect x="299" y="12" width="373" height="89" rx="12" fill="#f8f6ef" stroke="#7c7567" stroke-width="2"/><text text-anchor="middle" x="485.5" y="49.5" font-size="25"><tspan x="485.5" dy="0">Solid change</tspan><tspan x="485.5" dy="31">under heat or pressure</tspan></text><path d="M675,56 L723,56" fill="none" stroke="#776c55" stroke-width="3" marker-end="url(#tip)"/><rect x="728" y="12" width="385" height="89" rx="12" fill="#e7dee3" stroke="#7c7567" stroke-width="2"/><text text-anchor="middle" x="920.5" y="49.5" font-size="25"><tspan x="920.5" dy="0">Gneiss</tspan><tspan x="920.5" dy="31">(metamorphic rock)</tspan></text><rect x="299" y="154" width="373" height="98" rx="12" fill="#f8f6ef" stroke="#7c7567" stroke-width="2"/><text text-anchor="middle" x="485.5" y="196.0" font-size="23"><tspan x="485.5" dy="0">Weathered grains are moved</tspan><tspan x="485.5" dy="31">and deposited as sediment</tspan></text><path d="M676,201 L723,201" fill="none" stroke="#776c55" stroke-width="3" marker-end="url(#tip)"/><rect x="728" y="141" width="385" height="124" rx="12" fill="#ece2cb" stroke="#7c7567" stroke-width="2"/><text text-anchor="middle" x="920.5" y="180.0" font-size="23"><tspan x="920.5" dy="0">Compaction + cementation</tspan><tspan x="920.5" dy="31">→ Sandstone</tspan><tspan x="920.5" dy="31">(sedimentary rock)</tspan></text><rect x="8" y="286" width="268" height="65" rx="12" fill="#f8f6ef" stroke="#7c7567" stroke-width="2"/><text text-anchor="middle" x="142.0" y="327.5" font-size="25"><tspan x="142.0" dy="0">Any existing rock</tspan></text><path d="M277,318 L318,318" fill="none" stroke="#776c55" stroke-width="3" marker-end="url(#tip)"/><rect x="325" y="286" width="331" height="65" rx="12" fill="#f6e0cb" stroke="#7c7567" stroke-width="2"/><text text-anchor="middle" x="490.5" y="327.5" font-size="25"><tspan x="490.5" dy="0">Melts → magma</tspan></text><path d="M658,318 L702,318" fill="none" stroke="#776c55" stroke-width="3" marker-end="url(#tip)"/><rect x="710" y="278" width="403" height="81" rx="12" fill="#f6e0cb" stroke="#7c7567" stroke-width="2"/><text text-anchor="middle" x="911.5" y="311.5" font-size="25"><tspan x="911.5" dy="0">Cooling and solidification</tspan><tspan x="911.5" dy="31">→ Igneous rock</tspan></text></g></svg>
