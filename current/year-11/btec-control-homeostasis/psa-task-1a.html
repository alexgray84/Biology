const form=document.getElementById('unlock-form'),status=document.getElementById('unlock-status'),button=document.getElementById('open-task');
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener('submit',async e=>{
 e.preventDefault();button.disabled=true;status.textContent='Opening your task…';
 try{
  if(!globalThis.crypto?.subtle)throw Error('crypto-unavailable');
  const p=JSON.parse(document.getElementById('task-payload').textContent);
  const code=document.getElementById('release-code').value.replace(/[\s-]/g,'').toUpperCase();
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(p.salt),iterations:p.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(p.iv)},key,decode(p.data));
  const html=new TextDecoder().decode(raw);
  document.getElementById('release-code').value='';
  document.open();document.write(html);document.close();
 }catch(err){
  status.textContent=err.message==='crypto-unavailable'?'Open this task using the HTTPS class website in an up-to-date browser.':'That code did not open this task. Check the year group, task number and code with your teacher.';
  button.disabled=false;
 }
});</script></body></html>
