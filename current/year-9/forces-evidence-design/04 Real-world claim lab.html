<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real-world claim lab | Year 9 Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body .card{padding-top:28px!important;padding-bottom:28px!important}body .claim{font-size:clamp(1.75rem,2.7vw,2.8rem)!important;margin:12px 0 14px!important}body:has(.tag.final) .card{padding-top:26px!important;padding-bottom:26px!important}body:has(.tag.final) .claim{font-size:clamp(1.75rem,2.6vw,2.65rem)!important;margin:10px 0!important}body:has(.tag.final) .evidence,body:has(.tag.final) .facts{margin-bottom:10px}
:root{--navy:#14263d;--paper:#f5f0e6;--white:#fffdf8;--ink:#1c2a38;--muted:#65717c;--gold:#c79535;--line:#d6d0c4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Montserrat,Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;justify-content:space-between;align-items:center;padding:17px clamp(18px,4vw,64px);background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}.kicker{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:#ead4a0;font-weight:800}.top h1{font:500 clamp(1.5rem,3vw,2.4rem)/1 Fraunces,Georgia,serif;margin:.25rem 0}.counter{font-weight:800;font-variant-numeric:tabular-nums}.main{width:min(1220px,94vw);margin:24px auto;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(330px,.88fr);background:var(--white);border:1px solid var(--line);box-shadow:0 16px 42px #14263d1c;min-height:660px}.photo{position:relative;min-height:420px;background:#d7d2c7;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo:after{content:"";position:absolute;inset:auto 0 0;height:32%;background:linear-gradient(transparent,#101e31aa)}.credit{position:absolute;z-index:2;left:16px;right:16px;bottom:12px;color:#fff;font-size:.68rem;text-shadow:0 1px 3px #000}.card{padding:clamp(24px,4vw,54px);display:flex;flex-direction:column}.tag{display:inline-block;padding:.35rem .62rem;border-radius:999px;background:#eee7d8;color:var(--navy);font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.tag.final{background:#7e2730;color:#fff}.claim{font:500 clamp(1.8rem,3.2vw,3.25rem)/1.08 Fraunces,Georgia,serif;color:var(--navy);margin:18px 0 22px}.evidence{border-left:5px solid var(--gold);padding:14px 18px;background:#f4efe5;margin-bottom:18px}.evidence strong{display:block;text-transform:uppercase;letter-spacing:.09em;font-size:.7rem;color:#795c20;margin-bottom:5px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.fact{border:1px solid var(--line);padding:11px 12px;background:#fff}.fact b{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.prompts{margin:0 0 20px;padding-left:1.25rem}.prompts li{margin:.35rem 0}.source{margin-top:auto;color:var(--navy);font-weight:800;text-decoration-thickness:2px;text-underline-offset:3px}.nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;background:var(--navy)}button{font:800 .8rem Montserrat,sans-serif;letter-spacing:.06em;text-transform:uppercase;border:1px solid #ffffff77;border-radius:4px;background:transparent;color:#fff;padding:.75rem 1.1rem;cursor:pointer}button:hover,button:focus-visible{background:var(--gold);color:var(--navy);outline:3px solid #fff;outline-offset:2px}.dots{display:flex;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:#ffffff55}.dot.on{background:var(--gold);transform:scale(1.35)}.clear{position:fixed;right:18px;bottom:76px;background:var(--white);border:1px solid var(--line);padding:9px 12px;box-shadow:0 8px 24px #0002;font-size:.7rem}.clear b{color:var(--navy)}@media(max-width:820px){.main{grid-template-columns:1fr;margin:12px auto}.photo{min-height:300px}.card{padding:26px}.claim{font-size:2rem}.facts{grid-template-columns:1fr}.clear{position:static;margin:0 auto 12px;width:min(94vw,700px)}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div>
<div class="kicker">Year 9 science · evidence desk</div>
<h1>Real-world claim lab</h1>
</div>
<div class="counter" aria-live="polite">01 / 10</div>
</header>
<main class="main">
<figure class="photo">
<img id="image" alt="">
<figcaption class="credit" id="credit">
</figcaption>
</figure>
<article class="card">
<div id="tags">
</div>
<h2 class="claim" id="claim">
</h2>
<div class="evidence">
<strong>Evidence snapshot</strong>
<span id="evidence">
</span>
</div>
<div class="facts">
<div class="fact">
<b>Evidence type</b>
<span id="method">
</span>
</div>
<div class="fact">
<b>Evaluation trap</b>
<span id="trap">
</span>
</div>
</div>
<ol class="prompts" id="prompts">
</ol>
<a class="source" id="source" target="_blank" rel="noopener">Open the named source ↗</a>
</article>
</main>
<aside class="clear">
<b>C.L.E.A.R.</b> Claim · Look · Examine · Apply limits · Reach a verdict</aside>
<nav class="nav">
<button id="prev">← Previous</button>
<div class="dots" id="dots">
</div>
<button id="next">Next →</button>
</nav>
</div>
<script>
const base='assets/real-world-claims/';const cards=[
['Health · screens','“Blue-light glasses reduce digital eye strain.”','blue-light-glasses.jpg','A pair of glasses in front of a computer screen','Photo: Document1 / Wikimedia Commons · CC BY-SA 3.0','A 2023 Cochrane review of 17 randomised trials found that blue-light filtering lenses may not reduce short-term eye strain compared with ordinary lenses. Evidence about sleep and retina effects was uncertain.','Systematic review of randomised trials','“May not” is not the same as “never works”',['What does the review actually measure?','Which part is supported, weakened or still uncertain?','Accept, adapt or reject—and what would your careful version say?'],'https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD013244.pub2/full'],
['Fitness · habits','“Everyone needs exactly 10,000 steps a day to be healthy.”','step-counter.jpg','A handheld mechanical step counter','Photo: Anagoria / Wikimedia Commons · CC BY 3.0','A meta-analysis of 15 studies found that more daily steps were associated with lower mortality risk, but benefits began below 10,000. The point where benefits levelled off differed between younger and older adults.','Meta-analysis of observational studies','A useful target becomes a magic threshold',['Does the evidence test “exactly,” “everyone” and “healthy”?','What can association show—and what can it not prove?','Rewrite the claim so its certainty and population fit the evidence.'],'https://pmc.ncbi.nlm.nih.gov/articles/PMC9289978/'],
['Social media · wellbeing','“Social media causes depression in every teenager.”','teen-social-media.jpg','A teenager using a mobile phone outdoors','Photo: TheEgdeLord / Wikimedia Commons · CC BY-SA 4.0','The US Surgeon General’s 2023 advisory reports both risks and benefits. Effects vary with time, content, individual vulnerability and social context; important causal questions remain unresolved.','Public-health advisory reviewing multiple evidence types','A complex association becomes universal causation',['Which word makes the claim easiest to challenge?','What variables could alter the effect?','What conclusion is useful without pretending all teenagers respond alike?'],'https://www.hhs.gov/surgeongeneral/reports-and-publications/youth-mental-health/social-media/index.html'],
['Technology · climate','“Electric cars have zero emissions.”','electric-car.jpg','An electric car connected to a charging station','Photo: Ivan Radic / Wikimedia Commons · CC BY 2.0','The US EPA states that fully electric vehicles have no tailpipe emissions. Manufacturing the vehicle and battery, and generating the electricity, can still cause emissions; lifetime totals are usually lower than for petrol vehicles.','Government evidence summary and lifecycle comparison','One stage stands for the whole lifecycle',['What boundary makes “zero” true?','Which emissions sit outside that boundary?','Write a verdict that distinguishes tailpipe from lifecycle emissions.'],'https://www.epa.gov/greenvehicles/electric-vehicle-myths'],
['School · nutrition','“Eating breakfast makes every pupil achieve better grades.”','breakfast.jpg','A bowl of breakfast cereal','Photo: USDA / Wikimedia Commons · public domain','A systematic review found some short-term benefits for attention, memory and executive function, especially among undernourished children. Few studies involved adolescents, and links with grades can be affected by other differences between pupils.','Systematic review of school-age studies','Short-term cognition and school grades become the same outcome',['What was measured: thinking during a task, or final grades?','Who appears most likely to benefit?','Which extra evidence would be needed for the original claim?'],'https://pubmed.ncbi.nlm.nih.gov/27184287/'],
['Sport · recovery','“Ice baths always speed recovery after sport.”','cold-water.jpg','Athletes completing cold-water immersion training','Photo: US Marine Corps / Wikimedia Commons · public domain','A 2023 meta-analysis found that cold-water immersion improved perceived soreness and some recovery measures after intense exercise. Effects on strength, power and flexibility were mixed or similar to passive recovery.','Systematic review and meta-analysis','One recovery measure is stretched to all recovery',['What does “recovery” need to be split into?','Which outcomes improved, and which did not clearly improve?','How should “always” change?'],'https://pubmed.ncbi.nlm.nih.gov/36527593/'],
['Gaming · learning','“Playing action video games improves intelligence.”','video-games.png','A simple illustration of a video-game controller','Graphic: Rickterto / Wikimedia Commons · CC BY 4.0','A meta-analysis reported small benefits for top-down attention and spatial cognition, with smaller effects after accounting for publication bias. It did not establish a broad increase in general intelligence.','Meta-analysis of training studies','Specific tested skills become “intelligence”',['Which cognitive skills were actually measured?','Why does publication bias matter?','Adapt the claim without losing the limited positive finding.'],'https://pubmed.ncbi.nlm.nih.gov/29172564/'],
['Environment · choices','“Paper bags are always greener than plastic bags.”','plastic-bag.jpg','A light plastic shopping bag','Photo: Jasmin Sessler / Wikimedia Commons · CC BY 4.0','A UK Environment Agency lifecycle study compared materials across manufacture, transport, use and disposal. Results changed with the environmental impact measured and how many times each bag was reused.','Lifecycle assessment','One material label replaces a whole-system comparison',['Which stages must a fair comparison include?','Why does number of reuses change the verdict?','What information should a shopper need before deciding?'],'https://www.gov.uk/government/publications/life-cycle-assessment-of-supermarket-carrierbags-a-review-of-the-bags-available-in-2006'],
['Running · equipment','“Nike Vaporfly shoes make every runner 4% faster.”','running-shoes.jpg','A pair of running shoes photographed from above','Photo: Josiah Mackenzie / Wikimedia Commons · CC BY 2.0','Laboratory studies reported about 4% lower energetic cost on average in tested runners wearing early Vaporfly models. Running economy is not the same measure as race time, and individual responses varied.','Controlled laboratory studies and review','Average efficiency becomes every person’s race-time gain',['What was 4% lower: energy cost or finishing time?','What does “on average” hide?','How could you report the result without using it as a guarantee?'],'https://pmc.ncbi.nlm.nih.gov/articles/PMC9189709/'],
['Final assessment · youth health','“Energy drinks are safe for every teenager.”','energy-drinks.jpg','Several cans of energy drink','Photo: Klooni / Wikimedia Commons · CC BY-SA 3.0','A systematic review reported links between energy-drink use and physical and mental health concerns in children and young people. Many included studies show associations, so they cannot prove that the drinks caused every outcome. The evidence does not support a guarantee of safety for every teenager.','Systematic review of youth health evidence','Evidence with limits becomes a universal safety promise',['Evaluate the exact population and outcome.','Explain that a link does not always prove a cause.','Use at least two limits in a 160–200 word independent verdict. This is evidence evaluation, not health advice.'],'https://pubmed.ncbi.nlm.nih.gov/38228408/']];
let i=0,$=x=>document.getElementById(x);function show(){let c=cards[i];$('image').src=base+c[2];$('image').alt=c[3];$('credit').textContent=c[4];$('claim').textContent=c[1];$('evidence').textContent=c[5];$('method').textContent=c[6];$('trap').textContent=c[7];$('prompts').innerHTML=c[8].map(x=>`<li>${x}</li>`).join('');$('source').href=c[9];$('tags').innerHTML=`<span class="tag ${i===9?'final':''}">${c[0]}</span>`;document.querySelector('.counter').textContent=`${String(i+1).padStart(2,'0')} / 10`;$('dots').innerHTML=cards.map((_,n)=>`<span class="dot ${n===i?'on':''}">
</span>`).join('');$('prev').disabled=i===0;$('next').textContent=i===9?'Back to start ↺':'Next →'}function move(n){i=(i+n+10)%10;show()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>i===9?(i=0,show()):move(1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});show();
</script>
</body>
</html>
