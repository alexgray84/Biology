<script>const lesson = {"shape":"discussion-and-evaluation","architecture_version":2,"phases":[{"type":"doNow","layout":"retrieval-sheet","label":"Start","nav":"1","title":"What did this week’s evidence show?","lead":"Answer four questions in your book. Work silently. Use evidence ideas from Lessons 1–3.","minutes":4,"points":["O or E? The dye moved 32 mm.","O or E? Moving water carried the dye.","Which is stronger: one result or repeated results?","Complete: A pattern can support a claim, but it does not always prove __."],"review":{"type":"answers","label":"Show the key idea","title":"Check your evidence ideas","body":"<p>1 Observation. 2 Explanation. 3 Repeated results. 4 Cause. These ideas help us test real-world claims.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Observation means what was measured or seen. Explanation means why it happened.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use: Item __ is an observation because it states __.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why repeated results still cannot prove a cause on their own.</p>"}},"product":"Four retrieval answers in your book"},{"type":"concept","layout":"visual-first-explanation","label":"Learn","nav":"2","title":"How do you check a claim?","lead":"Read the example. Copy the four labelled evidence parts into your book.","minutes":5,"visual":["Population · 20 adult runners","Method · cold bath compared with rest","Outcome · soreness score the next day","Limit · adults and soreness only","Decision · change the word always"],"claim":"Claim: Ice baths always speed recovery. Evidence: 20 adult runners reported slightly less soreness after a cold bath than after rest.","support":{"start":{"title":"Get started","heading":"","body":"<p>Look for words such as every, always, zero and exactly. These words make a claim very strong.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Ask three questions: Who was tested? What was measured? What did they do?</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why an answer can be useful even when it is not completely certain.</p>"}},"product":"Four labelled parts of the example in your book"},{"type":"model","layout":"worked-model","label":"Watch","nav":"3","title":"Watch how I check a claim","lead":"Open Card 1. Watch each check. Write your verdict before the final answer appears.","minutes":6,"steps":[{"text":"C: This claim is about eye strain from screens. It is not about sleep or damage to the eye."},{"text":"L: People using blue-light glasses had little or no short-term improvement compared with people using ordinary glasses."},{"text":"E: The review combined 17 fair comparison studies. This is stronger than one person’s story."},{"text":"A: The studies were short. Some other effects were still unclear, so we cannot make a claim about every possible effect."},{"text":"My first verdict said ‘never help with anything’. I cross out ‘never’ and ‘anything’ because the studies did not test every outcome.","weak":true}],"review":{"type":"wagoll","label":"Show the final answer","title":"A careful answer","body":"<p>In these studies, blue-light glasses did not reduce short-term eye strain compared with ordinary glasses. The studies do not prove that the glasses never affect sleep, eye health or any other outcome.</p>"},"resources":[{"label":"Open Card 1","href":"04 Real-world claim lab.html","kind":"reference"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>First, underline exactly what the claim says the glasses will improve.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>For each step, ask: What does the evidence show? What does it not show?</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why the rejected answer is just as overconfident as the original claim.</p>"}},"product":"Your predicted final answer in your book"},{"type":"data","layout":"evidence-workbench","label":"Work together","nav":"4","title":"Check one claim with your partner","lead":"Open one of Cards 2–5. Complete the evidence sheet with your partner.","minutes":7,"tasks":["Copy the claim and evidence type.","Write the finding and one limit.","Choose accept, change or reject. Explain why."],"review":{"type":"mark-scheme","label":"Show the partner check","title":"Did they include all five checks?","body":"<p>Check: exact claim, finding, evidence type, limit and decision.</p>"},"resources":[{"label":"Open Cards 2–5","href":"04 Real-world claim lab.html","kind":"task"},{"label":"Open evidence sheet","href":"04 Evaluate survival claims and design responsibly - Evidence Resource.html","kind":"worksheet"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Circle words such as every, always, zero or exactly. Start by checking that word.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use: The evidence supports __. It does not prove __ because __.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>What new test or information would help you feel more certain? Explain why.</p>"}},"assessment":{"type":"peer","label":"Peer assessment","detail":"A completed evidence sheet and a 30-second explanation"}},{"type":"practice","layout":"task-and-criteria","label":"Share and try","nav":"5","title":"Teach your claim. Check another claim.","lead":"Write your verdict silently. Then teach your card to your home group.","minutes":6,"tasks":["Experts: Rehearse the claim, finding, limit and decision.","Home group: Each expert teaches one different card. Listeners record all four parts.","On your own: Use another expert’s card. Write a two-sentence verdict."],"criteria":["Use only evidence from the card","Say exactly what the evidence cannot show","Everyone writes their own answer"],"resources":[{"label":"Open Cards 6–9","href":"04 Real-world claim lab.html","kind":"task"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Ask: Which word in the claim is not supported by the evidence?</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Ask: Would your decision change if __? Explain why.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Compare two cards. How does each one make the evidence sound stronger than it really is?</p>"}},"product":"Notes from another speaker and your own two-sentence answer"},{"type":"hinge","layout":"diagnostic-decision","label":"Check","nav":"6","title":"Link or cause?","lead":"Write A–D and one reason on your whiteboard.","minutes":4,"support":false,"choices":["Breakfast causes grades.","There is a link, not proof.","There is no useful evidence.","It is true for everyone."],"answer":1,"feedback":"B: a link does not prove a cause.","recheck":"Screen use links with less sleep. Is a cause proved?","callout":"Skipping breakfast is linked with poor grades. What follows?","product":"Your A–D choice and one reason on your whiteboard"},{"type":"ai","layout":"claim-verification","label":"AI feedback","nav":"7","title":"Check the AI feedback","lead":"Write one problem with the draft before opening the feedback.","minutes":5,"tasks":["Label each suggestion. Explain one choice. Rewrite one sentence."],"claim":"You decide what to use.","review":{"type":"worked-solution","label":"Show the key idea","title":"You made the important decisions","body":"<p>You checked the feedback and made the revision.</p>"},"resources":[{"label":"Open prepared AI feedback","href":"04 Prepared AI feedback editor.html","kind":"task"}],"support":{"start":{"title":"Get started","heading":"","body":"<p>Find the words proves and no pollution in the draft. Ask whether the evidence supports them.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Good feedback matches the claim to the evidence.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Choose one suggestion that sounds helpful but could make the answer worse. Explain why.</p>"}},"assessment":{"type":"self","label":"Self-assessment","detail":"Four decisions and one rewritten sentence on the sheet"}},{"type":"exit","layout":"quiet-exit","label":"Your final answer","nav":"8","title":"Write your final answer","lead":"Open Card 10 and the final sheet. Work alone. Write 160–200 words.","minutes":8,"tasks":["State what the evidence found. Copy the evidence type shown on Card 10.","Explain two limits: who was studied, what was measured or what remains uncertain.","Accept, change or reject the claim. Do not give health advice."],"criteria":["I answer the exact claim","I use the evidence correctly","I explain two limits","My final decision matches the evidence"],"review":{"type":"wagoll","label":"Show after work is collected","title":"Example answer","body":"<p>The claim should be rejected. A systematic review reported links between energy-drink use and several physical and mental health concerns in children and young people. The studies do not prove that every drink causes harm to every teenager, and many findings show links rather than causes. However, the evidence does not support saying the drinks are safe for everyone. This is an evaluation of the claim, not health advice.</p>"},"resources":[{"label":"Open Card 10","href":"04 Real-world claim lab.html","kind":"assessment"},{"label":"Open final evidence sheet","href":"04 Evaluate survival claims and design responsibly - Evidence Resource.html","kind":"assessment"}],"support":false,"assessment":{"type":"teacher","label":"Teacher-marked evidence","detail":"Your 160–200 word final answer on the evidence sheet"}},{"type":"practice","layout":"task-and-criteria","label":"Improve","nav":"9","title":"Improve one sentence","lead":"Keep your first answer visible. Use another colour. Improve one sentence.","minutes":2,"tasks":["Underline the evidence you used.","Box your two limits and circle your decision.","Rewrite one sentence if its certainty is wrong."],"criteria":["Evidence used correctly","Two limits explained","Final decision matches the evidence"],"review":{"type":"mark-scheme","label":"Reveal final check","title":"Make the meaning better","body":"<p>Improve the evidence, a limit, the claim’s scope or its certainty.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>If you did not underline anything, add one sentence that states what the evidence found.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>If you cannot find two limits, ask: Who was tested? What was measured? What changed between people?</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Make your final decision useful without turning it into a promise or guarantee.</p>"}},"assessment":{"type":"self","label":"Self-assessment","detail":"One improved sentence in a different colour"}}]};
