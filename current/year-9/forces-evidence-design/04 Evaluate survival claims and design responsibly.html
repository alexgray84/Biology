<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4eee1">
  <title>Evaluate survival claims and design responsibly | Year 9 Science</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-950: oklch(20% 0.085 258);
      --navy-900: oklch(25% 0.10 258);
      --navy-700: oklch(36% 0.12 258);
      --navy-100: oklch(93% 0.025 258);
      --gold-600: oklch(50% 0.13 82);
      --gold-500: oklch(76% 0.16 82);
      --gold-100: oklch(94% 0.035 82);
      --paper-50: oklch(99% 0.008 82);
      --paper-100: oklch(98% 0.012 82);
      --paper-200: oklch(95% 0.022 82);
      --ink-900: oklch(22% 0.015 75);
      --ink-600: oklch(43% 0.02 258);
      --line: oklch(36% 0.04 258 / 0.18);
      --line-strong: oklch(36% 0.06 258 / 0.34);
      --push: oklch(39% 0.14 258);
      --resist: oklch(43% 0.10 30);
      --success: oklch(40% 0.09 155);
      --surface-shadow: 0 18px 50px oklch(25% 0.08 258 / 0.08);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --sans: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper-200); }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--paper-200); color: var(--ink-900); font: 400 1rem/1.5 var(--sans); }
    button { font: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 3px solid var(--gold-500); outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: 0.38; }
    .skip-link { position: fixed; left: 16px; top: -80px; z-index: 50; padding: 10px 16px; border-radius: 8px; background: var(--navy-950); color: var(--paper-100); font-weight: 700; }
    .skip-link:focus { top: 16px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .app { width: 100%; min-width: 0; min-height: 100vh; display: grid; grid-template-rows: 68px 3px minmax(0, 1fr) 54px 62px; }
    .app > * { min-width: 0; }
    .topbar { display: flex; align-items: center; gap: 14px; padding: 8px 20px; background: var(--paper-50); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-copy { min-width: 0; }
    .eyebrow { color: var(--ink-600); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; }
    .topic { margin: 1px 0 0; color: var(--navy-950); font: 400 1.35rem/1.1 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topic em { color: var(--gold-600); font-weight: 400; }
    .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .view-label { color: var(--ink-600); font-size: 0.75rem; font-weight: 700; }
    .control, .icon-control, .tool-control, .choice, .support-tab, .phase-link, .reveal-control, .timer-control {
      border: 1px solid var(--line);
      background: var(--paper-50);
      color: var(--navy-950);
      cursor: pointer;
      transition: background 140ms var(--ease-out), border-color 140ms var(--ease-out), color 140ms var(--ease-out), transform 140ms var(--ease-out);
    }
    .control { min-height: 44px; padding: 9px 15px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
    .control.primary { background: var(--navy-900); border-color: var(--navy-900); color: var(--paper-100); }
    .control:hover, .icon-control:hover, .tool-control:hover, .reveal-control:hover, .timer-control:hover { border-color: var(--navy-700); background: var(--navy-100); }
    .control.primary:hover { background: var(--navy-700); color: var(--paper-100); }
    .control:active, .icon-control:active, .tool-control:active, .reveal-control:active, .timer-control:active { transform: translateY(1px); }
    .progress-track { height: 3px; background: var(--navy-100); }
    .progress-value { display: block; height: 100%; width: 0; background: var(--gold-500); transition: width 220ms var(--ease-out); }

    .workspace { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px 20px; }
    .workspace.has-drawer { grid-template-columns: minmax(0, 1fr) minmax(330px, 382px); }
    .lesson-stage, .student-drawer { min-width: 0; min-height: 0; overflow: hidden; border: 1px solid var(--line); background: var(--paper-100); }
    .lesson-stage { position: relative; border-radius: 20px; box-shadow: var(--surface-shadow); }
    .screen { height: 100%; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: clamp(28px, 4.5vh, 52px) clamp(32px, 5.6vw, 78px); animation: screen-enter 220ms var(--ease-out); }
    .screen-heading { margin: 8px 0 14px -0.035em; max-width: 24ch; color: var(--navy-950); font: 350 clamp(2.5rem, 4vw, 3.75rem)/0.99 var(--serif); letter-spacing: -0.035em; text-wrap: balance; }
    .screen-heading:focus, .drawer-head h2:focus { outline: none; }
    .screen-lead { max-width: 68ch; margin: 0; color: var(--ink-600); font-size: clamp(1rem, 1.3vw, 1.2rem); line-height: 1.5; text-wrap: pretty; }
    .screen-kicker { color: var(--ink-600); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
    .screen-kicker strong { color: var(--gold-600); }
    .micro-instruction { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 20px; color: var(--navy-950); font-size: 0.9rem; font-weight: 700; }
    .micro-instruction span { display: inline-flex; align-items: center; gap: 7px; }
    .micro-instruction span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold-500); }

    .do-now-layout { display: grid; grid-template-columns: minmax(0, 0.72fr) minmax(0, 1.28fr); gap: clamp(36px, 6vw, 84px); align-items: center; }
    .do-now-number { margin: 2px 0 14px; color: var(--gold-500); font: 300 clamp(5.5rem, 9vw, 8rem)/0.78 var(--serif); font-variant-numeric: lining-nums; }
    .question-sheet { counter-reset: question; display: grid; gap: 0; border-top: 1px solid var(--line-strong); }
    .question-row { counter-increment: question; display: grid; grid-template-columns: 38px 1fr; gap: 14px; align-items: start; padding: 14px 4px; border-bottom: 1px solid var(--line); color: var(--navy-950); font-size: clamp(1rem, 1.3vw, 1.15rem); font-weight: 600; }
    .question-row::before { content: counter(question, decimal-leading-zero); color: var(--gold-600); font: 500 0.82rem/1.8 var(--serif); }

    .question-stage { max-width: 1120px; }
    .question-stage .screen-heading { max-width: 22ch; font-size: clamp(3rem, 5.3vw, 5.2rem); }
    .prediction { display: flex; gap: 10px; margin-top: 26px; }
    .choice { min-width: 150px; min-height: 48px; padding: 10px 18px; border-radius: 12px; font-weight: 700; text-align: left; }
    .choice:hover, .choice[aria-pressed="true"] { border-color: var(--navy-700); background: var(--navy-900); color: var(--paper-100); }
    .commitment { min-height: 26px; margin-top: 14px; color: var(--ink-600); font-size: 0.9rem; font-weight: 600; }

    .concept-layout { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: clamp(40px, 7vw, 96px); align-items: center; }
    .principles { display: grid; border-top: 1px solid var(--line-strong); }
    .principle { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .principle span:first-child { color: var(--gold-600); font: 500 0.8rem/1.8 var(--serif); }
    .principle p { margin: 0; color: var(--navy-950); font-size: 1.02rem; font-weight: 600; }
    .key-statement { margin-top: 24px; padding: 18px 20px; border: 1px solid var(--navy-900); border-radius: 12px; background: var(--navy-900); color: var(--paper-100); }
    .key-statement span { display: block; margin-bottom: 4px; color: var(--gold-500); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .key-statement p { margin: 0; font: 350 1.35rem/1.3 var(--serif); }

    .model-layout { display: grid; grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
    .diagram-wrap { min-width: 0; padding-block: 16px; }
    .force-diagram { display: block; width: 100%; height: auto; max-height: 340px; overflow: visible; }
    .force-diagram text { font-family: var(--sans); }
    .force-arrow { stroke-linecap: round; stroke-width: 9; }
    .force-arrow.push { stroke: var(--push); }
    .force-arrow.resist { stroke: var(--resist); }
    .motion-path { stroke: var(--gold-500); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 12 11; animation: motion-flow 1.2s linear infinite; }
    .diagram-label { fill: var(--navy-950); font-size: 18px; font-weight: 700; }
    .diagram-label.resist { fill: var(--resist); }
    .diagram-result { fill: var(--navy-950); font: 400 27px var(--serif) !important; }
    .diagram-result, .resultant-arrow { transition: opacity 220ms var(--ease-out); }
    .diagram-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .reveal-control, .timer-control { min-height: 44px; padding: 9px 14px; border-radius: 999px; font-size: 0.86rem; font-weight: 750; }
    .reveal-control.primary { border-color: var(--navy-900); background: var(--navy-900); color: var(--paper-100); }
    .step-list { display: grid; gap: 0; margin-top: 20px; border-top: 1px solid var(--line-strong); }
    .model-step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--line); animation: step-enter 200ms var(--ease-out); }
    .model-step span:first-child { color: var(--gold-600); font: 500 0.82rem/1.8 var(--serif); }
    .model-step p { margin: 0; font-weight: 600; }

    .hinge-layout { max-width: 1080px; }
    .hinge-layout .screen-heading { max-width: 25ch; font-size: clamp(2.6rem, 4.3vw, 4.2rem); }
    .answer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
    .answer-option { min-height: 64px; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-50); color: var(--ink-900); text-align: left; cursor: pointer; }
    .answer-option:hover, .answer-option[aria-pressed="true"] { border-color: var(--navy-700); background: var(--navy-100); }
    .answer-option.is-correct { border-color: var(--success); background: oklch(94% 0.025 155); }
    .answer-letter { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--navy-700); font-size: 0.82rem; font-weight: 800; }
    .answer-feedback { min-height: 50px; margin-top: 12px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-200); color: var(--navy-950); }
    .answer-feedback:empty { min-height: 0; margin: 0; padding: 0; border: 0; }

    .practice-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: clamp(36px, 6vw, 82px); align-items: center; }
    .task-list { counter-reset: task; margin-top: 20px; border-top: 1px solid var(--line-strong); }
    .task-item { counter-increment: task; display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
    .task-item::before { content: counter(task); color: var(--gold-600); font: 500 0.9rem/1.65 var(--serif); }
    .success-list { padding: 24px 0 24px 28px; border-left: 1px solid var(--line-strong); }
    .success-list h2 { margin: 0 0 14px; color: var(--navy-950); font: 400 1.55rem var(--serif); }
    .success-list p { display: flex; gap: 9px; margin: 10px 0; color: var(--ink-600); font-size: 0.92rem; }
    .success-list p::before { content: "✓"; color: var(--gold-600); font-weight: 800; }

    .source-claim { max-width: 950px; margin: 22px 0 0; padding: clamp(22px, 3vw, 34px); border: 1px solid var(--line-strong); border-radius: 14px; background: var(--paper-50); }
    .source-label { margin-bottom: 12px; color: var(--ink-600); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; }
    .source-claim blockquote { margin: 0; max-width: 34ch; color: var(--navy-950); font: 350 clamp(1.65rem, 2.5vw, 2.45rem)/1.18 var(--serif); text-wrap: balance; }
    .verification-steps { display: flex; flex-wrap: wrap; gap: 16px 28px; margin-top: 20px; color: var(--navy-950); font-weight: 700; }
    .verification-steps span { display: inline-flex; align-items: center; gap: 8px; }
    .verification-steps b { color: var(--gold-600); font-family: var(--serif); }

    .exit-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.42fr); gap: clamp(48px, 8vw, 112px); align-items: center; }
    .exit-mark { color: var(--gold-500); font: 300 clamp(5rem, 8vw, 7.5rem)/0.8 var(--serif); }
    .exit-question { margin: 16px 0 0; max-width: 42ch; color: var(--navy-950); font: 350 clamp(1.7rem, 2.6vw, 2.5rem)/1.17 var(--serif); }
    .timer-panel { padding: 28px 0 28px 32px; border-left: 1px solid var(--line-strong); }
    .timer-value { color: var(--navy-950); font: 350 clamp(3.5rem, 5.5vw, 5rem)/1 var(--serif); font-variant-numeric: tabular-nums; }
    .timer-note { margin: 8px 0 18px; color: var(--ink-600); font-size: 0.86rem; }

    .student-drawer { display: grid; grid-template-rows: auto auto minmax(0, 1fr); border-radius: 18px; box-shadow: var(--surface-shadow); animation: drawer-enter 240ms var(--ease-out); }
    .student-drawer[hidden] { display: none; }
    .drawer-head { display: flex; align-items: start; gap: 16px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 0; color: var(--navy-950); font: 400 1.55rem/1.1 var(--serif); }
    .drawer-head p { margin: 5px 0 0; color: var(--ink-600); font-size: 0.8rem; line-height: 1.4; }
    .icon-control { width: 44px; height: 44px; flex: 0 0 44px; display: grid; place-items: center; margin-left: auto; border-radius: 50%; font-size: 1.25rem; font-weight: 500; }
    .drawer-tabs { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .support-tab { min-height: 38px; padding: 7px 10px; border-color: transparent; border-radius: 999px; color: var(--ink-600); font-size: 0.72rem; font-weight: 750; white-space: nowrap; }
    .support-tab[aria-selected="true"] { background: var(--navy-900); color: var(--paper-100); }
    .drawer-body { min-height: 0; padding: 18px; overflow: auto; }
    .drawer-section-title { margin: 0 0 14px; color: var(--gold-600); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .support-list { display: grid; gap: 0; border-top: 1px solid var(--line-strong); }
    .support-item { padding: 13px 2px; border-bottom: 1px solid var(--line); }
    .support-item h3 { margin: 0; color: var(--navy-950); font-size: 0.92rem; line-height: 1.4; }
    .support-item p { margin: 5px 0 0; color: var(--ink-600); font-size: 0.8rem; line-height: 1.45; }
    .journey-list { display: grid; gap: 2px; }
    .phase-link { width: 100%; min-height: 42px; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 7px 9px; border-color: transparent; border-radius: 8px; text-align: left; font-size: 0.78rem; }
    .phase-link[aria-current="step"] { background: var(--navy-100); color: var(--navy-950); font-weight: 750; }
    .phase-link span:first-child { color: var(--gold-600); font-family: var(--serif); }
    .phase-link small { color: var(--ink-600); }

    .student-tools { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 5px 20px; }
    .tool-control { min-height: 42px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 750; }
    .tool-control[aria-pressed="true"] { border-color: var(--navy-900); background: var(--navy-900); color: var(--paper-100); }
    .tool-icon { font-size: 0.92rem; line-height: 1; }
    .support-tool { border-color: var(--gold-500); }

    .lesson-nav { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 16px; padding: 7px 20px 10px; border-top: 1px solid var(--line); background: var(--paper-50); }
    .nav-control { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--paper-50); color: var(--navy-950); cursor: pointer; font-size: 1.2rem; font-weight: 700; }
    .nav-control:hover { border-color: var(--navy-700); background: var(--navy-100); }
    .nav-context { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
    .phase-context { min-width: 0; }
    .phase-context small { display: block; color: var(--ink-600); font-size: 0.68rem; font-weight: 750; letter-spacing: 0.11em; text-transform: uppercase; }
    .phase-context strong { display: block; overflow: hidden; color: var(--navy-950); font: 400 1.12rem/1.2 var(--serif); text-overflow: ellipsis; white-space: nowrap; }
    .next-context { color: var(--ink-600); font-size: 0.72rem; text-align: right; }
    .next-context strong { color: var(--navy-950); }

    .present-bar { display: none; align-items: center; gap: 12px; padding: 6px 18px; background: var(--navy-950); color: var(--paper-100); }
    .present-meta { min-width: 0; }
    .present-meta small { display: block; color: var(--gold-500); font-size: 0.66rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .present-meta strong { display: block; overflow: hidden; font: 400 1rem var(--serif); text-overflow: ellipsis; white-space: nowrap; }
    .present-actions { display: flex; gap: 7px; margin-left: auto; }
    .present-actions .control { min-height: 38px; padding: 7px 12px; border-color: oklch(90% 0.02 82 / 0.24); background: transparent; color: var(--paper-100); font-size: 0.72rem; }
    .present-actions .control:hover { background: oklch(90% 0.02 82 / 0.12); }

    .app[data-mode="present"] { height: 100vh; grid-template-rows: 50px 3px minmax(0, 1fr) 64px; overflow: hidden; background: var(--paper-100); }
    .app[data-mode="present"] .topbar, .app[data-mode="present"] .student-tools, .app[data-mode="present"] .student-drawer { display: none; }
    .app[data-mode="present"] .present-bar { display: flex; }
    .app[data-mode="present"] .workspace { padding: 0; }
    .app[data-mode="present"] .lesson-stage { border: 0; border-radius: 0; box-shadow: none; }
    .app[data-mode="present"] .screen { padding: clamp(38px, 6vh, 72px) clamp(58px, 7vw, 108px); }
    .app[data-mode="present"] .screen-heading { font-size: clamp(3.5rem, 5.5vw, 5.5rem); }
    .app[data-mode="present"] .screen-lead { font-size: clamp(1.28rem, 1.8vw, 1.7rem); }
    .app[data-mode="present"] .question-row { font-size: clamp(1.2rem, 1.7vw, 1.55rem); padding-block: 16px; }
    .app[data-mode="present"] .principle p, .app[data-mode="present"] .task-item { font-size: clamp(1.05rem, 1.45vw, 1.3rem); }
    .app[data-mode="present"] .lesson-nav { background: var(--navy-950); border-color: transparent; color: var(--paper-100); }
    .app[data-mode="present"] .nav-control { border-color: oklch(90% 0.02 82 / 0.24); background: transparent; color: var(--paper-100); }
    .app[data-mode="present"] .nav-control:hover { background: oklch(90% 0.02 82 / 0.12); }
    .app[data-mode="present"] .phase-context small, .app[data-mode="present"] .next-context { color: oklch(90% 0.02 82 / 0.64); }
    .app[data-mode="present"] .phase-context strong, .app[data-mode="present"] .next-context strong { color: var(--paper-100); }

    @media (min-width: 1021px) {
      .workspace.has-drawer .screen { padding-inline: clamp(28px, 3vw, 46px); }
      .workspace.has-drawer .do-now-layout,
      .workspace.has-drawer .concept-layout,
      .workspace.has-drawer .model-layout,
      .workspace.has-drawer .practice-layout,
      .workspace.has-drawer .exit-layout { gap: clamp(22px, 3vw, 42px); }
      .workspace.has-drawer .force-diagram { max-height: 270px; }
    }


    .topic { line-height: 1.3; }
    .screen-practice .task-list { margin-top: 14px; }
    .screen-practice .task-item { padding-block: 9px; }
    .bubble { animation: bubble-rise 1.55s var(--ease-out) infinite; transform-origin: center; }
    .bubble.delay { animation-delay: 620ms; }
    .bubble.slow { animation-duration: 2.1s; animation-delay: 260ms; }
    @keyframes bubble-rise { from { transform: translateY(28px); opacity: 0; } 35% { opacity: 1; } to { transform: translateY(-62px); opacity: 0; } }
    .diagram-kicker { fill:var(--navy-950); font-size:14px; font-weight:850; letter-spacing:.07em; }
    .variables-diagram .variable-chip,.variables-diagram .control-group,.variables-diagram .endpoint-card { animation:diagram-settle .5s var(--ease-out) both; }
    .variables-diagram .measure-chip { animation-delay:100ms; }

  <script>
    (() => {
      const lesson = {
        "title": "Evaluate survival claims and design responsibly",
        "objectives": [
                [
                        "Verify a claim",
                        "Match exact wording to named evidence."
                ],
                [
                        "Expose uncertainty",
                        "State what the evidence cannot establish."
                ],
                [
                        "Design responsibly",
                        "Propose a testable next step without making safety claims."
                ]
        ],
        "vocabulary": [
                [
                        "Verified",
                        "Directly supported by an inspectable and relevant source."
                ],
                [
                        "Unsupported",
                        "Not supported by the evidence available."
                ],
                [
                        "Uncertain",
                        "Some relevant evidence exists, but it is incomplete or indirect."
                ],
                [
                        "Cognitive offloading",
                        "Using a tool to perform thinking the learner was meant to develop."
                ]
        ],
        "resources": [
                [
                        "Marked evidence resource",
                        "Complete independently and keep the first judgement visible."
                ],
                [
                        "Week 1 evidence",
                        "Tow-model table, dispersal record and method notes only."
                ],
                [
                        "Prepared AI claim",
                        "Teacher checked; no live prompting or pupil data."
                ],
                [
                        "Safety boundary",
                        "This is evidence literacy, not shark-safety advice."
                ]
        ],
        "phases": [
                {
                        "nav": "Do now",
                        "label": "Human first",
                        "type": "doNow",
                        "title": "Judge before the machine speaks",
                        "lead": "Classify each claim as supported, unsupported or uncertain. Give one evidence reason.",
                        "questions": [
                                "Shape B required less tow force in the classroom model.",
                                "Streamlining removes all drag.",
                                "Warmer water proves diffusion is faster.",
                                "A design based on these results guarantees swimmer safety."
                        ]
                },
                {
                        "nav": "Verification model",
                        "label": "Explain",
                        "type": "concept",
                        "visual": "verification",
                        "title": "Confidence is not evidence",
                        "lead": "Scientific verification is a sequence of inspectable decisions.",
                        "principles": [
                                "Extract the exact claim; do not judge a vague impression.",
                                "Name and inspect the evidence source.",
                                "Ask whether the evidence directly matches the claim.",
                                "Record uncertainty before accepting, adapting or rejecting."
                        ],
                        "key": "A fluent answer, an expert tone or an AI label cannot replace traceable evidence."
                },
                {
                        "nav": "Evidence inventory",
                        "label": "Orient",
                        "type": "data",
                        "title": "Know what each Week 1 source can actually support",
                        "lead": "The boundary of the source becomes the boundary of the claim.",
                        "columns": [
                                "Evidence source",
                                "Can support",
                                "Cannot support"
                        ],
                        "rows": [
                                [
                                        "Tow-model table",
                                        "Shape comparison at one tested speed",
                                        "Zero drag or living-shark performance"
                                ],
                                [
                                        "Dispersal record",
                                        "Visible colour-time pattern",
                                        "Diffusion alone or open-water behaviour"
                                ],
                                [
                                        "Method notes",
                                        "Controls, changes and limitations",
                                        "A safety guarantee"
                                ]
                        ],
                        "note": "No Week 1 source provides shark-safety guidance.",
                        "revealable": false
                },
                {
                        "nav": "Prepared AI claim",
                        "label": "AI literacy",
                        "type": "ai",
                        "title": "A fluent claim can still fail every evidence check",
                        "lead": "Read once. Do not edit the prose. Audit the science and the evidence match.",
                        "claim": "Shark-like streamlining eliminates drag. Warm UAE waters make chemical signals spread faster, so a dye deterrent would guarantee swimmer safety.",
                        "support": {
                                "start": [
                                        [
                                                "Extract three claims",
                                                "Separate drag, dispersal mechanism and safety guarantee."
                                        ]
                                ],
                                "explain": [
                                        [
                                                "Trace each source",
                                                "Which Week 1 evidence would the claim need to cite?"
                                        ]
                                ],
                                "extend": [
                                        [
                                                "Identify offloading",
                                                "Explain what learning would be lost if AI supplied the final judgement."
                                        ]
                                ]
                        }
                },
                {
                        "nav": "Worked verification",
                        "label": "Model",
                        "type": "model",
                        "visual": "verification",
                        "title": "Reject the guarantee; adapt the testable idea",
                        "lead": "Follow the reasoning, then use the same structure on a different claim.",
                        "steps": [
                                "Extract: “streamlining eliminates drag”. The tow model only shows a lower force for one shape. Reject.",
                                "Extract: “warm water proves chemical signals spread faster”. The dye test shows visible dispersal and is confounded by convection. Reject as written.",
                                "Extract: “guarantee swimmer safety”. No Week 1 source tests safety. Reject completely.",
                                "Adapt: a model shape required less tow force at one speed; further controlled tests could examine a specific design feature.",
                                "Disclose: the original paragraph was teacher-prepared AI-style text and was not treated as an authority."
                        ],
                        "support": {
                                "start": [
                                        [
                                                "Use one row at a time",
                                                "Claim → source → match → uncertainty → decision."
                                        ]
                                ],
                                "explain": [
                                        [
                                                "Keep decisions distinct",
                                                "Rejecting one claim does not mean every idea in the paragraph is false."
                                        ]
                                ],
                                "extend": [
                                        [
                                                "Design the next test",
                                                "Choose the largest uncertainty and specify evidence that would reduce it."
                                        ]
                                ]
                        }
                },
                {
                        "nav": "Hinge check",
                        "label": "Decide",
                        "type": "hinge",
                        "title": "Which change most strengthens a scientific claim?",
                        "options": [
                                [
                                        "Use more confident wording.",
                                        false,
                                        "Tone does not make evidence more relevant or reliable."
                                ],
                                [
                                        "Name an inspectable source that directly supports the exact claim.",
                                        true,
                                        "Correct. Traceability and direct relevance make verification possible."
                                ],
                                [
                                        "Add more technical vocabulary.",
                                        false,
                                        "Jargon can make an unsupported claim sound stronger without improving it."
                                ],
                                [
                                        "State that AI generated it.",
                                        false,
                                        "Disclosure matters, but an AI label is not scientific evidence."
                                ]
                        ],
                        "support": {
                                "start": [
                                        [
                                                "Ask “can I inspect it?”",
                                                "A source must be available and named."
                                        ]
                                ],
                                "explain": [
                                        [
                                                "Ask “does it match?”",
                                                "A real source can still be irrelevant to the exact claim."
                                        ]
                                ],
                                "extend": [
                                        [
                                                "Evaluate authority",
                                                "Explain why a prestigious but indirect source may be weaker than simple direct evidence."
                                        ]
                                ]
                        }
                },
                {
                        "nav": "Marked evidence",
                        "label": "Teacher-marked",
                        "type": "practice",
                        "assessment": {
                                "type": "teacher",
                                "label": "Teacher-marked evidence",
                                "detail": "Complete independently. Keep the first judgement visible for later feedback."
                        },
                        "visual": "verificationGrid",
                        "title": "Verify four claims and own the decision",
                        "lead": "Complete independently. This is the teacher-marked evidence for Friday review.",
                        "tasks": [
                                "Copy the exact claim and name the available source.",
                                "Classify it verified, unsupported or uncertain.",
                                "Accept, adapt or reject with a scientific reason.",
                                "State one additional source or test that would reduce the key uncertainty."
                        ],
                        "criteria": [
                                "Every decision names evidence",
                                "The evidence directly matches the claim",
                                "Uncertainty and AI provenance are disclosed"
                        ],
                        "support": {
                                "start": [
                                        [
                                                "Use the five headings",
                                                "Claim, source, match, uncertainty, decision."
                                        ]
                                ],
                                "explain": [
                                        [
                                                "Keep the first judgement",

ext x="442" y="225" text-anchor="middle" class="diagram-label">04</text></g><g><circle cx="566" cy="146" r="46" fill="var(--paper-50)" stroke="var(--navy-700)" stroke-width="3"/><text x="566" y="151" text-anchor="middle" fill="var(--navy-950)" font-size="15" font-weight="800">ENDPOINT</text><line x1="614" y1="146" x2="636" y2="146" stroke="var(--gold-600)" stroke-width="3" marker-end="url(#seq-head)"/><text x="566" y="225" text-anchor="middle" class="diagram-label">05</text></g><g><circle cx="690" cy="146" r="46" fill="var(--navy-900)" stroke="var(--navy-700)" stroke-width="3"/><text x="690" y="151" text-anchor="middle" fill="var(--paper-100)" font-size="15" font-weight="800">RECORD</text><text x="690" y="225" text-anchor="middle" class="diagram-label">06</text></g><text x="380" y="286" text-anchor="middle" class="diagram-result">same method · every trial · originals stay visible</text></g></svg>`;
  if (kind === 'dispersalGraph') return `<svg class="force-diagram" viewBox="0 0 760 330" role="img" aria-label="Synthetic classroom graph showing mean visible dispersal time decreasing from 96 seconds at 20 degrees Celsius to 38 seconds at 50 degrees Celsius."><g aria-hidden="true"><line x1="104" y1="270" x2="690" y2="270" stroke="var(--navy-950)" stroke-width="3"/><line x1="104" y1="270" x2="104" y2="48" stroke="var(--navy-950)" stroke-width="3"/><polyline points="195,76 390,153 585,224" fill="none" stroke="var(--gold-600)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g fill="var(--navy-900)" stroke="var(--paper-50)" stroke-width="3"><circle cx="195" cy="76" r="10"/><circle cx="390" cy="153" r="10"/><circle cx="585" cy="224" r="10"/></g><text x="195" y="54" text-anchor="middle" class="diagram-label">96 s</text><text x="390" y="131" text-anchor="middle" class="diagram-label">61 s</text><text x="585" y="202" text-anchor="middle" class="diagram-label">38 s</text><text x="195" y="299" text-anchor="middle" class="diagram-label">20 °C</text><text x="390" y="299" text-anchor="middle" class="diagram-label">35 °C</text><text x="585" y="299" text-anchor="middle" class="diagram-label">50 °C</text><text x="27" y="164" transform="rotate(-90 27 164)" text-anchor="middle" class="diagram-label">mean time / s</text><text x="678" y="48" text-anchor="end" class="diagram-kicker">SYNTHETIC DATA</text></g></svg>`;
  return `<svg class="force-diagram" viewBox="0 0 760 330" role="img" aria-label="Scientific verification chain: exact claim, named source, evidence match, uncertainty and accept, adapt or reject decision."><g aria-hidden="true"><defs><marker id="verify-head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="var(--gold-600)"/></marker></defs><g><rect x="18" y="105" width="128" height="112" rx="15" fill="var(--paper-50)" stroke="var(--line-strong)" stroke-width="2"/><text x="82" y="151" text-anchor="middle" fill="var(--navy-950)" font-size="14" font-weight="800">EXACT CLAIM</text><text x="82" y="185" text-anchor="middle" fill="var(--ink-600)" font-size="13" font-weight="650">extract</text><line x1="146" y1="161" x2="165" y2="161" stroke="var(--gold-600)" stroke-width="3" marker-end="url(#verify-head)"/></g><g><rect x="167" y="105" width="128" height="112" rx="15" fill="var(--paper-50)" stroke="var(--line-strong)" stroke-width="2"/><text x="231" y="151" text-anchor="middle" fill="var(--navy-950)" font-size="14" font-weight="800">NAMED SOURCE</text><text x="231" y="185" text-anchor="middle" fill="var(--ink-600)" font-size="13" font-weight="650">inspect</text><line x1="295" y1="161" x2="314" y2="161" stroke="var(--gold-600)" stroke-width="3" marker-end="url(#verify-head)"/></g><g><rect x="316" y="105" width="128" height="112" rx="15" fill="var(--paper-50)" stroke="var(--line-strong)" stroke-width="2"/><text x="380" y="151" text-anchor="middle" fill="var(--navy-950)" font-size="14" font-weight="800">DIRECT MATCH</text><text x="380" y="185" text-anchor="middle" fill="var(--ink-600)" font-size="13" font-weight="650">compare</text><line x1="444" y1="161" x2="463" y2="161" stroke="var(--gold-600)" stroke-width="3" marker-end="url(#verify-head)"/></g><g><rect x="465" y="105" width="128" height="112" rx="15" fill="var(--paper-50)" stroke="var(--line-strong)" stroke-width="2"/><text x="529" y="151" text-anchor="middle" fill="var(--navy-950)" font-size="14" font-weight="800">UNCERTAINTY</text><text x="529" y="185" text-anchor="middle" fill="var(--ink-600)" font-size="13" font-weight="650">disclose</text><line x1="593" y1="161" x2="612" y2="161" stroke="var(--gold-600)" stroke-width="3" marker-end="url(#verify-head)"/></g><g><rect x="614" y="105" width="128" height="112" rx="15" fill="var(--navy-900)" stroke="var(--navy-900)" stroke-width="2"/><text x="678" y="151" text-anchor="middle" fill="var(--gold-500)" font-size="14" font-weight="800">DECISION</text><text x="678" y="185" text-anchor="middle" fill="var(--paper-100)" font-size="13" font-weight="650">A · A · R</text></g><text x="380" y="274" text-anchor="middle" class="diagram-result">fluency never replaces verification</text></g></svg>`;
}

      function commonHeading(current) {
        return `<div class="screen-kicker"><strong>${escapeHtml(current.label)}</strong> · ${twoDigits(state.index + 1)} of ${twoDigits(lesson.phases.length)}</div>`;
      }

      function decorateVisualNarrative(current) {
        const makeFigure = (className) => {
          const figure = document.createElement("figure");
          figure.className = className;
          const image = document.createElement("img");
          image.src = current.image;
          image.alt = current.imageAlt || "";
          image.loading = "eager";
          figure.append(image);
          if (current.imageCaption) {
            const caption = document.createElement("figcaption");
            caption.textContent = current.imageCaption;
            figure.append(caption);
          }
          return figure;
        };
        if (current.assessment) {
          const banner = document.createElement("aside");
          banner.className = "assessment-banner assessment-" + (current.assessment.type || "formative");
          banner.setAttribute("aria-label", current.assessment.label + ": " + current.assessment.detail);
          const loop = current.assessment.loop;
          const loopAction = loop && loop.href ? '<a href="' + escapeHtml(loop.href) + '" target="_blank" rel="noreferrer">Open in Loop</a>' : (loop ? escapeHtml(loop.status) : "");
          const loopMarkup = loop ? '<span class="assessment-loop"><strong>' + escapeHtml(loop.label) + '</strong> · ' + loopAction + '</span>' : "";
          banner.innerHTML = '<strong>' + escapeHtml(current.assessment.label) + '</strong><span>' + escapeHtml(current.assessment.detail) + '</span>' + loopMarkup;
          screen.querySelector(".screen-kicker")?.insertAdjacentElement("afterend", banner);
        }
        if (current.type === "question" && current.image) {
          screen.classList.add("has-context-visual");
          screen.prepend(makeFigure("context-figure context-hero"));
        }
        if (current.type === "concept" && current.visual) {
          screen.classList.add("has-concept-visual");
          const principles = screen.querySelector(".principles");
          const figure = document.createElement("figure");
          figure.className = "concept-figure";
          figure.innerHTML = lessonDiagram(current.visual, true);
          principles?.prepend(figure);
        }
        if (current.type === "practice" && current.image) {
          screen.classList.add("has-context-visual");
          screen.querySelector(".success-list")?.prepend(makeFigure("context-figure"));
        }
        if (current.type === "practice" && current.visual) {
          screen.classList.add("has-practice-visual");
          const figure = document.createElement("figure");
          figure.className = "practice-figure";
          figure.innerHTML = lessonDiagram(current.visual, true);
          screen.querySelector(".success-list")?.prepend(figure);
        }
        if (current.type === "ai") {
          screen.classList.add("has-ai-visual");
          const figure = document.createElement("figure");
          figure.className = "ai-visual";
          figure.innerHTML = lessonDiagram("verification", true);
          screen.append(figure);
        }
      }

      function renderScreen() {
        const current = phase();
        const heading = commonHeading(current);
        let content = "";

        if (current.type === "doNow") {
          content = `<div class="do-now-layout"><div>${heading}<div class="do-now-number">01</div><h1 class="screen-heading" id="screen-title" tabindex="-1">${escapeHtml(current.title)}</h1><p class="screen-lead">${escapeHtml(current.lead)}</p><div class="micro-instruction"><span>Five minutes</span><span>Work in your book</span><span>No notes</span></div></div><div class="question-sheet">${current.questions.map(question => `<div class="question-row">${escapeHtml(question)}</div>`).join("")}</div></div>`;
        }

        if (current.type === "question") {
          content = `<div class="question-stage">${heading}<h1 class="screen-heading" id="screen-title" tabindex="-1">${escapeHtml(current.title)}</h1><p class="screen-lead">${escapeHtml(current.lead)}</p><div class="prediction" aria-label="Choose your prediction">${current.choices.map((choice, index) => `<button class="choice" type="button" data-prediction="${index}" aria-pressed="${state.prediction === index}">${escapeHtml(choice)}</button>`).join("")}</div><div class="commitment" id="prediction-feedback">${state.prediction === null ? "Choose before discussing." : "Position recorded. Now explain why."}</div></div>`;
        }

        if (current.type === "concept") {
          content = `<div class="concept-layout"><div>${heading}<h1 class="screen-heading" id="screen-title" tabindex="-1">${escapeHtml(current.title)}</h1><p class="screen-lead">${escapeHtml(current.lead)}</p><div class="key-statement"><span>Core model</span><p>${escapeHtml(current.key)}</p></div></div><div class="principles">${current.principles.map((principle, index) => `<div class="principle"><span>${twoDigits(index + 1)}</span><p>${escapeHtml(principle)}</p></div>`).join("")}</div></div>`;
        }

        if (current.type === "diagram") {
          content = `<div class="model-layout"><div>${heading}<h1 class="screen-heading" id="screen-title" tabindex="-1">${escapeHtml(current.title)}</h1><p class="screen-lead">${escapeHtml(current.lead)}</p><div class="diagram-controls"><button class="reveal-control primary" type="button" id="replay-diagram">Replay model</button></div></div><div class="diagram-wrap">${lessonDiagram(current.visual, true)}</div></div>`;
        }

        if (current.type === "model") {
          const revealed = current.steps.slice(0, state.modelStep + 1);
          content = `<div class="model-layout"><div>${heading}<h1 class="screen-heading" id="screen-title" tabindex="-1">${escapeHtml(current.title)}</h1><p class="screen-lead">${escapeHtml(current.lead)}</p><div class="step-list">${revealed.map((step, index) => `<div class="model-step"><span>${twoDigits(index + 1)}</span><p>${escapeHtml(step)}</p></div>`).join("")}</div><div class="diagram-controls"><button class="reveal-control primary" type="button" id="reveal-step" ${state.modelStep >= current.steps.length - 1 ? "disabled" : ""}>${state.modelStep >= current.steps.length - 1 ? "Model complete" : "Reveal next step"}</button><button class="reveal-control" type="button" id="reset-model" ${state.modelStep === 0 ? "disabled" : ""}>Start again</button></div></div><div class="diagram-wrap">${lessonDiagram(current.visual, state.modelStep >= 2)}</div></div>`;
        }

        if (current.type === "hinge") {
          const feedback = state.hingeAnswer === null ? "" : current.options[state.hingeAnswer][2];
          content = `<div class="hinge-layout">${heading}<h1 class="screen-heading" id="screen-title" tabindex="-1">${escapeHtml(current.title)}</h1><div class="answer-grid">${current.options.map((option, index) => `<button class="answer-option ${state.hingeAnswer === index && option[1] ? "is-correct" : ""}" type="button" data-answer="${index}" aria-pressed="${state.hingeAnswer === index}"><span class="answer-letter">${"ABCD"[index]}</span><span>${escapeHtml(option[0])}</span></button>`).join("")}</div><div class="answer-feedback" id="answer-feedback" role="status">${escapeHtml(feedback)}</div></div>`;
        }

        if (current.type === "practice") {
          content = `<div class="practice-layout"><div>${heading}<h1 class="screen-heading" id="screen-title" tabindex="-1">${escapeHtml(current.title)}</h1><p class="screen-lead">${escapeHtml(current.lead)}</p><div class="task-list">${current.tasks.map(task => `<div class="task-item">${escapeHtml(task)}</div>`).join("")}</div></div><div class="success-list"><h2>What success includes</h2>${current.criteria.map(criterion => `<p>${escapeHtml(criterion)}</p>`).join("")}</div></div>`;
        }

        if (current.type === "media") {
          const prompts = current.prompts.map((prompt, index) => `<li><span>${index + 1}</span><div>${escapeHtml(prompt)}</div></li>`).join("");
          content = `<div class="media-layout"><div class="media-copy">${heading}<h1 class="screen-heading" id="screen-title" tabindex="-1">${escapeHtml(current.title)}</h1><p class="screen-lead">${escapeHtml(current.lead)}</p><ol class="observation-prompts">${prompts}</ol></div><div class="media-shell"><div class="media-frame"><video class="lesson-video" id="reaction-video" preload="metadata" muted playsinline poster="${escapeHtml(current.poster)}" aria-label="Close-up video of magnesium reacting with hydrochloric acid"><source src="${escapeHtml(current.video)}" type="video/mp4">Your browser cannot play this local video.</video><button class="media-play" type="button" id="media-play" aria-controls="reaction-video">Play 20-second observation</button></div><div class="media-meta"><strong>${escapeHtml(current.note)}</strong><span>${escapeHtml(current.credit)}</span></div><p class="media-status" id="media-status" role="status" aria-live="polite">Paused. Look first; explain second.</p></div></div>`;
        }

        if (current.type === "data") {
          const revealed = !current.revealable || state.diagramState === 1;
          const table = revealed ? `<table class="data-table"><thead><tr>${current.columns.map(column => `<th scope="col">${escapeHtml(column)}</th>`).join("")}</tr></thead><tbody>${current.rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table><p class="data-note">${escapeHtml(current.note)}</p>` : `<div class="data-placeholder">Use your own complete class dataset unless your teacher selects the prepared fallback.</div>`;
          content = `<div class="data-layout"><div>${heading}<h1 class="screen-heading" id="screen-title" tabindex="-1">${escapeHtml(current.title)}</h1><p class="screen-lead">${escapeHtml(current.lead)}</p>${current.revealable ? `<div class="diagram-controls"><button class="reveal-control primary" type="button" id="toggle-data">${revealed ? "Hide prepared data" : escapeHtml(current.button || "Show prepared data")}</button></div>` : ""}</div><div class="data-card">${table}</div></div>`;
        }

        if (current.type === "ai") {
          content = `${heading}<h1 class="screen-heading" id="screen-title" tabindex="-1">${escapeHtml(current.title)}</h1><p class="screen-lead">${escapeHtml(current.lead)}</p><div class="source-claim"><div class="source-label">Prepared AI tutor claim</div><blockquote>“${escapeHtml(current.claim)}”</blockquote></div><div class="verification-steps"><span><b>01</b> Identify the claim</span><span><b>02</b> Test it against the model</span><span><b>03</b> Rewrite it accurately</span></div>`;
        }

        if (current.type === "exit") {
          content = `<div class="exit-layout"><div>${heading}<div class="exit-mark">09</div><h1 class="screen-heading" id="screen-title" tabindex="-1">${escapeHtml(current.title)}</h1><p class="screen-lead">${escapeHtml(current.lead)}</p><p class="exit-question">${escapeHtml(current.question)}</p></div><div class="timer-panel"><div class="timer-value" id="timer-value">${formatTime(state.timerSeconds)}</div><p class="timer-note">No books. Hand in your response when time ends.</p><button class="timer-control" type="button" id="timer-toggle">${state.timerRunning ? "Pause timer" : state.timerSeconds < 180 ? "Continue timer" : "Start three-minute timer"}</button><button class="timer-control" type="button" id="timer-reset">Reset</button></div></div>`;
        }

        screen.className = `screen screen-${current.type}`;
        screen.innerHTML = content;
        decorateVisualNarrative(current);
        bindScreenActions();
      }

      function renderTools() {
        if (state.mode === "present") {
          tools.innerHTML = "";
          return;
        }
        const hasSupport = Boolean(phase().support);
        const items = [
          ["guide", "⌘", "Lesson guide"],
          ...(hasSupport ? [["support", "?", "Choose support"]] : []),
          ["resources", "＋", "Resources"]
        ];
        tools.innerHTML = items.map(([id, icon, label]) => `<button class="tool-control ${id === "support" ? "support-tool" : ""}" type="button" data-drawer="${id}" aria-pressed="${state.drawer === id}"><span class="tool-icon" aria-hidden="true">${icon}</span>${label}</button>`).join("");
        tools.querySelectorAll("[data-drawer]").forEach(button => button.addEventListener("click", () => toggleDrawer(button.dataset.drawer, button)));
      }

      function drawerContent() {
        if (state.drawer === "support") {
          const labels = {start: "Get started", explain: "See another way", extend: "Go further"};
          const descriptions = {start: "A first step without changing the goal.", explain: "A different representation or prompt.", extend: "Deeper reasoning and real-world transfer."};
          const items = phase().support?.[state.drawerTab] ?? [];
          return {
            title: "Choose your support",
            subtitle: "Use what helps, then return to the same lesson goal.",
            tabs: Object.entries(labels),
            body: `<p class="drawer-section-title">${escapeHtml(labels[state.drawerTab])}</p><div class="support-list">${items.map(item => `<div class="support-item"><h3>${escapeHtml(item[0])}</h3><p>${escapeHtml(item[1])}</p></div>`).join("")}</div><p class="sr-only">${escapeHtml(descriptions[state.drawerTab])}</p>`
          };
        }

        if (state.drawer === "guide") {
          const tabs = [["goal", "Lesson goal"], ["words", "Key words"], ["journey", "Lesson journey"]];
          let body = "";
          if (state.drawerTab === "goal") body = `<p class="drawer-section-title">Today's destination</p><div class="support-list">${lesson.objectives.map(item => `<div class="support-item"><h3>${escapeHtml(item[0])}</h3><p>${escapeHtml(item[1])}</p></div>`).join("")}</div>`;
          if (state.drawerTab === "words") body = `<p class="drawer-section-title">Use precise science</p><div class="support-list">${lesson.vocabulary.map(item => `<div class="support-item"><h3>${escapeHtml(item[0])}</h3><p>${escapeHtml(item[1])}</p></div>`).join("")}</div>`;
          if (state.drawerTab === "journey") body = `<p class="drawer-section-title">Nine teaching moves</p><div class="journey-list">${lesson.phases.map((item, index) => `<button class="phase-link" type="button" data-phase="${index}" ${index === state.index ? "aria-current=\"step\"" : ""}><span>${twoDigits(index + 1)}</span><span>${escapeHtml(item.nav)}</span><small>${escapeHtml(item.label)}</small></button>`).join("")}</div>`;
          return {title: "Lesson guide", subtitle: "Goal, language and where you are in the lesson.", tabs, body};
        }

        return {
          title: "Lesson resources",
          subtitle: "What you need for this lesson.",
          tabs: [],
          body: `<p class="drawer-section-title">Ready to learn</p><div class="support-list">${lesson.resources.map(item => `<div class="support-item"><h3>${escapeHtml(item[0])}</h3><p>${escapeHtml(item[1])}</p></div>`).join("")}</div>`
        };
      }

      function renderDrawer({focusTarget = null} = {}) {
        const open = state.mode === "student" && Boolean(state.drawer);
        workspace.classList.toggle("has-drawer", open);
        drawer.hidden = !open;
        if (!open) {
          drawer.innerHTML = "";
          if (focusTarget) requestAnimationFrame(() => focusTarget.focus({ preventScroll: true }));
          return;
        }

        const content = drawerContent();
        drawer.innerHTML = `<div class="drawer-head"><div><h2 id="drawer-title" tabindex="-1">${escapeHtml(content.title)}</h2><p>${escapeHtml(content.subtitle)}</p></div><button class="icon-control" type="button" id="close-drawer" aria-label="Close ${escapeHtml(content.title)}">×</button></div>${content.tabs.length ? `<div class="drawer-tabs" role="tablist" aria-label="${escapeHtml(content.title)} sections">${content.tabs.map(([id, label]) => `<button class="support-tab" type="button" role="tab" data-drawer-tab="${id}" aria-selected="${state.drawerTab === id}" tabindex="${state.drawerTab === id ? "0" : "-1"}">${escapeHtml(label)}</button>`).join("")}</div>` : "<div></div>"}<div class="drawer-body" role="tabpanel">${content.body}</div>`;
        drawer.querySelector("#close-drawer").addEventListener("click", closeDrawer);
        drawer.querySelectorAll("[data-drawer-tab]").forEach(button => {
          button.addEventListener("click", () => changeDrawerTab(button.dataset.drawerTab));
          button.addEventListener("keydown", handleTabKeys);
        });
        drawer.querySelectorAll("[data-phase]").forEach(button => button.addEventListener("click", () => goToPhase(Number(button.dataset.phase))));
        if (focusTarget === "drawer") requestAnimationFrame(() => drawer.querySelector("#drawer-title").focus());
      }

      function renderNavigation() {
        const current = phase();
        previous.disabled = state.index === 0;
        next.disabled = state.index === lesson.phases.length - 1;
        phasePosition.textContent = `Screen ${state.index + 1} of ${lesson.phases.length}`;
        phaseName.textContent = current.nav;
        nextContext.innerHTML = state.index < lesson.phases.length - 1 ? `Next: <strong>${escapeHtml(lesson.phases[state.index + 1].nav)}</strong>` : "Lesson complete";
        progressTrack.setAttribute("aria-valuenow", String(state.index + 1));
        progressValue.style.width = `${((state.index + 1) / lesson.phases.length) * 100}%`;
      }

      function render({focusHeading = false, restoreFocusId = null, announceMessage = null} = {}) {
        app.dataset.mode = state.mode;
        if (state.mode === "present") {
          state.drawer = null;
          workspace.classList.remove("has-drawer");
          drawer.hidden = true;
        }
        renderScreen();
        renderTools();
        renderDrawer();
        renderNavigation();
        if (focusHeading) requestAnimationFrame(() => document.querySelector("#screen-title")?.focus({ preventScroll: true }));
        if (restoreFocusId) requestAnimationFrame(() => document.getElementById(restoreFocusId)?.focus({ preventScroll: true }));
        if (announceMessage) announce(announceMessage);
      }

      function toggleDrawer(name, trigger) {
        if (state.drawer === name) {
          closeDrawer();
          return;
        }
        state.lastTrigger = trigger;
        state.drawer = name;
        state.drawerTab = name === "support" ? "start" : name === "guide" ? "goal" : "resources";
        renderTools();
        renderDrawer({focusTarget: "drawer"});
        announce(`${drawerContent().title} opened.`);
      }

      function closeDrawer() {
        const trigger = state.lastTrigger;
        state.drawer = null;
        renderTools();
        renderDrawer({focusTarget: trigger});
        announce("Panel closed.");
      }

      function changeDrawerTab(tab) {
        state.drawerTab = tab;
        renderDrawer();
        requestAnimationFrame(() => drawer.querySelector(`[data-drawer-tab="${tab}"]`)?.focus({ preventScroll: true }));
      }

      function handleTabKeys(event) {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        const tabs = [...drawer.querySelectorAll("[data-drawer-tab]")];
        const index = tabs.indexOf(event.currentTarget);
        const direction = event.key === "ArrowRight" ? 1 : -1;
        const nextIndex = (index + direction + tabs.length) % tabs.length;
        changeDrawerTab(tabs[nextIndex].dataset.drawerTab);
      }

      function resetPhaseInteraction() {
        state.prediction = null;
        state.hingeAnswer = null;
        state.modelStep = 0;
        state.diagramState = 0;
      }

      function goToPhase(index) {
        if (index < 0 || index >= lesson.phases.length || index === state.index) return;
        state.index = index;
        state.drawer = null;
        resetPhaseInteraction();
        render({focusHeading: true, announceMessage: `${phase().nav}. Screen ${state.index + 1} of ${lesson.phases.length}.`});
      }

      function bindScreenActions() {
        screen.querySelectorAll("[data-prediction]").forEach(button => button.addEventListener("click", () => {
          state.prediction = Number(button.dataset.prediction);
          render({restoreFocusId: null, announceMessage: "Prediction recorded. Explain your reason to a partner."});
          requestAnimationFrame(() => screen.querySelector(`[data-prediction="${state.prediction}"]`)?.focus({ preventScroll: true }));
        }));

        screen.querySelectorAll("[data-answer]").forEach(button => button.addEventListener("click", () => {
          state.hingeAnswer = Number(button.dataset.answer);
          const selected = phase().options[state.hingeAnswer];
          render({announceMessage: `${selected[1] ? "Correct." : "Not yet."} ${selected[2]}`});
          requestAnimationFrame(() => screen.querySelector(`[data-answer="${state.hingeAnswer}"]`)?.focus({ preventScroll: true }));
        }));

        screen.querySelector("#reveal-step")?.addEventListener("click", () => {
          if (state.modelStep < phase().steps.length - 1) state.modelStep += 1;
          render({restoreFocusId: "reveal-step", announceMessage: `Step ${state.modelStep + 1} revealed.`});
        });

        screen.querySelector("#reset-model")?.addEventListener("click", () => {
          state.modelStep = 0;
          render({restoreFocusId: "reveal-step", announceMessage: "Worked model reset."});
        });

        screen.querySelector("#replay-diagram")?.addEventListener("click", event => {
          const diagram = screen.querySelector(".force-diagram");
          diagram.style.animation = "none";
          requestAnimationFrame(() => {
            diagram.style.animation = "screen-enter 420ms var(--ease-out)";
            event.currentTarget.focus({ preventScroll: true });
          });
          announce("Force model replayed.");
        });

        screen.querySelector("#toggle-data")?.addEventListener("click", () => { state.diagramState = state.diagramState ? 0 : 1; render({restoreFocusId: "toggle-data", announceMessage: state.diagramState ? "Prepared data shown." : "Prepared data hidden."}); });
        const reactionVideo = screen.querySelector("#reaction-video");
        const mediaPlay = screen.querySelector("#media-play");
        const mediaStatus = screen.querySelector("#media-status");
        if (reactionVideo && mediaPlay) {
          const mediaPhase = phase();
          const startAt = Number(mediaPhase.start || 0);
          const stopAt = Number(mediaPhase.stop || reactionVideo.duration || 0);
          const resetMedia = () => { reactionVideo.pause(); reactionVideo.currentTime = startAt; mediaPlay.textContent = "Replay 20-second observation"; mediaPlay.setAttribute("aria-pressed", "false"); if (mediaStatus) mediaStatus.textContent = "Observation complete. Replay or discuss the endpoint."; };
          reactionVideo.addEventListener("loadedmetadata", () => { if (reactionVideo.currentTime < startAt) reactionVideo.currentTime = startAt; });
          reactionVideo.addEventListener("timeupdate", () => { if (reactionVideo.currentTime >= stopAt) resetMedia(); });
          reactionVideo.addEventListener("ended", resetMedia);
          mediaPlay.addEventListener("click", async () => {
            if (!reactionVideo.paused) { reactionVideo.pause(); mediaPlay.textContent = "Continue observation"; mediaPlay.setAttribute("aria-pressed", "false"); if (mediaStatus) mediaStatus.textContent = "Paused for discussion."; return; }
            if (reactionVideo.currentTime < startAt || reactionVideo.currentTime >= stopAt) reactionVideo.currentTime = startAt;
            try { await reactionVideo.play(); mediaPlay.textContent = "Pause observation"; mediaPlay.setAttribute("aria-pressed", "true"); if (mediaStatus) mediaStatus.textContent = "Playing the reaction close-up."; }
            catch { if (mediaStatus) mediaStatus.textContent = "The clip could not play. Use the licensed still image and observation prompts."; }
          });
        }
        screen.querySelector("#timer-toggle")?.addEventListener("click", toggleTimer);
        screen.querySelector("#timer-reset")?.addEventListener("click", resetTimer);
      }

      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        return `${minutes}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function toggleTimer() {
        state.timerRunning = !state.timerRunning;
        if (state.timerRunning) {
          clearInterval(state.timerId);
          state.timerId = setInterval(() => {
            state.timerSeconds -= 1;
            const value = document.querySelector("#timer-value");
            if (value) value.textContent = formatTime(state.timerSeconds);
            if (state.timerSeconds <= 0) {
              clearInterval(state.timerId);
              state.timerRunning = false;
              state.timerSeconds = 0;
              render({restoreFocusId: "timer-toggle", announceMessage: "Time is up. Hand in your response."});
            }
          }, 1000);
        } else {
          clearInterval(state.timerId);
        }
        render({restoreFocusId: "timer-toggle", announceMessage: state.timerRunning ? "Three-minute timer started." : "Timer paused."});
      }

      function resetTimer() {
        clearInterval(state.timerId);
        state.timerSeconds = 180;
        state.timerRunning = false;
        render({restoreFocusId: "timer-toggle", announceMessage: "Timer reset to three minutes."});
      }

      function enterPresent() {
        state.mode = "present";
        state.drawer = null;
        render({focusHeading: true, announceMessage: "Present view. Student support is hidden."});
      }

      function exitPresent() {
        state.mode = "student";
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        render({focusHeading: true, announceMessage: "Student view. Lesson support is available."});
      }

      async function toggleFullscreen() {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (_) {
          announce("Fullscreen is not available in this browser. Present view is still active.");
        }
      }

      previous.addEventListener("click", () => goToPhase(state.index - 1));
      next.addEventListener("click", () => goToPhase(state.index + 1));
      document.querySelector("#enter-present").addEventListener("click", enterPresent);
      document.querySelector("#exit-present").addEventListener("click", exitPresent);
      document.querySelector("#fullscreen").addEventListener("click", toggleFullscreen);

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          if (state.drawer) closeDrawer();
          else if (state.mode === "present" && !document.fullscreenElement) exitPresent();
          return;
        }
        const interactive = event.target.closest("button, a, [role=tab]");
        if (interactive) return;
        if (event.key === "ArrowRight") goToPhase(state.index + 1);
        if (event.key === "ArrowLeft") goToPhase(state.index - 1);
      });

      render();
    })();
  </script>
</body>
</html>
