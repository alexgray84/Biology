<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Sections B and C enlargement of a continuous journey graph</title>
  <desc id="desc">Section B stays at four metres from two to five seconds. Section C rises from four metres at five seconds to ten metres at seven seconds.</desc>
  <rect width="720" height="440" rx="20" fill="#fffdf8"/>
  <g stroke="#dce7e9" stroke-width="1"><path d="M115 345H625M115 290H625M115 235H625M115 180H625M115 125H625"/><path d="M115 125V345M217 125V345M319 125V345M421 125V345M523 125V345M625 125V345"/></g>
  <path d="M115 125V345H625" fill="none" stroke="#14263d" stroke-width="4"/>
  <path d="M115 345H421" fill="none" stroke="#b78324" stroke-width="8" stroke-linecap="round"/>
  <path d="M421 345L625 125" fill="none" stroke="#8b56b4" stroke-width="8" stroke-linecap="round"/>
  <g fill="#fffdf8" stroke="#14263d" stroke-width="4"><circle cx="115" cy="345" r="8"/><circle cx="421" cy="345" r="8"/><circle cx="625" cy="125" r="8"/></g>
  <g fill="#14263d" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="800"><text x="106" y="379">2</text><text x="208" y="379">3</text><text x="310" y="379">4</text><text x="412" y="379">5</text><text x="514" y="379">6</text><text x="616" y="379">7</text><text x="80" y="352">4</text><text x="80" y="242">7</text><text x="72" y="132">10</text><text x="370" y="416" text-anchor="middle">Elapsed time / s</text><text transform="translate(35 235) rotate(-90)" text-anchor="middle">Distance from start / m</text><text x="261" y="326" fill="#b78324">B</text><text x="505" y="235" fill="#8b56b4">C</text></g>
</svg>
