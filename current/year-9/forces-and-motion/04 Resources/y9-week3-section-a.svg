<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Section A enlargement of a continuous journey graph</title>
  <desc id="desc">The line rises from zero metres at zero seconds to four metres at two seconds. The rise is four metres and the run is two seconds.</desc>
  <rect width="720" height="440" rx="20" fill="#fffdf8"/>
  <g stroke="#dce7e9" stroke-width="1"><path d="M115 345H625M115 290H625M115 235H625M115 180H625M115 125H625"/><path d="M115 125V345M242.5 125V345M370 125V345M497.5 125V345M625 125V345"/></g>
  <path d="M115 125V345H625" fill="none" stroke="#14263d" stroke-width="4"/>
  <path d="M115 345L625 125" fill="none" stroke="#168b9c" stroke-width="8" stroke-linecap="round"/>
  <path d="M115 125V345H625" fill="none" stroke="#b78324" stroke-width="3" stroke-dasharray="9 8"/>
  <g fill="#fffdf8" stroke="#14263d" stroke-width="4"><circle cx="115" cy="345" r="8"/><circle cx="625" cy="125" r="8"/></g>
  <g fill="#14263d" font-family="Montserrat,Arial,sans-serif" font-size="21" font-weight="800"><text x="108" y="378">0</text><text x="608" y="378">2</text><text x="82" y="352">0</text><text x="82" y="132">4</text><text x="370" y="416" text-anchor="middle">Elapsed time / s</text><text transform="translate(38 235) rotate(-90)" text-anchor="middle">Distance from start / m</text><text x="350" y="170" fill="#168b9c">A</text></g>
</svg>
