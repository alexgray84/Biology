<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 530" role="img" aria-labelledby="title desc">
<title id="title">A new distance–time graph</title><desc id="desc">A rises from zero seconds, zero metres to two seconds, six metres. B stays at six metres until four seconds. C rises to ten metres at six seconds. Motion is away from the start, with straight sections.</desc>
<rect width="840" height="530" fill="#fffdf8"/>
<g fill="none" stroke="#dce7e9" stroke-width="1"><path d="M110 70H770M110 140H770M110 210H770M110 280H770M110 350H770M110 420H770M110 70V420M220 70V420M330 70V420M440 70V420M550 70V420M660 70V420M770 70V420"/></g>
<path d="M110 55V420H785" fill="none" stroke="#182944" stroke-width="3"/>
<g font-family="Arial,sans-serif" fill="#182944" font-size="27" text-anchor="middle"><text x="110" y="458">0</text><text x="220" y="458">1</text><text x="330" y="458">2</text><text x="440" y="458">3</text><text x="550" y="458">4</text><text x="660" y="458">5</text><text x="770" y="458">6</text><text x="440" y="510">Elapsed time / s</text></g>
<g font-family="Arial,sans-serif" fill="#182944" font-size="27" text-anchor="end"><text x="94" y="429">0</text><text x="94" y="359">2</text><text x="94" y="289">4</text><text x="94" y="219">6</text><text x="94" y="149">8</text><text x="94" y="79">10</text></g>
<text transform="translate(33 245) rotate(-90)" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#182944">Distance from start / m</text>
<g fill="none" stroke-width="6"><path d="M110 420L330 210" stroke="#168b9c"/><path d="M330 210H550" stroke="#b78324"/><path d="M550 210L770 70" stroke="#8b56b4"/></g>
<g fill="#fffdf8" stroke="#182944" stroke-width="3"><circle cx="110" cy="420" r="6"/><circle cx="330" cy="210" r="6"/><circle cx="550" cy="210" r="6"/><circle cx="770" cy="70" r="6"/></g>
<g font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#182944"><text x="190" y="286">A</text><text x="430" y="193">B</text><text x="665" y="117">C</text></g>
</svg>
