<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Changing steepness on distance–time graphs</title><desc id="desc">Curve P rises increasingly steeply: speeding up. Curve Q keeps rising but becomes less steep: slowing down. Both show distance increasing with time.</desc>
<rect width="900" height="420" fill="#fffdf8"/>
<g fill="none" stroke="#182944" stroke-width="3"><path d="M80 55V335H410M510 55V335H840"/></g>
<g fill="none" stroke-width="6"><path d="M85 330Q340 315 395 65" stroke="#168b9c"/><path d="M515 330Q560 80 825 65" stroke="#8b56b4"/></g>
<g font-family="Arial,sans-serif" fill="#182944" font-size="28"><text x="240" y="395" text-anchor="middle">Time →</text><text x="670" y="395" text-anchor="middle">Time →</text><text transform="translate(32 205) rotate(-90)" text-anchor="middle">Distance →</text><text transform="translate(462 205) rotate(-90)" text-anchor="middle">Distance →</text><text x="110" y="80" font-size="38">P</text><text x="755" y="135" font-size="38">Q</text></g>
</svg>
