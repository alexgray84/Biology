<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Continuous distance–time record for a model car</title>
  <desc id="desc">Time from zero to ten seconds is on the horizontal axis. Distance from start from zero to fourteen metres is on the vertical axis. The line rises from zero metres at zero seconds to four metres at two seconds, stays at four metres until five seconds, rises to ten metres at seven seconds, then rises more gently to thirteen metres at ten seconds.</desc>
  <rect width="960" height="560" rx="22" fill="#fffdf8"/>
  <g stroke="#dce7e9" stroke-width="1">
    <path d="M130 450H850M130 397H850M130 344H850M130 291H850M130 238H850M130 185H850M130 132H850M130 79H850"/>
    <path d="M130 79V450M202 79V450M274 79V450M346 79V450M418 79V450M490 79V450M562 79V450M634 79V450M706 79V450M778 79V450M850 79V450"/>
  </g>
  <path d="M130 79V450H850" fill="none" stroke="#14263d" stroke-width="4" stroke-linecap="round"/>
  <g fill="#435369" font-family="Montserrat,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="130" y="482">0</text><text x="202" y="482">1</text><text x="274" y="482">2</text><text x="346" y="482">3</text><text x="418" y="482">4</text><text x="490" y="482">5</text><text x="562" y="482">6</text><text x="634" y="482">7</text><text x="706" y="482">8</text><text x="778" y="482">9</text><text x="850" y="482">10</text>
  </g>
  <g fill="#435369" font-family="Montserrat,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="end">
    <text x="114" y="457">0</text><text x="114" y="404">2</text><text x="114" y="351">4</text><text x="114" y="298">6</text><text x="114" y="245">8</text><text x="114" y="192">10</text><text x="114" y="139">12</text><text x="114" y="86">14</text>
  </g>
  <g fill="#14263d" font-family="Montserrat,Arial,sans-serif" font-size="30" font-weight="800">
    <text x="490" y="531" text-anchor="middle">Elapsed time / s</text>
    <text transform="translate(42 264) rotate(-90)" text-anchor="middle">Distance from start / m</text>
  </g>
  <path d="M130 450L274 344" fill="none" stroke="#168b9c" stroke-width="7" stroke-linecap="round"/>
  <path d="M274 344H490" fill="none" stroke="#b78324" stroke-width="7" stroke-linecap="round"/>
  <path d="M490 344L634 185" fill="none" stroke="#8b56b4" stroke-width="7" stroke-linecap="round"/>
  <path d="M634 185L850 106" fill="none" stroke="#168b9c" stroke-width="7" stroke-linecap="round"/>
  <g fill="#fffdf8" stroke="#14263d" stroke-width="4">
    <circle cx="130" cy="450" r="8"/><circle cx="274" cy="344" r="8"/><circle cx="490" cy="344" r="8"/><circle cx="634" cy="185" r="8"/><circle cx="850" cy="106" r="8"/>
  </g>
  <g fill="#14263d" font-family="Montserrat,Arial,sans-serif" font-size="30" font-weight="800">
    <text x="187" y="365">A</text><text x="370" y="327">B</text><text x="550" y="247">C</text><text x="731" y="155">D</text>
  </g>
</svg>
