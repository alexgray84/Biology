<script>const lesson = {"shape":"real-world-problem","architecture_version":3,"phases":[{"type":"question","layout":"image-led-decision","label":"Constraints","nav":"1","title":"What happens just after the jump?","lead":"Draw a parachutist just after leaving the aircraft. Add weight and drag arrows, then predict the motion in your book.","minutes":3,"points":["Make the arrow lengths show the relative force sizes.","Name the resultant direction.","Use accelerating, constant velocity or decelerating."],"review":{"type":"answers","label":"Reveal the starting model","title":"Immediately after the jump","body":"<p>Weight acts downwards and is larger than the small drag force. The resultant is downwards, so the parachutist accelerates downwards.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose your own starting point, or begin by drawing one downward arrow labelled weight.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>If you want a structure after your first attempt, ask how very low speed affects collisions with the air, then choose the drag-arrow length yourself.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Predict how the drag arrow must change as speed increases, and explain why the weight arrow stays the same.</p>"}},"product":"A force-arrow sketch and prediction in each pupil's exercise book."},{"type":"practice","layout":"context-brief","label":"Learning","nav":"2","title":"Terminal velocity: your safety brief","lead":"Read the learning outcomes. Write the title, then choose the outcome you most need to secure.","minutes":2,"points":["Learning outcome 1 — Compare weight and drag during each stage of a parachute jump.","Learning outcome 2 — Use resultant force to explain changes in a falling object's motion.","Learning outcome 3 — Explain why a parachutist can have two different terminal velocities."],"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose learning outcome 1 if force arrows are your first focus; you can change your choice later.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Choose learning outcome 2 if you want to practise the chain: force sizes, resultant, then motion.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Choose learning outcome 3 if you are ready to explain why the same person can reach two different constant velocities.</p>"}},"product":"A dated lesson title and one chosen personal focus recorded in books."},{"type":"concept","layout":"split-explanation","label":"Select the science","nav":"3","title":"What is terminal velocity?","lead":"Listen to the explanation. Copy the definition and sketch the equal force arrows in your book.","minutes":4,"points":["Weight acts downwards and stays almost the same; drag (air resistance) acts upwards and increases as speed rises.","Terminal velocity is the constant speed reached when drag equals weight.","Equal forces give zero resultant and zero acceleration, so the velocity no longer changes.","The object is still moving downwards; it has not stopped."],"interactive":{"kind":"terminal-velocity-lab","initial_stage":3,"allow_stage_choice":false,"show_forces_initially":true,"inquiry_mode":false,"caption":"At terminal velocity, equal force arrows show zero resultant force while the parachutist continues downwards at constant speed."},"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose the simple view if you want the two force arrows isolated from the moving scene.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use the chain: drag = weight → resultant = 0 N → acceleration = 0 → speed stays constant.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why terminal velocity describes motion even though the forces are balanced.</p>"}},"product":"A boxed definition and an equal-arrow force diagram in each pupil's exercise book."},{"type":"concept","layout":"visual-first-explanation","label":"Select the science","nav":"4","title":"Why are there two terminal velocities?","lead":"Follow the force change. Copy the four-link chain in your book and add one reason to each arrow.","minutes":4,"points":["Parachute opens → surface area increases.","Larger area → drag suddenly becomes greater than weight.","Upward resultant → the downward motion slows.","Drag then falls until it equals weight at a new, lower constant speed."],"interactive":{"kind":"terminal-velocity-lab","initial_stage":4,"allow_stage_choice":false,"show_forces_initially":true,"inquiry_mode":false,"caption":"The parachutist is still moving downwards when the upward resultant force makes the downward speed decrease."},"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose the simple view and begin with: opening the parachute changes surface area, not weight.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use the order: area → drag → resultant → change in motion → new force balance.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why the new balanced-force speed must be lower than the first terminal velocity.</p>"}},"product":"A four-link area-to-terminal-velocity chain in each pupil's exercise book."},{"type":"media","layout":"observation-theatre","label":"Select the science","nav":"5","title":"Find both terminal velocities","lead":"Use the six evidence frames. In your book, identify both moments of terminal velocity and justify each choice.","minutes":4,"tasks":["Track the motion first, then choose when to reveal the force arrows.","For each choice, write: drag ___ weight, so the resultant is ___ and the velocity ___."],"interactive":{"kind":"terminal-velocity-lab","initial_stage":1,"allow_stage_choice":true,"show_forces_initially":false,"inquiry_mode":true,"caption":"Qualitative Three.js model: arrow lengths compare force sizes; they are not measured values."},"support":{"start":{"title":"Get started","heading":"","body":"<p>You can pause the model, choose any numbered stage, or switch to the simple static view.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>When you are ready, reveal the force arrows and compare their lengths before naming the motion.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why the two balanced-force frames show different downward speeds.</p>"}},"product":"Two identified balanced-force frames with a reason in each pupil's book."},{"type":"diagram","layout":"model-stage","label":"Select the science","nav":"6","title":"Build the force chain","lead":"Before the parachute opens: complete the chain, then reveal.","minutes":6,"points":["Speed ↑ → drag ______.","Drag nears weight → downward resultant ______.","Downward resultant → downward speed ______."],"reveals":[{"label":"Reveal, reject and complete","title":"Complete and repair","body":"<p><strong>Complete:</strong> speed ↑ → drag ↑ → downward resultant ↓ → downward speed still ↑, but more slowly. <strong>Reject:</strong> ‘smaller resultant means slowing’—it still acts downwards.</p>"}],"interactive":{"kind":"terminal-velocity-lab","initial_stage":2,"allow_stage_choice":true,"show_forces_initially":true,"inquiry_mode":true,"caption":"Choose a stage, compare the arrows and decide what the resultant changes."},"support":{"start":{"title":"Get started","heading":"","body":"<p>Start with the two visible facts: the direction of motion and which force arrow is longer.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Choose the causal frame: as speed ___, drag ___; therefore the resultant ___ and the motion ___.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Explain why a decreasing downward resultant can still accompany an increasing downward speed.</p>"}},"product":"A mirrored four-link causal chain in each pupil's exercise book."},{"type":"media","layout":"observation-theatre","label":"Test options","nav":"7","title":"Interrogate each stage","lead":"Work as Force Analyst and Motion Analyst. Agree on each stage, then swap roles after stage 3.","minutes":4,"tasks":["Force Analyst chooses the relative arrow sizes and resultant.","Motion Analyst chooses accelerating, constant velocity or slowing.","Explain one disagreement before moving to the next stage."],"interactive":{"kind":"terminal-velocity-lab","initial_stage":1,"allow_stage_choice":true,"show_forces_initially":true,"inquiry_mode":true,"caption":"Use the controls as evidence. Completed explanations stay with the teacher until the pair has decided."},"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose your route: inspect one stage at a time, use the static view, or attempt all six before checking.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use the comparison order: force sizes, resultant direction, then motion. Ask the teacher to check only after both roles decide.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>For each balanced stage, explain why zero resultant does not mean zero downward velocity.</p>"}},"product":"Six agreed spoken decisions after interdependent pair reasoning."},{"type":"data","layout":"evidence-workbench","label":"Test options","nav":"8","title":"Record your fall profile","lead":"Copy the four-column table in your book. Complete all six stages from your pair's decisions.","minutes":4,"table":[["Stage","Compare forces","Resultant","Motion"],["1","weight ___ drag","___","___"],["2","weight ___ drag","___","___"],["3","weight ___ drag","___","___"],["4","weight ___ drag","___","___"],["5","weight ___ drag","___","___"],["6","weight ___ drag","___","___"]],"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose whether to copy the full table or write four labelled lines for each numbered stage.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Complete stages 1, 3, 4 and 6 first; these show the main changes in the force-motion story.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Add one causal sentence below stages 2 and 5 to explain why changing speed changes drag.</p>"}},"product":"A personally recorded six-row fall profile in each pupil's exercise book."},{"type":"hinge","layout":"diagnostic-decision","label":"Check","nav":"9","title":"Can balanced forces move?","lead":"Choose A–D on your whiteboard. Show together, then justify the link.","minutes":3,"support":false,"choices":["Weight > drag; accelerating downwards.","Weight = drag; constant velocity downwards.","Weight = drag; stationary.","Drag > weight; moving upwards."],"answer":1,"feedback":"Weight equals drag, so the resultant is zero. Velocity does not change; motion continues downwards at constant velocity.","recheck":"A falling seed has constant velocity. Compare weight and drag; state the resultant force.","callout":"At terminal velocity, which force and motion statement is correct?","product":"An A–D whiteboard response and spoken justification."},{"type":"concept","layout":"visual-first-explanation","label":"Test options","nav":"10","title":"Change one feature of the fall","lead":"Take 20 seconds silently. Compare the same parachutist with a smaller and a larger parachute; mass, gravitational field and starting speed stay fixed.","minutes":4,"tasks":["Compare Case A: smaller parachute with Case B: larger parachute. Which force changes first, and what evidence from the six-stage model supports that?","Predict which case reaches the lower terminal velocity and explain the full causal chain."],"interactive":{"kind":"terminal-velocity-lab","initial_stage":4,"allow_stage_choice":false,"show_forces_initially":true,"inquiry_mode":true,"allow_area_choice":true,"caption":"Compare only parachute area at the same evidence frame; arrow lengths are qualitative."},"support":{"start":{"title":"Get started","heading":"","body":"<p>After your silent choice, use the area buttons to compare the two cases and decide which arrow changes first.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Use: changing ___ changes drag because ___; the new balance is reached at a ___ speed.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Go further: compare greater mass with no atmosphere and justify which case can still reach terminal velocity.</p>"}},"product":"One changed-constraint prediction with a reason in each pupil's book."},{"type":"practice","layout":"task-and-criteria","label":"Justify","nav":"11","title":"Write the safety brief","lead":"Create two linked panels in your book: before the parachute opens and after it opens. Explain both terminal velocities.","minutes":5,"tasks":["Draw proportional weight and drag arrows in both panels.","Write four linked sentences from force sizes to resultant force to motion."],"criteria":["Weight and drag are compared accurately.","Both resultant forces are stated.","Acceleration and constant velocity are used precisely.","The lower terminal velocity is linked to the larger parachute area."],"support":false,"product":"An individual two-panel fall-profile safety brief in each pupil's exercise book."},{"type":"exit","layout":"quiet-exit","label":"Respond","nav":"12","title":"Inspect and repair your explanation","lead":"Underline the force comparison, box the resultant and circle the motion term. Repair one causal link in a different pen.","minutes":3,"tasks":["Finish: I used to think ___; now I think ___ because ___."],"review":{"type":"wagoll","label":"Reveal the model explanation","title":"One secure causal chain","body":"<p>Before the parachute opens, speed rises and drag increases until it equals weight. The resultant is then zero, so the parachutist keeps falling at constant velocity. Opening the parachute increases area and makes drag larger than weight, so the downward motion slows. Drag then decreases until it equals weight again, producing a new, lower terminal velocity.</p>"},"support":{"start":{"title":"Get started","heading":"","body":"<p>Choose which feature you want to check first: force comparison, resultant or motion language.</p>"},"build":{"title":"Build understanding","heading":"","body":"<p>Compare each sentence with the model one link at a time; keep your own wording where the science is accurate.</p>"},"stretch":{"title":"Go further","heading":"","body":"<p>Evaluate whether your explanation makes clear that an upward resultant can occur while the parachutist is still moving downwards.</p>"}},"assessment":{"type":"self","label":"Self-assessment","detail":"An annotated safety brief with one visible correction in a different pen."}}]};
