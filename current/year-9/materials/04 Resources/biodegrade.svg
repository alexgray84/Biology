<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 358" role="img"><title>What microorganisms need to break a material down</title><desc></desc><rect width="100%" height="100%" rx="14" fill="#fcfaf5"/><g font-family="Arial, sans-serif" fill="#182944"><ellipse cx="108" cy="124" rx="70" ry="46" fill="#d7b24b" stroke="#7b601b" stroke-width="3"/><text x="86" y="208" font-size="27" font-weight="800" text-anchor="middle" fill="#182944">Material</text><ellipse cx="226" cy="88" rx="19" ry="11" fill="#7fae5a" stroke="#3f6b2a" stroke-width="2.5" transform="rotate(20 226 88)"/><ellipse cx="270" cy="138" rx="19" ry="11" fill="#7fae5a" stroke="#3f6b2a" stroke-width="2.5" transform="rotate(-30 270 138)"/><ellipse cx="205" cy="168" rx="19" ry="11" fill="#7fae5a" stroke="#3f6b2a" stroke-width="2.5" transform="rotate(60 205 168)"/><ellipse cx="292" cy="74" rx="19" ry="11" fill="#7fae5a" stroke="#3f6b2a" stroke-width="2.5" transform="rotate(45 292 74)"/><text x="268" y="208" font-size="26" font-weight="800" text-anchor="middle" fill="#182944">Microorganisms</text><text x="268" y="240" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">feed on it</text><line x1="352" y1="124" x2="398.0" y2="124.0" stroke="#182944" stroke-width="7" stroke-linecap="round"/><polygon points="416,124 398.0,111.4 398.0,136.6" fill="#182944"/><text x="432" y="112" font-size="28" font-weight="800" text-anchor="start" fill="#182944">Smaller</text><text x="432" y="146" font-size="28" font-weight="800" text-anchor="start" fill="#182944">substances</text><text x="432" y="180" font-size="25" font-weight="400" text-anchor="start" fill="#182944">(such as CO₂</text><text x="432" y="212" font-size="25" font-weight="400" text-anchor="start" fill="#182944">and water)</text><rect x="20" y="262" width="630" height="84" rx="12" fill="#fff" stroke="#182944" stroke-width="2"/><text x="335" y="298" font-size="27" font-weight="800" text-anchor="middle" fill="#182944">They need:</text><text x="335" y="332" font-size="30" font-weight="800" text-anchor="middle" fill="#a8660c">water · warmth · usually oxygen</text></g></svg>