<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 372" role="img"><title>Reuse, recycling, biodegradation and residual waste</title><desc></desc><rect width="100%" height="100%" rx="14" fill="#fcfaf5"/><g font-family="Arial, sans-serif" fill="#182944"><rect x="8" y="12" width="222" height="266" rx="12" fill="#fff" stroke="#2c7a57" stroke-width="3.5"/><text x="119" y="54" font-size="26" font-weight="800" text-anchor="middle" fill="#2c7a57">Reuse</text><text x="119" y="104" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">Cleaned, then</text><text x="119" y="140" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">same object</text><text x="119" y="176" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">used again</text><text x="119" y="256" font-size="23" font-weight="800" text-anchor="middle" fill="#182944">Same object</text><rect x="238" y="12" width="222" height="266" rx="12" fill="#fff" stroke="#2f6fb3" stroke-width="3.5"/><text x="349" y="54" font-size="26" font-weight="800" text-anchor="middle" fill="#2f6fb3">Recycling</text><text x="349" y="104" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">Processed</text><text x="349" y="140" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">into a new</text><text x="349" y="176" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">product</text><text x="349" y="256" font-size="23" font-weight="800" text-anchor="middle" fill="#182944">Needs a collector</text><rect x="468" y="12" width="222" height="266" rx="12" fill="#fff" stroke="#a8660c" stroke-width="3.5"/><text x="579" y="54" font-size="26" font-weight="800" text-anchor="middle" fill="#a8660c">Biodegradation</text><text x="579" y="104" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">Broken down</text><text x="579" y="140" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">by micro-</text><text x="579" y="176" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">organisms</text><text x="579" y="256" font-size="23" font-weight="800" text-anchor="middle" fill="#182944">Needs conditions</text><rect x="698" y="12" width="222" height="266" rx="12" fill="#fff" stroke="#5b5f68" stroke-width="3.5"/><text x="809" y="54" font-size="26" font-weight="800" text-anchor="middle" fill="#5b5f68">Residual waste</text><text x="809" y="104" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">Landfill uses</text><text x="809" y="140" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">land. Burning</text><text x="809" y="176" font-size="25" font-weight="400" text-anchor="middle" fill="#182944">releases CO₂.</text><text x="809" y="256" font-size="23" font-weight="800" text-anchor="middle" fill="#182944">General rubbish</text><rect x="8" y="294" width="912" height="66" rx="12" fill="#fff4dc" stroke="#182944" stroke-width="2"/><text x="464" y="338" font-size="33" font-weight="800" text-anchor="middle" fill="#182944">Bio-based tells you the source, not the ending.</text></g></svg>