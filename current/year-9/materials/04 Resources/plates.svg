<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 386" role="img"><title>Canteen plates E and F</title><desc></desc><rect width="100%" height="100%" rx="14" fill="#fcfaf5"/><g font-family="Arial, sans-serif" fill="#182944"><rect x="10" y="12" width="356" height="330" rx="12" fill="#fff" stroke="#182944" stroke-width="2.5"/><text x="188" y="58" font-size="31" font-weight="800" text-anchor="middle" fill="#182944">E · ceramic plate</text><text x="28" y="108" font-size="28" font-weight="400" text-anchor="start" fill="#182944">Clay is dug up.</text><text x="28" y="152" font-size="28" font-weight="400" text-anchor="start" fill="#182944">Fired in a kiln.</text><text x="28" y="196" font-size="28" font-weight="400" text-anchor="start" fill="#182944">Reused every day.</text><text x="28" y="240" font-size="28" font-weight="400" text-anchor="start" fill="#182944">Washing uses water</text><text x="28" y="284" font-size="28" font-weight="400" text-anchor="start" fill="#182944">and energy.</text><rect x="384" y="12" width="356" height="330" rx="12" fill="#fff" stroke="#182944" stroke-width="2.5"/><text x="562" y="58" font-size="31" font-weight="800" text-anchor="middle" fill="#182944">F · paper plate</text><text x="402" y="108" font-size="28" font-weight="400" text-anchor="start" fill="#182944">From wood pulp.</text><text x="402" y="152" font-size="28" font-weight="400" text-anchor="start" fill="#182944">Used once.</text><text x="402" y="196" font-size="28" font-weight="400" text-anchor="start" fill="#182944">Goes to residual</text><text x="402" y="240" font-size="28" font-weight="400" text-anchor="start" fill="#182944">waste.</text><text x="375" y="372" font-size="27" font-weight="800" text-anchor="middle" fill="#182944">No totals are given for either plate.</text></g></svg>