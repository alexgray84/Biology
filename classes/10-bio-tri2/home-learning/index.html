<section data-step data-n="" data-short="Start" data-title="Photosynthesis preparation: check and improve" data-kicker="Weeks 8–9 self-assessment · 1 minute">
<div class="blk "><p class="lead">Check the science. Improve the link. Then try it alone.</p></div>
<div class="blk "><ul class="facts"><li>About 30 minutes</li><li class="gold">Green pen + exercise book</li><li>Ready for the yellow sheet next lesson</li></ul></div>
<div class="blk rules"><h4>Before you reveal answers</h4><p>Get your completed Week 8 and Week 9 home learning. Keep your first attempts readable. Compare each answer before correcting it in green. If work is missing, award its original answer zero and add the correction.</p></div>
<div class="blk "><h4>Mark the original attempt honestly</h4><p>Tick only science already present. Award each mark once; accept equivalent accurate wording. Green additions do not raise your original score. If previous changes hide the original, write <b>first attempt unavailable</b> instead of inventing a score.</p></div>
<div class="blk "><p><b>Timing:</b> setup 1 → Week 8 check 9 → Week 9 check 8 → improve 5 → fresh check 5 → check and reflect 2 minutes.</p></div>
<div class="blk "><p>Keep your usual reading, enlargement, language-access and response tools. Translation may clarify wording. The scientific explanations must be your own. Record content help as <b>S</b>, separately from your score. This page collects no pupil responses.</p></div>
</section>

<section data-step data-n="1" data-short="Week 8 answers" data-title="Week 8: compare every answer" data-kicker="9 minutes · original score /26 + unmarked depth" data-gate="Have you kept your Week 8 first attempts visible, ready to compare before correcting?">
<div class="blk do"><p>Compare every original answer with these mark points. Correct gaps in green, keeping the first attempt visible. Record <b>recall /15 + application /11 = /26</b>. The final depth task is unmarked.</p></div>
<div class="blk " data-question="W8-Q1"><h4>Q1 · Name the pigment that absorbs light energy and the organelle that contains it. <span class="mk">[2]</span></h4><p>Chlorophyll [1]; chloroplast [1].</p></div>
<div class="blk " data-question="W8-Q2"><h4>Q2 · Which colours does it absorb most? Why do leaves look green? <span class="mk">[2]</span></h4><p>Red and blue light [1]. Green light is mainly reflected (not absorbed), so leaves look green [1].</p></div>
<div class="blk " data-question="W8-Q3"><h4>Q3 · Balanced symbol equation, with conditions. <span class="mk">[2]</span></h4><p>6CO<sub>2</sub> + 6H<sub>2</sub>O → C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6O<sub>2</sub>, correct formulae and balancing [1]; light and chlorophyll by the arrow [1].</p><p class="foot">Do not credit unbalanced forms, H<sub>2</sub>O<sub>6</sub>, light as a reactant.</p></div>
<div class="blk " data-question="W8-Q4"><h4>Q4 · Correct: “Light is turned into glucose.” <span class="mk">[1]</span></h4><p>Light energy is transferred to chemical energy stored in glucose, which is made from carbon dioxide and water [1].</p><p class="foot">Do not credit “light is converted into glucose”.</p></div>
<div class="blk " data-question="W8-Q5"><h4>Q5 · Two reasons photosynthesis matters to animals. <span class="mk">[2]</span></h4><p>Any two: energy enters food chains (plants are producers that animals eat); releases the oxygen animals use for respiration; removes carbon dioxide from the air.</p></div>
<div class="blk " data-question="W8-Q6"><h4>Q6 · “A limiting factor is …” <span class="mk">[1]</span></h4><p>… the factor in shortest supply that stops the rate of photosynthesis increasing any further [1].</p></div>
<div class="blk " data-question="W8-Q7"><h4>Q7 · Sketch rate against temperature; label optimum and denaturing. <span class="mk">[3]</span></h4><p>Axes labelled rate of photosynthesis and temperature; curve rising to a peak [1]. Peak labelled <b>optimum</b> [1]. Falling section beyond the optimum labelled <b>enzymes denature</b> [1]. The optimum varies between plants; no single numerical value is required.</p></div>

<div class="blk " data-question="W8-Q8"><h4>Q8 · Why sodium hydrogencarbonate? Why wait 5 minutes? <span class="mk">[2]</span></h4><p>It supplies dissolved carbon dioxide [1]. The wait lets the pondweed acclimatise to the new light intensity so the rate is steady before measuring [1].</p></div>
<div class="blk criteria"><p><b>Recall subtotal: /15.</b> Add only the marks in your first answers to Q1–Q8.</p></div>
<div class="blk " data-question="W8-a"><h4>Application (a) · Plot both sets of data on one graph; smooth curves; label each room. <span class="mk">[4]</span></h4><p>Axes labelled with quantity and unit [1]; linear scales using more than half the grid [1]; all 12 points within ± half a small square [1]; two smooth curves, each labelled [1].</p></div>

<div class="blk " data-question="W8-b"><h4>Application (b) · At 20 % light both rooms have the same rate. Explain why. <span class="mk">[2]</span></h4><p>Light intensity is the limiting factor at 20 % [1]. So extra CO<sub>2</sub> makes no difference: CO<sub>2</sub> is not limiting (both rates are 4) [1].</p></div>
<div class="blk " data-question="W8-c"><h4>Application (c) · Factor limiting Room A at 100 % light, with evidence. <span class="mk">[2]</span></h4><p>Carbon dioxide concentration [1]. At the same 100 % light, extra CO<sub>2</sub> raises the rate from 8 (A) to 13 (B) [1].</p></div>
<div class="blk " data-question="W8-d"><h4>Application (d) · Room B gains dry mass faster. Use the equation to explain. <span class="mk">[3]</span></h4><p>Faster photosynthesis [1]. More glucose is made, with carbon from CO<sub>2</sub> [1]. Glucose is used to make biomass such as starch or cellulose [1]. Carbon from CO<sub>2</sub> becomes part of glucose and then biomass. Making proteins also needs a nitrogen source, such as nitrate ions; glucose alone supplies no nitrogen.</p><p class="foot">Do not credit “absorbs more food” and “light becomes mass”.</p></div>
<div class="blk criteria"><p><b>Application subtotal: /11. Week 8 original total: /26.</b> Do not add green-pen corrections or unmarked challenge points to this total.</p></div>
<div class="blk " data-question="W8-depth"><h4>Go further · unmarked model</h4><p>Choose option 2, raising the CO<sub>2</sub>. At 60 % light Room A’s rate is 8. Raising light to 100 % keeps it at 8, so light is not limiting. Raising CO<sub>2</sub> to 1200 ppm at 60 % gives 11, so CO<sub>2</sub> is limiting. <b>Changed condition:</b> at 20 % light both CO<sub>2</sub> levels give 4, so CO<sub>2</sub> is not limiting; raising the light (to 100 %, rate 8) would then be better.</p></div>
<div class="blk criteria"><h4>Go further · criteria check</h4><p>Check a clear decision; 8→11 compared with 8→8; a link to the limiting factor; and a changed starting condition that reverses the better choice. At 20% light, extra CO₂ keeps the rate at 4, while raising light to 100% in A raises 4→8.</p></div><div class="help" data-label="Table" data-title="Original Week 8 data"><div><table class="data">

<section data-step data-n="2" data-short="Week 9 answers" data-title="Week 9: compare every answer" data-kicker="8 minutes · original score /18" data-gate="Have you kept your Week 9 first attempts visible, ready to compare before correcting?">
<div class="blk do"><p>Compare your first attempts. Record <b>recall /5 + A–D /10 + E /3 = /18</b>. Keep the original score separate from your green improvements.</p></div>
<div class="blk " data-question="W9-R1"><h4>R1 · Energy absorbed by chlorophyll. <span class="mk">[1]</span></h4><p>Light energy [1].</p></div>
<div class="blk " data-question="W9-R2"><h4>R2 · Other substance used with water to make glucose. <span class="mk">[1]</span></h4><p>Carbon dioxide [1]. Light supplies energy; it is not a substitute substance.</p></div>
<div class="blk " data-question="W9-R3"><h4>R3 · Guard cell compared with a stoma. <span class="mk">[2]</span></h4><p>Guard cell: a cell bordering/regulating the pore [1]. Stoma: the pore/opening [1].</p></div>
<div class="blk " data-question="W9-R4"><h4>R4 · Tissue containing large connected air spaces. <span class="mk">[1]</span></h4><p>Spongy mesophyll [1].</p></div>
<div class="blk criteria" data-question="W9-recap"><h4>Earlier check-and-correct step · unmarked</h4><p>Replace wrong science visibly; a tick alone is not a revision. Do not add marks for copying the recap. If recall was already secure, clarify a precise distinction: a stoma is an opening; guard cells border and regulate it.</p></div>
<div class="blk " data-question="W9-A"><h4>A · Explain how Screen could reduce glucose production. Link the leaf to its cell structures. <span class="mk">[3]</span></h4><p>Less light reaches/passes through the upper tissues [1]; less reaches chlorophyll in mesophyll chloroplasts [1]; less light energy is available for photosynthesis/glucose production [1].</p><p class="foot">Do not invent a numerical rate or say carbon dioxide replaces light energy.</p></div>
<div class="blk " data-question="W9-B"><h4>B · Explain how transparent Film could reduce glucose production. <span class="mk">[3]</span></h4><p>Sealing stomata removes some open entry pathways [1]; those sealed pores no longer connect outside air to internal spaces/mesophyll [1]; this restricts CO₂ diffusion/supply for photosynthesis despite unchanged light [1]. Here CO<sub>2</sub> concentration is higher outside than in the mesophyll, so it diffuses down this concentration gradient.</p><p class="foot">Remaining open pores still permit exchange. Do not credit all diffusion stops, guard cells pump gases, or film removes chloroplasts.</p></div>
<div class="blk " data-question="W9-C"><h4>C · Explain 15 °C compared with 25 °C, connecting enzyme action to photosynthesis in chloroplasts. <span class="mk">[2]</span></h4><p>At 15 °C particles have less kinetic energy, so there are fewer successful enzyme–substrate collisions per second [1]; fewer complexes/reactions per second slow glucose production in photosynthesis (6 compared with 12 a.u.) [1].</p><p class="foot">Do not credit denaturation as the reason for the lower rate at 15 °C.</p></div>
<div class="blk " data-question="W9-D"><h4>D · Explain the fall at 45 °C using active sites and substrate binding. <span class="mk">[2]</span></h4><p>Above this crop’s optimum some relevant enzymes denature: active sites change shape [1]; substrates bind/fit less effectively, so fewer suitable complexes form and glucose production falls from 12 to 3 a.u. [1].</p><p class="foot">Do not credit enzymes are killed/used up or glucose denatures. Some activity remains in the illustrative data.</p></div>
<div class="blk " data-question="W9-E"><h4>E · Untreated at 25 °C compared with filmed at 15 °C: judge “any difference is caused by the film”. Add a condition and justify the comparison. <span class="mk">[3]</span></h4><p>Not established: film and temperature both change [1]. Add filmed at 25 °C or untreated at 15 °C [1]. Compare filmed/unfilmed matched leaves at the same temperature, light and other conditions, so film is the relevant difference [1].</p><p class="foot">Repeated rate measurements are still needed; adding a condition alone does not prove a result.</p></div>
<div class="blk criteria"><h4>Original subtotals</h4><p>R1–R4 <b>/5</b> · A–D <b>/10</b> · E <b>/3</b> = <b>Week 9 /18</b>. The temperatures 25 °C and 45 °C refer to this crop and supplied conditions; they are not universal plant limits.</p></div>
<div class="blk " data-question="W9-review"><h4>Review the original hand-in criteria</h4><p>Find your light mechanism and gas pathway. Check that both C and D connect enzyme action to photosynthesis. Check E isolates film without inventing a result. Improve one missing link, or qualify an overgeneral claim; mark remaining uncertainty <b>?</b>.</p></div><div class="help" data-label="Table" data-title="Original Week 9 temperature data"><div><table class="data"><caption>Same crop, uncovered leaves. Illustrative data; relative rate in arbitrary units (a.u.).</caption><thead><tr><th scope="col">Temperature / °C</th><th scope="col">Glucose-production rate / a.u.</th></tr></thead><tbody><tr><th scope="row">15</th><td>6</td></tr><tr><th scope="row">25</th><td>12</td></tr><tr><th scope="row">45</th><td>3</td></tr></tbody></table></div></div>
</section>

<section data-step data-n="3" data-short="Improve" data-title="Repair a link, then explain it again" data-kicker="5 minutes · feedback into action">
<div class="blk do"><h4>Make feedback change your work</h4><p>Find <b>one missing or incorrect scientific link in each week</b>. Correct it in green. Underline the evidence that now meets its criterion. Choose the help that matches the missing link.</p></div>
<div class="blk "><h4>Then reconstruct it</h4><p>Close the model and content prompts. Explain each repaired link again in your own words, without looking. Check that the explanation still works. If needed, reopen only the matching prompt, then close it and try again. Record <b>S</b> if you used content help.</p></div>
<div class="blk "><h4>If both weeks were secure</h4><p>Qualify one claim that sounds always true. Use Week 8: when would more light become the better upgrade? Or Week 9: why can the original two-leaf comparison not isolate the film? Use the exact conditions and evidence.</p></div>
<div class="blk "><p>A labelled causal sketch or spoken rehearsal can help you plan your written improvement. Support does not limit how deeply you reason. Keep access tools; fade the content prompts before the fresh attempt.</p></div><div class="help" data-label="Support" data-title="Choose the missing link, then close the prompt">
<p class="helpnote">Self-code the barrier: <b>LIGHT</b> = setup to chloroplast; <b>PORE</b> = gas route; <b>ENZYME</b> = temperature to reaction; <b>LINK</b> = evidence to explanation. Use just the matching prompt. Write S separately from your score.</p>
<div class="frame"><b>LIGHT · light</b><br>Setup change → what reaches the chloroplast → energy available → glucose production.</div>
<div class="frame"><b>PORE · gas</b><br>Outside air → stoma → connected air spaces → mesophyll surface. Add the stated concentration difference and its consequence.</div>
<div class="frame"><b>ENZYME · enzyme</b><br>Temperature relative to optimum → particle movement or active-site change → complexes per second → photosynthesis rate.</div>
<div class="frame"><b>LINK · evidence</b><br>At the same ___, ___ changes from ___ to ___. This supports ___ because ___.</div>
<p class="helpnote">Close models and prompts for reconstruction and the fresh check. Retain normal reading, enlargement, language-access and response tools. A successful different attempt shows whether to fade the content help.</p></div>
</section>

<section data-step data-n="4" data-short="Fresh check" data-title="Close the models: try a different check" data-kicker="5 minutes · independent attempt /6">
<div class="blk do"><p>Close answer pages, notes and content prompts. Keep your normal access tools. Answer all three parts in your book <b>before opening Check &amp; reflect</b>. Spend five minutes. This is a practice self-check, not the yellow sheet.</p></div>
<div class="blk "><h4>New greenhouse data</h4><p>An illustrative greenhouse grows bean plants. Comparable plants have the same temperature and water supply.</p></div>
<div class="blk "><table class="data"><caption>Oxygen-release rate / arbitrary units (a.u.). Illustrative data.</caption><thead><tr><th scope="col">Light / % of maximum</th><th scope="col">450 ppm CO₂</th><th scope="col">1000 ppm CO₂</th></tr></thead><tbody><tr><th scope="row">25</th><td>3</td><td>3</td></tr><tr><th scope="row">75</th><td>7</td><td>12</td></tr></tbody></table></div>

    <div class="blk"><h4>Light and cells</h4><p>Chlorophyll absorbs <b>light energy</b> for photosynthesis. Water and carbon dioxide supply the substances used to make glucose; oxygen is also produced. The transparent upper epidermis allows light to reach mesophyll cells. Chloroplasts in these cells contain chlorophyll.</p></div>

lipse cx="504.0" cy="95" rx="4" ry="6" fill="#56834b"/><ellipse cx="64" cy="126" rx="17" ry="11" fill="#c5d6a3" stroke="#62734d"/><ellipse cx="122" cy="126" rx="17" ry="11" fill="#c5d6a3" stroke="#62734d"/><ellipse cx="180" cy="126" rx="17" ry="11" fill="#c5d6a3" stroke="#62734d"/><ellipse cx="238" cy="126" rx="17" ry="11" fill="#c5d6a3" stroke="#62734d"/><ellipse cx="296" cy="126" rx="17" ry="11" fill="#c5d6a3" stroke="#62734d"/><ellipse cx="354" cy="126" rx="17" ry="11" fill="#c5d6a3" stroke="#62734d"/><ellipse cx="412" cy="126" rx="17" ry="11" fill="#c5d6a3" stroke="#62734d"/><ellipse cx="470" cy="126" rx="17" ry="11" fill="#c5d6a3" stroke="#62734d"/><rect x="40" y="146" width="100" height="18" fill="#eef0dc" stroke="#62734d"/><rect x="160" y="146" width="110" height="18" fill="#eef0dc" stroke="#62734d"/><rect x="290" y="146" width="110" height="18" fill="#eef0dc" stroke="#62734d"/><rect x="420" y="146" width="100" height="18" fill="#eef0dc" stroke="#62734d"/><ellipse cx="139" cy="155" rx="7" ry="12" fill="#93b471" stroke="#62734d"/><ellipse cx="161" cy="155" rx="7" ry="12" fill="#93b471" stroke="#62734d"/><ellipse cx="269" cy="155" rx="7" ry="12" fill="#93b471" stroke="#62734d"/><ellipse cx="291" cy="155" rx="7" ry="12" fill="#93b471" stroke="#62734d"/><ellipse cx="399" cy="155" rx="7" ry="12" fill="#93b471" stroke="#62734d"/><ellipse cx="421" cy="155" rx="7" ry="12" fill="#93b471" stroke="#62734d"/><text x="280" y="28" text-anchor="middle" fill="#182944" font-size="27" font-weight="700">Upper surface → palisade → spongy tissue</text><text x="280" y="216" text-anchor="middle" fill="#182944" font-size="26">Lower surface: open pores and guard cells</text><path d="M74 95H34V251H45" fill="none" stroke="#182944" stroke-width="2"/><text x="55" y="262" fill="#182944" font-size="25">Green shapes inside cells = chloroplasts</text></svg><p class="figcap">Typical terrestrial broad leaf, schematic, not to scale. Stomatal distribution varies between species.</p></div></div>
    <div class="blk"><h4>Spaces, pores and diffusion</h4><p><b>Spongy mesophyll</b> contains large connected air spaces. Open stomata connect outside air to these spaces; gases diffuse to or from mesophyll surfaces. A <b>stoma</b> is a pore. <b>Guard cells</b> regulate its opening; they do not pump gases. Net diffusion follows a concentration difference.</p></div>
    <div class="blk"><h4>The synoptic link</h4><p>Photosynthesis takes place in chloroplasts and involves <b>enzymes</b>. Below the optimum, warming gives particles more kinetic energy, increasing successful collisions and enzyme–substrate complexes. Above the optimum, enzymes can <b>denature</b>: active sites change shape and substrates bind less effectively. The rate can fall. Optima vary between plants.</p></div>
    <div class="blk never">A feature can help one part of photosynthesis without guaranteeing the overall rate under every condition. Enzymes do not “die”.</div>
    <div class="blk"><p>All four recall answers correct? Add one precise distinction, such as a pore compared with the cells beside it. Keep this recap closed for your first application attempt.</p></div>

    <div class="blk do">Try A and B on your own first. If a barrier remains after trying, open <b>Support</b>. Add a small <b>S</b> beside any answer where you use content help. Keep normal access tools.</div>
    <div class="blk q"><span class="qn">A</span><span class="stem"><span class="cmd">Explain</span> how Screen could reduce glucose production. Link the leaf to its cell structures.</span><span class="mk">[3]</span></div>
    <div class="blk q"><span class="qn">B</span><span class="stem"><span class="cmd">Explain</span> how transparent Film could reduce glucose production. Link the gas pathway to photosynthesis.</span><span class="mk">[3]</span></div>
    <div class="blk"><h4>Synoptic part: one crop, different temperatures</h4><p>Uncovered leaves from the same crop have the same area, light, water and CO₂ supply. Light and CO₂ are not limiting. This crop's optimum is <b>25 °C</b>; 45 °C is above it. The table shows illustrative rates of glucose production. Photosynthesis happens in chloroplasts and includes enzyme-controlled reactions.</p></div>
    <div class="blk"><table class="data"><caption>Same crop, uncovered leaves. Illustrative data; relative rate in arbitrary units (a.u.).</caption><thead><tr><th scope="col">Temperature / °C</th><th scope="col">Glucose-production rate / a.u.</th></tr></thead><tbody><tr><th scope="row">15</th><td>6</td></tr><tr><th scope="row">25</th><td>12</td></tr><tr><th scope="row">45</th><td>3</td></tr></tbody></table></div>
    <div class="blk"><p><b>Facts to connect:</b> at lower temperatures particles have less kinetic energy. Reactions depend on successful enzyme–substrate collisions and complexes. Sufficient heat can change active-site shape. Enzymes are not used up.</p></div>
    <div class="blk q"><span class="qn">C</span><span class="stem"><span class="cmd">Explain</span> why the rate at 15 °C is lower than at 25 °C. Connect enzyme action to photosynthesis in chloroplasts.</span><span class="mk">[2]</span></div>
    <div class="blk q"><span class="qn">D</span><span class="stem"><span class="cmd">Explain</span> why the rate falls at 45 °C. Use active sites and substrate binding to connect enzyme change to photosynthesis in chloroplasts. Use the table in C and D.</span><span class="mk">[2]</span></div>
    <div class="blk criteria"><h4>What a strong explanation shows</h4><ul>
      <li><b>Light:</b> a link from the change to the cells and the energy available.</li>
      <li><b>Gas:</b> a pathway and a diffusion explanation using the stated conditions.</li>
      <li><b>Enzymes:</b> how temperature changes enzyme action and therefore the photosynthesis rate.</li>
    </ul></div>
    <div class="help" data-label="Table" data-title="Synoptic temperature data"><table class="data"><caption>Same crop, uncovered leaves. Illustrative data; relative rate in arbitrary units (a.u.).</caption><thead><tr><th scope="col">Temperature / °C</th><th scope="col">Glucose-production rate / a.u.</th></tr></thead><tbody><tr><th scope="row">15</th><td>6</td></tr><tr><th scope="row">25</th><td>12</td></tr><tr><th scope="row">45</th><td>3</td></tr></tbody></table></div>
    <div class="help" data-label="Support" data-title="After your first attempt">
      <p class="helpnote">Self-code the barrier: <b>LIGHT</b> = connect the setup to cells; <b>PORE</b> = opening, cell or route; <b>ENZYME</b> = connect temperature to reaction; <b>LINK</b> = explain your science. Use the matching prompt. Close it for the next attempt; your teacher will recheck the link.</p>
      <div class="frame"><b>LIGHT</b><br>Change in setup: ___ → what reaches the cell: ___ → what the cell can use: ___</div>
      <div class="figblk"><div class="fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="t9-pore-help-t t9-pore-help-d" font-family="system-ui,sans-serif"><title id="t9-pore-help-t">t9 pore help</title><desc id="t9-pore-help-d">Two cells border an opening. No gas route or predicted effect is shown.</desc><path d="M231 42C103 15 101 231 231 218C176 170 176 93 231 42Z" fill="#c5d6a3" stroke="#62734d" stroke-width="4"/><path d="M329 42C457 15 459 231 329 218C384 170 384 93 329 42Z" fill="#c5d6a3" stroke="#62734d" stroke-width="4"/><text x="110" y="258" fill="#182944" font-size="28">Cell</text><path d="M141 230L169 172" fill="none" stroke="#182944" stroke-width="3"/><text x="336" y="258" fill="#182944" font-size="28">Opening</text><path d="M370 231L280 150" fill="none" stroke="#182944" stroke-width="3"/></svg></div></div>
      <div class="frame"><b>PORE</b><br>Outside air → [entry structure: ___] → [internal pathway: ___] → cell surface. The surrounding cells are separate from the opening.</div>
      <div class="frame"><b>ENZYME</b><br>Temperature compared with optimum: ___ → change in particles <i>or</i> active site: ___ → change in enzyme–substrate complexes: ___ → effect on photosynthesis: ___</div>
      <div class="frame"><b>LINK</b><br>The change is ___. This means ___. Therefore ___.<br>A labelled causal sketch or a short spoken rehearsal may help you plan.</div>

  <section data-step data-n="4" data-short="Go further" data-title="Go further: choose a fair comparison" data-kicker="Step 4 of 5 · 5 minutes · 3 marks">
    <div class="blk do">Everyone has time for this decision. You may use a language frame and still tackle the full reasoning.</div>
    <div class="blk"><p>The nursery compares an <b>untreated leaf at 25 °C</b> with a <b>filmed leaf at 15 °C</b>, under the same light. It claims: “Any difference in glucose production is caused by the film.”</p></div>
    <div class="blk q"><span class="qn">E</span><span class="stem"><span class="cmd">Judge</span> the claim. Choose <b>one additional condition</b> that would help test the effect of the film. <span class="cmd">Explain</span> the comparison you would make.</span><span class="mk">[3]</span></div>
    <div class="blk criteria"><h4>Decision criteria</h4><ul><li>Identify the competing change.</li><li>Choose a comparison that isolates the film's effect.</li><li>Justify which leaves you would compare; do not invent a result.</li></ul></div>
    <div class="help" data-label="Frame" data-title="Plan your comparison"><div class="frame">The first comparison changes ___ and ___. I would add ___. Comparing ___ with ___ would help because ___.</div><p class="helpnote">Write S if you used content help. A frame supports the explanation; it does not choose the comparison for you.</p></div>
  </section>

  <section data-step data-n="5" data-short="Hand in" data-title="Review and improve before hand-in" data-kicker="Step 5 of 5 · 3 minutes · self-assessment">
    <div class="blk do">Keep your first attempts and changes visible. Review the science, then improve a missing link in your own words.</div>
    <div class="blk"><ul class="check"><li>Underline one light mechanism and one gas-pathway mechanism.</li><li>Check that C and D connect enzyme action to photosynthesis, rather than describing temperature alone.</li><li>Check that your decision uses the conditions rather than an invented result.</li><li>If a link is missing, add your own explanation. If all are secure, qualify one claim that sounds as though it must always be true.</li><li>Mark one remaining uncertainty with <b>?</b>. Bring your book on <b>Tuesday 3 November</b>.</li></ul></div>
    <div class="blk"><p class="foot">18 marks across recall, application and the decision. These are original classroom allocations, not a Pearson mark scheme. Your teacher will review answers in class after a different individual check. This page does not collect or store information about you.</p></div>

  <section data-step data-n="2" data-short="Check" data-title="Check and correct" data-kicker="Step 2 of 5 · 5 minutes" data-gate="Have you answered every step 1 question in your book, from memory?">

    <div class="blk"><h4>What photosynthesis does</h4>
      <ul>
        <li>It happens in <span class="kw">chloroplasts</span>. Most are in the <b>palisade mesophyll</b> cells near the top of the leaf.</li>
        <li><span class="kw">Chlorophyll</span> absorbs light energy, mostly <b>red and blue</b> light. Green light is mainly reflected, so leaves look green.</li>
        <li><b>Light energy is transferred to chemical energy</b> stored in glucose, made from <b>carbon dioxide and water</b>. Light supplies energy, not atoms.</li>
      </ul>
    </div>

    <div class="blk eq" aria-label="Word equation: carbon dioxide plus water gives glucose plus oxygen, with light and chlorophyll as conditions">carbon dioxide + water → glucose + oxygen<span class="cond">light and chlorophyll go by the arrow: they are conditions, not reactants</span></div>
    <div class="blk eq" aria-label="Balanced symbol equation: 6 C O 2 plus 6 H 2 O gives C 6 H 12 O 6 plus 6 O 2">6CO<sub>2</sub> + 6H<sub>2</sub>O → C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6O<sub>2</sub><span class="cond">check: C 6 = 6 · H 12 = 12 · O 18 = 18</span></div>
    <div class="blk"><h4>Why it matters</h4>
      <ul>
        <li>It is how energy enters <b>food chains</b>: plants are producers.</li>
        <li>It <b>releases oxygen</b> and <b>removes carbon dioxide</b> from the air.</li>
        <li>The plant uses the glucose for respiration and to build starch, cellulose, sucrose, proteins and oils.</li>
      </ul>
    </div>
    <div class="blk"><h4>Limiting factors</h4>
      <ul>
        <li>A <span class="kw">limiting factor</span> is the factor in shortest supply. It stops the rate going any higher.</li>
        <li><b>Light intensity</b> and <b>CO<sub>2</sub> concentration</b>: more gives a faster rate, until another factor becomes limiting and the graph levels off.</li>
        <li>If raising a factor raises the rate, that factor <b>was</b> limiting. If it makes no difference, it was not.</li>
      </ul>
    </div>
    <div class="blk figblk"><div class="fig"><svg viewBox="0 0 520 300" role="img" aria-labelledby="t8-fig2-t t8-fig2-d">

    <div class="blk"><h4>Temperature</h4>
      <ul>
        <li>Photosynthesis is controlled by <b>enzymes</b>. Up to the optimum, molecules have more kinetic energy, collide more often and form more enzyme–substrate complexes.</li>
        <li>Above the optimum (about 30 °C in our simulator; it varies between species) the <b>active site changes shape</b>. The enzyme is <b>denatured</b> and the rate falls.</li>
      </ul>
    </div>
    <div class="blk never"><b>Never write</b> “enzymes die”, “plants make energy” or “the plant gets its food from the soil”.</div>
    <div class="blk"><h4>The pondweed investigation</h4>
      <ul>
        <li>Pondweed sits in <b>sodium hydrogencarbonate solution</b>, which supplies dissolved CO<sub>2</sub>. A water bath keeps the temperature the same.</li>
        <li>At each new light intensity, leave the pondweed about <b>5 minutes to acclimatise</b>, then collect gas in a gas syringe for a fixed time.</li>
        <li>Repeat three times, leave out any anomaly, and calculate a mean. Counting bubbles is less accurate: bubbles vary in size.</li>
      </ul>
    </div>
  </section>
