  <section data-step data-n="1" data-short="Recall" data-title="Recall from memory" data-kicker="Step 1 of 5 · 6 minutes · 10 marks">
    <div class="blk do">Cover your notes. Write the question number and your answer.</div>
    <div class="blk q"><span class="qn">1</span><span class="stem">The <b>independent variable</b> is the variable you <span class="blank"><span class="sr">blank</span></span> on purpose.</span><span class="mk">[1]</span></div>

    <div class="blk q"><span class="qn">4</span><span class="stem">At the <b>end-point</b>, what colour does the iodine stay? What does that colour tell you?</span><span class="mk">[2]</span></div>

    <div class="blk q"><span class="qn">7</span><span class="stem">A drop was tested every 30 s. So the end-point time is only known to within <span class="blank short"><span class="sr">blank</span></span> s.</span><span class="mk">[1]</span></div>
    <div class="help" data-label="Word bank" data-title="Word bank">

      <ul class="wordbank text">
        <li><span><b>independent variable (IV)</b>the one thing you change on purpose</span></li>
        <li><span><b>dependent variable (DV)</b>what you measure</span></li>
        <li><span><b>control variable</b>kept the same, so only the IV affects the DV</span></li>
        <li><span><b>end-point</b>the first iodine sample that stays orange-brown</span></li>
      </ul>
      <ul class="wordbank text">
        <li><span><b>orange-brown / blue-black</b>iodine with no starch / iodine with starch</span></li>
        <li><span><b>buffer</b>keeps the pH the same</span></li>
        <li><span><b>rate</b>1 ÷ time, in s⁻¹; bigger = faster</span></li>
        <li><span><b>sampling interval</b>how often a drop is tested, e.g. every 30 s</span></li>

  <section data-step data-n="2" data-short="Check" data-title="Check and correct" data-kicker="Step 2 of 5 · 5 minutes" data-gate="Have you answered every step 1 question in your book first?">
    <div class="blk do">Read the key facts. Go back to step 1. Tick what is right. Fix the rest in <b>green pen</b>.</div>
    <div class="blk"><h4>Variables</h4>
      <ul>
        <li><span class="kw">Independent variable</span>: what you <b>change</b>. Here: temperature.</li>
        <li><span class="kw">Dependent variable</span>: what you <b>measure</b>. Here: time to the end-point.</li>
        <li><span class="kw">Control variables</span>: kept the <b>same</b>. Here: 2 cm³ amylase, 2 cm³ starch, 1 cm³ pH-7 buffer.</li>
      </ul>
    </div>
    <div class="blk"><h4>The method</h4>
      <ul>
        <li>Warm the amylase and starch <b>separately</b>, so the reaction only starts at the test temperature.</li>
        <li>Mix and start timing. Every <b>30 s</b>, put one drop into fresh iodine.</li>
        <li><b>End-point</b>: the first drop that stays <b>orange-brown</b>. No starch is left.</li>
      </ul>
    </div>

t-weight:700">End-point 240 s</text><text x="486" y="111" class="diagram-small" text-anchor="start" font-size="17" font-weight="500" fill="#182944">rate = 0.0042 s⁻¹</text><text x="18" y="172" class="diagram-label" text-anchor="start" font-size="22" font-weight="650" fill="#182944">40 °C</text><rect x="96" y="140" width="350" height="48" rx="10" fill="#ffffff" stroke="#182944" stroke-width="2"/><circle cx="118" cy="164" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="152" cy="164" r="13" fill="#5b3a1e" stroke="#8f8676" stroke-width="2"/><circle cx="186" cy="164" r="13" fill="#b8651f" stroke="#8f8676" stroke-width="2"/><circle cx="186" cy="164" r="18.5" fill="none" stroke="#bd8126" stroke-width="3.5"/><circle cx="220" cy="164" r="13" fill="none" stroke="#c9c1ae" stroke-width="2" stroke-dasharray="4 4"/><circle cx="254" cy="164" r="13" fill="none" stroke="#c9c1ae" stroke-width="2" stroke-dasharray="4 4"/><circle cx="288" cy="164" r="13" fill="none" stroke="#c9c1ae" stroke-width="2" stroke-dasharray="4 4"/><circle cx="322" cy="164" r="13" fill="none" stroke="#c9c1ae" stroke-width="2" stroke-dasharray="4 4"/><circle cx="356" cy="164" r="13" fill="none" stroke="#c9c1ae" stroke-width="2" stroke-dasharray="4 4"/><circle cx="390" cy="164" r="13" fill="none" stroke="#c9c1ae" stroke-width="2" stroke-dasharray="4 4"/><circle cx="424" cy="164" r="13" fill="none" stroke="#c9c1ae" stroke-width="2" stroke-dasharray="4 4"/><text x="486" y="161" class="diagram-small" text-anchor="start" font-size="17" font-weight="700" fill="#182944" style="font-weight:700">End-point 90 s</text><text x="486" y="183" class="diagram-small" text-anchor="start" font-size="17" font-weight="500" fill="#182944">rate = 0.011 s⁻¹</text><text x="18" y="244" class="diagram-label" text-anchor="start" font-size="22" font-weight="650" fill="#182944">60 °C</text><rect x="96" y="212" width="350" height="48" rx="10" fill="#ffffff" stroke="#182944" stroke-width="2"/><circle cx="118" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="152" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="186" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="220" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="254" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="288" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="322" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="356" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="390" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="424" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><text x="458" y="243" class="diagram-label" text-anchor="middle" font-size="22" font-weight="650" fill="#182944">…</text><text x="486" y="233" class="diagram-small" text-anchor="start" font-size="17" font-weight="700" fill="#182944" style="font-weight:700">No end-point by 600 s</text><text x="486" y="255" class="diagram-small" text-anchor="start" font-size="17" font-weight="500" fill="#182944">starch still present</text><text x="118" y="282" class="diagram-small" text-anchor="middle" font-size="17" font-weight="500" fill="#182944">30</text><text x="220" y="282" class="diagram-small" text-anchor="middle" font-size="17" font-weight="500" fill="#182944">120</text><text x="322" y="282" class="diagram-small" text-anchor="middle" font-size="17" font-weight="500" fill="#182944">210</text><text x="424" y="282" class="diagram-small" text-anchor="middle" font-size="17" font-weight="500" fill="#182944">300</text><text x="18" y="282" class="diagram-small" text-anchor="start" font-size="17" font-weight="650" fill="#182944" style="font-weight:650">Time / s</text><circle cx="34" cy="318" r="11" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><text x="54" y="324" class="diagram-small" text-anchor="start" font-size="17" font-weight="500" fill="#182944">blue-black: starch present</text><circle cx="352" cy="318" r="11" fill="#b8651f" stroke="#8f8676" stroke-width="2"/><circle cx="352" cy="318" r="15.5" fill="none" stroke="#bd8126" stroke-width="3"/><text x="376" y="324" class="diagram-small" text-anchor="start" font-size="17" font-weight="500" fill="#182944">stays orange-brown: end-point</text></svg><p class="figcap">From Monday’s lesson. Illustrative data.</p></div></div>
    <div class="blk"><h4>Rate</h4>
      <ul>
        <li>Rate = 1 ÷ time. Unit: <b>s⁻¹</b>. A shorter time means a faster rate.</li>
        <li>Example: 1 ÷ 90 s = 0.0111… → <b>0.011 s⁻¹</b> (2 significant figures).</li>
      </ul>
    </div>
    <div class="blk"><h4>What the data can’t show</h4>
      <ul>
        <li>Testing every 30 s: the end-point is only known to within <b>30 s</b>.</li>
        <li>Testing every 10 °C: the optimum could be anywhere between the temperatures either side of the fastest one.</li>
        <li>No end-point in 600 s: the rate is <b>below 1 ÷ 600 s⁻¹</b>. That is not proof it is zero.</li>
        <li><b>Repeats</b> let you spot anomalies and find a mean. They don’t fix the 30 s limit.</li>
      </ul>
    </div>
  </section>

    </table></div>
    <div class="help" data-label="Frames" data-title="Frames">
      <p class="helpnote">Write <b>F</b> next to any part where you used a frame.</p>

  <section data-step data-n="2" data-short="Check" data-title="Check and correct" data-kicker="Step 2 of 6 · 5 minutes" data-gate="Have you answered every step 1 question in your book first?">
    <div class="blk do">Read the key facts. Go back to step 1 in your book. Tick what is right. Fix the rest in <b>green pen</b>.</div>
    <div class="blk"><h4>Enzymes</h4>
      <ul>
        <li>An <span class="kw">enzyme</span> is a <b>biological catalyst</b>. It speeds up a reaction and is not used up.</li>
        <li>The <span class="kw">substrate</span> fits into the <span class="kw">active site</span>. Together they make an <b>enzyme–substrate complex</b>.</li>
        <li>Amylase: starch → <b>maltose</b>.</li>
        <li>Rate = 1 ÷ <b>time</b>. The unit is <b>s⁻¹</b>.</li>
      </ul>
    </div>
    <div class="blk figblk"><div class="fig"><svg viewBox="0 0 440 300" role="img" aria-labelledby="d8-fig1-t d8-fig1-d">

                </svg><p class="figcap">Sketch graph: shape only, no data.</p></div></div>
    <div class="blk"><h4>Temperature: read the graph in 3 parts</h4>
      <div class="frame"><b>1 Rising:</b> more <b>kinetic energy</b>, so more <b>collisions</b>, so more enzyme–substrate complexes.</div>
    </div>
    <div class="blk frame"><b>2 Peak:</b> the <b>optimum</b>. The rate is fastest here.</div>
    <div class="blk frame"><b>3 Falling:</b> the <b>active site changes shape</b>. The substrate no longer fits. The enzyme is <b>denatured</b>. This is permanent.</div>
    <div class="blk never"><b>Cold</b> slows enzymes but does <b>not</b> denature them. Never write “the enzyme is killed”: enzymes are not alive.</div>
    <div class="blk"><h4>pH</h4>
      <ul>
        <li>Each enzyme has an <b>optimum pH</b>.</li>
        <li>Away from the optimum, the <b>active site changes shape</b>. The substrate fits less well, so the rate falls.</li>
        <li>Very high or low pH <b>denatures</b> the enzyme.</li>
      </ul>
    </div>
