<template data-week="week-13" data-label="Week 13 · Fix your AP2 (2 of 2)">

  <section data-step data-n="" data-short="Start" data-title="Fix your AP2: part 2" data-kicker="Week 13 · homework 2 of 2">
    <div class="blk"><p class="lead">Last week you fixed short answers and calculations. This week is about the biggest group of lost marks: <b>explaining why</b>. Each part shows you how to answer, gives a worked example, then lets you practise on your own.</p></div>
    <div class="blk"><ul class="facts" aria-label="At a glance"><li>About 45 minutes</li><li class="gold">Answer in your exercise book</li><li>Bring your book to your next Biology lesson</li></ul></div>
    <div class="blk rules"><h4>How this works</h4><ol>
      <li>Write <b>Home learning · Week 13 · Fix your AP2 (2)</b>.</li>
      <li>Read each worked example carefully. Then do <b>Your turn</b> on your own.</li>
      <li>Stuck? Try first, then open <b>Help</b>. Write <b>H</b> next to any answer you used help for.</li>
      <li>Step 7 is a short exam question. Time yourself: 9 minutes.</li>
    </ol></div>
    <div class="blk"><p>Use your usual reading, enlargement, language-access and response tools. Translation may help with the wording. Your answers must be your own; do not use AI or answer websites.</p></div>
  </section>

  <section data-step data-n="1" data-short="Your data" data-title="Where the marks were lost" data-kicker="Step 1 of 8 · 2 minutes">
    <div class="blk"><table class="data"><caption>Marks needing an explanation in the hardest AP2 questions on the Double paper</caption><thead><tr><th scope="col">Question</th><th scope="col">Explanation marks</th><th scope="col">Year 10 score on the question</th></tr></thead><tbody>
      <tr><th scope="row">Q2 Lipase practical</th><td>4 of 8</td><td>46%</td></tr>
      <tr><th scope="row">Q3 Cells and osmosis (red blood cells)</th><td>5 of 12</td><td>46%</td></tr>
      <tr><th scope="row">Q8 The gut and cellulose</th><td>3 of 7</td><td>51%</td></tr>
      <tr><th scope="row">Q5 Benedict's test</th><td>6 of 8</td><td>53%</td></tr>
      <tr><th scope="row">Q9 Comparing two milks</th><td>5 of 5 (discuss)</td><td>54%</td></tr>
    </tbody></table><p class="helpnote">These are averages for the whole of Year 10 on the questions you also sat.</p></div>
    <div class="blk"><p>Explanations and discussing data were <b>23 of the 43 marks</b> in the six hardest questions, the largest group. Most lost marks came from answers that said <i>what</i> happened but not <i>why</i>, or stopped after one idea.</p></div>
    <div class="blk do">In your book, score yourself <b>1, 2 or 3</b> (3 = confident) for: explaining in a chain · explaining osmosis · explaining enzyme results · explaining a step in a method · comparing with data.</div>
  </section>

  <section data-step data-n="2" data-short="Chains" data-title="Explain in a chain" data-kicker="Step 2 of 8 · 8 minutes · 8 marks">
    <div class="blk"><h4>How to answer</h4><ol>
      <li>Start with what happens first.</li>
      <li>Join each idea to the next with <b>so</b> or <b>because</b>.</li>
      <li>One linked idea for each mark. Keep going until you reach what the question asked about.</li>
    </ol></div>
    <div class="blk"><h4>Worked example</h4><div class="frame">Explain why the rate at which amylase digests starch slows down after 10 minutes, even though the temperature stays the same. [2]<br>
      <b>Idea 1</b> The starch is being used up,<br>
      <b>so → Idea 2</b> amylase and starch collide less often, so fewer enzyme–substrate complexes form (fewer starch molecules fit into amylase's active site).<br>
      2 marks, 2 linked ideas.</div></div>
    <div class="blk never">Respiration <b>releases</b> energy. It never “makes” or “produces” energy.</div>
    <div class="blk"><h4>Your turn</h4></div>
    <div class="blk q"><span class="qn">X1</span><span class="stem"><span class="cmd">Explain</span> why a person on a very low-carbohydrate diet may get tired quickly during a long run.</span><span class="mk">[3]</span></div>
    <div class="blk q"><span class="qn">X2</span><span class="stem">Bacteria in a cow's stomach make cellulase. Humans do not make cellulase. <span class="cmd">Explain</span> why a cow can get energy from grass but a human cannot. Assume the glucose produced is absorbed by the cow.</span><span class="mk">[3]</span></div>
    <div class="blk q"><span class="qn">X3</span><span class="stem"><span class="cmd">Explain</span> why muscle cells need a supply of glucose during exercise.</span><span class="mk">[2]</span></div>
    <div class="help" data-label="Help" data-title="If you are stuck">
      <p class="helpnote">Use these links in order. Each arrow is one mark.</p>
      <div class="frame">X1: less carbohydrate → less ______ absorbed into the blood → less ______ in muscle cells → less energy ______ for the muscles to contract.<br>X2: cellulase digests cellulose into ______ → used in ______ → releases ______ · humans have no ______.</div>
    </div>
  </section>

  <section data-step data-n="3" data-short="Osmosis" data-title="Explain osmosis: cells in water and salt" data-kicker="Step 3 of 8 · 6 minutes · 5 marks">
    <div class="blk"><h4>How to answer</h4><ol>
      <li>Compare the two solutions: which is more <b>dilute</b> (more water) and which is more <b>concentrated</b> (less water)?</li>
      <li>Say that water moves <b>by osmosis</b>, from the dilute solution to the concentrated one, through the partially permeable cell membrane.</li>
      <li>Say what happens to the cell. Animal cells have no cell wall, so they can burst or shrink.</li>
    </ol></div>
    <div class="blk"><h4>Worked example</h4><div class="frame">Red blood cells are placed in pure water. Explain what happens to them. [3]<br>
      <b>Idea 1</b> The water outside is more dilute than the cytoplasm inside the cell,<br>
      <b>so → Idea 2</b> water moves into the cell by osmosis, through the partially permeable cell membrane,<br>
      <b>so → Idea 3</b> the cell swells and, because it has no cell wall, it bursts.</div></div>
    <div class="blk never">“The cell absorbs water” on its own scores nothing. Name osmosis and say which way the water moves.</div>
    <div class="blk"><h4>Your turn</h4></div>
    <div class="blk q"><span class="qn">O1</span><span class="stem">Red blood cells are placed in a concentrated salt solution. <span class="cmd">Explain</span> what happens to them.</span><span class="mk">[3]</span></div>
    <div class="blk q"><span class="qn">O2</span><span class="stem">A plant cell is placed in pure water. <span class="cmd">Explain</span> why it does not burst, even though a red blood cell would.</span><span class="mk">[2]</span></div>
    <div class="help" data-label="Help" data-title="If you are stuck">
      <p class="helpnote">Answer these three questions in order, then join them with “so”.</p>
      <div class="frame">1 Which is more concentrated: inside the cell or outside?<br>2 Which way does water move by osmosis: in or out?<br>3 What happens to the cell? (Does it have a cell wall?)</div>
    </div>
  </section>

  <section data-step data-n="4" data-short="Enzymes" data-title="Explain enzyme results" data-kicker="Step 4 of 8 · 7 minutes · 7 marks">
    <div class="blk"><h4>How to answer</h4><ol>
      <li><b>Below the best (optimum) temperature:</b> molecules move faster, so they collide more often, so more enzyme–substrate complexes form and the reaction speeds up.</li>
      <li><b>Name the optimum</b> from the data.</li>
      <li><b>Above the optimum, or at the wrong pH:</b> the enzyme is denatured, so its active site changes shape, so the substrate no longer fits.</li>
      <li>Never write “killed” or “dies”. Enzymes are not alive.</li>
    </ol></div>
    <div class="blk"><h4>Worked example</h4><div class="frame">A protease digests egg-white protein. The rate increases from 20 °C to 40 °C, then falls to almost zero at 70 °C. Explain these results. [4]<br>
      <i>From 20 °C to 40 °C, the molecules have more kinetic energy, so they collide more often and more enzyme–substrate complexes form [1, 1]. 40 °C is the optimum [1]. Above 40 °C the protease is denatured: its active site changes shape, so the protein no longer fits [1].</i><br>
      Both parts explained: the rise and the fall.</div></div>
    <div class="blk"><h4>Your turn</h4></div>
    <div class="blk q"><span class="qn">T1</span><span class="stem">Pepsin is a protease that works in the stomach, where the pH is about 2. <span class="cmd">Explain</span> why pepsin digests protein very slowly at pH 7.</span><span class="mk">[3]</span></div>
    <div class="blk"><table class="data"><caption>Time for a bacterial amylase to digest starch. Illustrative data.</caption><thead><tr><th scope="col">Temperature / °C</th><th scope="col">10</th><th scope="col">25</th><th scope="col">35</th><th scope="col">45</th><th scope="col">55</th></tr></thead><tbody><tr><th scope="row">Time / s</th><td>300</td><td>150</td><td>60</td><td>120</td><td>400</td></tr></tbody></table></div>
    <div class="blk q"><span class="qn">T2</span><span class="stem"><span class="cmd">Explain</span> the results in the table. Remember: a shorter time means a faster reaction.</span><span class="mk">[4]</span></div>
    <div class="help" data-label="Help" data-title="If you are stuck">
      <p class="helpnote">For T2, write two short paragraphs.</p>
      <div class="frame">Up to 35 °C: the molecules have more ______ energy, so they ______ more often, so more ______ complexes form, so the time is shorter.<br>Above 35 °C: the enzyme is ______, so its active site ______, so the starch no longer ______.</div>
    </div>
  </section>

  <section data-step data-n="5" data-short="Method steps" data-title="Explain a step in a method" data-kicker="Step 5 of 8 · 4 minutes · 3 marks">
    <div class="blk"><h4>How to answer</h4><ol>
      <li>Say what the step does.</li>
      <li>Then say how that makes the results fair or more accurate.</li>
      <li>“To make it a fair test” on its own scores nothing. Say <i>what</i> it keeps fair.</li>
    </ol></div>
    <div class="blk"><h4>Worked example</h4><div class="frame">Explain why the amylase and the starch solution are put in the water bath for 5 minutes <b>before</b> they are mixed. [2]<br>
      <i>So both liquids reach the temperature of the water bath before mixing [1], so the reaction happens at that temperature from the start and only the variable being tested affects the time [1].</i></div></div>
    <div class="blk"><h4>Your turn</h4></div>
    <div class="blk q"><span class="qn">W1</span><span class="stem"><span class="cmd">Suggest</span> why a student grated the cheese before adding a protease to it.</span><span class="mk">[1]</span></div>
    <div class="blk q"><span class="qn">W2</span><span class="stem"><span class="cmd">Explain</span> why a buffer solution is added to each tube in an enzyme investigation.</span><span class="mk">[1]</span></div>
    <div class="blk q"><span class="qn">W3</span><span class="stem"><span class="cmd">Suggest</span> why the Benedict's tubes are heated in a water bath rather than straight over a Bunsen flame.</span><span class="mk">[1]</span></div>
  </section>

  <section data-step data-n="6" data-short="Compare" data-title="Compare and discuss with data" data-kicker="Step 6 of 8 · 7 minutes · 6 marks">
    <div class="blk"><h4>How to answer</h4><ol>
      <li>Put <b>both</b> things in every sentence, with a comparing word: more, less, higher, lower.</li>
      <li>Quote <b>both</b> numbers: “5 g compared with 30 g”.</li>
      <li>Say why the difference matters.</li>
      <li>If you are asked to discuss or decide, finish with “Overall… because…”.</li>
    </ol></div>
    <div class="blk"><h4>Worked example</h4><div class="frame">Per 100 g, cereal A has 1600 kJ of energy, 30 g of sugar and 2 g of fibre. Cereal B has 1500 kJ, 5 g of sugar and 9 g of fibre. Discuss which cereal is the better choice for a healthy breakfast. Use the data. [4]<br>
      <i>Cereal B has much less sugar than cereal A (5 g compared with 30 g), so there is less risk of tooth decay [1]. Cereal B has more fibre than cereal A (9 g compared with 2 g), which helps prevent constipation [1]. Their energy is similar (1500 kJ compared with 1600 kJ) [1]. Overall, cereal B is the better choice because it has less sugar and more fibre [1].</i></div></div>
    <div class="blk"><h4>Your turn</h4></div>
    <div class="blk q"><span class="qn">D1</span><span class="stem">The lower surface of a leaf has 240 stomata per mm². The upper surface has 20 stomata per mm². <span class="cmd">Compare</span> the two surfaces.</span><span class="mk">[2]</span></div>
    <div class="blk q"><span class="qn">D2</span><span class="stem">Per 500 cm³, sports drink A has 400 kJ of energy and 24 g of glucose. Drink B has 120 kJ and 6 g of glucose. <span class="cmd">Discuss</span> which drink is better for a marathon runner. Use the data.</span><span class="mk">[4]</span></div>
  </section>

  <section data-step data-n="7" data-short="Exam question" data-title="Short exam question" data-kicker="Step 7 of 8 · 9 minutes · 9 marks">
    <div class="blk do">Set a 9-minute timer. Box, underline and count each part first. Use what you practised in Steps 2–6.</div>
    <div class="blk"><p>The enzyme catalase, found in potato, breaks down hydrogen peroxide into water and oxygen. A student adds potato pieces to hydrogen peroxide at different pH values, using buffers, and collects the oxygen in a measuring cylinder for 2 minutes.</p>
      <table class="data"><caption>Volume of oxygen collected in 2 minutes. Illustrative data.</caption><thead><tr><th scope="col">pH</th><th scope="col">4</th><th scope="col">5</th><th scope="col">6</th><th scope="col">7</th><th scope="col">8</th><th scope="col">9</th></tr></thead><tbody><tr><th scope="row">Oxygen / cm³</th><td>4</td><td>9</td><td>15</td><td>20</td><td>12</td><td>3</td></tr></tbody></table></div>
    <div class="blk q"><span class="qn">Ta</span><span class="stem"><span class="cmd">Give</span> the variable being changed and one variable that should be kept the same.</span><span class="mk">[2]</span></div>
    <div class="blk q"><span class="qn">Tb</span><span class="stem"><span class="cmd">Describe</span> the effect of pH on the volume of oxygen collected. Use numbers from the table.</span><span class="mk">[3]</span></div>
    <div class="blk q"><span class="qn">Tc</span><span class="stem"><span class="cmd">Explain</span> why so little oxygen is collected at pH 9.</span><span class="mk">[3]</span></div>
    <div class="blk q"><span class="qn">Td</span><span class="stem"><span class="cmd">Suggest</span> a piece of equipment that would measure the volume of oxygen more accurately than a measuring cylinder.</span><span class="mk">[1]</span></div>
  </section>

  <section data-step data-n="8" data-short="Done" data-title="How much have you improved?" data-kicker="Step 8 of 8 · 2 minutes · self-assessment">
    <div class="blk do">Score yourself 1, 2 or 3 again for the five skills from Step 1. Write the new score next to the old one.</div>
    <div class="blk"><ul class="check">
      <li>Each explanation has as many linked ideas as marks, joined with “so” or “because”.</li>
      <li>Osmosis answers name osmosis, say which way the water moves, and what happens to the cell.</li>
      <li>Enzyme answers explain both the rise and the fall, and say “denatured”, never “killed”.</li>
      <li>Every comparison names both things and quotes both numbers.</li>
      <li>Write one sentence: “I can now… which I could not do in AP2.”</li>
    </ul></div>
    <div class="blk"><p class="foot">38 marks in total. These are original classroom questions, not a Pearson mark scheme. Your teacher will go through the answers after a short check in class. This page does not collect or store information about you.</p></div>
  </section>

</template>

  <section data-step data-n="2" data-short="Read it" data-title="Read the question first" data-kicker="Step 2 of 7 · 3 minutes · 2 marks">
    <div class="blk"><h4>How to answer</h4><ol>
      <li><b>Box</b> the instruction word at the start, such as Give, Calculate or Describe.</li>
      <li><b>Underline</b> anything your answer must include, such as a unit or “two”.</li>
      <li><b>Count</b> the marks. That is how many points or steps you need.</li>
    </ol></div>
    <div class="blk"><h4>Worked example</h4><div class="frame">
      <span style="border:2px solid currentColor;border-radius:4px;padding:2px 8px"><b>Calculate</b></span> the surface area to volume ratio of the cube. <u style="text-decoration-thickness:2px;text-underline-offset:3px">Give your answer as a ratio</u>. [3]<br>
      I boxed <b>Calculate</b>, so I must show working.<br>
      I underlined <b>as a ratio</b>, so my answer must look like “3 : 1”.<br>
      There are <b>3 marks</b>, so I expect 3 steps.</div></div>
    <div class="blk"><h4>Your turn</h4><p>Copy each question. Box, underline and count. Then write one line starting “My answer must…”. Do not answer it.</p></div>
    <div class="blk q"><span class="qn">R1</span><span class="stem">Calculate the stomatal density. Give your answer to 2 significant figures. [3]</span><span class="mk">[1]</span></div>
    <div class="blk q"><span class="qn">R2</span><span class="stem">Give two variables the student should keep the same. [2]</span><span class="mk">[1]</span></div>
  </section>

  <section data-step data-n="3" data-short="Short answers" data-title="Short answers: use the exact science word" data-kicker="Step 3 of 7 · 5 minutes · 6 marks">
    <div class="blk"><h4>How to answer</h4><ol>
      <li>One precise word or fact is enough. No reason is needed.</li>
      <li>Use the science word, not an everyday word.</li>
      <li>A thing you keep the same can never be the thing you are changing.</li>
    </ol></div>
    <div class="blk"><h4>Worked examples</h4><div class="frame">
      Give the dependent variable (what is measured).<br>✗ <i>the amount of gas</i> &nbsp; ✓ <i>the volume of gas collected in 5 minutes</i> · “Amount” is too vague, so it scores nothing.<br>
      Give one variable to keep the same in an investigation into the effect of temperature on an enzyme.<br>✗ <i>temperature</i> &nbsp; ✓ <i>the volume of enzyme</i> · Temperature is being changed.<br>
      Name the product when starch is digested.<br>✗ <i>sugar</i> &nbsp; ✓ <i>maltose</i> · Name the exact substance.</div></div>
    <div class="blk"><h4>Your turn</h4></div>
    <div class="blk q"><span class="qn">N1</span><span class="stem"><span class="cmd">Name</span> the tube that carries food from the mouth to the stomach.</span><span class="mk">[1]</span></div>

  <section data-step data-n="4" data-short="Stomata" data-title="Calculation: stomatal density" data-kicker="Step 4 of 7 · 6 minutes · 6 marks">
    <div class="blk"><h4>How to answer</h4><ol>
      <li>Mean = add the counts, then divide by how many counts there are.</li>
      <li>Area of the circle = 3.14 × radius × radius.</li>
      <li>Density = mean ÷ area. Round as asked. The unit is per mm².</li>
    </ol></div>
    <div class="blk"><h4>Worked example</h4><div class="frame">Stomata counted in three circles: 14, 18 and 16. Each circle has a radius of 0.25 mm. Calculate the stomatal density to 2 significant figures. [3]<br>
      <b>1</b> Mean = (14 + 18 + 16) ÷ 3 = 48 ÷ 3 = 16<br>
      <b>2</b> Area = 3.14 × 0.25 × 0.25 = 0.19625 mm²<br>
      <b>3</b> Density = 16 ÷ 0.19625 = 81.5 = <b>82 per mm²</b> (2 significant figures)</div></div>
    <div class="blk never">In AP2, the common mistakes were radius × 2 instead of radius × radius, and dividing the total instead of the mean.</div>
    <div class="blk"><h4>Your turn</h4></div>
    <div class="blk q"><span class="qn">S1</span><span class="stem">Counts: 31, 27, 35 and 29. Radius 0.20 mm. <span class="cmd">Calculate</span> the stomatal density to 2 significant figures.</span><span class="mk">[3]</span></div>
    <div class="blk q"><span class="qn">S2</span><span class="stem">Counts: 22, 25, 19, 26 and 23. This time the circle's <b>diameter</b> is 0.60 mm (the distance all the way across). <span class="cmd">Calculate</span> the stomatal density to 2 significant figures.</span><span class="mk">[3]</span></div>
    <div class="help" data-label="Help" data-title="If you are stuck">
      <p class="helpnote">Copy this layout and fill in the gaps for S1. Then do S2 on your own.</p>
      <div class="frame">Mean = (31 + 27 + 35 + 29) ÷ 4 = ____<br>Area = 3.14 × ____ × ____ = ____ mm²<br>Density = ____ ÷ ____ = ____ per mm²</div>
      <p class="helpnote">For S2: halve the diameter first to get the radius.</p>
    </div>
  </section>

  <section data-step data-n="5" data-short="SA : V" data-title="Calculation: surface area to volume ratio" data-kicker="Step 5 of 7 · 6 minutes · 6 marks">
    <div class="blk"><h4>How to answer</h4><ol>
      <li>Surface area of a cube = 6 × side × side (a cube has 6 faces).</li>
      <li>Volume of a cube = side × side × side.</li>
      <li>Ratio = surface area ÷ volume. Write it as a number : 1.</li>
    </ol></div>
    <div class="blk"><h4>Worked example</h4><div class="frame">Calculate the surface area to volume ratio of a cube with sides of 2 cm. [3]<br>
      <b>1</b> Surface area = 6 × 2 × 2 = 24 cm²<br>
      <b>2</b> Volume = 2 × 2 × 2 = 8 cm³<br>
      <b>3</b> Ratio = 24 ÷ 8 = 3, so <b>3 : 1</b></div></div>
    <div class="blk never">Common mistakes: forgetting the 6 faces, and writing the ratio the wrong way round (volume first).</div>
    <div class="blk"><h4>Your turn</h4></div>
    <div class="blk q"><span class="qn">V1</span><span class="stem"><span class="cmd">Calculate</span> the surface area to volume ratio of a cube with sides of 1 cm.</span><span class="mk">[3]</span></div>
    <div class="blk q"><span class="qn">V2</span><span class="stem"><span class="cmd">Calculate</span> the surface area to volume ratio of a cube with sides of 4 cm. Then <span class="cmd">state</span> which cube, 1 cm or 4 cm, has the larger ratio.</span><span class="mk">[3]</span></div>
    <div class="help" data-label="Help" data-title="If you are stuck">
      <p class="helpnote">Copy this layout and fill in the gaps for V1. Then do V2 on your own.</p>
      <div class="frame">Surface area = 6 × ____ × ____ = ____ cm²<br>Volume = ____ × ____ × ____ = ____ cm³<br>Ratio = ____ ÷ ____ = ____ , so ____ : 1</div>
    </div>
  </section>

  <section data-step data-n="6" data-short="Method" data-title="Describe a method" data-kicker="Step 6 of 7 · 8 minutes · 7 marks">
    <div class="blk"><h4>How to answer</h4><ol>
      <li>Say what you change, with the values.</li>
      <li>Say two things you keep the same, and how.</li>
      <li>Say what you measure, and the equipment you use.</li>
      <li>Repeat each one and work out a mean. One point per mark.</li>
    </ol></div>
    <div class="blk"><h4>Worked example</h4><div class="frame">Describe how to find the effect of temperature on how long amylase takes to digest starch. [4]<br>
      <b>1 Change</b> Put tubes of starch and amylase in water baths at 20, 30, 40, 50 and 60 °C.<br>
      <b>2 Keep the same</b> Use the same volume of starch and of amylase each time, and add a buffer so the pH stays the same.<br>
      <b>3 Measure</b> Every 30 seconds, add a drop of the mixture to iodine. Use a stopwatch to time how long until it no longer turns blue-black.<br>
      <b>4 Repeat</b> Do each temperature three times and work out a mean.</div></div>

    <div class="blk"><h4>Variables</h4>

    <div class="blk"><h4>The method</h4>

3" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="152" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="186" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="220" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="254" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="288" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="322" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="356" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="390" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><circle cx="424" cy="236" r="13" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><text x="458" y="243" class="diagram-label" text-anchor="middle" font-size="22" font-weight="650" fill="#182944">…</text><text x="486" y="233" class="diagram-small" text-anchor="start" font-size="17" font-weight="700" fill="#182944" style="font-weight:700">No end-point by 600 s</text><text x="486" y="255" class="diagram-small" text-anchor="start" font-size="17" font-weight="500" fill="#182944">starch still present</text><text x="118" y="282" class="diagram-small" text-anchor="middle" font-size="17" font-weight="500" fill="#182944">30</text><text x="220" y="282" class="diagram-small" text-anchor="middle" font-size="17" font-weight="500" fill="#182944">120</text><text x="322" y="282" class="diagram-small" text-anchor="middle" font-size="17" font-weight="500" fill="#182944">210</text><text x="424" y="282" class="diagram-small" text-anchor="middle" font-size="17" font-weight="500" fill="#182944">300</text><text x="18" y="282" class="diagram-small" text-anchor="start" font-size="17" font-weight="650" fill="#182944" style="font-weight:650">Time / s</text><circle cx="34" cy="318" r="11" fill="#1d2140" stroke="#8f8676" stroke-width="2"/><text x="54" y="324" class="diagram-small" text-anchor="start" font-size="17" font-weight="500" fill="#182944">blue-black: starch present</text><circle cx="352" cy="318" r="11" fill="#b8651f" stroke="#8f8676" stroke-width="2"/><circle cx="352" cy="318" r="15.5" fill="none" stroke="#bd8126" stroke-width="3"/><text x="376" y="324" class="diagram-small" text-anchor="start" font-size="17" font-weight="500" fill="#182944">stays orange-brown: end-point</text></svg><p class="figcap">From Monday’s lesson. Illustrative data.</p></div></div>
    <div class="blk"><h4>Rate</h4>
      <ul>
        <li>Rate = 1 ÷ time. Unit: <b>s⁻¹</b>. A shorter time means a faster rate.</li>
        <li>Example: 1 ÷ 90 s = 0.0111… → <b>0.011 s⁻¹</b> (2 significant figures).</li>
      </ul>
    </div>
    <div class="blk"><h4>What the data can’t show</h4>
      <ul>
        <li>Testing every 30 s: the end-point is only known to within <b>30 s</b>.</li>
        <li>Testing every 10 °C: the optimum could be anywhere between the temperatures either side of the fastest one.</li>
        <li>No end-point in 600 s: the rate is <b>below 1 ÷ 600 s⁻¹</b>. That is not proof it is zero.</li>
        <li><b>Repeats</b> let you spot anomalies and find a mean. They don’t fix the 30 s limit.</li>
      </ul>
    </div>
  </section>

    <div class="blk do">Read the key facts. Go back to step 1 in your book. Tick what is right. Fix the rest in <b>green pen</b>.</div>
    <div class="blk"><h4>Enzymes</h4>
      <ul>
        <li>An <span class="kw">enzyme</span> is a <b>biological catalyst</b>. It speeds up a reaction and is not used up.</li>
        <li>The <span class="kw">substrate</span> fits into the <span class="kw">active site</span>. Together they make an <b>enzyme–substrate complex</b>.</li>
        <li>Amylase: starch → <b>maltose</b>.</li>
        <li>Rate = 1 ÷ <b>time</b>. The unit is <b>s⁻¹</b>.</li>
      </ul>
    </div>
    <div class="blk figblk"><div class="fig"><svg viewBox="0 0 440 300" role="img" aria-labelledby="d8-fig1-t d8-fig1-d">

    <div class="blk"><h4>Temperature: read the graph in 3 parts</h4>
      <div class="frame"><b>1 Rising:</b> more <b>kinetic energy</b>, so more <b>collisions</b>, so more enzyme–substrate complexes.</div>
    </div>
    <div class="blk frame"><b>2 Peak:</b> the <b>optimum</b>. The rate is fastest here.</div>
    <div class="blk frame"><b>3 Falling:</b> the <b>active site changes shape</b>. The substrate no longer fits. The enzyme is <b>denatured</b>. This is permanent.</div>
    <div class="blk never"><b>Cold</b> slows enzymes but does <b>not</b> denature them. Never write “the enzyme is killed”: enzymes are not alive.</div>
    <div class="blk"><h4>pH</h4>
      <ul>
        <li>Each enzyme has an <b>optimum pH</b>.</li>
        <li>Away from the optimum, the <b>active site changes shape</b>. The substrate fits less well, so the rate falls.</li>
        <li>Very high or low pH <b>denatures</b> the enzyme.</li>
      </ul>

  <section data-step data-n="3" data-short="Skill" data-title="Graph skill: rate = 1 ÷ time" data-kicker="Step 3 of 6 · 6 minutes · 4 marks">

      <p><b>Biological washing powder</b> contains a <b>protease</b>. It digests protein stains, like egg. A pupil puts egg-stained cloth into washing-powder solution at different temperatures. They time how long the stain takes to disappear.</p></div>

  <section data-step data-n="4" data-short="Exam" data-title="Exam-style question" data-kicker="Step 4 of 6 · 8 minutes · 6 marks">

  <section data-step data-n="5" data-short="Go further" data-title="Go further: find a counterexample" data-kicker="Step 5 of 6 · 4 minutes">
    <div class="blk"><p>A pupil says: <b>“The washing-powder protease is a better enzyme than trypsin, because its optimum is higher.”</b></p></div>
    <div class="blk"><p>Trypsin is a protease in your small intestine. It works best at about 37 °C and pH 8.</p></div>
    <div class="blk"><p><span class="cmd">Give</span> one place or situation where trypsin would work better than the washing-powder protease. <span class="cmd">Explain</span> why, using the word <b>optimum</b>.</p></div>
