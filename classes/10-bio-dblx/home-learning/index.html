    <div class="blk do">Read the key facts. Go back to step 1 in your book. Tick what is right. Fix the rest in <b>green pen</b>.</div>
    <div class="blk"><h4>Enzymes</h4>
      <ul>
        <li>An <span class="kw">enzyme</span> is a <b>biological catalyst</b>. It speeds up a reaction and is not used up.</li>
        <li>The <span class="kw">substrate</span> fits into the <span class="kw">active site</span>. Together they make an <b>enzyme–substrate complex</b>.</li>
        <li>Amylase: starch → <b>maltose</b>.</li>
        <li>Rate = 1 ÷ <b>time</b>. The unit is <b>s⁻¹</b>.</li>
      </ul>
    </div>

    <div class="blk"><h4>Temperature: read the graph in 3 parts</h4>
      <div class="frame"><b>1 Rising:</b> more <b>kinetic energy</b>, so more <b>collisions</b>, so more enzyme–substrate complexes.</div>
    </div>
    <div class="blk frame"><b>2 Peak:</b> the <b>optimum</b>. The rate is fastest here.</div>
    <div class="blk frame"><b>3 Falling:</b> the <b>active site changes shape</b>. The substrate no longer fits. The enzyme is <b>denatured</b>. This is permanent.</div>
    <div class="blk never"><b>Cold</b> slows enzymes but does <b>not</b> denature them. Never write “the enzyme is killed”: enzymes are not alive.</div>
    <div class="blk"><h4>pH</h4>
      <ul>
        <li>Each enzyme has an <b>optimum pH</b>.</li>
        <li>Away from the optimum, the <b>active site changes shape</b>. The substrate fits less well, so the rate falls.</li>
        <li>Very high or low pH <b>denatures</b> the enzyme.</li>
      </ul>
    </div>

  <section data-step data-n="3" data-short="Skill" data-title="Graph skill: rate = 1 ÷ time" data-kicker="Step 3 of 6 · 6 minutes · 4 marks">
    <div class="blk"><p><span class="tag">New context</span><span class="tag gold">Illustrative data</span></p>
      <p><b>Biological washing powder</b> contains a <b>protease</b>. It digests protein stains, like egg. A pupil puts egg-stained cloth into washing-powder solution at different temperatures. They time how long the stain takes to disappear.</p></div>
    <div class="blk"><table class="data">
      <caption>Time for the egg stain to disappear. Illustrative data.</caption>
      <thead><tr><th scope="col">Temperature / °C</th><th scope="col">Time / s</th></tr></thead>
      <tbody><tr><td>20</td><td>400</td></tr><tr><td>30</td><td>250</td></tr><tr><td>40</td><td>160</td></tr><tr><td>50</td><td>100</td></tr><tr><td>60</td><td>200</td></tr><tr><td>70</td><td>still there at 600 s</td></tr></tbody>
    </table></div>
    <div class="blk rung"><h4>Worked example</h4>
      <p>From Monday: amylase at 40 °C took <b>90 s</b>. Rate = 1 ÷ 90.</p>
      <p>Press <span class="keys">1 ÷ 9 0 =</span> Screen: 0.01111…</p>
      <p>Round to 2 significant figures: <b style="white-space:nowrap">0.011 s⁻¹</b></p>
    </div>
    <div class="blk rung"><h4>Your turn: part done</h4>
      <p>The protease at 30 °C took <b>250 s</b>. Rate = 1 ÷ <span class="blank short"><span class="sr">blank</span></span></p>
      <p>Press <span class="keys">1 ÷ 2 5 0 =</span></p>
      <p>Rate = 0.00<span class="blank short"><span class="sr">blank</span></span> s⁻¹ <span class="mk">[1]</span></p>
    </div>
    <div class="blk rung"><h4>On your own</h4>
      <p>Calculate the rate at <b>50 °C</b>. <span class="mk">[1]</span></p>
      <p>Calculate the rate at <b>60 °C</b>. <span class="mk">[1]</span></p>
      <p>Write each rate <b>with its unit</b>. <span class="mk">[1]</span></p>
    </div>
    <div class="help" data-label="Table" data-title="Washing-powder data"><table class="data">
      <caption>Time for the egg stain to disappear. Illustrative data.</caption>
      <thead><tr><th scope="col">Temperature / °C</th><th scope="col">Time / s</th></tr></thead>
      <tbody><tr><td>20</td><td>400</td></tr><tr><td>30</td><td>250</td></tr><tr><td>40</td><td>160</td></tr><tr><td>50</td><td>100</td></tr><tr><td>60</td><td>200</td></tr><tr><td>70</td><td>still there at 600 s</td></tr></tbody>
    </table></div>
  </section>

  <section data-step data-n="4" data-short="Exam" data-title="Exam-style question" data-kicker="Step 4 of 6 · 8 minutes · 6 marks">
    <div class="blk"><p><span class="tag">Original question</span><span class="tag gold">Same washing-powder data</span></p><p>Press <b>Table</b> at the top to see the data.</p></div>
    <div class="blk do">Try every part on your own for <b>2 minutes</b>. Then, if you are stuck, press <b>Frames</b> at the top.</div>
    <div class="blk q"><span class="qn">(a)</span><span class="stem">What is the <span class="cmd">optimum</span> temperature for this protease?</span><span class="mk">[1]</span></div>
    <div class="blk q"><span class="qn">(b)</span><span class="stem"><span class="cmd">Describe</span> how the time changes from 20 °C to 50 °C. Use two values with units.</span><span class="mk">[2]</span></div>
    <div class="blk q"><span class="qn">(c)</span><span class="stem"><span class="cmd">Explain</span> why the stain is still there at 70 °C.</span><span class="mk">[2]</span></div>
    <div class="blk q"><span class="qn">(d)</span><span class="stem">A pupil writes: “At 70 °C the enzyme was killed.” Rewrite it using the correct science words.</span><span class="mk">[1]</span></div>
    <div class="help" data-label="Table" data-title="Washing-powder data"><table class="data">
      <caption>Time for the egg stain to disappear. Illustrative data.</caption>
      <thead><tr><th scope="col">Temperature / °C</th><th scope="col">Time / s</th></tr></thead>
      <tbody><tr><td>20</td><td>400</td></tr><tr><td>30</td><td>250</td></tr><tr><td>40</td><td>160</td></tr><tr><td>50</td><td>100</td></tr><tr><td>60</td><td>200</td></tr><tr><td>70</td><td>still there at 600 s</td></tr></tbody>
    </table></div>
    <div class="help" data-label="Frames" data-title="Frames">
      <p class="helpnote">Write <b>F</b> next to any part where you used a frame. That is fine: it tells your teacher what to practise next.</p>
      <div class="frame"><b>(a)</b> The time is shortest at <b>___</b> °C. So the rate is fastest there.</div>
      <div class="frame"><b>(b)</b> As the temperature increases from 20 °C to 50 °C, the time <b>___</b> from <b>___</b> s to <b>___</b> s. So the rate <b>___</b>.</div>
      <div class="frame"><b>(c)</b> At 70 °C the <b>___ ___</b> changes shape. The protein in the stain no longer <b>___</b>. The enzyme is <b>___</b>.</div>
      <div class="frame"><b>(d)</b> At 70 °C the enzyme was <b>___</b>. Its active site changed <b>___</b> for good.</div>
    </div>
  </section>

  <section data-step data-n="5" data-short="Go further" data-title="Go further: find a counterexample" data-kicker="Step 5 of 6 · 4 minutes">
    <div class="blk"><p>A pupil says: <b>“The washing-powder protease is a better enzyme than trypsin, because its optimum is higher.”</b></p></div>
    <div class="blk"><p>Trypsin is a protease in your small intestine. It works best at about 37 °C and pH 8.</p></div>
    <div class="blk"><p><span class="cmd">Give</span> one place or situation where trypsin would work better than the washing-powder protease. <span class="cmd">Explain</span> why, using the word <b>optimum</b>.</p></div>
    <div class="blk criteria"><h4>Success criteria</h4>
      <ul><li>You name one real place or situation.</li><li>You compare the temperature (or pH) there with each enzyme’s optimum.</li><li>You finish with what “better” depends on.</li></ul>
    </div>
  </section>
